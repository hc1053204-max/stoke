<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜球隊營運中心</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193047 0,#0a141e 56%,#08111a 100%);color:var(--text);min-height:100vh}.app{max-width:1180px;margin:auto;padding:20px}header,.row,.actions,.tabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}a{color:var(--gold);text-decoration:none}.card{background:#121e2acc;border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.notice{padding:11px 13px;background:#19293a;border:1px solid #34495e;border-radius:9px;color:#d4e2f1;margin:10px 0;line-height:1.55}.muted,small{color:var(--muted)}.btn{border:1px solid var(--line);background:#26374a;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:700}.btn.gold{color:#201b11;background:var(--gold);border-color:var(--gold)}.btn.blue{background:#244367;border-color:#41628a}.btn.red{background:#45292d;border-color:#74444b}.btn:disabled{opacity:.42;cursor:not-allowed}.tabs{justify-content:flex-start;border-bottom:1px solid var(--line);margin:18px 0;gap:18px}.tabs button{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:10px 0;cursor:pointer;font:inherit}.tabs button.active{color:var(--gold);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.core,.team{background:#0b1520;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block}.stat b{display:block;font-size:19px;margin:4px 0}.row{margin-bottom:11px}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border:0}.badge{display:inline-block;font-size:10px;border:1px solid #927941;border-radius:99px;color:var(--gold);padding:3px 7px;margin-left:5px}.foreign{color:#ffd7aa;border-color:#c78f4a}.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;gap:10px;margin:12px 0}.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}select,input{font:inherit;color:var(--text);background:#0a1520;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;max-width:90vw;z-index:5}@media(max-width:650px){.app{padding:12px}.tabs{gap:12px}.tabs button{font-size:13px}.entry{align-items:flex-start}}
</style></head>
<body><main class="app">
<header><div><h1>FRONT OFFICE｜球隊營運中心</h1><small>豪華儀表板・名單・交易・選秀・生涯管理</small></div><div class="actions"><a href="./">返回主遊戲</a><button class="btn" id="export">匯出 JSON</button><label class="btn" for="importFile">匯入 JSON</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></header>
<nav class="tabs"><button class="active" data-tab="dashboard">儀表板</button><button data-tab="roster">球員名單</button><button data-tab="market">交易／自由球員</button><button data-tab="draft">新秀選秀</button><button data-tab="season">賽季進度</button><button data-tab="career">生涯與排行榜</button></nav>
<section id="dashboard" class="panel active"></section><section id="roster" class="panel"></section><section id="market" class="panel"></section><section id="draft" class="panel"></section><section id="season" class="panel"></section><section id="career" class="panel"></section>
<p class="muted">名單上限 16 人（含本土與洋將），每隊洋將最多 4 人；本土薪資上限 100M，洋將薪資合計上限 US$40,000。資料存於此瀏覽器 localStorage，可匯出 JSON 備份。</p>
</main><script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',DOMESTIC_CAP=100,FOREIGN_CAP_USD=40000,ROSTER_CAP=16,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,today=()=>new Date().toLocaleDateString('zh-TW');
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>n.remove(),2400)}
function isForeign(p){return !!(p?.isForeign||p?.foreign)}
function makeFA(name,i,foreign=false){let r=foreign?72+(i*3)%16:64+(i*7)%18;return{id:uid(),name,team:'自由球員',pos:POS[i%5],age:foreign?23+i%8:20+i%10,rating:r,potential:Math.min(99,r+12),salary:foreign?0:5+i%6,salaryUsd:foreign?10000:null,isForeign:foreign,contractYears:2,starter:false,injury:0,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}}}
function defaultFAs(){const locals=['林冠宇','陳子豪','張家維','王俊凱','李明哲','周柏安','吳承翰','黃建宏','蔡昱廷','許博翔','鄭宇翔','郭柏廷'];const imports=['Marcus Reed','Jordan Hayes','Darius Cole','Andre Miller'];return [...locals.map((n,i)=>makeFA(n,i)),...imports.map((n,i)=>makeFA(n,i+locals.length,true))]}
function normalizePlayer(p,t){const f=isForeign(p);return {...p,id:p.id||uid(),team:p.team||t,salary:f?0:(Number(p.salary)||5),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):null,isForeign:f,age:Number(p.age)||22,rating:Number(p.rating)||65,potential:Number(p.potential)||Number(p.rating)||65,contractYears:Math.max(1,Number(p.contractYears)||2),stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,...p.stats}}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function makeSchedule(){const games=[];for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)for(let k=0;k<6;k++)games.push({a:TEAMS[i],b:TEAMS[j]});for(let i=games.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[games[i],games[j]]=[games[j],games[i]]}return games.map((g,i)=>({...g,id:i+1}))}
function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!s.rosters)throw Error('請先開啟主遊戲並建立存檔，再進入球隊營運中心。');s.rosters=s.rosters||{};TEAMS.forEach(t=>s.rosters[t]=(Array.isArray(s.rosters[t])?s.rosters[t]:[]).map(p=>normalizePlayer(p,t)));s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents.map(p=>normalizePlayer(p,'自由球員')):defaultFAs();s.standings={...blankStandings(),...(s.standings||{})};s.history=Array.isArray(s.history)?s.history:[];s.seasonRecords=Array.isArray(s.seasonRecords)?s.seasonRecords:[];s.awards=Array.isArray(s.awards)?s.awards:[];s.achievements=Array.isArray(s.achievements)?s.achievements:[];s.tradeHistory=Array.isArray(s.tradeHistory)?s.tradeHistory:[];s.gameIndex=Number(s.gameIndex)||0;s.season=Number(s.season)||1;s.draftDone=!!s.draftDone;return s}
let state;try{state=load()}catch(e){document.body.innerHTML=`<main class="app"><h1>球隊營運中心</h1><div class="notice">${esc(e.message)}</div><a href="./">回到主遊戲</a></main>`;return}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請匯出備份並檢查瀏覽器空間。');return false}}
const roster=t=>state.rosters[t]||[],myTeam=()=>state.team,domesticPayroll=t=>roster(t).filter(p=>!isForeign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0),foreignPayroll=t=>roster(t).filter(isForeign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0),foreignCount=t=>roster(t).filter(isForeign).length;
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))}
function avgOVR(list){return list.length?Math.round(list.reduce((n,p)=>n+(Number(p.rating)||0),0)/list.length):0}
function recordEvent(text){state.history.unshift({text,date:today()});state.history=state.history.slice(0,250)}
function mood(r){const winRate=r.g?r.w/r.g:.5;if(domesticPayroll(myTeam())>DOMESTIC_CAP||foreignPayroll(myTeam())>FOREIGN_CAP_USD)return '薪資超過上限';return winRate>=.65?'非常滿意':winRate>=.5?'滿意':winRate>=.35?'擔憂':'不滿意'}
function dashboard(){const t=myTeam(),r=state.standings[t],list=roster(t),starters=list.filter(p=>p.starter),bench=list.filter(p=>!p.starter),rank=standings().findIndex(x=>x.team===t)+1,core=[...list].sort((a,b)=>(b.rating+b.potential*.15)-(a.rating+a.potential*.15)).slice(0,3);return `<div class="card"><div class="row"><div><h2>${esc(t)}｜第 ${state.season} 季</h2><small>例行賽 ${r.g}/${GAMES} 場 · 排名第 ${rank}</small></div><b>賽季積分 ${r.w*2+r.l}</b></div><div class="stats"><div class="stat"><small>戰績</small><b>${r.w}-${r.l}</b></div><div class="stat"><small>本土薪資／稅線</small><b>${domesticPayroll(t)} / ${DOMESTIC_CAP}M</b><small>剩餘 ${Math.max(0,DOMESTIC_CAP-domesticPayroll(t))}M</small></div><div class="stat"><small>洋將薪資</small><b>US$${foreignPayroll(t).toLocaleString()} / $${FOREIGN_CAP_USD.toLocaleString()}</b></div><div class="stat"><small>洋將名額</small><b>${foreignCount(t)}/${FOREIGN_LIMIT}</b></div><div class="stat"><small>先發戰力</small><b>${avgOVR(starters)} OVR</b></div><div class="stat"><small>替補戰力</small><b>${avgOVR(bench)} OVR</b></div><div class="stat"><small>老闆情緒</small><b>${mood(r)}</b></div></div></div><div class="card"><h2>球隊核心球員卡</h2><div class="grid">${core.map(p=>`<div class="core"><span class="badge">${esc(p.pos)}</span>${isForeign(p)?'<span class="badge foreign">洋將</span>':''}<b>${esc(p.name)}</b><small>OVR ${p.rating} · 潛力 ${p.potential} · ${p.age} 歲</small><small class="meta">薪資 ${isForeign(p)?'US$'+Number(p.salaryUsd).toLocaleString():p.salary+'M'} · 合約 ${p.contractYears} 年</small></div>`).join('')||'<p class="muted">尚無球員</p>'}</div></div><div class="card"><h2>聯盟排行榜</h2>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} · 積分 ${x.w*2+x.l}</b></div>`).join('')}</div>`}
function rosterView(){const t=myTeam();return `<div class="card"><div class="row"><div><h2>完整球員名單</h2><small>本土與洋將合計最多 ${ROSTER_CAP} 人；最多 ${FOREIGN_LIMIT} 名洋將；先發最多五人。</small></div><b>${roster(t).length}/${ROSTER_CAP} 人 · 本土薪資 ${domesticPayroll(t)}/${DOMESTIC_CAP}M · 洋將 US$${foreignPayroll(t).toLocaleString()}/$${FOREIGN_CAP_USD.toLocaleString()}</b></div>${roster(t).map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${isForeign(p)?'<span class="badge foreign">洋將</span>':''}<small class="meta">${esc(p.pos)} · ${p.age}歲 · OVR ${p.rating} · 潛力 ${p.potential} · ${isForeign(p)?'US$'+Number(p.salaryUsd).toLocaleString():p.salary+'M'} · 合約 ${p.contractYears} 年 · ${p.starter?'先發':'替補'}</small></div><button class="btn" data-starter="${esc(p.id)}">設為${p.starter?'替補':'先發'}</button></div>`).join('')||'<div class="notice">名單目前沒有球員。</div>'}</div>`}
function marketView(){const other=TEAMS.filter(t=>t!==myTeam());return `<div class="card"><h2>球員交易</h2><p class="notice">交易限本土球員；球隊名單最多 ${ROSTER_CAP} 人。本土薪資上限 ${DOMESTIC_CAP}M，洋將合計薪資上限 US$${FOREIGN_CAP_USD.toLocaleString()}。</p><div class="form"><div><label>交易對象</label><select id="tradeTeam">${other.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div><label>我方球員</label><select id="tradeMine">${roster(myTeam()).filter(p=>!isForeign(p)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${p.salary}M</option>`).join('')}</select></div><div><label>對方球員</label><select id="tradeTarget"></select></div><button class="btn gold" id="doTrade">確認交易</button></div><h2>自由球員市場</h2>${state.freeAgents.map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${isForeign(p)?'<span class="badge foreign">洋將</span>':'<span class="badge">本土</span>'}<small class="meta">${esc(p.pos)} · OVR ${p.rating} · 潛力 ${p.potential} · ${isForeign(p)?'US$'+Number(p.salaryUsd).toLocaleString()+'（洋將薪資）':p.salary+'M（本土薪資）'}</small></div><button class="btn gold" data-sign="${esc(p.id)}">簽約</button></div>`).join('')||'<p class="muted">目前沒有自由球員。</p>'}</div><div class="card"><h2>交易歷史</h2>${state.tradeHistory.slice(0,30).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')||'<p class="muted">尚無交易紀錄。</p>'}</div>`}
function refreshTargets(){const sel=$('#tradeTeam'),dest=$('#tradeTarget');if(!sel||!dest)return;dest.innerHTML=roster(sel.value).filter(p=>!isForeign(p)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${p.salary}M</option>`).join('')}
function trade(){const other=$('#tradeTeam')?.value,a=roster(myTeam()),b=roster(other),mine=a.find(p=>p.id===$('#tradeMine')?.value),theirs=b.find(p=>p.id===$('#tradeTarget')?.value);if(!mine||!theirs||isForeign(mine)||isForeign(theirs))return notify('請選擇雙方本土球員。');if(a.length>ROSTER_CAP||b.length>ROSTER_CAP)return notify('球隊名單已達上限，無法交易。');if(domesticPayroll(myTeam())-mine.salary+theirs.salary>DOMESTIC_CAP||domesticPayroll(other)-theirs.salary+mine.salary>DOMESTIC_CAP)return notify('交易後任一隊本土薪資會超過 100M。');const ai=a.indexOf(mine),bi=b.indexOf(theirs);a[ai]={...theirs,team:myTeam(),starter:mine.starter};b[bi]={...mine,team:other,starter:theirs.starter};const text=`${myTeam()} 送出 ${mine.name}，換回 ${theirs.name}（${other}）`;state.tradeHistory.unshift({text,date:today()});recordEvent(`交易完成：${text}。`);save();render();notify('交易完成並已記錄。')}
function signFA(id){const p=state.freeAgents.find(x=>x.id===id);if(!p)return;const t=myTeam(),foreign=isForeign(p);if(roster(t).length>=ROSTER_CAP)return notify(`名單已達 ${ROSTER_CAP} 人。`);if(foreign){if(foreignCount(t)>=FOREIGN_LIMIT)return notify(`洋將已達 ${FOREIGN_LIMIT} 名上限。`);if(foreignPayroll(t)+(Number(p.salaryUsd)||0)>FOREIGN_CAP_USD)return notify('簽約後洋將薪資總額會超過 US$40,000。')}else if(domesticPayroll(t)+(Number(p.salary)||0)>DOMESTIC_CAP)return notify('簽約後本土薪資會超過 100M。');const signed=normPlayer({...p,team:t,starter:false,contractYears:2},t);roster(t).push(signed);state.freeAgents=state.freeAgents.filter(x=>x.id!==id);recordEvent(`${foreign?'洋將':'自由球員'}簽約：${t} 簽下 ${p.name}。`);save();render();notify(`已簽下 ${p.name}。`)}
function draftView(){if(!Array.isArray(state.draftClass)||!state.draftClass.length){state.draftClass=Array.from({length:7},(_,i)=>{const p=makeFA(['林承恩','陳子豪','張宇翔','王柏安','李冠宇','周明哲','吳家維'][i],i);p.team='新秀';p.age=19;p.rating=62+Math.floor(Math.random()*14);p.potential=Math.min(99,p.rating+12+Math.floor(Math.random()*15));p.salary=[9,8,7,5,5,5,5][i];p.contractYears=2;return p});save()}return `<div class="card"><div class="row"><div><h2>新人選秀</h2><small>首輪前三順位底薪 9／8／7M，其餘 5M；合約兩年保障。</small></div><button class="btn gold" id="draftButton" ${state.draftDone?'disabled':''}>${state.draftDone?'本季已完成選秀':'選秀並簽下首順位新秀'}</button></div>${state.draftClass.map((p,i)=>`<div class="entry"><span>${i+1}順位｜${esc(p.name)}<small class="meta">${p.age}歲 · OVR ${p.rating} · 潛力 ${p.potential} · 薪資 ${p.salary}M</small></span><b>保障 ${p.contractYears||2} 年</b></div>`).join('')}</div>`}
function runDraft(){if(state.draftDone)return notify('本季已完成選秀。');const p=state.draftClass?.[0],t=myTeam();if(!p)return;if(roster(t).length>=ROSTER_CAP)return notify('名單已滿，無法選秀簽約。');if(domesticPayroll(t)+p.salary>DOMESTIC_CAP)return notify('本土薪資空間不足，無法簽下新秀。');roster(t).push({...p,id:uid(),team:t,starter:false,contractYears:2});state.draftClass=state.draftClass.slice(1);state.draftDone=true;recordEvent(`新人選秀：${t} 選進 ${p.name}（潛力 ${p.potential}）。`);save();render();notify(`已選進新秀 ${p.name}。`)}
function seasonView(){const r=state.standings[myTeam()];return `<div class="card"><h2>賽季進度</h2><div class="stats"><div class="stat"><small>球季</small><b>第 ${state.season} 季</b></div><div class="stat"><small>例行賽</small><b>${r.g}/${GAMES}</b></div><div class="stat"><small>聯盟賽程</small><b>${state.gameIndex}/${state.schedule?.length||LEAGUE_GAMES}</b></div><div class="stat"><small>階段</small><b>${state.postseason?.champion?'休賽季':state.postseason?'季後賽':'例行賽'}</b></div></div><p class="notice">比賽及季後賽請至主遊戲進行。此處推進下一季會更新合約、年齡和能力。</p><div class="actions"><a class="btn blue" href="./">回主遊戲</a><button class="btn gold" id="advanceSeason">推進至下一季</button></div></div><div class="card"><h2>賽季日誌</h2>${state.history.slice(0,20).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')}</div>`}
function advanceSeason(){if(!confirm('推進至下一季？將重置戰績賽程並更新球員年齡、合約及能力。'))return;state.season++;state.gameIndex=0;state.wins=state.losses=0;state.standings=blankStandings();state.schedule=makeSchedule();state.postseason=null;state.tradeUsed=false;state.draftDone=false;state.draftClass=null;for(const t of TEAMS)for(const p of roster(t)){p.stats={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0};p.age++;p.contractYears=Math.max(0,(p.contractYears||1)-1);p.injury=0;if(p.age<=p.potential&&Math.random()<.65)p.rating=Math.min(p.potential,p.rating+1);else if(p.age>32&&Math.random()<.3)p.rating=Math.max(45,p.rating-1)}recordEvent(`第 ${state.season} 季開始：賽程、球員年齡、合約與能力已更新。`);save();render();notify(`第 ${state.season} 季開始。`)}
function careerView(){const rank=standings(),ach=state.achievements||[];return `<div class="card"><h2>生涯與成就</h2><div class="grid"><div class="core"><b>冠軍數</b>${state.seasonRecords.filter(x=>x.champion===myTeam()).length}</div><div class="core"><b>已完成球季</b>${state.seasonRecords.length}</div><div class="core"><b>目前排名</b>第 ${rank.findIndex(x=>x.team===myTeam())+1} 名</div></div><div class="row" style="margin-top:12px"><b>本機成就（不跨玩家同步）</b><button class="btn" id="checkAchievements">更新成就</button></div>${ach.map(a=>`<div class="entry">${esc(a.title)}<small>${esc(a.date)}</small></div>`).join('')||'<p class="muted">尚無成就。</p>'}</div><div class="card"><h2>歷年球季紀錄</h2>${[...state.seasonRecords].reverse().map(x=>`<div class="entry"><span>第 ${x.season} 季｜冠軍 ${esc(x.champion)}<small class="meta">${(x.standings||[]).map((t,i)=>`${i+1}.${esc(t.team)} ${t.w}-${t.l}`).join('　')}</small></span><b>${esc(x.myRecord||'')}</b></div>`).join('')||'<p class="muted">尚無已完成球季紀錄。</p>'}</div>`}
function checkAchievements(){const tests=[['首勝',state.standings[myTeam()].w>=1],['十勝球隊',state.standings[myTeam()].w>=10],['薪資管理達人',domesticPayroll(myTeam())<=DOMESTIC_CAP&&foreignPayroll(myTeam())<=FOREIGN_CAP_USD],['完整陣容',roster(myTeam()).length>=12],['四名洋將',foreignCount(myTeam())>=4]];let n=0;for(const [title,ok] of tests)if(ok&&!state.achievements.some(a=>a.title===title)){state.achievements.push({title,date:today()});n++}save();render();notify(n?`新增 ${n} 項成就。`:'沒有新成就。')}
function render(){const active=document.querySelector('.tabs button.active')?.dataset.tab||'dashboard';$('#dashboard').innerHTML=dashboard();$('#roster').innerHTML=rosterView();$('#market').innerHTML=marketView();$('#draft').innerHTML=draftView();$('#season').innerHTML=seasonView();$('#career').innerHTML=careerView();document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===active));refreshTargets()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
document.addEventListener('change',e=>{if(e.target.id==='tradeTeam')refreshTargets();if(e.target.id==='importFile')importJSON(e.target.files?.[0])});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.starter){const p=roster(myTeam()).find(x=>x.id===b.dataset.starter);if(!p)return;if(p.injury)return notify('受傷球員不可設為先發。');if(!p.starter&&roster(myTeam()).filter(x=>x.starter).length>=5)return notify('先發最多五人，請先將一人改為替補。');p.starter=!p.starter;save();render();return}if(b.dataset.sign){signFA(b.dataset.sign);return}if(b.id==='doTrade'){trade();return}if(b.id==='draftButton'){runDraft();return}if(b.id==='advanceSeason'){advanceSeason();return}if(b.id==='checkAchievements'){checkAchievements();return}});
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`front-office-season-${state.season}-backup.json`;a.click();URL.revokeObjectURL(url);notify('已匯出 JSON 備份。')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data?.rosters||!TEAMS.every(t=>Array.isArray(data.rosters[t])))throw Error('JSON 存檔格式無效');if(!confirm('匯入會覆蓋此瀏覽器目前的遊戲存檔，確定嗎？'))return;localStorage.setItem(KEY,JSON.stringify(data));state=load();render();notify('存檔匯入成功。')}catch(err){notify(`匯入失敗：${err.message}`)}$('#importFile').value=''};reader.readAsText(file)}
$('#export').addEventListener('click',exportJSON);save();render();
})();
</script></body></html>
