<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>球員管理｜FRONT OFFICE</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--green:#73d6a0;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{max-width:1000px;margin:auto;padding:20px}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.notice{background:#19293a;border:1px solid var(--line);padding:12px;border-radius:9px;color:#d4e2f1;line-height:1.55}.muted,small{color:var(--muted)}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:#26374a;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:700}.btn.gold{color:#201b11;background:var(--gold);border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}.entry{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border:0}.badge{display:inline-block;font-size:11px;border:1px solid #927941;border-radius:99px;color:var(--gold);padding:3px 7px;margin-left:6px}.foreign{color:#ffc987;border-color:#a66b36}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.team{background:#0b1520;border:1px solid var(--line);border-radius:10px;padding:12px}.team h3{margin:0 0 6px;font-size:15px}.player{font-size:13px;padding:5px 0;border-top:1px solid #ffffff10}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;max-width:90vw}.danger{color:var(--red)}a{color:var(--gold)}
</style>
</head>
<body><main class="app">
<header><div><h1>FRONT OFFICE｜球員管理中心</h1><small>球員隨機分隊・自由球員・薪資��限・外籍球員</small></div><a href="./">返回遊戲</a></header>
<section class="card"><div class="row"><div><h2>聯盟設定</h2><small id="status">讀取中…</small></div><button id="randomize" class="btn">隨機重新分隊</button></div><p class="notice">隨機分隊會重新洗牌現有球員並平均分配到七隊（每隊最多 15 人），同時保留球員能力與數據。外籍球員不可交易；每隊最多登錄 4 名外籍球員。此變更會儲存在同一瀏覽器的遊戲存檔中。</p></section>
<section class="card"><div class="row"><div><h2>自由球員市場</h2><small>簽約後球員直接加入你在遊戲中選擇經營的球隊。</small></div><b id="payroll"></b></div><div id="market"></div></section>
<section class="card"><h2>各隊球員名單</h2><div id="teams" class="grid"></div></section>
<p class="muted">薪資以遊戲中的 M 為單位；簽約後球隊薪資不得超過 100M。自由球員池會保存在本機遊戲存檔中。</p>
</main><script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=100,MAX_ROSTER=15,MAX_FOREIGN=4,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>`fa-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
function makeAgents(){const locals=['林冠宇','陳子豪','張家維','王俊凱','李明哲','周柏安','吳承翰','黃建宏','蔡昱廷','許博翔','鄭宇翔','郭柏廷','高志遠','楊承恩','洪子皓','羅文傑'];const imports=['Marcus Reed','Jordan Hayes','Darius Cole','Andre Miller','Caleb Brooks','Malik Turner','Dylan Carter','Noah Bennett'];return [...locals.map((name,i)=>agent(name,false,i)),...imports.map((name,i)=>agent(name,true,i+locals.length)]}
function agent(name,isForeign,i){const rating=65+(i*7)%21;return{id:id(),name,team:'自由球員',pos:['PG','SG','SF','PF','C'][i%5],age:21+i%12,rating,potential:Math.min(99,rating+10),salary:5+i%6,starter:false,injury:0,isForeign,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}}}
function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!s.rosters)throw Error('找不到遊戲存檔。請先開啟遊戲一次，再回到這個管理頁面。');s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:makeAgents();s.rosters=s.rosters||{};TEAMS.forEach(t=>s.rosters[t]=Array.isArray(s.rosters[t])?s.rosters[t]:[]);return s}
let state;function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('無法儲存遊戲資料，請檢查瀏覽器儲存空間。');return false}}
function teamName(){return TEAMS.includes(state.team)?state.team:TEAMS[0]}function payroll(team=teamName()){return (state.rosters[team]||[]).reduce((sum,p)=>sum+(Number(p.salary)||0),0)}function foreignCount(team=teamName()){return (state.rosters[team]||[]).filter(p=>p.isForeign||p.foreign).length}
function render(){const team=teamName(),players=state.rosters[team]||[];$('#status').textContent=`經營球隊：${team}｜名單 ${players.length}/${MAX_ROSTER}｜外籍球員 ${foreignCount(team)}/${MAX_FOREIGN}`;$('#payroll').textContent=`薪資 ${payroll()} / ${CAP}M`;
$('#market').innerHTML=state.freeAgents.length?state.freeAgents.map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${p.isForeign?'<span class="badge foreign">外籍</span>':'<span class="badge">本土</span>'}<small class="muted">${esc(p.pos||'SF')} · ${Number(p.age)||24}歲 · ${Number(p.rating)||65} OVR · 薪資 ${Number(p.salary)||5}M</small></div><button class="btn gold" data-sign="${esc(p.id)}">簽約</button></div>`).join(''):'<div class="notice">自由球員市場目前沒有球員。</div>';
$('#teams').innerHTML=TEAMS.map(t=>`<section class="team"><h3>${esc(t)} <small>${(state.rosters[t]||[]).length}/${MAX_ROSTER}人 · 薪資 ${payroll(t)}M · 外籍 ${foreignCount(t)}/${MAX_FOREIGN}</small></h3>${(state.rosters[t]||[]).map(p=>`<div class="player">${esc(p.name)}${p.isForeign||p.foreign?' <span class="badge foreign">外籍</span>':''}<span class="muted"> · ${Number(p.rating)||0} OVR · ${Number(p.salary)||0}M</span></div>`).join('')||'<small>尚無球員</small>'}</section>`).join('')}
}
function sign(playerId){const team=teamName(),list=state.rosters[team]||[],p=state.freeAgents.find(x=>x.id===playerId);if(!p)return;if(list.length>=MAX_ROSTER)return alert(`名單已達 ${MAX_ROSTER} 人上限，無法簽約。`);if(payroll(team)+(Number(p.salary)||0)>CAP)return alert(`簽約後薪資會超過 ${CAP}M 上限，無法簽約。`);if((p.isForeign||p.foreign)&&foreignCount(team)>=MAX_FOREIGN)return alert(`外籍球員已達 ${MAX_FOREIGN} 人登錄上限。`);state.freeAgents=state.freeAgents.filter(x=>x.id!==playerId);p.team=team;p.starter=false;p.injury=0;p.stats=p.stats||{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0};list.push(p);state.rosters[team]=list;if(save())render()}
function randomize(){if(!confirm('隨機重新分配所有球員到七隊？這會重置本季賽程戰績、季後賽進度和球員數據，但保留球員能力及歷史紀錄。'))return;const pool=TEAMS.flatMap(t=>state.rosters[t]||[]);for(const t of TEAMS)state.rosters[t]=[];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pool.forEach((p,i)=>{const team=TEAMS[i%TEAMS.length];p.team=team;p.starter=false;p.isForeign=Boolean(p.isForeign||p.foreign);state.rosters[team].push(p)});TEAMS.forEach(t=>{const roster=state.rosters[t];roster.slice().sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,5).forEach(p=>p.starter=true)});state.gameIndex=0;state.wins=0;state.losses=0;state.standings=Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]));state.schedule=null;state.postseason=null;for(const t of TEAMS)for(const p of state.rosters[t])p.stats={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0};state.history=Array.isArray(state.history)?state.history:[];state.history.unshift({text:'球員已隨機重新分配；本季戰績與賽程已重置。',date:new Date().toLocaleDateString('zh-TW')});if(save()){alert('已完成隨機分隊。回到遊戲重新整理以套用新陣容。');render()}}
$('#market').addEventListener('click',e=>{const b=e.target.closest('[data-sign]');if(b)sign(b.dataset.sign)});$('#randomize').addEventListener('click',randomize);
try{state=load();if(!Array.isArray(state.schedule)||state.schedule.length!==126){state.schedule=null}save();render()}catch(err){$('#status').textContent=err.message;$('#market').innerHTML=`<div class="notice">${esc(err.message)}</div>`;$('#teams').innerHTML=''}
})();
</script></body></html>
