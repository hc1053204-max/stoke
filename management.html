<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜球隊營運中心</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--green:#73d6a0;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193047 0,#0a141e 56%,#08111a 100%);color:var(--text);min-height:100vh}.app{max-width:1180px;margin:auto;padding:20px}header,.row,.actions,.tabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}.card{background:#121e2acc;border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.notice{padding:11px 13px;background:#19293a;border:1px solid #34495e;border-radius:9px;color:#d4e2f1;margin:10px 0;line-height:1.55}.muted,small{color:var(--muted)}.btn{border:1px solid var(--line);background:#26374a;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:700}.btn.gold{color:#201b11;background:var(--gold);border-color:var(--gold)}.btn.blue{background:#244367;border-color:#41628a}.btn.red{background:#45292d;border-color:#74444b}.btn:disabled{opacity:.42;cursor:not-allowed}a{color:var(--gold)}.row{margin-bottom:11px}.tabs{justify-content:flex-start;border-bottom:1px solid var(--line);margin:18px 0;gap:18px}.tabs button{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:10px 0;cursor:pointer;font:inherit}.tabs button.active{color:var(--gold);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.core,.team{background:#0b1520;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block}.stat b{display:block;font-size:20px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.core b{display:block;margin:5px 0}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border:0}.badge{display:inline-block;font-size:10px;border:1px solid #927941;border-radius:99px;color:var(--gold);padding:3px 7px;margin-left:5px}.foreign{color:#ffd7aa;border-color:#c78f4a}.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}select,input{font:inherit;color:var(--text);background:#0a1520;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;gap:10px;margin:12px 0}.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.roster-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.danger{color:var(--red)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;max-width:90vw;z-index:5}.hidden{display:none!important}@media(max-width:650px){.app{padding:12px}.tabs{gap:12px}.tabs button{font-size:13px}.entry{align-items:flex-start}.roster-row{grid-template-columns:1fr}}
</style></head>
<body><main class="app">
<header><div><h1>FRONT OFFICE｜球隊營運中心</h1><small id="subtitle">儀表板、球員、交易、選秀與生涯管理</small></div><div class="actions"><a href="./">返回主遊戲</a><button class="btn" id="export">匯出 JSON</button><label class="btn" for="importFile">匯入 JSON</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></header>
<nav class="tabs"><button class="active" data-tab="dashboard">儀表板</button><button data-tab="roster">球員名單</button><button data-tab="market">交易／自由球員</button><button data-tab="draft">新秀選秀</button><button data-tab="season">賽季進度</button><button data-tab="career">生涯與排行榜</button></nav>
<section id="dashboard" class="panel active"></section><section id="roster" class="panel"></section><section id="market" class="panel"></section><section id="draft" class="panel"></section><section id="season" class="panel"></section><section id="career" class="panel"></section>
<p class="muted">所有資料儲存在此瀏覽器的 localStorage；不同瀏覽器或裝置不會自動同步。建議定期匯出 JSON 備份。</p>
</main><script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=100,MAX_ROSTER=15,MAX_FOREIGN=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,today=()=>new Date().toLocaleDateString('zh-TW');
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;clearTimeout(window.__t);window.__t=setTimeout(()=>n.remove(),2400)}
function newFreeAgents(){const locals=['林冠宇','陳子豪','張家維','王俊凱','李明哲','周柏安','吳承翰','黃建宏','蔡昱廷','許博翔','鄭宇翔','郭柏廷'];const imports=['Marcus Reed','Jordan Hayes','Darius Cole','Andre Miller'];return [...locals.map((name,i)=>player(name,i,false)),...imports.map((name,i)=>player(name,i+locals.length,true))]}
function player(name,i,foreign=false){let rating=foreign?72+(i*3)%16:64+(i*7)%18;return{id:uid(),name,team:'自由球員',pos:POS[i%5],age:foreign?23+i%8:20+i%10,rating,potential:Math.min(99,rating+8+i%8),salary:foreign?4:5+i%6,salaryUsd:foreign?40000:null,isForeign:foreign,contractYears:2,starter:false,injury:0,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}}}
function normPlayer(p,t){const f=!!(p.isForeign||p.foreign);return {...p,id:p.id||uid(),team:p.team||t,salary:f?Math.min(Number(p.salary)||4,4):(Number(p.salary)||5),salaryUsd:f?Math.min(Number(p.salaryUsd)||40000,40000):null,isForeign:f,contractYears:Math.max(1,Number(p.contractYears)||2),stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,...p.stats}}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function makeSchedule(){let a=[];for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)for(let k=0;k<6;k++)a.push({a:TEAMS[i],b:TEAMS[j]});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.map((g,i)=>({...g,id:i+1}))}
function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!s.rosters)throw Error('請先開啟主遊戲並建立存檔，再進入球隊營運中心。');s.rosters=s.rosters||{};TEAMS.forEach(t=>s.rosters[t]=(Array.isArray(s.rosters[t])?s.rosters[t]:[]).map(p=>normPlayer(p,t)));s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents.map(p=>normPlayer(p,'自由球員')):newFreeAgents();s.standings={...blankStandings(),...(s.standings||{})};s.history=Array.isArray(s.history)?s.history:[];s.seasonRecords=Array.isArray(s.seasonRecords)?s.seasonRecords:[];s.awards=Array.isArray(s.awards)?s.awards:[];s.achievements=Array.isArray(s.achievements)?s.achievements:[];s.tradeHistory=Array.isArray(s.tradeHistory)?s.tradeHistory:[];s.gameIndex=Number(s.gameIndex)||0;s.season=Number(s.season)||1;s.draftDone=!!s.draftDone;return s}
let state;try{state=load()}catch(e){document.body.innerHTML=`<main class="app"><h1>球隊營運中心</h1><div class="notice">${esc(e.message)}</div><a href="./">回到主遊戲</a></main>`;return}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請匯出備份並檢查瀏覽器儲存空間。');return false}}
const roster=t=>state.rosters[t]||[],team=()=>state.team,payroll=t=>roster(t).reduce((s,p)=>s+(Number(p.salary)||0),0),foreignCount=t=>roster(t).filter(p=>p.isForeign||p.foreign).length;
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))}
function avgOVR(list){return list.length?Math.round(list.reduce((s,p)=>s+(Number(p.rating)||0),0)/list.length):0}
function ownerMood(record,pay){let rate=record.g?record.w/record.g:.5;if(pay>CAP)return '不滿意：薪資超過上限';if(rate>=.65)return '非常滿意';if(rate>=.5)return '滿意';if(rate>=.35)return '擔憂';return '不滿意：戰績不佳'}
function recordEvent(text){state.history.unshift({text,date:today()});state.history=state.history.slice(0,250)}
function dashboard(){const t=team(),r=state.standings[t],list=roster(t),starters=list.filter(p=>p.starter).sort((a,b)=>b.rating-a.rating),bench=list.filter(p=>!p.starter).sort((a,b)=>b.rating-a.rating),core=[...list].sort((a,b)=>(b.rating+b.potential*.15)-(a.rating+a.potential*.15)).slice(0,3),rank=standings().findIndex(x=>x.team===t)+1;return `<div class="card"><div class="row"><div><h2>${esc(t)}｜第 ${state.season} 季</h2><small>例行賽 ${r.g}/${GAMES} 場 · 排名第 ${rank}</small></div><span class="badge">球隊總分 ${r.w*2+r.l}</span></div><div class="stats"><div class="stat"><small>戰績</small><b>${r.w}-${r.l}</b></div><div class="stat"><small>薪資／上限</small><b>${payroll(t)} / ${CAP}M</b><small>${payroll(t)>CAP?'超出上限':'剩餘 '+(CAP-payroll(t))+'M'}</small></div><div class="stat"><small>外籍球員</small><b>${foreignCount(t)}/${MAX_FOREIGN}</b></div><div class="stat"><small>先發戰力</small><b>${avgOVR(starters)} OVR</b></div><div class="stat"><small>替補戰力</small><b>${avgOVR(bench)} OVR</b></div><div class="stat"><small>老闆情緒</small><b>${ownerMood(r,payroll(t))}</b></div></div></div><div class="card"><h2>球隊核心球員</h2><div class="grid">${core.map(p=>`<div class="core"><span class="badge">${esc(p.pos)}</span>${p.isForeign?'<span class="badge foreign">外籍</span>':''}<b>${esc(p.name)}</b><small>總評 ${p.rating} · 潛力 ${p.potential} · ${p.age} 歲</small><small class="meta">薪資 ${p.salary}M · 合約 ${p.contractYears} 年</small></div>`).join('')||'<p class="muted">尚無球員</p>'}</div></div><div class="card"><h2>聯盟排行榜</h2>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} · 積分 ${x.w*2+x.l}</b></div>`).join('')}</div>`}
function rosterView(){return `<div class="card"><div class="row"><div><h2>完整球員名單</h2><small>先發最多五人；使用按鈕切換先發／替補。</small></div><b>${roster(team()).length}/${MAX_ROSTER} 人 · 薪資 ${payroll(team())}/${CAP}M</b></div>${roster(team()).map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${p.isForeign?'<span class="badge foreign">外籍</span>':''}<small class="meta">${esc(p.pos)} · ${p.age}歲 · OVR ${p.rating} · 潛力 ${p.potential} · ${p.salary}M · 合約 ${p.contractYears} 年 · ${p.starter?'先發':'替補'}</small></div><button class="btn" data-starter="${esc(p.id)}">設為${p.starter?'替補':'先發'}</button></div>`).join('')||'<div class="notice">名單目前沒有球員。</div>'}</div>`}
function marketView(){let others=TEAMS.filter(t=>t!==team());return `<div class="card"><h2>球員交易</h2><p class="notice">一換一交易；雙方薪資總額均不得超過 ${CAP}M。外籍球員不可交易，雙方名單上限 ${MAX_ROSTER} 人。</p><div class="form"><div><label>交易對象</label><select id="tradeTeam">${others.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></div><div><label>我方交易球員</label><select id="tradeMine">${roster(team()).filter(p=>!p.isForeign).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${p.salary}M</option>`).join('')}</select></div><div><label>對方球員</label><select id="tradeTarget"></select></div><button class="btn gold" id="doTrade">確認交易</button></div><h2>自由球員市場</h2>${state.freeAgents.map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${p.isForeign?'<span class="badge foreign">外籍 · US$40,000上限</span>':'<span class="badge">本土</span>'}<small class="meta">${p.pos} · OVR ${p.rating} · 潛力 ${p.potential} · ${p.isForeign?'薪資 '+p.salary+'M（US$'+Number(p.salaryUsd||40000).toLocaleString()+'）':'薪資 '+p.salary+'M'}</small></div><button class="btn gold" data-sign="${esc(p.id)}">簽約</button></div>`).join('')||'<p class="muted">目前沒有自由球員。</p>'}</div><div class="card"><h2>交易歷史</h2>${state.tradeHistory.slice(0,30).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')||'<p class="muted">尚無交易紀錄。</p>'}</div>`}
function refreshTradeTargets(){let sel=$('#tradeTeam'),dest=$('#tradeTarget');if(!sel||!dest)return;dest.innerHTML=roster(sel.value).filter(p=>!p.isForeign).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${p.salary}M</option>`).join('')}
function doTrade(){const other=$('#tradeTeam')?.value,mine=roster(team()).find(p=>p.id===$('#tradeMine')?.value),theirs=roster(other).find(p=>p.id===$('#tradeTarget')?.value);if(!mine||!theirs)return notify('請選擇雙方可交易的本土球員。');if(roster(other).length>MAX_ROSTER||roster(team()).length>MAX_ROSTER)return notify('名單超過人數限制，請先調整名單。');if(payroll(team())-mine.salary+theirs.salary>CAP||payroll(other)-theirs.salary+mine.salary>CAP)return notify('交易後任一球隊薪資將超過 100M。');let a=roster(team()),b=roster(other),ai=a.indexOf(mine),bi=b.indexOf(theirs);a[ai]={...theirs,team:team(),starter:mine.starter};b[bi]={...mine,team:other,starter:theirs.starter};const text=`${team()} 送出 ${mine.name}，換回 ${theirs.name}（${other}）`;state.tradeHistory.unshift({text,date:today()});recordEvent(`交易完成：${text}。`);save();render();notify('交易完成並已記錄。')}
function signFA(id){let p=state.freeAgents.find(x=>x.id===id);if(!p)return;if(roster(team()).length>=MAX_ROSTER)return notify(`名單已達 ${MAX_ROSTER} 人。`);if(payroll(team())+(Number(p.salary)||0)>CAP)return notify('簽約後薪資會超過 100M 上限。');if(p.isForeign&&foreignCount(team())>=MAX_FOREIGN)return notify(`外籍球員已達 ${MAX_FOREIGN} 人上限。`);p=normPlayer({...p,team:team(),starter:false,contractYears:2},team());state.rosters[team()].push(p);state.freeAgents=state.freeAgents.filter(x=>x.id!==id);recordEvent(`自由球員簽約：${team()} 簽下 ${p.name}。`);save();render();notify(`已簽下 ${p.name}。`)}
function draftView(){let picks=state.draftClass||[];if(!picks.length){picks=Array.from({length:7},(_,i)=>{let p=player(['林新秀','陳新秀','張新秀','王新秀','李新秀','周新秀','吳新秀'][i],i,false);p.name=`${['林','陳','張','王','李','周','吳'][i]}${['承恩','子豪','宇翔','柏安','冠宇','明哲','家維'][Math.floor(Math.random()*7)]}`;p.rating=62+Math.floor(Math.random()*14);p.potential=Math.min(99,p.rating+12+Math.floor(Math.random()*15));p.salary=i===0?9:i===1?8:i===2?7:5;p.age=19;p.team='新秀';p.contractYears=2;return p});state.draftClass=picks;save()}return `<div class="card"><div class="row"><div><h2>新人選秀</h2><small>首輪前三順位底薪 9／8／7M，其餘 5M；新秀合約兩年保障。</small></div><button class="btn gold" id="draftButton" ${state.draftDone?'disabled':''}>${state.draftDone?'本季已完成選秀':'模擬選秀並簽下新秀'}</button></div>${picks.map((p,i)=>`<div class="entry"><span>${i+1}順位｜${esc(p.name)}<small class="meta">${p.age}歲 · OVR ${p.rating} · 潛力 ${p.potential} · ${p.salary}M</small></span><b>合約 ${p.contractYears||2} 年</b></div>`).join('')}</div>`}
function runDraft(){if(state.draftDone)return notify('本季已完成選秀。');const available=state.draftClass||[];let pick=available[0];if(!pick)return notify('選秀球員資料不存在。');if(roster(team()).length>=MAX_ROSTER)return notify('名單已滿，請先釋出名額再選秀。');if(payroll(team())+pick.salary>CAP)return notify('薪資空間不足，無法簽下新秀。');pick={...pick,id:uid(),team:team(),starter:false,contractYears:2,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}};roster(team()).push(pick);state.draftClass=available.slice(1);state.draftDone=true;recordEvent(`新人選秀：${team()} 選進 ${pick.name}（潛力 ${pick.potential}）。`);save();render();notify(`已選進新秀 ${pick.name}。`)}
function seasonView(){const r=state.standings[team()];return `<div class="card"><h2>賽季進度</h2><div class="stats"><div class="stat"><small>球季</small><b>第 ${state.season} 季</b></div><div class="stat"><small>例行賽</small><b>${r.g}/${GAMES}</b></div><div class="stat"><small>聯盟賽程</small><b>${state.gameIndex}/${(state.schedule||[]).length||LEAGUE_GAMES}</b></div><div class="stat"><small>賽季階段</small><b>${state.postseason?.champion?'休賽季':state.postseason?'季後賽':'例行賽'}</b></div></div><p class="notice">賽程與模擬比賽由主遊戲處理。完成例行賽後可回主遊戲進行季後賽；此頁的賽季推進會建立新球季並更新球員年齡、合約與能力。</p><div class="actions"><a class="btn blue" href="./">回主遊戲進行比賽／季後賽</a><button class="btn gold" id="advanceSeason">推進至下一季</button></div></div><div class="card"><h2>最近賽季日誌</h2>${state.history.slice(0,20).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')||'<p class="muted">尚無賽季紀錄。</p>'}</div>`}
function advanceSeason(){if(!confirm('推進至下一季？將重置本季賽程與戰績，球員年齡增加，合約年資減少並進行能力發展。'))return;state.season=(Number(state.season)||1)+1;state.gameIndex=0;state.wins=0;state.losses=0;state.standings=blankStandings();state.schedule=makeSchedule();state.postseason=null;state.tradeUsed=false;state.draftDone=false;state.draftClass=null;for(const t of TEAMS)for(const p of roster(t)){p.stats={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0};p.age=(Number(p.age)||20)+1;p.contractYears=Math.max(0,(Number(p.contractYears)||1)-1);p.injury=0;if(p.age<=Number(p.potential||p.rating)&&Math.random()<.65)p.rating=Math.min(Number(p.potential)||99,p.rating+1);else if(p.age>32&&Math.random()<.3)p.rating=Math.max(45,p.rating-1)}recordEvent(`第 ${state.season} 季開始：賽程已重設，球員年齡、合約與能力已更新。`);save();render();notify(`第 ${state.season} 季開始。`)}
function careerView(){const records=[...state.seasonRecords].reverse(),rank=standings(),achievements=state.achievements;return `<div class="card"><h2>生涯榮譽與成就</h2><div class="grid"><div class="core"><b>冠軍數</b>${state.seasonRecords.filter(x=>x.champion===team()).length}</div><div class="core"><b>累計球季</b>${Math.max(0,state.season-1)}</div><div class="core"><b>排行榜</b>目前第 ${rank.findIndex(x=>x.team===team())+1} 名</div></div><div class="row" style="margin-top:14px"><b>本機成就（不與其他玩家同步）</b><button class="btn" id="checkAchievements">檢查／更新成就</button></div>${achievements.map(a=>`<div class="entry"><span>${esc(a.title)}</span><small>${esc(a.date)}</small></div>`).join('')||'<p class="muted">尚未解鎖成就。</p>'}</div><div class="card"><h2>歷年球季紀錄</h2>${records.map(x=>`<div class="entry"><span>第 ${x.season} 季｜冠軍 ${esc(x.champion)}<small class="meta">${(x.standings||[]).map((t,i)=>`${i+1}.${esc(t.team)} ${t.w}-${t.l}`).join('　')}</small></span><b>${esc(x.myRecord||'')}</b></div>`).join('')||'<p class="muted">尚無已完成球季紀錄。</p>'}</div>`}
function checkAchievements(){const tests=[['首勝',state.wins>=1],['十勝球隊',state.wins>=10],['薪資管理達人',payroll(team())<=CAP],['完整陣容',roster(team()).length>=12],['四名外籍球員',foreignCount(team())>=4]];let got=0;for(const [title,ok] of tests)if(ok&&!state.achievements.some(a=>a.title===title)){state.achievements.push({title,date:today()});got++}save();render();notify(got?`新增 ${got} 項成就。`:'目前沒有新成就。')}
function render(){const active=document.querySelector('.tabs button.active')?.dataset.tab||'dashboard';$('#dashboard').innerHTML=dashboard();$('#roster').innerHTML=rosterView();$('#market').innerHTML=marketView();$('#draft').innerHTML=draftView();$('#season').innerHTML=seasonView();$('#career').innerHTML=careerView();document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===active));refreshTradeTargets();}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
document.addEventListener('change',e=>{if(e.target.id==='tradeTeam')refreshTradeTargets();if(e.target.id==='importFile')importJSON(e.target.files?.[0])});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.starter){const p=roster(team()).find(x=>x.id===b.dataset.starter);if(!p)return;if(!p.starter&&roster(team()).filter(x=>x.starter).length>=5)return notify('先發最多五人，請先調整一位。');p.starter=!p.starter;save();render();return}if(b.dataset.sign){signFA(b.dataset.sign);return}if(b.id==='doTrade'){doTrade();return}if(b.id==='draftButton'){runDraft();return}if(b.id==='advanceSeason'){advanceSeason();return}if(b.id==='checkAchievements'){checkAchievements();return}});
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`front-office-season-${state.season}-backup.json`;a.click();URL.revokeObjectURL(url);notify('已匯出 JSON 備份。')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||!imported.rosters||!TEAMS.every(t=>Array.isArray(imported.rosters[t])))throw Error('JSON 格式不符合遊戲存檔');if(!confirm('匯入會覆蓋目前瀏覽器存檔。確定繼續？'))return;localStorage.setItem(KEY,JSON.stringify(imported));state=load();render();notify('存檔匯入成功。')}catch(err){notify(`匯入失敗：${err.message}`)}$('#importFile').value=''};reader.readAsText(file)}
$('#export').addEventListener('click',exportJSON);
save();render();
})();
</script></body></html>
