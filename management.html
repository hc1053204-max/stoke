<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜球隊營運中心</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193047 0,#0a141e 56%,#08111a 100%);color:var(--text);min-height:100vh}.app{max-width:1120px;margin:auto;padding:20px}header,.row,.tabs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}a{color:var(--gold);text-decoration:none}.card{background:#121e2acc;border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.notice{padding:11px 13px;background:#19293a;border:1px solid #34495e;border-radius:9px;color:#d4e2f1;margin:10px 0;line-height:1.55}.muted,small{color:var(--muted)}.btn{border:1px solid var(--line);background:#26374a;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:700}.btn.gold{color:#201b11;background:var(--gold);border-color:var(--gold)}.btn:disabled{opacity:.42;cursor:not-allowed}.tabs{justify-content:flex-start;border-bottom:1px solid var(--line);margin:18px 0;gap:16px}.tabs button{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:10px 0;cursor:pointer;font:inherit}.tabs button.active{color:var(--gold);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.core,.team{background:#0b1520;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block}.stat b{display:block;font-size:18px;margin:4px 0}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border:0}.badge{display:inline-block;font-size:10px;border:1px solid #927941;border-radius:99px;color:var(--gold);padding:3px 7px;margin-left:5px}.foreign{color:#ffd7aa;border-color:#c78f4a}.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end;gap:10px;margin:12px 0}.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}select,input{font:inherit;color:var(--text);background:#0a1520;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;max-width:90vw;z-index:5}@media(max-width:650px){.app{padding:12px}.tabs{gap:10px}.tabs button{font-size:12px}.entry{align-items:flex-start}}
</style></head>
<body><main class="app">
<header><div><h1>FRONT OFFICE｜球隊營運中心</h1><small>名單管理・球員簽約・球隊薪資</small></div><div><a href="./">返回主遊戲</a>　<button class="btn" id="export">匯出 JSON</button>　<label class="btn" for="importFile">匯入 JSON</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></header>
<nav class="tabs"><button class="active" data-tab="dashboard">總管儀表板</button><button data-tab="roster">球員名單</button><button data-tab="market">自由球員／交易</button><button data-tab="season">賽季</button></nav>
<section id="dashboard" class="panel active"></section><section id="roster" class="panel"></section><section id="market" class="panel"></section><section id="season" class="panel"></section>
<p class="muted">名單上限 16 人（含本土與洋將）；洋將最多 4 名、合計薪資上限 US$40,000；本土薪資合計上限 200M。存檔保存在此瀏覽器 localStorage。</p>
</main><script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',DOM_CAP=200,FOREIGN_CAP=40000,ROSTER_CAP=16,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,today=()=>new Date().toLocaleDateString('zh-TW');
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>n.remove(),2300)}
function foreign(p){return !!(p?.isForeign||p?.foreign)}
function newFA(name,i,isImport=false){let r=isImport?72+(i*3)%15:64+(i*7)%18;return{id:uid(),name,team:'自由球員',pos:POS[i%5],age:isImport?23+i%8:20+i%10,rating:r,potential:Math.min(99,r+12),salary:isImport?0:5+i%6,salaryUsd:isImport?10000:null,isForeign:isImport,contractYears:2,starter:false,injury:0,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}}}
function defaultFAs(){let locals=['林冠宇','陳子豪','張家維','王俊凱','李明哲','周柏安','吳承翰','黃建宏','蔡昱廷','許博翔','鄭宇翔','郭柏廷'];let imports=['Marcus Reed','Jordan Hayes','Darius Cole','Andre Miller'];return [...locals.map((n,i)=>newFA(n,i)),...imports.map((n,i)=>newFA(n,i+locals.length,true))]}
function normalizePlayer(p,t){const f=foreign(p);return{...p,id:p.id||uid(),team:p.team||t,salary:f?0:(Number(p.salary)||5),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):null,isForeign:f,age:Number(p.age)||22,rating:Number(p.rating)||65,potential:Number(p.potential)||Number(p.rating)||65,contractYears:Math.max(1,Number(p.contractYears)||2),stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,...p.stats}}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s?.rosters)throw Error('請先開啟主遊戲並建立存檔。');s.rosters=s.rosters||{};TEAMS.forEach(t=>s.rosters[t]=(Array.isArray(s.rosters[t])?s.rosters[t]:[]).map(p=>normalizePlayer(p,t)));s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents.map(p=>normalizePlayer(p,'自由球員')):defaultFAs();s.standings={...blankStandings(),...(s.standings||{})};s.history=Array.isArray(s.history)?s.history:[];s.tradeHistory=Array.isArray(s.tradeHistory)?s.tradeHistory:[];s.gameIndex=Number(s.gameIndex)||0;s.season=Number(s.season)||1;return s}
let state;try{state=load()}catch(e){document.body.innerHTML=`<main class="app"><h1>球隊營運中心</h1><div class="notice">${esc(e.message)}</div><a href="./">返回主遊戲</a></main>`;return}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器空間。');return false}}
const roster=t=>state.rosters[t]||[],myTeam=()=>state.team,domesticPayroll=t=>roster(t).filter(p=>!foreign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0),foreignPayroll=t=>roster(t).filter(foreign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0),foreignCount=t=>roster(t).filter(foreign).length;
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))}
function avg(list){return list.length?Math.round(list.reduce((n,p)=>n+(Number(p.rating)||0),0)/list.length):0}
function event(text){state.history.unshift({text,date:today()});state.history=state.history.slice(0,250)}
function dashboard(){const t=myTeam(),r=state.standings[t],starters=roster(t).filter(p=>p.starter),bench=roster(t).filter(p=>!p.starter),rank=standings().findIndex(x=>x.team===t)+1,core=[...roster(t)].sort((a,b)=>b.rating-a.rating).slice(0,3);return `<div class="card"><div class="row"><div><h2>${esc(t)}｜第 ${state.season} 季</h2><small>例行賽 ${r.g}/${GAMES} 場 · 排名第 ${rank}</small></div><b>聯盟賽程 ${state.gameIndex}/${state.schedule?.length||LEAGUE_GAMES}</b></div><div class="stats"><div class="stat"><small>戰績</small><b>${r.w}-${r.l}</b></div><div class="stat"><small>本土薪資／上限</small><b>${domesticPayroll(t)} / ${DOM_CAP}M</b><small>剩餘 ${Math.max(0,DOM_CAP-domesticPayroll(t))}M</small></div><div class="stat"><small>洋將薪資</small><b>US$${foreignPayroll(t).toLocaleString()} / $${FOREIGN_CAP.toLocaleString()}</b></div><div class="stat"><small>名單／洋將</small><b>${roster(t).length}/${ROSTER_CAP} · ${foreignCount(t)}/${FOREIGN_LIMIT}</b></div><div class="stat"><small>先發戰力</small><b>${avg(starters)} OVR</b></div><div class="stat"><small>替補戰力</small><b>${avg(bench)} OVR</b></div><div class="stat"><small>老闆情緒</small><b>${r.w>r.l?'滿意':'觀望'}</b></div></div></div><div class="card"><h2>球隊核心</h2><div class="grid">${core.map(p=>`<div class="core"><b>${esc(p.name)}${foreign(p)?'　洋將':''}</b><small>OVR ${p.rating} · 潛力 ${p.potential} · ${p.age}歲</small><small class="meta">${foreign(p)?'US$'+Number(p.salaryUsd).toLocaleString():p.salary+'M'} · 合約 ${p.contractYears}年</small></div>`).join('')}</div></div><div class="card"><h2>聯盟戰績排行</h2>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} · ${x.w*2+x.l}分</b></div>`).join('')}</div>`}
function rosterView(){const t=myTeam();return `<div class="card"><div class="row"><div><h2>完整球員名單</h2><small>最多 16 人，先發最多五人。點擊右側按鈕即可切換先發／替補。</small></div><b>${roster(t).length}/${ROSTER_CAP}</b></div>${roster(t).map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${foreign(p)?'<span class="badge foreign">洋將</span>':''}<small class="meta">${esc(p.pos)} · ${p.age}歲 · OVR ${p.rating} · 潛力 ${p.potential} · ${foreign(p)?'US$'+Number(p.salaryUsd).toLocaleString():p.salary+'M'} · 合約 ${p.contractYears}年 · ${p.starter?'先發':'替補'}</small></div><button class="btn" data-starter="${esc(p.id)}">設為${p.starter?'替補':'先發'}</button></div>`).join('')||'<p class="muted">名單目前沒有球員。</p>'}</div>`}
function marketView(){return `<div class="card"><h2>自由球員市場</h2><p class="notice">本土薪資上限 200M；洋將最多 4 名，洋將薪資總額上限 US$40,000；全隊名單最多 16 人。</p>${state.freeAgents.map(p=>`<div class="entry"><div><b>${esc(p.name)}</b>${foreign(p)?'<span class="badge foreign">洋將</span>':'<span class="badge">本土</span>'}<small class="meta">${esc(p.pos)} · OVR ${p.rating} · 潛力 ${p.potential} · ${foreign(p)?'US$'+Number(p.salaryUsd).toLocaleString():'薪資 '+p.salary+'M'}</small></div><button class="btn gold" data-sign="${esc(p.id)}">簽約</button></div>`).join('')||'<p class="muted">自由球員市場目前沒有球員。</p>'}</div><div class="card"><h2>交易歷史</h2>${state.tradeHistory.map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')||'<p class="muted">目前沒有交易紀錄。</p>'}</div>`}
function seasonView(){return `<div class="card"><h2>賽季進度</h2><p class="notice">七隊各 36 場、聯盟共 126 場。比賽及季後賽請回主遊戲進行；管理中心不會把季後賽場次加入例行賽戰績。</p><div class="entry"><span>目前球季</span><b>第 ${state.season} 季 · ${state.standings[myTeam()].g}/${GAMES}</b></div><div class="entry"><span>聯盟賽程游標</span><b>${state.gameIndex}/${state.schedule?.length||LEAGUE_GAMES}</b></div><a class="btn" href="./">回主遊戲</a></div>`}
function render(){const active=document.querySelector('.tabs button.active')?.dataset.tab||'dashboard';$('#dashboard').innerHTML=dashboard();$('#roster').innerHTML=rosterView();$('#market').innerHTML=marketView();$('#season').innerHTML=seasonView();document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===active))}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.starter){const p=roster(myTeam()).find(x=>x.id===b.dataset.starter);if(!p)return;if(p.injury)return notify('受傷球員不可設為先發。');if(!p.starter&&roster(myTeam()).filter(x=>x.starter).length>=5)return notify('先發最多五人，請先將一人改為替補。');p.starter=!p.starter;save();render();return}if(b.dataset.sign){const p=state.freeAgents.find(x=>x.id===b.dataset.sign),t=myTeam();if(!p)return;if(roster(t).length>=ROSTER_CAP)return notify(`名單已達 ${ROSTER_CAP} 人。`);if(foreign(p)){if(foreignCount(t)>=FOREIGN_LIMIT)return notify('洋將已達4人上限。');if(foreignPayroll(t)+(Number(p.salaryUsd)||0)>FOREIGN_CAP)return notify('簽約後洋將薪資會超過 US$40,000。')}else if(domesticPayroll(t)+(Number(p.salary)||0)>DOM_CAP)return notify('簽約後本土薪資會超過 200M。');const signed=normalizePlayer({...p,team:t,starter:false,contractYears:2},t);roster(t).push(signed);state.freeAgents=state.freeAgents.filter(x=>x.id!==p.id);event(`${foreign(p)?'洋將':'自由球員'}簽約：${t} 簽下 ${p.name}。`);save();render();notify(`已簽下 ${p.name}。`)}});
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`front-office-season-${state.season}.json`;a.click();URL.revokeObjectURL(url)}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.rosters||!TEAMS.every(t=>Array.isArray(data.rosters[t])))throw Error('存檔格式錯誤');if(!confirm('匯入會覆蓋目前存檔，確定嗎？'))return;localStorage.setItem(KEY,JSON.stringify(data));location.reload()}catch(err){notify('匯入失敗：'+err.message)}$('#importFile').value=''};reader.readAsText(file)}
$('#export').addEventListener('click',exportJSON);$('#importFile').addEventListener('change',e=>importJSON(e.target.files?.[0]));save();render();
})();
</script></body></html>
