<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜球隊營運中心</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}html,body{margin:0;padding:0;background:radial-gradient(circle at top,#101d2d,#07141d 55%);color:var(--text)}body{min-height:100vh}a,button{font:inherit}button{background:linear-gradient(180deg,#1a2b3d,#0f1d2a);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.65rem .9rem;cursor:pointer;transition:.18s ease;box-shadow:0 6px 18px rgba(0,0,0,.18)}button:hover{transform:translateY(-1px);border-color:#4a627f}button:focus-visible,a:focus-visible{outline:3px solid rgba(237,195,110,.8);outline-offset:2px}.app{max-width:1200px;margin:0 auto;padding:1rem}.panel{display:none}.panel.active{display:block}.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.tabs button{flex:1 1 180px}.card{background:rgba(20,32,45,.88);border:1px solid var(--line);border-radius:18px;padding:1rem;box-shadow:0 12px 32px rgba(3,8,13,.28)}.muted{color:var(--muted)}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0 1.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem}header h1{margin:0;font-size:clamp(1.5rem,3vw,2.5rem)}header small{display:block;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}.notice{padding:.8rem 1rem;border:1px solid rgba(237,195,110,.5);background:rgba(237,195,110,.08);border-radius:12px}.table{display:grid;gap:.6rem}.entry{display:flex;justify-content:space-between;gap:.75rem;align-items:center;border-bottom:1px solid var(--line);padding:.55rem 0}.toast{position:fixed;right:1rem;bottom:1rem;z-index:9999;background:rgba(7,13,17,.95);color:#eef4fb;border:1px solid rgba(237,195,110,.45);padding:.7rem 1rem;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media (max-width:760px){.app{padding:.8rem}.row,header,.tabs{flex-direction:column;align-items:flex-start}.tabs button{width:100%}.card{padding:.8rem}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style>
<link rel="stylesheet" href="./enhancements.css">
</head>
<body><main class="app">
<header><div><h1>FRONT OFFICE｜球隊營運中心</h1><small>名單管理・球員簽約・球隊薪資</small></div><div><a href="./">返回主遊戲</a>　<button class="btn" id="export">匯出存檔</button><label class="btn"><input type="file" id="importFile" accept="application/json" hidden>匯入</label></div></header>
<nav class="tabs"><button class="active" data-tab="dashboard">總管儀表板</button><button data-tab="roster">球員名單</button><button data-tab="market">自由球員／交易</button><button data-tab="season">賽季進度</button></nav>
<section id="dashboard" class="panel active"></section><section id="roster" class="panel"></section><section id="market" class="panel"></section><section id="season" class="panel"></section>
<p class="muted">名單上限 16 人（含本土與洋將）；洋將最多 4 名、合計薪資上限 US$40,000；本土薪資合計上限 200M。存檔保存在此瀏覽器 localStorage。</p>
</main><script>
(() => {'use strict';
const KEY='front-office-tpbl-optimized-v1',DOM_CAP=200,FOREIGN_CAP=40000,ROSTER_CAP=16,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','高雄17LIVE鋼鐵人','臺北富邦勇士','新竹御頂攻城獅'];
const POS=['PG','SG','SF','PF','C'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\'':'&#39;'}[c]));
function uid(){return `p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`} 
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;n.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>n.classList.remove('show'),1800)}
function foreign(p){return !!(p?.isForeign||p?.foreign)}
function newFA(name,i,isImport=false){let r=isImport?72+(i*3)%15:64+(i*7)%18;return{id:uid(),name,team:'自由球員',pos:POS[i%5],age:isImport?23+i%8:20+i%10,rating:r,potential:Math.min(99,r+12),salary:isImport?Math.round(7+Math.random()*12):Math.round(3+Math.random()*8),salaryUsd:isImport?Math.round(9000+Math.random()*18000):0,isForeign:isImport,starter:false,injury:false}} 
function defaultFAs(){let locals=['林冠宇','陳子豪','張家維','王俊凱','李明哲','周柏安','吳承翰','黃建宏','蔡昱廷','許博翔','鄭宇翔','郭柏廷'];let imports=['Marvin Williams','Malcolm Miller','Nathan Knight','Lorenzo Brown','Jamal Murray','Tyler Cavanaugh','Myles Turner','Shabazz Napier'];return [...locals.map((n,i)=>newFA(n,i,false)),...imports.map((n,i)=>newFA(n,i,true))]}
function normalizePlayer(p,t){const f=foreign(p);return{...p,id:p.id||uid(),team:p.team||t,salary:f?0:(Number(p.salary)||5),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):0,isForeign:f,age:Number(p.age)||22,rating:Number(p.rating)||70,potential:Number(p.potential)||72,starter:Boolean(p.starter),injury:Boolean(p.injury)}} 
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s?.rosters)throw Error('請先開啟主遊戲並建立存檔。');s.rosters=s.rosters||{};TEAMS.forEach(t=>{if(!Array.isArray(s.rosters[t])) s.rosters[t]=[]; s.rosters[t]=s.rosters[t].map(p=>normalizePlayer(p,t));});return s}
let state;try{state=load()}catch(e){document.body.innerHTML=`<main class="app"><h1>球隊營運中心</h1><div class="notice">${esc(e.message)}</div><a href="./">返回主遊戲</a></main>`;return}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器空間。');return false}}
const roster=t=>state.rosters[t]||[],myTeam=()=>state.team,domesticPayroll=t=>roster(t).filter(p=>!foreign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0),foreignPayroll=t=>roster(t).filter(foreign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0)
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))}
function avg(list){return list.length?Math.round(list.reduce((n,p)=>n+(Number(p.rating)||0),0)/list.length):0}
function today(){return new Date().toLocaleDateString('zh-TW')} 
function dashboard(){const t=myTeam(),r=state.standings[t],starters=roster(t).filter(p=>p.starter),bench=roster(t).filter(p=>!p.starter),rank=standings().findIndex(x=>x.team===t)+1,core=roster(t).slice(0,3);return `<div class="card"><div class="row"><div><h2>總管儀表板</h2><small class="muted">當前球隊：${esc(t)}｜聯盟排名：${rank+1}</small></div><div class="notice">本土薪資 ${domesticPayroll(t)}M／200M｜洋將薪資 US$${foreignPayroll(t).toLocaleString()}／40,000</div></div><div class="table"><div class="entry"><span>球隊戰績</span><b>${r?.w||0}-${r?.l||0}</b></div><div class="entry"><span>平均評價</span><b>${avg(roster(t))}</b></div><div class="entry"><span>先發</span><b>${starters.length}/5</b></div><div class="entry"><span>替補</span><b>${bench.length}</b></div></div><div class="table">${core.map(p=>`<div class="entry"><span>${esc(p.name)}</span><b>${p.rating}</b></div>`).join('')}</div></div>`}
function rosterView(){const t=myTeam();return `<div class="card"><div class="row"><div><h2>完整球員名單</h2><small class="muted">最多 16 人，先發最多五人。</small></div></div><div class="table">${roster(t).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)} · ${p.isForeign?'洋將':'本土'}</span><b>${p.rating}</b></div>`).join('')}</div></div>`}
function marketView(){return `<div class="card"><h2>自由球員市場</h2><p class="notice">本土薪資上限 200M；洋將最多 4 名，洋將薪資總額上限 US$40,000；全隊名單最多 16 人。</p><div class="table">${defaultFAs().slice(0,8).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><button data-sign="${p.id}">簽約</button></div>`).join('')}</div></div>`}
function seasonView(){return `<div class="card"><h2>賽季進度</h2><p class="notice">七隊各 36 場、聯盟共 126 場。比賽及季後賽請回主遊戲進行；管理中心不會直接模擬賽果。</p></div>`}
function render(){const active=document.querySelector('.tabs button.active')?.dataset.tab||'dashboard';$('#dashboard').innerHTML=dashboard();$('#roster').innerHTML=rosterView();$('#market').innerHTML=marketView();$('#season').innerHTML=seasonView();document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===active));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===active));}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; if(b.dataset.sign){const p=defaultFAs().find(x=>x.id===b.dataset.sign);if(p){notify(`已標記簽約 ${p.name}`);return;}} if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`front-office-${Date.now()}.json`;a.click();URL.revokeObjectURL(url);notify('已匯出存檔');}});
$('#importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);state=load();if(data.rosters){state.rosters=data.rosters;save();render();notify('匯入成功');}}catch{notify('匯入失敗，請確認 JSON 格式');}};reader.readAsText(file);});
save();render();
})();
</script>
<script src="./enhancements.js" defer></script></body></html>
