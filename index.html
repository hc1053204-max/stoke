<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--green:#73d6a0;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:1050px;margin:auto;padding:20px}header,.row,.entry,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}header{flex-wrap:wrap}.muted,small{color:var(--muted)}h1{margin:0}h2,h3{margin:.25em 0}.budget,.badge{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--gold)}.budget small{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:16px 0}.nav button{background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;white-space:nowrap}.nav button.active{color:var(--gold);border-bottom:2px solid var(--gold)}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#26374a;color:var(--text);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:var(--gold);color:#201b11;border-color:var(--gold);font-weight:700}.danger{background:#45292d;border-color:#74444b;color:#ffc7c7}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{padding:10px 0;border-bottom:1px solid #ffffff18}.entry:last-child{border:0}.form{display:grid;gap:8px;margin:12px 0}.form label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:10px;background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:5}.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}.empty{padding:16px;color:var(--muted)}.danger-text{color:var(--red)}@media(max-width:700px){.app{padding:12px}.columns{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head>
<body><div class="app"><header><div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div id="budget" class="budget"></div></header><section class="hero"><div class="row"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="new">新賽季</button><button class="danger" data-action="restart">重新開始</button></div></div></section><nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="market">自由球員／洋將</button><button data-page="standings">聯盟排名</button></nav><main id="view"></main><div class="footer">每隊例行賽 36 場｜聯盟共 126 場｜本土薪資上限 200M｜洋將最多 4 名、合計上限 US$40,000</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=200,FOREIGN_CAP=40000,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],NAMES=['高錦瑋','林信寬','陳子豪','王皓吉','周柏臣','林冠宇','陳子威','吳承翰','張家維','劉元凱','李明哲','黃建宏'],IMPORTS=['Marcus Brown','Jordan Williams','Chris Johnson','Michael Davis','David Miller','Anthony Smith'],POS=['PG','SG','SF','PF','C'];let page='home',state;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makePlayer(name,team,i,foreign=false){const rating=foreign?74+(i*3)%13:68+(i*7)%18;return{id:`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,name,team,pos:POS[i%5],age:22+i%9,rating,salary:foreign?0:7+i%8,salaryUsd:foreign?9000+i%4*2000:null,isForeign:foreign,starter:false,injury:0,stats:{gp:0,pts:0}}}
function schedule(){const games=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)games.push({a:TEAMS[i],b:TEAMS[j]});for(let i=games.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[games[i],games[j]]=[games[j],games[i]]}return games.map((g,i)=>({...g,id:i+1}))}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}]))}
function fresh(){const rosters={};TEAMS.forEach((t,ti)=>{rosters[t]=Array.from({length:12},(_,i)=>makePlayer(NAMES[(i+ti)%NAMES.length],t,i));rosters[t].slice(0,5).forEach(p=>p.starter=true)});return{team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,rosters,standings:blankStandings(),schedule:schedule(),freeAgents:[],history:[]}}
function normalize(raw){if(!raw?.rosters)return fresh();const s={...fresh(),...raw};s.rosters=s.rosters||{};TEAMS.forEach((t,ti)=>{const list=Array.isArray(s.rosters[t])?s.rosters[t]:[];s.rosters[t]=list.map((p,i)=>{const f=!!(p.isForeign||p.foreign);return{...makePlayer(p.name||NAMES[i%NAMES.length],t,i,f),...p,team:t,id:p.id||`${t}-${i}`,isForeign:f,salary:f?0:Math.max(0,Number(p.salary)||0),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):null,stats:{gp:0,pts:0,...p.stats}}});let starters=s.rosters[t].filter(p=>p.starter);s.rosters[t].forEach(p=>p.starter=starters.includes(p)&&starters.indexOf(p)<5);if(!s.rosters[t].some(p=>p.starter))s.rosters[t].slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)});s.standings={...blankStandings(),...(s.standings||{})};TEAMS.forEach(t=>{const r=s.standings[t]||{};const w=Math.max(0,Number(r.w)||0),l=Math.max(0,Number(r.l)||0);s.standings[t]={...r,w,l,g:w+l}});s.schedule=Array.isArray(s.schedule)&&s.schedule.length===LEAGUE_GAMES?s.schedule:schedule();s.gameIndex=Math.max(0,Math.min(LEAGUE_GAMES,Number(s.gameIndex)||0));s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:[];return s}
try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器儲存空間。');return false}}
function notify(m){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=m;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.remove(),2600)}
function roster(t=state.team){return state.rosters[t]||[]}function foreign(p){return!!(p.isForeign||p.foreign)}function domesticPayroll(t=state.team){return roster(t).filter(p=>!foreign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0)}function foreignPayroll(t=state.team){return roster(t).filter(foreign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0)}function foreignCount(t=state.team){return roster(t).filter(foreign).length}function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l)}
function render(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('[id="budget"]').innerHTML=`本土薪資 ${domesticPayroll()} / ${CAP}M<small>洋將 ${foreignCount()} / ${FOREIGN_LIMIT} 名 · US$${foreignPayroll().toLocaleString()} / ${FOREIGN_CAP.toLocaleString()}</small>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='roster'?rosterPage():page==='market'?marketPage():page==='standings'?standingsPage():homePage()}
function homePage(){const r=state.standings[state.team];return `<div class="columns"><section class="card"><h3>例行賽進度</h3><p>${r.g}/${GAMES} 場；全聯盟 ${state.gameIndex}/${LEAGUE_GAMES} 場</p><p class="muted">七隊彼此各交手六次，每隊 36 場、全聯盟共 126 場。</p><button class="gold" data-action="play" ${r.g>=GAMES?'disabled':''}>模擬下一場</button></section><section class="card"><h3>聯盟戰績</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} <small>${x.g}/${GAMES}</small></b></div>`).join('')}</section></div><section class="card"><h3>先發陣容</h3>${roster().filter(p=>p.starter).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating} OVR</b></div>`).join('')||'<p class="empty">尚未設定先發</p>'}</section>`}
function rosterPage(){return `<section class="card"><h3>球員名單 · ${roster().length}/16</h3><p class="muted">先發最多五人。替補可直接按「替換先發」，系統會以該球員取代目前評分最低且未受傷的先發。</p>${roster().map(p=>`<div class="entry"><span><b>${esc(p.name)}</b> ${p.starter?'<span class="badge">先發</span>':'<span class="muted">替補</span>'}<small class="muted"><br>${esc(p.pos)} · ${p.age} 歲 · ${foreign(p)?`洋將 US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 ${Number(p.salary)||0}M`}${p.injury?` · 受傷 ${p.injury} 場`:''}</small></span><button data-action="${p.starter?'bench':'replace'}" data-id="${esc(p.id)}" ${p.injury?'disabled':''}>${p.starter?'改為替補':'替換先發'}</button></div>`).join('')}</section>`}
function marketPage(){const fas=state.freeAgents;return `<section class="card"><h3>自由球員簽約</h3><p class="muted">本土薪資上限 200M；洋將最多四名、合計薪資不超過 US$40,000；球員名單最多 16 人。</p><div class="form"><label for="faType">球員類型</label><select id="faType"><option value="local">本土球員</option><option value="foreign">洋將</option></select><label for="faName">球員姓名</label><input id="faName" maxlength="30" placeholder="輸入球員姓名"><label for="faSalary">本土年薪（M）</label><input id="faSalary" type="number" min="1" max="200" value="8"><label for="faUsd">洋將年薪（US$）</label><input id="faUsd" type="number" min="1" max="40000" value="10000"><button class="gold" data-action="sign">建立並簽約</button></div><h3>自由球員市場</h3>${fas.length?fas.map(p=>`<div class="entry"><span><b>${esc(p.name)}</b><small class="muted"><br>${foreign(p)?`洋將 · US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 · ${p.salary}M`} · ${p.rating||70} OVR</small></span><button data-action="sign-existing" data-id="${esc(p.id)}">簽下</button></div>`).join(''):'<p class="empty">目前沒有待簽球員；可使用上方表單建立簽約。</p>'}<div class="entry"><span>目前本土薪資</span><b>${domesticPayroll()} / ${CAP}M</b></div><div class="entry"><span>洋將薪資與名額</span><b>${foreignCount()} / ${FOREIGN_LIMIT} 人 · US$${foreignPayroll().toLocaleString()} / ${FOREIGN_CAP.toLocaleString()}</b></div></section>`}
function standingsPage(){return `<section class="card"><h3>例行賽排名</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w} 勝 ${x.l} 敗 · ${x.g}/${GAMES} 場</b></div>`).join('')}</section>`}
function playFixture(f){const a=state.standings[f.a],b=state.standings[f.b];if(!a||!b)return;const avg=t=>{const starters=roster(t).filter(p=>p.starter&&!p.injury);const players=starters.length?starters:roster(t).filter(p=>!p.injury).slice(0,5);return players.length?players.reduce((n,p)=>n+(Number(p.rating)||0),0)/players.length:65};let sa=Math.round(80+Math.random()*22+(avg(f.a)-72)*.55),sb=Math.round(80+Math.random()*22+(avg(f.b)-72)*.55);if(sa===sb)sa++;a.g++;b.g++;if(sa>sb){a.w++;b.l++}else{b.w++;a.l++}for(const [team,score]of[[f.a,sa],[f.b,sb]])roster(team).filter(p=>p.starter&&!p.injury).forEach(p=>{p.stats.gp=(p.stats.gp||0)+1;p.stats.pts=(p.stats.pts||0)+Math.floor(score/5)})}
function finishSchedule(){while(state.gameIndex<state.schedule.length){playFixture(state.schedule[state.gameIndex]);state.gameIndex++}const allDone=TEAMS.every(t=>state.standings[t].g===GAMES);if(allDone)notify('例行賽完成：七隊各 36 場，聯盟共 126 場。');else notify('賽程資料不完整，請重新開始賽季以建立正確賽程。')}
function nextGame(){if(state.standings[state.team].g>=GAMES)return notify('你的例行賽已完成。');let found=false;while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex];state.gameIndex++;playFixture(f);if(f.a===state.team||f.b===state.team){found=true;break}}if(state.standings[state.team].g>=GAMES)finishSchedule();else if(!found)finishSchedule();save();render()}
function setStarter(id,replace=false){const p=roster().find(x=>String(x.id)===id);if(!p)return;if(p.injury)return notify('受傷球員不可設定為先發。');if(p.starter){if(roster().filter(x=>x.starter).length<=5)return notify('至少需保留五位先發；請直接選擇替補球員替換先發。');p.starter=false}else{const current=roster().filter(x=>x.starter);if(current.length>=5){if(!replace)return notify('先發最多五人；請使用「替換先發」按鈕讓替補直接頂替。');const out=current.filter(x=>!x.injury).sort((a,b)=>(Number(a.rating)||0)-(Number(b.rating)||0))[0];if(!out)return notify('目前先發皆受傷，無法自動替換。');out.starter=false}p.starter=true}save();render()}
function signPlayer(name,type,salary,salaryUsd,player=null){name=String(name||'').trim();if(!name)return notify('請輸入球員姓名。');if(roster().length>=16)return notify('名單已滿（16 人），無法簽約。');const isForeign=type==='foreign'||(player&&foreign(player));const pay=Number(salary),usd=Number(salaryUsd);if(isForeign){const requested=player?Number(player.salaryUsd)||0:usd;if(!Number.isFinite(requested)||requested<=0)return notify('請輸入有效洋將年薪。');if(foreignCount()>=FOREIGN_LIMIT)return notify(`洋將名額已滿（${FOREIGN_LIMIT} 名）。`);if(foreignPayroll()+requested>FOREIGN_CAP)return notify(`簽約後洋將薪資將超過 US$${FOREIGN_CAP.toLocaleString()} 上限。`)}else{const requested=player?Number(player.salary)||0:pay;if(!Number.isFinite(requested)||requested<=0)return notify('請輸入有效本土年薪。');if(domesticPayroll()+requested>CAP)return notify(`簽約後本土薪資將超過 ${CAP}M 上限。`)}const p=player?{...player}:makePlayer(name,state.team,roster().length,isForeign);p.id=`fa-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;p.name=name;p.team=state.team;p.isForeign=isForeign;p.salary=isForeign?0:(player?Number(player.salary):pay);p.salaryUsd=isForeign?(player?Number(player.salaryUsd)||0:usd):null;p.starter=false;p.injury=0;p.stats=p.stats||{gp:0,pts:0};roster().push(p);if(player)state.freeAgents=state.freeAgents.filter(x=>x.id!==player.id);save();render();notify(`已簽下 ${name}。`)}
function restart(){if(!confirm('確定重新開始遊戲？目前球隊、球員、賽季及戰績存檔都會清除。'))return;state=fresh();page='home';save();render();notify('新遊戲已開始。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}switch(b.dataset.action){case'play':nextGame();break;case'replace':setStarter(b.dataset.id,true);break;case'bench':setStarter(b.dataset.id,false);break;case'sign':signPlayer($('#faName').value,$('#faType').value,$('#faSalary').value,$('#faUsd').value);break;case'sign-existing':{const p=state.freeAgents.find(x=>String(x.id)===b.dataset.id);if(p)signPlayer(p.name,foreign(p)?'foreign':'local',p.salary,p.salaryUsd,p);break}case'team':{const t=prompt(`輸入球隊名稱：\n${TEAMS.join('\n')}`,state.team);if(TEAMS.includes(t)){state.team=t;save();render()}break}case'new':if(confirm('開始新賽季？目前戰績與賽程將重置，球員及薪資保留。')){state.season++;state.gameIndex=0;state.standings=blankStandings();state.schedule=schedule();TEAMS.forEach(t=>roster(t).forEach(p=>p.stats={gp:0,pts:0}));save();render()}break;case'restart':restart();break}});
render();save();
})();
</script></body></html>
