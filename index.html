<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title><style>
:root{color-scheme:dark;--bg:#0b1018;--card:#141f2d;--line:#2b3b4f;--muted:#9aabbe;--text:#f1f5f9;--gold:#edc36e;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17283a,#0b1018 60%);color:var(--text);min-height:100vh}.app{max-width:1120px;margin:auto;padding:20px}.top,.row,.cardhead,.nav,.stats,.item,.actions,.modal-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:18px;letter-spacing:2px;margin:0}.brand small,small,.muted{color:var(--muted)}.balance,.stat,.card,.hero{border:1px solid var(--line);border-radius:14px}.balance{padding:10px 14px;color:var(--gold);font-weight:bold}.hero{padding:22px;margin:18px 0;background:linear-gradient(120deg,#1d3043,#17212d 65%,#30291d)}.hero h2{margin:6px 0;font-size:26px}.hero p{margin:0;color:var(--muted)}.gold{color:var(--gold)}.stats{justify-content:flex-start;flex-wrap:wrap;margin-top:18px}.stat{background:#0b1420aa;padding:10px 14px;min-width:125px}.stat small{display:block}.stat b{font-size:19px}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:12px 0 18px}.nav button{white-space:nowrap;background:none;border:0;color:var(--muted);padding:11px 13px;border-bottom:2px solid transparent;cursor:pointer}.nav button.active{color:var(--gold);border-color:var(--gold)}.card{background:var(--card);padding:17px;margin-bottom:14px}.card h3{margin:0}.cardhead{margin-bottom:13px}.title{margin:12px 0}.title h2{margin:0}.title p{margin:5px 0;color:var(--muted)}.button{background:var(--gold);color:#18202a;border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.button.secondary{background:#26374a;color:var(--text);border:1px solid var(--line)}.button.danger{background:#482a2e;color:#ffd2d2;border:1px solid #704247}.button:disabled{opacity:.45;cursor:not-allowed}.button.small{font-size:12px;padding:7px 10px}.item{padding:11px 0;border-bottom:1px solid #ffffff12}.item:last-child{border:0}.meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}.ovr{color:var(--gold);font-weight:800;font-size:18px}.notice{background:#18283a;border:1px solid #314761;border-radius:9px;padding:11px;margin:10px 0;color:#c5d5e5}.empty{padding:22px;text-align:center;color:var(--muted)}.history{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff12}.modalbg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.modal label{display:block;margin:10px 0 4px;color:var(--muted)}.modal input,.modal select,.filter{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b1420;color:var(--text)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:8}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{border:1px solid #967a43;border-radius:9px;padding:9px;text-align:center;background:#211f19;font-size:12px}.slot b{display:block;margin-top:5px}.actions{justify-content:flex-end}.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.series{border:1px solid var(--line);border-radius:10px;padding:12px;background:#0b1420}.series.current{border-color:var(--gold)}.badge{display:inline-block;border:1px solid #8a743d;border-radius:99px;color:var(--gold);padding:3px 8px;font-size:11px;margin-left:5px}@media(max-width:700px){.app{padding:12px}.hero{padding:16px}.hero h2{font-size:22px}.stats{gap:7px}.stat{flex:1;min-width:calc(50% - 8px)}.lineup{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.bracket{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div style="font-size:28px">🏀</div><div><h1>FRONT OFFICE</h1><small>TPBL · BUILD YOUR DYNASTY</small></div></div><div class="balance" id="balance"></div></header><section class="hero"><div class="row"><div><div class="gold">YOUR FRANCHISE · MANAGER MODE</div><h2 id="teamName"></h2><p id="tagline"></p></div><button class="button secondary" data-action="settings">⚙ 球隊設定</button></div><div class="stats" id="stats"></div></section><nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="standings">排名與季後賽</button><button data-page="awards">年度獎項</button><button data-page="history">球隊紀錄</button><button data-page="market">球員市場</button><button data-page="draft">選秀</button></nav><main id="view"></main><div class="footer">例行賽 40 場｜固定 TPBL 球隊名單｜第 4、5 名挑戰賽（三戰兩勝）｜季後賽七戰四勝｜最多 20 季。遊戲進度儲存在此瀏覽器。</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-v7',MAX_SEASONS=20,GAMES=40,teams=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'];
const raw=[['曹薰襄','呂濟而','劉元凱','高錦瑋','徐宏瑋','汪哲宇','丁冠皓','莊博元','林信寬','王皓吉','黃鎮','董永全','麥卡洛','米勒','克羅馬','迪亞洛'],['盧冠良','蔣淯安','周柏臣','湯普金斯','高柏鎧','霍爾曼','班提爾','陳振傑','馬建豪','張宗憲','吳家駿','林俊吉','簡偉儒','忻沃克','李德威','史承平'],['林書緯','蘇培凱','鍾理翔','李愷諺','簡祐哲','王柏智','林彥廷','呂政儒','蘇士軒','林金榜','熊祥泰','喬納森','杰倫','飛米','奧帝','沃許本'],['梁瀚','盧冠軒','李啓瑋','徐小龍','高國豪','曾柏喻','朱雲豪','田浩','劉丞勳','蕭順議','李家瑞','蔡宸綱','德魯','帕塞獅','提傑','馬力'],['黃泓瀚','簡廷兆','曾文鼎','陳懷安','阿巴西','李睿麒','林安龍','余維豪','魏嘉豪','謝亞軒','林任鴻','曾信武','林韋翰','李沛澄','貝奇','內馬','飛克','馬可'],['錢肯尼','張耕淯','雷蒙恩','蘇奕晉','陳冠全','梅克','弗利沙','威力斯','恩多','丁聖儒','魏芃禾','江均','劉彥廷','陳文宏','張兆辰','黃聰翰','謝銘駿','孫思堯'],['余純安','廖偉皓','吳曉謹','陳懷安','勤明慶','艾德','克力斯','杭特','賽克維奇','魏莨哲','于煥亞','邱子軒','唐維傑','胡瓏貿','施晉堯','呂威霆','吳彥侖','蘇文儒']];
const positions=['PG','SG','SF','PF','C'];
function makePlayer(name,ti,i){const rating=65+(i*11+ti*5)%21;return{id:`t${ti}p${i}`,name,club:teams[ti],pos:positions[(i+ti)%5],age:20+(i*7+ti*3)%14,rating,potential:Math.min(99,rating+8+(i*3)%16),salary:5+((i*3+ti)%10),starter:false,stats:{games:0,points:0,mvp:0}}}
const teamRosters=raw.map((names,ti)=>names.map((name,i)=>makePlayer(name,ti,i)));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let page='home',toastTimer;
function date(){return new Date().toLocaleDateString('zh-TW')}function fresh(){const rosters=teamRosters.map(r=>r.map(p=>({...p,stats:{games:0,points:0,mvp:0}})));const own=rosters[5].slice(0,12);own.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true);return{team:teams[5],manager:'總經理',season:1,wins:0,losses:0,games:0,budget:30,rosters,history:[{text:'球隊成立，王朝之路開始。',date:date()}],standings:newStandings(),postseason:null,draft:null,seasonRecords:[],awards:[]}}
function newStandings(){return Object.fromEntries(teams.map(t=>[t,{wins:0,losses:0,games:0}]))}
function normalize(s){if(!s||!Array.isArray(s.roster)&&!Array.isArray(s.rosters))return fresh();s.team=teams.includes(s.team)?s.team:teams[5];s.manager=s.manager||'總經理';s.season=clamp(Number(s.season)||1,1,MAX_SEASONS);s.budget=Number.isFinite(+s.budget)?+s.budget:30;s.history=Array.isArray(s.history)?s.history:[];s.seasonRecords=Array.isArray(s.seasonRecords)?s.seasonRecords:[];s.awards=Array.isArray(s.awards)?s.awards:[];s.rosters=Array.isArray(s.rosters)?s.rosters:teamRosters.map(r=>r.map(p=>({...p})));for(let i=0;i<teams.length;i++){s.rosters[i]=Array.isArray(s.rosters[i])?s.rosters[i]:teamRosters[i].map(p=>({...p}));s.rosters[i].forEach((p,j)=>{p.id=p.id||`t${i}p${j}`;p.club=teams[i];p.stats=p.stats||{games:0,points:0,mvp:0};p.starter=!!p.starter})}if(Array.isArray(s.roster)){const ti=teams.indexOf(s.team);s.rosters[ti]=s.roster.map((p,j)=>({...p,id:p.id||`mine${j}`,club:s.team,stats:p.stats||{games:0,points:0,mvp:0}}))}s.standings=s.standings||newStandings();teams.forEach(t=>s.standings[t]=s.standings[t]||{wins:0,losses:0,games:0});s.wins=Number(s.wins)||0;s.losses=Number(s.losses)||0;s.games=Number(s.games)||0;s.postseason=s.postseason||null;s.draft=s.draft||null;return s}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function roster(team=state.team){return state.rosters[teams.indexOf(team)]||[]}function starters(){return roster().filter(p=>p.starter)}function ovr(players=starters()){return players.length?Math.round(players.reduce((n,p)=>n+p.rating,0)/players.length):0}function log(text){state.history.push({text,date:date()});if(state.history.length>250)state.history.shift()}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('儲存失敗，請檢查瀏覽器空間。');return false}}function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2400)}
function table(){return teams.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.wins-a.wins||a.losses-b.losses||teams.indexOf(a.team)-teams.indexOf(b.team))}function rank(t){return table().findIndex(x=>x.team===t)+1}function phaseLabel(){const p=state.postseason;if(!p)return state.draft?'選秀進行中':state.games>=GAMES?'例行賽結束':`例行賽 ${state.games}/${GAMES}`;if(p.champion)return '季後賽結束';return p.stage==='challenge'?'第 4、5 名挑戰賽':p.stage==='semifinals'?'季後賽準決賽':'季後賽總冠軍賽'}
function renderHeader(){$('#teamName').textContent=state.team;$('#balance').textContent=`預算 ${state.budget.toFixed(1)}M`);$('#tagline').textContent=`總經理 ${state.manager} · 第 ${state.season}/${MAX_SEASONS} 季 · ${phaseLabel()}`;$('#stats').innerHTML=`<div class="stat"><small>先發戰力</small><b>${ovr()} OVR</b></div><div class="stat"><small>本季戰績</small><b>${state.wins}-${state.losses}</b></div><div class="stat"><small>聯盟排名</small><b>第 ${rank(state.team)} 名</b></div><div class="stat"><small>球員人數</small><b>${roster().length}/15</b></div>`}
function card(p,extra=''){return `<div class="item"><div><b>${esc(p.name)}</b>${p.starter?'<span class="badge">先發</span>':''}<small class="meta">${esc(p.club)} · ${p.pos} · ${p.age}歲 · 薪資 ${p.salary}M · 生涯場均 ${p.stats?.games?(p.stats.points/p.stats.games).toFixed(1):'—'} 分</small></div><div class="actions"><span class="ovr">${p.rating}</span>${extra}</div></div>`}
function standingsHtml(){return `<div class="card"><div class="cardhead"><h3>聯盟戰績</h3><small class="muted">前 3 名直晉季後賽</small></div>${table().map((t,i)=>`<div class="item"><span>${i+1}. ${esc(t.team)}${t.team===state.team?'（我的球隊）':''}${i<3?'<span class="badge">直晉</span>':i<5?'<span class="badge">挑戰賽</span>':''}</span><b>${t.wins}-${t.losses} <small>(${t.games}場)</small></b></div>`).join('')}</div>`}
function home(){return `<div class="card"><div class="cardhead"><div><h3>${state.postseason?'季後賽':state.draft?'選秀':'例行賽'}</h3><small class="muted">${state.postseason?'挑戰賽三戰兩勝，季後賽七戰四勝。':'每隊固定 TPBL 球員名單；例行賽共 40 場。'}</small></div></div>${state.postseason?postseasonCard():state.draft?'<div class="notice">選秀進行中，請到「選秀」頁完成選人。</div>':`<div class="notice">先發陣容 ${starters().length}/5 · 對手將從其固定球員名單計算戰力。</div><button class="button" data-action="game" ${starters().length!==5||state.games>=GAMES?'disabled':''}>🏀 進行下一場</button>`} <button class="button secondary" data-action="restart">重新開始</button>${state.season>=MAX_SEASONS&&state.postseason?.champion?'<div class="notice">恭喜完成第 20 季！可以重新開始新王朝。</div>':''}</div>${standingsHtml()}<div class="card"><div class="cardhead"><h3>先發陣容</h3><span class="gold">${ovr()} OVR</span></div><div class="lineup">${positions.map((pos,i)=>{const p=starters()[i];return `<div class="slot">${pos}<b>${p?esc(p.name):'待安排'}</b>${p?p.rating+' OVR':''}</div>`}).join('')}</div></div><div class="card"><div class="cardhead"><h3>最近紀錄</h3><button class="button small secondary" data-page="history">查看全部</button></div>${state.history.slice(-5).reverse().map(h=>`<div class="history"><span>${esc(h.text)}</span><small>${esc(h.date)}</small></div>`).join('')}</div>`}
function rosterPage(){return `<div class="title"><h2>${esc(state.team)}｜固定球員名單</h2><p>先發名額最多五位；放棄球員會釋出薪資的一半預算。</p></div><div class="card">${roster().map(p=>card(p,`<button class="button small ${p.starter?'secondary':''}" data-action="toggle" data-id="${esc(p.id)}">${p.starter?'改替補':'設先發'}</button> <button class="button small danger" data-action="release" data-id="${esc(p.id)}">釋出</button>`)).join('')||'<div class="empty">尚無球員</div>'}</div>`}
function historyPage(){return `<div class="title"><h2>球隊與球季紀錄</h2></div><div class="card">${state.history.slice().reverse().map(h=>`<div class="history"><span>${esc(h.text)}</span><small>${esc(h.date)}</small></div>`).join('')||'<div class="empty">尚無紀錄</div>'}</div>${state.seasonRecords.slice().reverse().map(r=>`<div class="card"><h3>第 ${r.season} 季</h3><p>冠軍：${esc(r.champion)} · ${esc(state.team)}：${r.record}</p><p class="muted">MVP：${esc(r.mvp?.name||'—')} · 年度最佳防守：${esc(r.dopy?.name||'—')}</p></div>`).join('')}`}
function standingsPage(){return `<div class="title"><h2>排名與季後賽</h2><p>例行賽每隊 40 場。前 3 名直接晉級；第 4、5 名三戰兩勝，勝隊與第 1 名交手；準決賽另一組為第 2 名對第 3 名，之後總冠軍賽七戰四勝。</p></div>${standingsHtml()}${state.postseason?postseasonCard():state.games>=GAMES?`<div class="card"><div class="notice">例行賽已結束，依排名第 4 名對第 5 名挑戰。</div><button class="button" data-action="start-playoffs">開始季後賽</button></div>`:'<div class="card"><div class="notice">完成 40 場例行賽後，季後賽分組表會顯示於此。</div></div>'}`}
function allLeaguePlayers(){return state.rosters.flat()}
function awardPage(){const cur=state.awards.filter(a=>a.season===state.season);return `<div class="title"><h2>年度獎項</h2><p>季後賽總冠軍賽結束時，依球員評分、得分及出賽計算球季獎項。</p></div>${cur.length?cur.map(a=>`<div class="card"><h3>第 ${a.season} 季年度獎項</h3><div class="item"><span>🏆 總冠軍</span><b>${esc(a.champion)}</b></div><div class="item"><span>🌟 年度 MVP</span><b>${esc(a.mvp.name)} · ${a.mvp.ppg} PPG</b></div><div class="item"><span>🛡️ 年度最佳防守球員</span><b>${esc(a.dopy.name)} · ${a.dopy.club}</b></div><div class="item"><span>🚀 年度最佳新秀</span><b>${esc(a.roy.name)} · ${a.roy.club}</b></div><div class="item"><span>⭐ 年度第一隊</span><b>${a.allStar.map(x=>esc(x.name)).join('、')}</b></div></div>`).join(''):'<div class="card empty">本季尚未決出總冠軍。獎項將於季後賽結束後公布。</div>'}${state.awards.filter(a=>a.season!==state.season).slice().reverse().map(a=>`<div class="card"><h3>第 ${a.season} 季｜冠軍 ${esc(a.champion)}</h3><p>年度 MVP：${esc(a.mvp.name)}　·　防守球員：${esc(a.dopy.name)}　·　最佳新秀：${esc(a.roy.name)}</p></div>`).join('')}`}
function marketPage(){const own=new Set(roster().map(p=>p.name));const list=allLeaguePlayers().filter(p=>p.club!==state.team&&!own.has(p.name));return `<div class="title"><h2>TPBL 球員市場</h2><p>從其他球隊固定名單簽下球員，該球員會從原隊名單轉入你的球隊。名單上限 15 人。</p></div><div class="card"><label for="clubFilter" class="muted">依球隊篩選</label><select class="filter" id="clubFilter"><option value="">全部球隊</option>${teams.filter(t=>t!==state.team).map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="card" id="marketList">${list.map(p=>`<div class="item market-player" data-club="${esc(p.club)}"><div><b>${esc(p.name)}</b><small class="meta">${esc(p.club)} · ${p.pos} · ${p.age}歲 · 潛力 ${p.potential} · 薪資 ${p.salary}M</small></div><div class="actions"><span class="ovr">${p.rating}</span><button class="button small" data-action="sign" data-id="${esc(p.id)}" ${roster().length>=15||state.budget<p.salary?'disabled':''}>${roster().length>=15?'名單已滿':state.budget<p.salary?'預算不足':'簽約'}</button></div></div>`).join('')||'<div class="empty">目前沒有可簽約球員</div>'}</div>`}
function postseasonLabel(){const p=state.postseason;if(!p)return '';if(p.champion)return '季後賽結束';return p.stage==='challenge'?'挑戰賽':p.stage==='semis'?'準決賽':'總冠軍賽'}function currentSeries(){const p=state.postseason;if(!p||p.champion)return null;if(p.stage==='challenge')return p.challenge;if(p.stage==='semis')return p.semis[p.semiIndex];return p.final}
function seriesBox(s,label,current){if(!s)return '';return `<div class="series ${current?'current':''}"><b>${esc(label)}</b><div class="item"><span>${esc(s.a)}</span><b>${s.aw}</b></div><div class="item"><span>${esc(s.b)}</span><b>${s.bw}</b></div><small>${s.best===3?'三戰兩勝':'七戰四勝'} · ${s.winner?'系列賽結束':'進行中'}</small></div>`}
function postseasonCard(){const p=state.postseason;if(!p)return '';if(p.champion)return `<div class="notice">🏆 第 ${state.season} 季總冠軍：${esc(p.champion)}！</div><button class="button" data-page="awards">查看年度獎項</button> <button class="button secondary" data-page="draft" ${state.season>=MAX_SEASONS?'disabled':''}>進入選秀</button>`;const s=currentSeries();return `<div class="bracket">${seriesBox(p.challenge,'挑戰賽｜第 4 名 vs 第 5 名',p.stage==='challenge')}${p.semis.map((x,i)=>seriesBox(x,`準決賽 ${i+1}`,p.stage==='semis'&&p.semiIndex===i)).join('')}${seriesBox(p.final,'總冠軍賽',p.stage==='final')}</div>${s?`<div class="notice">${esc(s.a)} ${s.aw}－${s.bw} ${esc(s.b)}｜${s.best===3?'三戰兩勝':'七戰四勝'}</div><button class="button" data-action="playoff-game">模擬下一場季後賽</button>`:''}`}
function startPlayoffs(){if(state.games<GAMES)return toast('請先完成 40 場例行賽。');const t=table().map(x=>x.team);state.postseason={stage:'challenge',challenge:{a:t[3],b:t[4],aw:0,bw:0,best:3,winner:null},semis:[],semiIndex:0,final:null,champion:null};log(`例行賽結束：${table().map((x,i)=>`${i+1}.${x.team} ${x.wins}-${x.losses}`).join('、')}。第 4、5 名進行挑戰賽。`);save();render();toast('季後賽分組已產生！')}
function playoffPerformance(team){const players=state.rosters[teams.indexOf(team)]||[];if(team!==state.team)return;players.filter(p=>p.starter).forEach((p,i)=>{p.stats=p.stats||{games:0,points:0,mvp:0};const pts=12+Math.floor(Math.random()*18)+(p.rating-70)*.25;p.stats.games++;p.stats.points+=pts;p.stats.mvp+=Math.max(1,pts+(5-i*2))})}
function finishSeason(){const champion=state.postseason.champion,league=allLeaguePlayers().filter(p=>p.stats?.games>0);const scored=league.map(p=>({...p,ppg:p.stats.points/p.stats.games,score:(p.stats.points/p.stats.games)*.55+p.rating*.35+(p.stats.mvp/p.stats.games)*.1}));const mvp=[...scored].sort((a,b)=>b.score-a.score)[0]||{name:'尚無資料',club:'—',ppg:0};const dopy=[...allLeaguePlayers()].sort((a,b)=>b.rating-a.rating)[0]||{name:'尚無資料',club:'—'};const roy=[...allLeaguePlayers()].filter(p=>p.age<=22).sort((a,b)=>b.rating-a.rating)[0]||{name:'尚無資料',club:'—'};const top5=[...allLeaguePlayers()].sort((a,b)=>b.rating-a.rating).slice(0,5);const award={season:state.season,champion,mvp:{name:mvp.name,club:mvp.club,ppg:Number(mvp.ppg.toFixed(1))},dopy:{name:dopy.name,club:dopy.club},roy:{name:roy.name,club:roy.club},allStar:top5.map(p=>({name:p.name,club:p.club}))};state.awards.push(award);state.seasonRecords.push({season:state.season,champion,record:`${state.wins}-${state.losses}`,mvp:award.mvp,dopy:award.dopy});log(`年度獎項：總冠軍 ${champion}；MVP ${mvp.name}（${mvp.ppg.toFixed(1)} PPG）；最佳防守 ${dopy.name}；最佳新秀 ${roy.name}。`);toast(`🏆 ${champion} 獲得總冠軍！MVP：${mvp.name}`)}
function nextSeries(s,winner){s.winner=winner;const p=state.postseason;if(p.stage==='challenge'){const order=table().map(x=>x.team);p.semis=[{a:order[0],b:winner,aw:0,bw:0,best:7,winner:null},{a:order[1],b:order[2],aw:0,bw:0,best:7,winner:null}];p.stage='semis';p.semiIndex=0;log(`挑戰賽冠軍 ${winner} 晉級，將對戰第一名 ${order[0]}；另一組由第 2 名對第 3 名。`);return}if(p.stage==='semis'){if(p.semiIndex===0){p.semiIndex=1;return}const winners=p.semis.map(x=>x.winner);p.final={a:winners[0],b:winners[1],aw:0,bw:0,best:7,winner:null};p.stage='final';log(`總冠軍賽：${winners[0]} 對 ${winners[1]}。`);return}if(p.stage==='final'){p.champion=winner;log(`${winner} 獲得第 ${state.season} 季總冠軍！`);finishSeason()}}
function playoffGame(){const s=currentSeries();if(!s)return toast('季後賽已結束。');const aRating=ovr(state.rosters[teams.indexOf(s.a)]?.filter(p=>p.starter).slice(0,5)||[]),bRating=ovr(state.rosters[teams.indexOf(s.b)]?.filter(p=>p.starter).slice(0,5)||[]);const aScore=78+Math.floor(Math.random()*24)+(aRating-70)*.7,bScore=78+Math.floor(Math.random()*24)+(bRating-70)*.7;const scoreA=Math.round(aScore),scoreB=Math.round(bScore+(aScore===bScore?1:0));const aWon=scoreA>scoreB;if(aWon)s.aw++;else s.bw++;playoffPerformance(aWon?s.a:s.b);const match=`${s.a} ${scoreA}：${scoreB} ${s.b}`;log(`${postseasonLabel()}第 ${s.aw+s.bw} 戰：${match}。`);const need=Math.ceil(s.best/2),winner=s.aw>=need?s.a:s.bw>=need?s.b:null;if(winner){log(`${winner} 以 ${s.aw}-${s.bw} 贏得系列賽。`);nextSeries(s,winner)}save();render();toast(winner?`${winner} 贏下系列賽！比分 ${match}`:`比賽結束：${match}`)}
function regularGame(){if(starters().length<5)return toast('請先安排五位先發。');if(state.games>=GAMES)return toast('例行賽已結束。');if(state.postseason)return toast('季後賽已開始。');const opponents=teams.filter(t=>t!==state.team),opp=opponents[Math.floor(Math.random()*opponents.length)];const oppStarters=state.rosters[teams.indexOf(opp)].slice().sort((a,b)=>b.rating-a.rating).slice(0,5);const ours=ovr(),theirs=ovr(oppStarters),userScore=72+Math.floor(Math.random()*32)+(ours-70)*.55,oppScore=72+Math.floor(Math.random()*32)+(theirs-70)*.55;const us=Math.round(userScore),them=Math.round(oppScore+(userScore===oppScore?1:0));const won=us>them;state.games++;if(won)state.wins++;else state.losses++;const st=state.standings[state.team];st.games++;st.wins=state.wins;st.losses=state.losses;const os=state.standings[opp];os.games++;if(won)os.losses++;else os.wins++;scorePlayerGame(us);simulateOtherGames(opp);log(`例行賽第 ${state.games} 場：${state.team} ${us}：${them} ${opp}，${won?'獲勝':'落敗'}。`);if(state.games===GAMES){completeStandings();save();render();toast(`例行賽 40 場完成！目前排名第 ${rank(state.team)} 名。`);return}save();render();toast(won?`比賽獲勝！${us}：${them}`:`比賽落敗。${us}：${them}`)}
function scorePlayerGame(teamPoints){const ps=starters();if(!ps.length)return;ps.forEach((p,i)=>{p.stats=p.stats||{games:0,points:0,mvp:0};const points=Math.max(2,Math.round(teamPoints*(.12+Math.random()*.09)+(p.rating-70)*.15));p.stats.games++;p.stats.points+=points;p.stats.mvp+=points+(i===0?4:0)})}
function simulateOtherGames(playedOpponent){const available=teams.filter(t=>t!==state.team&&t!==playedOpponent).sort(()=>Math.random()-.5);for(let i=0;i+1<available.length;i+=2){const a=available[i],b=available[i+1],pa=state.rosters[teams.indexOf(a)],pb=state.rosters[teams.indexOf(b)],aRating=ovr(pa.slice().sort((x,y)=>y.rating-x.rating).slice(0,5)),bRating=ovr(pb.slice().sort((x,y)=>y.rating-x.rating).slice(0,5));const aWin=Math.random()<(0.5+(aRating-bRating)*.012),winner=aWin?a:b,loser=aWin?b:a;state.standings[a].games++;state.standings[b].games++;state.standings[winner].wins++;state.standings[loser].losses++}}
function completeStandings(){for(const t of teams){const s=state.standings[t];while(s.games<GAMES){s.games++;if(Math.random()<.5)s.wins++;else s.losses++}if(t!==state.team)s.losses=s.games-s.wins}state.standings[state.team]={games:GAMES,wins:state.wins,losses:state.losses}}
function draftPage(){if(state.draft){const d=state.draft;return `<div class="title"><h2>第 ${state.season} 季選秀</h2><p>第 ${d.order.indexOf(state.team)+1} 順位｜目前第 ${d.pick+1}/${d.order.length} 順位</p></div><div class="card"><div class="notice">${d.order[d.pick]===state.team?'輪到你選人！':`目前 ${esc(d.order[d.pick])} 選秀中…`}</div>${d.order.map((t,i)=>`<div class="item"><span>${i+1}. ${esc(t)}</span><small>${i<d.pick?'已完成':i===d.pick?'選擇中':'等待'}</small></div>`)}</div><div class="card"><h3>可選新秀</h3>${d.pool.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><small class="meta">${esc(p.club)} · ${p.pos} · ${p.age}歲 · 潛力 ${p.potential}</small></div><div class="actions"><span class="ovr">${p.rating}</span><button class="button small" data-action="pick-player" data-id="${esc(p.id)}" ${d.order[d.pick]!==state.team||roster().length>=15?'disabled':''}>選擇</button></div></div>`).join('')||'<div class="empty">沒有可選新秀</div>'}</div>`}if(state.postseason&&!state.postseason.champion)return `<div class="card"><h2>選秀</h2><div class="notice">本季季後賽結束後開放選秀。</div></div>`;if(state.season>=MAX_SEASONS)return `<div class="card"><h2>王朝結束</h2><p>已完成 20 季，重新開始建立新王朝。</p><button class="button" data-action="restart">重新開始</button></div>`;return `<div class="title"><h2>TPBL 新秀選秀</h2><p>球季結束後依戰績由後至前選秀，每隊一個順位。</p></div><div class="card"><div class="notice">${state.postseason?.champion?`第 ${state.season} 季總冠軍：${esc(state.postseason.champion)}。`:'完成例行賽與季後賽後開放選秀。'}</div><button class="button" data-action="start-draft" ${!state.postseason?.champion?'disabled':''}>開始選秀</button></div>`}
function beginDraft(){if(!state.postseason?.champion)return toast('季後賽結束後才能選秀。');if(state.season>=MAX_SEASONS)return toast('已完成第 20 季，請重新開始。');const order=table().slice().reverse().map(x=>x.team),pool=Array.from({length:teams.length},(_,i)=>({id:`rookie${state.season}_${i}`,name:['陳冠宇','王子維','林冠廷','張家豪','李承恩','周昱翔','吳柏廷'][i],club:'TPBL 新秀',pos:positions[i%5],age:19,rating:64+i%7,potential:86+i%13,salary:4,starter:false,stats:{games:0,points:0,mvp:0}}));state.draft={order,pick:0,pool};autoPicks();save();render()}
function autoPicks(){const d=state.draft;while(d&&d.pick<d.order.length&&d.order[d.pick]!==state.team){const p=d.pool.shift();if(p){const dest=state.rosters[teams.indexOf(d.order[d.pick])];if(dest.length<15)dest.push({...p,id:`${p.id}_${d.pick}`,club:d.order[d.pick]});log(`${d.order[d.pick]} 選擇新秀 ${p.name}。`)}d.pick++}}
function choosePlayer(id){const d=state.draft;if(!d||d.order[d.pick]!==state.team)return toast('尚未輪到你的選秀順位。');if(roster().length>=15)return toast('球員名單已滿，請先釋出球員。');const i=d.pool.findIndex(p=>p.id===id);if(i<0)return;const p=d.pool.splice(i,1)[0];roster().push({...p,id:`${p.id}_user`,club:state.team});log(`選秀第 ${d.pick+1} 順位選擇 ${p.name}。`);d.pick++;if(d.pick>=d.order.length){state.draft=null;startNextSeason()}else autoPicks();save();render();toast(state.draft?'選秀完成！':'選秀結束，新賽季開始！')}
function startNextSeason(){state.draft=null;state.season++;state.games=state.wins=state.losses=0;state.standings=newStandings();state.postseason=null;state.budget=Math.round((state.budget+8)*10)/10;for(const r of state.rosters){for(const p of r){p.age++;p.starter=false;p.stats={games:0,points:0,mvp:0};if(p.age>31&&Math.random()<.3)p.rating=Math.max(40,p.rating-1)}r.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)}log(`進入第 ${state.season} 季，獲得 8M 預算。`)}
function settings(){const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h3>球隊設定</h3><label>選擇經營球隊</label><select id="teamChoice">${teams.map(t=>`<option ${t===state.team?'selected':''}>${esc(t)}</option>`).join('')}</select><label>總經理名稱</label><input id="managerChoice" maxlength="24" value="${esc(state.manager)}"><div class="modal-actions"><button class="button secondary" data-action="close">取消</button><button class="button" data-action="save-settings">儲存</button></div></div>`;document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()}}
function restart(){if(!confirm('確定重新開始？目前所有球隊、紀錄與進度都會清除。'))return;state=fresh();page='home';save();render();toast('新王朝已開始！')}
function render(){renderHeader();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='home'?home():page==='roster'?rosterPage():page==='standings'?standingsPage():page==='awards'?awardPage():page==='history'?historyPage():page==='market'?marketPage():draftPage()}
document.addEventListener('change',e=>{if(e.target.id==='clubFilter')document.querySelectorAll('.market-player').forEach(x=>x.hidden=!!e.target.value&&x.dataset.club!==e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0);return}switch(b.dataset.action){case'settings':settings();break;case'close':b.closest('.modalbg').remove();break;case'save-settings':{const old=state.team,next=$('#teamChoice').value;state.team=next;state.manager=$('#managerChoice').value.trim()||'總經理';state.standings[next].wins=state.wins;state.standings[next].losses=state.losses;state.standings[next].games=state.games;log(`總經理改為經營 ${next}。`);b.closest('.modalbg').remove();save();render();break}case'restart':restart();break;case'game':regularGame();break;case'start-playoffs':startPlayoffs();break;case'playoff-game':playoffGame();break;case'toggle':{const p=roster().find(x=>x.id===b.dataset.id);if(!p)return;if(p.starter&&starters().length<=5)return toast('至少需要五位先發。');if(!p.starter&&starters().length>=5)return toast('先發最多五位，請先將一位改為替補。');p.starter=!p.starter;save();render();break}case'release':{const r=roster(),i=r.findIndex(x=>x.id===b.dataset.id);if(i<0)return;if(r.length<=5)return toast('至少保留五位球員。');const p=r[i];if(p.starter&&starters().length<=5)return toast('先將球員改為替補後再釋出。');r.splice(i,1);state.budget=Math.round((state.budget+p.salary*.5)*10)/10;log(`釋出 ${p.name}，回收 ${p.salary*.5}M 預算。`);save();render();break}case'sign':{const src=allLeaguePlayers().find(p=>p.id===b.dataset.id);if(!src)return;if(roster().length>=15)return toast('球員名單已滿。');if(state.budget<src.salary)return toast('預算不足。');const source=state.rosters[teams.indexOf(src.club)],i=source.findIndex(p=>p.id===src.id),p=source.splice(i,1)[0];p.club=state.team;p.starter=false;roster().push(p);state.budget=Math.round((state.budget-p.salary)*10)/10;log(`從 ${src.club} 簽下 ${p.name}，支付 ${p.salary}M。`);save();render();toast('球員轉隊簽約完成！');break}case'start-draft':beginDraft();break;case'pick-player':choosePlayer(b.dataset.id);break}});
render();save();
})();
</script></body></html>
