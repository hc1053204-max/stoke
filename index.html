<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1018" />
  <title>FRONT OFFICE｜TPBL 籃球經理</title>
  <style>
    :root {
      --bg: #0b1018;
      --bg2: #101d2a;
      --card: rgba(17, 28, 40, 0.9);
      --line: rgba(160, 194, 222, 0.18);
      --muted: #9aaec2;
      --text: #edf4ff;
      --gold: #e6c37f;
      --gold-2: #d7aa5d;
      --accent: #6fa8ff;
      --danger: #ef6a6a;
      --success: #76d2a3;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(31,54,78,0.9), transparent 28%),
        linear-gradient(180deg, #07121b 0%, #0a1623 40%, #09141d 100%);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 24px 40px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff8a36, #f07b2b);
      box-shadow: 0 0 16px rgba(237, 132, 45, 0.35);
      font-size: 20px;
    }

    .brand-text h1 {
      margin: 0;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 2.1rem;
      line-height: 1;
    }

    .brand-text small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .balance {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(10, 20, 31, 0.7);
      color: var(--gold);
      padding: 12px 16px;
      font-weight: 700;
      min-width: 130px;
      text-align: center;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(90deg, rgba(18, 39, 56, 0.85), rgba(30, 47, 65, 0.74));
      padding: 22px 22px 18px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.04), transparent 44%, rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .label {
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.82rem;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(1.7rem, 2.6vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .btn {
      border: 1px solid rgba(117, 137, 160, 0.4);
      background: rgba(26, 40, 56, 0.86);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: rgba(115, 154, 197, 0.2);
      color: var(--text);
      border-color: rgba(146, 185, 238, 0.6);
    }
    .btn.gold {
      background: rgba(230, 195, 127, 0.14);
      border-color: rgba(230, 195, 127, 0.45);
      color: var(--gold);
    }
    .btn.danger {
      background: rgba(239, 106, 106, 0.14);
      border-color: rgba(239, 106, 106, 0.45);
      color: #ffc5c5;
    }
    .btn.small {
      padding: 7px 10px;
      font-size: 0.75rem;
    }
    .btn[disabled] {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .stat {
      min-width: 130px;
      flex: 1 1 130px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(14, 23, 33, 0.55);
      padding: 12px 14px 10px;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 1.2rem;
      color: var(--text);
    }

    .nav {
      display: flex;
      gap: 28px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      padding: 0 0 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 0;
      font-size: 0.96rem;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 8px;
    }
    .nav button.active {
      color: var(--gold);
    }
    .nav button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 2px;
      background: var(--gold);
      border-radius: 2px;
    }

    .view {
      min-height: 250px;
    }

    .card {
      background: rgba(17, 27, 38, 0.78);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .muted { color: var(--muted); }
    .gold { color: var(--gold); }

    .notice {
      background: rgba(23, 36, 49, 0.8);
      border: 1px solid rgba(121, 146, 168, 0.28);
      border-radius: 10px;
      padding: 12px 14px;
      color: #dfeaf9;
      margin-bottom: 12px;
    }

    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; gap: 12px; align-items: center; }

    .podium {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .slot {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(12, 20, 30, 0.75);
      padding: 10px 8px;
      text-align: center;
    }
    .slot strong { display: block; font-size: 0.92rem; }
    .slot small { display: block; color: var(--muted); margin-top: 4px; }

    .roster-list, .history-list, .standings-list, .market-list {
      display: grid;
      gap: 10px;
    }

    .player-row, .history-row, .standings-row, .market-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .player-row:last-child, .history-row:last-child, .standings-row:last-child, .market-row:last-child {
      border-bottom: 0;
    }

    .player-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid rgba(230, 195, 127, 0.5);
      color: var(--gold);
      background: rgba(230, 195, 127, 0.08);
      margin-left: 6px;
    }

    .rating {
      color: var(--gold);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .small-note {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      margin-top: 3px;
    }

    .empty {
      color: var(--muted);
      padding: 18px 10px;
      text-align: center;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.64);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 40;
    }

    .modal {
      width: min(420px, 100%);
      background: rgba(18, 28, 38, 0.95);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    .modal label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(10, 18, 29, 0.9);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .modal-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(240, 245, 250, 0.96);
      color: #111827;
      border-radius: 9px;
      padding: 10px 16px;
      z-index: 50;
      box-shadow: 0 12px 36px rgba(0,0,0,0.32);
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .app { padding: 16px 12px 28px; }
      .top { align-items: flex-start; }
      .brand-text h1 { font-size: 1.5rem; }
      .hero-row { flex-direction: column; align-items: flex-start; }
      .podium { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .nav { gap: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">🏀</div>
        <div class="brand-text">
          <h1>FRONT OFFICE</h1>
          <small>TPBL · BUILD YOUR DYNASTY</small>
        </div>
      </div>
      <div id="budgetBox" class="balance">預算 30.0M</div>
    </header>

    <section class="hero">
      <div class="hero-row">
        <div>
          <div class="label">Your Franchise · Manager Mode</div>
          <h2 id="teamName">臺北台新戰神</h2>
          <p id="teamMeta">總經理 · 第 1 / 20 季</p>
        </div>
        <button id="settingsBtn" class="btn gold">⚙ 球隊設定</button>
      </div>
      <div id="statRow" class="stats"></div>
    </section>

    <nav class="nav" id="navBar">
      <button class="active" data-page="home">總覽</button>
      <button data-page="roster">球員名單</button>
      <button data-page="standings">排名與季後賽</button>
      <button data-page="awards">年度獎項</button>
      <button data-page="history">球隊紀錄</button>
      <button data-page="market">球員市場</button>
      <button data-page="draft">選秀</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'front-office-tpbl-fixed-v1';
      const MAX_SEASONS = 20;
      const REGULAR_GAMES = 40;
      const TEAMS = [
        '桃園台啤永豐雲豹',
        '福爾摩沙台新夢想家',
        '新北國王',
        '新竹御嵿攻城獅',
        '新北中信特攻',
        '臺北台新戰神',
        '高雄全家海神'
      ];

      const POSITIONS = ['PG', 'SG', 'SF', 'PF', 'C'];
      const TEAM_ROSTER_DATA = {
        '桃園台啤永豐雲豹': ['曹薰襄', '呂濟而', '劉元凱', '高錦瑋', '徐宏瑋', '汪哲宇', '丁冠皓', '莊博元', '林信寬', '王皓吉', '黃鎮', '董永全'],
        '福爾摩沙台新夢想家': ['盧冠良', '蔣淯安', '周柏臣', '陳振傑', '馬建豪', '張宗憲', '吳家駿', '林俊吉', '簡偉儒', '忻沃克', '李德威', '史承平'],
        '新北國王': ['林書緯', '蘇培凱', '鍾理翔', '李愷諺', '簡祐哲', '王柏智', '林彥廷', '呂政儒', '蘇士軒', '林金榜', '熊祥泰', '喬納森'],
        '新竹御嵿攻城獅': ['梁瀚', '盧冠軒', '李啓瑋', '徐小龍', '高國豪', '曾柏喻', '朱雲豪', '田浩', '劉丞勳', '蕭順議', '李家瑞', '蔡宸綱'],
        '新北中信特攻': ['黃泓瀚', '簡廷兆', '曾文鼎', '陳懷安', '阿巴西', '李睿麒', '林安龍', '余維豪', '魏嘉豪', '謝亞軒', '林任鴻', '曾信武'],
        '臺北台新戰神': ['錢肯尼', '張耕淯', '雷蒙恩', '蘇奕晉', '陳冠全', '丁聖儒', '魏芃禾', '江均', '劉彥廷', '陳文宏', '張兆辰', '黃聰翰'],
        '高雄全家海神': ['余純安', '廖偉皓', '吳曉謹', '陳懷安', '勤明慶', '魏莨哲', '于煥亞', '邱子軒', '唐維傑', '胡瓏貿', '施晉堯', '呂威霆']
      };

      const state = loadState();
      let toastTimer = null;

      function safeText(value) {
        return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[ch]));
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function makePlayer(name, team, idx) {
        const baseRating = 64 + (idx * 9 + team.length * 3) % 22;
        return {
          id: `${team}-${idx}-${Math.random().toString(36).slice(2, 8)}`,
          name,
          team,
          pos: POSITIONS[(idx + team.length) % POSITIONS.length],
          age: 20 + (idx * 4 + team.length) % 13,
          rating: baseRating,
          potential: clamp(baseRating + 8 + (idx % 6), 70, 99),
          salary: 4 + ((idx * 3 + team.length) % 10),
          starter: false,
          stats: { games: 0, points: 0 }
        };
      }

      function createTeamRoster(teamName, includeUserTeam = false) {
        const list = TEAM_ROSTER_DATA[teamName] || [];
        return list.map((name, idx) => makePlayer(name, teamName, idx));
      }

      function defaultStandings() {
        const obj = {};
        TEAMS.forEach((team) => { obj[team] = { wins: 0, losses: 0, games: 0 }; });
        return obj;
      }

      function freshState() {
        const rosters = {};
        TEAMS.forEach((team) => { rosters[team] = createTeamRoster(team); });
        const myTeam = '臺北台新戰神';
        rosters[myTeam].slice(0, 5).forEach((p) => p.starter = true);

        return {
          team: myTeam,
          manager: '總經理',
          season: 1,
          wins: 0,
          losses: 0,
          games: 0,
          budget: 30,
          history: [{ text: '球隊成立，王朝之路正式開始。', date: formattedToday() }],
          standings: defaultStandings(),
          rosters,
          postseason: null,
          awards: [],
          draft: null
        };
      }

      function cloneRosterList(list) {
        return list.map((player) => ({
          ...player,
          stats: { ...player.stats }
        }));
      }

      function normalizeState(raw) {
        const base = freshState();
        if (!raw) return base;

        const state = {
          ...base,
          ...raw,
          standings: { ...base.standings, ...(raw.standings || {}) },
          rosters: {}
        };

        TEAMS.forEach((team) => {
          const rawRoster = Array.isArray(raw.rosters && raw.rosters[team]) ? raw.rosters[team] : createTeamRoster(team);
          state.rosters[team] = rawRoster.map((p, idx) => ({
            id: p.id || `${team}-${idx}`,
            name: p.name || TEAM_ROSTER_DATA[team][idx] || `球員${idx + 1}`,
            team,
            pos: p.pos || POSITIONS[(idx + team.length) % POSITIONS.length],
            age: Number(p.age) || 20 + (idx % 12),
            rating: Number(p.rating) || 70,
            potential: Number(p.potential) || 84,
            salary: Number(p.salary) || 6,
            starter: !!p.starter,
            stats: { games: Number(p.stats?.games) || 0, points: Number(p.stats?.points) || 0 }
          }));
        });

        state.team = TEAMS.includes(raw.team) ? raw.team : base.team;
        state.manager = raw.manager || '總經理';
        state.season = clamp(Number(raw.season) || 1, 1, MAX_SEASONS);
        state.wins = Number(raw.wins) || 0;
        state.losses = Number(raw.losses) || 0;
        state.games = Number(raw.games) || 0;
        state.budget = Number(raw.budget) || 30;
        state.history = Array.isArray(raw.history) && raw.history.length ? raw.history : base.history;
        state.awards = Array.isArray(raw.awards) ? raw.awards : [];
        state.postseason = raw.postseason || null;
        state.draft = raw.draft || null;

        // ensure my team roster always exists and is starterable
        const roster = state.rosters[state.team];
        if (!Array.isArray(roster) || roster.length === 0) {
          state.rosters[state.team] = createTeamRoster(state.team);
        }

        return state;
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (e) {
          toast('儲存失敗，請檢查瀏覽器空間。');
          return false;
        }
      }

      function loadState() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          return normalizeState(raw);
        } catch (e) {
          return freshState();
        }
      }

      function formattedToday() {
        return new Date().toLocaleDateString('zh-TW');
      }

      function toast(msg) {
        const node = document.getElementById('toast');
        if (node) node.remove();
        const el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          const t = document.getElementById('toast');
          if (t) t.remove();
        }, 2200);
      }

      function getRoster(team = state.team) {
        return state.rosters[team] || [];
      }

      function getStarters(team = state.team) {
        return getRoster(team).filter((p) => p.starter);
      }

      function overall(players = getStarters()) {
        if (!players.length) return 0;
        return Math.round(players.reduce((sum, p) => sum + p.rating, 0) / players.length);
      }

      function logEvent(text) {
        state.history.unshift({ text, date: formattedToday() });
        if (state.history.length > 80) state.history.length = 80;
      }

      function buildStandings() {
        const standings = defaultStandings();
        for (const team of TEAMS) {
          const s = state.standings[team] || { wins: 0, losses: 0, games: 0 };
          standings[team] = {
            wins: Number(s.wins) || 0,
            losses: Number(s.losses) || 0,
            games: Number(s.games) || 0
          };
        }
        return Object.entries(standings)
          .map(([team, value]) => ({ team, ...value }))
          .sort((a, b) => b.wins - a.wins || a.losses - b.losses || TEAMS.indexOf(a.team) - TEAMS.indexOf(b.team));
      }

      function rankFor(team) {
        return buildStandings().findIndex((row) => row.team === team) + 1;
      }

      function renderStats() {
        const budget = document.getElementById('budgetBox');
        const teamName = document.getElementById('teamName');
        const teamMeta = document.getElementById('teamMeta');
        const statRow = document.getElementById('statRow');

        budget.textContent = `預算 ${state.budget.toFixed(1)}M`;
        teamName.textContent = state.team;
        teamMeta.textContent = `總經理 ${state.manager} · 第 ${state.season}/${MAX_SEASONS} 季`;

        const standings = buildStandings();
        const myRank = rankFor(state.team);
        statRow.innerHTML = `
          <div class="stat"><small>先發戰力</small><strong>${overall()} OVR</strong></div>
          <div class="stat"><small>本季戰績</small><strong>${state.wins}-${state.losses}</strong></div>
          <div class="stat"><small>聯盟排名</small><strong>第 ${myRank} 名</strong></div>
          <div class="stat"><small>球員人數</small><strong>${getRoster().length}/15</strong></div>
        `;
      }

      function renderHome() {
        const starters = getStarters();
        const standings = buildStandings();

        return `
          <div class="card">
            <div class="card-head">
              <h3>例行賽</h3>
              <span class="muted">${state.games}/${REGULAR_GAMES} 場</span>
            </div>
            <div class="notice">
              先發陣容 ${starters.length}/5。五位先發才能進行比賽；例行賽結束後依排名進入季後賽。
            </div>
            <div class="row">
              <button class="btn gold" data-action="play-game" ${starters.length !== 5 || state.games >= REGULAR_GAMES ? 'disabled' : ''}>🏀 進行下一場</button>
              <button class="btn secondary" data-page="standings">查看排名</button>
              <button class="btn danger" data-action="restart">重新開始</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>先發陣容</h3>
              <span class="gold">${overall()} OVR</span>
            </div>
            <div class="podium">
              ${POSITIONS.map((pos, idx) => {
                const p = starters[idx];
                return `
                  <div class="slot">
                    <strong>${pos}</strong>
                    <small>${p ? p.name : '待安排'}</small>
                    ${p ? `<small>${p.rating} OVR</small>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>聯盟戰績</h3>
            </div>
            <div class="standings-list">
              ${standings.map((row, idx) => `
                <div class="standings-row">
                  <div>
                    <strong>${idx + 1}. ${safeText(row.team)}</strong>
                    ${row.team === state.team ? '<span class="badge">我的球隊</span>' : ''}
                  </div>
                  <strong>${row.wins}-${row.losses}</strong>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderRoster() {
        const roster = getRoster();
        return `
          <div class="card">
            <div class="card-head">
              <h3>${safeText(state.team)} · 固定球員名單</h3>
              <span class="muted">最多 15 人</span>
            </div>
            <div class="roster-list">
              ${roster.map((player) => `
                <div class="player-row">
                  <div class="player-main">
                    <div class="rating">${player.rating}</div>
                    <div>
                      <strong>${safeText(player.name)}</strong>
                      <span class="small-note">${safeText(player.pos)} · ${player.age}歲 · ${player.team === state.team ? '自有球隊' : player.team}</span>
                    </div>
                  </div>
                  <div class="row">
                    <button class="btn small ${player.starter ? 'gold' : ''}" data-action="toggle-starter" data-player-id="${player.id}" ${player.starter && getStarters().length <= 5 ? 'disabled' : ''}>
                      ${player.starter ? '改成替補' : '設為先發'}
                    </button>
                    <button class="btn small danger" data-action="release-player" data-player-id="${player.id}" ${roster.length <= 5 ? 'disabled' : ''}>釋出</button>
                  </div>
                </div>
              `).join('') || '<div class="empty">目前未有球員</div>'}
            </div>
          </div>
        `;
      }

      function renderStandings() {
        const standings = buildStandings();
        const topThree = standings.slice(0, 3).map((r) => r.team);
        const challengeTeams = standings.slice(3, 5).map((r) => r.team);
        return `
          <div class="card">
            <div class="card-head">
              <h3>排位與季後賽</h3>
            </div>
            <div class="notice">
              例行賽 40 場後，排名 1–3 名直接晉級季後賽；4–5 名進行三戰兩勝挑戰賽；季後賽採 7 戰 4 勝制。
            </div>
            <div class="standings-list">
              ${standings.map((row, idx) => `
                <div class="standings-row">
                  <div>
                    <strong>${idx + 1}. ${safeText(row.team)}</strong>
                    ${topThree.includes(row.team) ? '<span class="badge">直晉</span>' : ''}
                    ${challengeTeams.includes(row.team) ? '<span class="badge">挑戰賽</span>' : ''}
                    ${row.team === state.team ? '<span class="badge">我的球隊</span>' : ''}
                  </div>
                  <strong>${row.wins}-${row.losses}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>季後賽</h3>
              <button class="btn small gold" data-action="start-playoffs" ${state.games < REGULAR_GAMES ? 'disabled' : ''}>開始季後賽</button>
            </div>
            ${state.postseason ? renderPlayoffBracket() : '<div class="empty">例行賽尚未結束，季後賽分組表將在 40 場後出現。</div>'}
          </div>
        `;
      }

      function renderPlayoffBracket() {
        const p = state.postseason;
        if (!p) return '';

        if (p.champion) {
          return `<div class="notice">🏆 ${safeText(p.champion)} 取得總冠軍。</div>`;
        }

        const challenge = p.challenge || null;
        const semiBlocks = p.semis || [];
        const finals = p.final || null;

        const blocks = [];
        if (challenge) {
          blocks.push(`<div class="card"><h3>挑戰賽</h3><div class="standings-list"><div class="standings-row"><div>${safeText(challenge.a)}</div><strong>${challenge.aw}-${challenge.bw}</strong></div><div class="standings-row"><div>${safeText(challenge.b)}</div><strong>${challenge.bw}-${challenge.aw}</strong></div></div></div>`);
        }
        semiBlocks.forEach((match, idx) => {
          blocks.push(`<div class="card"><h3>準決賽 ${idx + 1}</h3><div class="standings-list"><div class="standings-row"><div>${safeText(match.a)}</div><strong>${match.aw}-${match.bw}</strong></div><div class="standings-row"><div>${safeText(match.b)}</div><strong>${match.bw}-${match.aw}</strong></div></div></div>`);
        });
        if (finals) {
          blocks.push(`<div class="card"><h3>總冠軍賽</h3><div class="standings-list"><div class="standings-row"><div>${safeText(finals.a)}</div><strong>${finals.aw}-${finals.bw}</strong></div><div class="standings-row"><div>${safeText(finals.b)}</div><strong>${finals.bw}-${finals.aw}</strong></div></div></div>`);
        }

        return `<div class="notice">模擬季後賽：三戰兩勝挑戰賽、準決賽與總冠軍賽皆為七戰四勝。</div>${blocks.join('')}`;
      }

      function renderAwards() {
        const awards = state.awards.slice().reverse();
        return `
          <div class="card">
            <div class="card-head"><h3>年度獎項</h3></div>
            ${awards.length ? awards.map((award) => `
              <div class="notice">
                <strong>第 ${award.season} 季</strong><br />
                冠軍：${safeText(award.champion)}<br />
                MVP：${safeText(award.mvp.name)} · ${award.mvp.ppg} PPG<br />
                最佳防守：${safeText(award.dopy.name)}<br />
                最佳新秀：${safeText(award.roy.name)}
              </div>
            `).join('') : '<div class="empty">本季尚未產生獎項，冠軍定出後會顯示。</div>'}
          </div>
        `;
      }

      function renderHistory() {
        const rows = state.history;
        return `
          <div class="card">
            <div class="card-head"><h3>球隊紀錄</h3></div>
            <div class="history-list">
              ${rows.map((item) => `
                <div class="history-row">
                  <div>${safeText(item.text)}</div>
                  <small class="muted">${safeText(item.date)}</small>
                </div>
              `).join('') || '<div class="empty">目前沒有紀錄。</div>'}
            </div>
          </div>
        `;
      }

      function renderMarket() {
        const myRoster = getRoster();
        const usedNames = new Set(myRoster.map((p) => p.name));
        const pool = TEAMS.flatMap((team) => {
          if (team === state.team) return [];
          return getRoster(team).filter((p) => !usedNames.has(p.name)).slice(0, 6);
        });

        return `
          <div class="card">
            <div class="card-head"><h3>TPBL 球員市場</h3><span class="muted">從其他球隊補強</span></div>
            <div class="market-list">
              ${pool.map((player) => `
                <div class="market-row">
                  <div>
                    <strong>${safeText(player.name)}</strong>
                    <span class="small-note">${safeText(player.team)} · ${safeText(player.pos)} · ${player.age}歲 · 薪資 ${player.salary}M</span>
                  </div>
                  <div class="row">
                    <span class="rating">${player.rating}</span>
                    <button class="btn small gold" data-action="sign-player" data-player-id="${player.id}" ${myRoster.length >= 15 || state.budget < player.salary ? 'disabled' : ''}>
                      ${myRoster.length >= 15 ? '名單已滿' : state.budget < player.salary ? '預算不足' : '簽約'}
                    </button>
                  </div>
                </div>
              `).join('') || '<div class="empty">目前沒有可簽約球員。</div>'}
            </div>
          </div>
        `;
      }

      function renderDraft() {
        if (!state.draft) {
          return `
            <div class="card">
              <div class="card-head"><h3>TPBL 選秀</h3></div>
              <div class="notice">完成例行賽後才能進行選秀，依戰績由後至前抽排。每年新秀會追加到你的名單。</div>
              <button class="btn gold" data-action="start-draft" ${state.games < REGULAR_GAMES ? 'disabled' : ''}>開始選秀</button>
            </div>
          `;
        }

        const d = state.draft;
        const currentTeam = d.order[d.pick];

        return `
          <div class="card">
            <div class="card-head"><h3>第 ${state.season} 季選秀</h3></div>
            <div class="notice">目前輪到：${safeText(currentTeam)}；你的順位：第 ${d.order.indexOf(state.team) + 1}</div>
            <div class="standings-list">
              ${d.order.map((team, idx) => `
                <div class="standings-row">
                  <div>${idx + 1}. ${safeText(team)}</div>
                  <strong>${idx === d.pick ? '輪到' : idx < d.pick ? '已選' : '待選'}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h3>可選新秀</h3></div>
            <div class="market-list">
              ${d.pool.map((player) => `
                <div class="market-row">
                  <div>
                    <strong>${safeText(player.name)}</strong>
                    <span class="small-note">${safeText(player.pos)} · 潛力 ${player.potential} · ${player.age}歲</span>
                  </div>
                  <div class="row">
                    <span class="rating">${player.rating}</span>
                    <button class="btn small gold" data-action="pick-player" data-player-id="${player.id}" ${currentTeam !== state.team || getRoster().length >= 15 ? 'disabled' : ''}>選擇</button>
                  </div>
                </div>
              `).join('') || '<div class="empty">沒有可選新秀。</div>'}
            </div>
          </div>
        `;
      }

      function render() {
        renderStats();
        const page = document.querySelector('.nav button.active')?.dataset.page || 'home';
        const view = document.getElementById('view');

        const content = {
          home: renderHome,
          roster: renderRoster,
          standings: renderStandings,
          awards: renderAwards,
          history: renderHistory,
          market: renderMarket,
          draft: renderDraft
        };

        view.innerHTML = content[page] ? content[page]() : renderHome();
      }

      function updateNavigation(nextPage) {
        document.querySelectorAll('.nav button').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.page === nextPage);
        });
      }

      function setPage(page) {
        updateNavigation(page);
        render();
      }

      function tournamentSim() {
        const myStarters = getStarters();
        if (myStarters.length !== 5) {
          toast('請先安排 5 位先發。');
          return;
        }

        if (state.games >= REGULAR_GAMES) {
          toast('例行賽已結束，請進入季後賽。');
          return;
        }

        const opponents = TEAMS.filter((team) => team !== state.team);
        const oppTeam = opponents[Math.floor(Math.random() * opponents.length)];
        const oppStarters = getStarters(oppTeam).slice(0, 5);
        const myOVR = overall(myStarters);
        const oppOVR = overall(oppStarters);

        const myScore = Math.round(75 + Math.random() * 25 + (myOVR - 70) * 0.8);
        const oppScore = Math.round(75 + Math.random() * 25 + (oppOVR - 70) * 0.8);
        const win = myScore >= oppScore;

        state.games += 1;
        if (win) state.wins += 1; else state.losses += 1;

        const teamRecord = state.standings[state.team] || { wins: 0, losses: 0, games: 0 };
        teamRecord.games = state.games;
        teamRecord.wins = state.wins;
        teamRecord.losses = state.losses;
        state.standings[state.team] = teamRecord;

        const oppRecord = state.standings[oppTeam] || { wins: 0, losses: 0, games: 0 };
        oppRecord.games = (oppRecord.games || 0) + 1;
        if (win) oppRecord.losses = (oppRecord.losses || 0) + 1; else oppRecord.wins = (oppRecord.wins || 0) + 1;
        state.standings[oppTeam] = oppRecord;

        logEvent(`${state.team} ${myScore}-${oppScore} ${oppTeam}，${win ? '獲勝' : '落敗'}。`);

        myStarters.forEach((p) => {
          p.stats.games += 1;
          p.stats.points += Math.max(8, Math.round((myScore / 5) * (0.8 + Math.random() * 0.5)));
        });

        if (state.games >= REGULAR_GAMES) {
          logEvent(`例行賽結束，${state.team} 戰績 ${state.wins}-${state.losses}。`);
        }

        saveState();
        render();
        toast(win ? `勝利！${myScore}-${oppScore}` : `落敗！${myScore}-${oppScore}`);
      }

      function startPlayoffs() {
        if (state.games < REGULAR_GAMES) {
          toast('請先完成 40 場例行賽。');
          return;
        }

        const order = buildStandings().map((row) => row.team);
        const challenge = {
          a: order[3],
          b: order[4],
          aw: 0,
          bw: 0,
          best: 3,
          winner: null
        };

        state.postseason = {
          stage: 'challenge',
          challenge,
          semis: [
            { a: order[0], b: order[3], aw: 0, bw: 0, best: 7, winner: null },
            { a: order[1], b: order[2], aw: 0, bw: 0, best: 7, winner: null }
          ],
          final: null,
          champion: null
        };

        logEvent(`例行賽結束，季後賽分組已產生。第 4、5 名挑戰賽開始。`);
        saveState();
        render();
      }

      function getCurrentSeries() {
        if (!state.postseason || state.postseason.champion) return null;
        if (state.postseason.stage === 'challenge') return state.postseason.challenge;
        if (state.postseason.stage === 'semis') return state.postseason.semis[state.postseason.semiIndex || 0];
        return state.postseason.final;
      }

      function advanceSeries(winner) {
        const p = state.postseason;
        if (!p) return;

        if (p.stage === 'challenge') {
          const s = p.challenge;
          s.winner = winner;
          p.semis = [
            { a: buildStandings()[0].team, b: winner, aw: 0, bw: 0, best: 7, winner: null },
            { a: buildStandings()[1].team, b: buildStandings()[2].team, aw: 0, bw: 0, best: 7, winner: null }
          ];
          p.stage = 'semis';
          p.semiIndex = 0;
          logEvent(`${winner} 晉級挑戰賽勝者戰，進入準決賽。`);
          return;
        }

        if (p.stage === 'semis') {
          const idx = p.semiIndex || 0;
          p.semis[idx].winner = winner;
          if (idx === 0) {
            p.semiIndex = 1;
            logEvent(`${winner} 先勝出準決賽第一組。`);
            return;
          }
          const finalists = [p.semis[0].winner, p.semis[1].winner];
          p.final = { a: finalists[0], b: finalists[1], aw: 0, bw: 0, best: 7, winner: null };
          p.stage = 'final';
          p.semiIndex = 0;
          logEvent(`總冠軍賽：${finalists[0]} 對 ${finalists[1]}。`);
          return;
        }

        if (p.stage === 'final') {
          p.champion = winner;
          logEvent(`${winner} 獲得總冠軍！`);
          finishSeason(winner);
        }
      }

      function finishSeason(champion) {
        const allPlayers = TEAMS.flatMap((team) => getRoster(team));
        const sortedByPoints = [...allPlayers].sort((a, b) => (b.stats.points || 0) - (a.stats.points || 0));
        const mvp = sortedByPoints[0] || { name: '—', team: '—', stats: { points: 0 } };
        const dopy = [...allPlayers].sort((a, b) => b.rating - a.rating)[0] || { name: '—', team: '—' };
        const roy = [...allPlayers].filter((p) => p.age <= 22).sort((a, b) => b.rating - a.rating)[0] || { name: '—', team: '—' };
        const ppg = (mvp.stats.points || 0) > 0 ? (mvp.stats.points / Math.max(1, mvp.stats.games || 1)).toFixed(1) : '0.0';

        state.awards.push({
          season: state.season,
          champion,
          mvp: { name: mvp.name, team: mvp.team, ppg: Number(ppg) },
          dopy: { name: dopy.name, team: dopy.team },
          roy: { name: roy.name, team: roy.team }
        });
      }

      function simulatePlayoffGame() {
        const s = getCurrentSeries();
        if (!s) {
          toast('季後賽已結束。');
          return;
        }

        const aTeam = s.a;
        const bTeam = s.b;
        const aOVR = overall(getStarters(aTeam));
        const bOVR = overall(getStarters(bTeam));
        const aScore = Math.round(80 + Math.random() * 16 + (aOVR - 70) * 0.6);
        const bScore = Math.round(80 + Math.random() * 16 + (bOVR - 70) * 0.6);

        if (aScore >= bScore) s.aw += 1; else s.bw += 1;

        const target = Math.ceil(s.best / 2);
        const winner = s.aw >= target ? s.a : s.bw >= target ? s.b : null;

        logEvent(`${aTeam} ${aScore}-${bScore} ${bTeam}。`);
        if (winner) {
          advanceSeries(winner);
          toast(`${winner} 取得系列賽勝利。`);
        } else {
          toast(`系列賽進行中：${s.a} ${s.aw}-${s.bw} ${s.b}`);
        }

        saveState();
        render();
      }

      function nextSeason() {
        if (state.season >= MAX_SEASONS) {
          toast('已達到 20 季上限，請重新開始新王朝。');
          return;
        }

        state.season += 1;
        state.games = 0;
        state.wins = 0;
        state.losses = 0;
        state.budget += 8;
        state.postseason = null;
        state.draft = null;
        state.standings = defaultStandings();

        TEAMS.forEach((team) => {
          const roster = getRoster(team);
          roster.forEach((p) => {
            p.age += 1;
            p.stats = { games: 0, points: 0 };
            if (p.age > 31 && Math.random() < 0.3) p.rating = Math.max(50, p.rating - 1);
            p.starter = false;
          });
          const starters = roster.slice(0, 5);
          starters.forEach((p) => p.starter = true);
        });

        logEvent(`進入第 ${state.season} 季，新賽季開始。`);
        saveState();
        render();
      }

      function startDraft() {
        if (state.games < REGULAR_GAMES) {
          toast('請先完成 40 場例行賽。');
          return;
        }

        const order = [...buildStandings()].reverse().map((r) => r.team);
        const pool = [
          { id: 'rookie-1', name: '陳冠宇', pos: 'SG', age: 19, rating: 77, potential: 92 },
          { id: 'rookie-2', name: '王子維', pos: 'PG', age: 18, rating: 74, potential: 89 },
          { id: 'rookie-3', name: '林冠廷', pos: 'PF', age: 20, rating: 76, potential: 90 },
          { id: 'rookie-4', name: '張家豪', pos: 'C', age: 19, rating: 75, potential: 88 },
          { id: 'rookie-5', name: '周昱翔', pos: 'SF', age: 20, rating: 78, potential: 91 },
          { id: 'rookie-6', name: '吳柏廷', pos: 'PG', age: 19, rating: 73, potential: 87 }
        ];

        state.draft = {
          order,
          pick: 0,
          pool
        };
        saveState();
        render();
      }

      function chooseDraftPlayer(playerId) {
        if (!state.draft) return;
        const draft = state.draft;
        if (draft.order[draft.pick] !== state.team) {
          toast('現在不是你的選秀順位。');
          return;
        }

        const idx = draft.pool.findIndex((p) => p.id === playerId);
        if (idx < 0) return;

        const p = draft.pool.splice(idx, 1)[0];
        const myList = getRoster();
        if (myList.length >= 15) {
          toast('名單已滿，請先釋出球員。');
          return;
        }

        myList.push({
          id: `draft-${Date.now()}`,
          name: p.name,
          team: state.team,
          pos: p.pos,
          age: p.age,
          rating: p.rating,
          potential: p.potential,
          salary: 4,
          starter: false,
          stats: { games: 0, points: 0 }
        });

        draft.pick += 1;
        logEvent(`${state.team} 選秀選下 ${p.name}。`);

        if (draft.pick >= draft.order.length) {
          state.draft = null;
          nextSeason();
          return;
        }

        saveState();
        render();
      }

      function toggleStarter(playerId) {
        const roster = getRoster();
        const player = roster.find((p) => p.id === playerId);
        if (!player) return;

        const starters = getStarters();
        if (player.starter) {
          if (starters.length <= 5) return;
          player.starter = false;
        } else {
          if (starters.length >= 5) return;
          player.starter = true;
        }
        saveState();
        render();
      }

      function releasePlayer(playerId) {
        const roster = getRoster();
        const idx = roster.findIndex((p) => p.id === playerId);
        if (idx < 0) return;
        if (roster.length <= 5) {
          toast('至少要保留 5 位球員。');
          return;
        }

        const [player] = roster.splice(idx, 1);
        state.budget += Number(player.salary) * 0.5;
        logEvent(`${player.name} 被釋出，回收 ${player.salary * 0.5}M。`);
        saveState();
        render();
      }

      function signPlayer(playerId) {
        const myRoster = getRoster();
        const pool = TEAMS.filter((team) => team !== state.team).flatMap((team) => getRoster(team));
        const player = pool.find((p) => p.id === playerId);
        if (!player) return;
        if (myRoster.length >= 15) {
          toast('球員名單已滿。');
          return;
        }
        if (state.budget < player.salary) {
          toast('預算不足，無法簽約。');
          return;
        }

        const sourceTeam = player.team;
        const sourceRoster = getRoster(sourceTeam);
        const idx = sourceRoster.findIndex((p) => p.id === player.id);
        if (idx >= 0) sourceRoster.splice(idx, 1);

        player.team = state.team;
        player.starter = false;
        state.budget -= player.salary;
        myRoster.push(player);
        logEvent(`${player.name} 從 ${sourceTeam} 簽下，薪資 ${player.salary}M。`);
        saveState();
        render();
      }

      function showSettings() {
        const modal = document.createElement('div');
        modal.className = 'modal-bg';
        modal.innerHTML = `
          <div class="modal">
            <h3>球隊設定</h3>
            <label>選擇經營球隊</label>
            <select id="teamSelect">
              ${TEAMS.map((team) => `<option value="${team}" ${team === state.team ? 'selected' : ''}>${safeText(team)}</option>`).join('')}
            </select>
            <label>總經理名稱</label>
            <input id="managerInput" value="${safeText(state.manager)}" />
            <div class="modal-actions">
              <button class="btn small" data-close-modal="1">取消</button>
              <button class="btn gold small" data-save-settings="1">儲存</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
      }

      function applySettings() {
        const team = document.getElementById('teamSelect')?.value || state.team;
        const manager = document.getElementById('managerInput')?.value.trim() || '總經理';
        state.team = TEAMS.includes(team) ? team : state.team;
        state.manager = manager;
        if (!state.rosters[state.team]) state.rosters[state.team] = createTeamRoster(state.team);
        saveState();
        render();
        document.querySelector('.modal-bg')?.remove();
      }

      function restartGame() {
        const should = confirm('確定要重新開始？這會重置全部進度。');
        if (!should) return;
        const fresh = freshState();
        Object.assign(state, fresh);
        saveState();
        render();
        toast('新王朝開始！');
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.dataset.page) {
          updateNavigation(button.dataset.page);
          render();
          return;
        }

        if (button.dataset.closeModal) {
          document.querySelector('.modal-bg')?.remove();
          return;
        }

        if (button.dataset.saveSettings) {
          applySettings();
          return;
        }

        if (button.id === 'settingsBtn') {
          showSettings();
          return;
        }

        const { action } = button.dataset;

        switch (action) {
          case 'play-game':
            tournamentSim();
            break;
          case 'toggle-starter':
            toggleStarter(button.dataset.playerId);
            break;
          case 'release-player':
            releasePlayer(button.dataset.playerId);
            break;
          case 'sign-player':
            signPlayer(button.dataset.playerId);
            break;
          case 'start-playoffs':
            startPlayoffs();
            break;
          case 'start-draft':
            startDraft();
            break;
          case 'pick-player':
            chooseDraftPlayer(button.dataset.playerId);
            break;
          case 'restart':
            restartGame();
            break;
          case 'simulate-postseason':
            simulatePlayoffGame();
            break;
          default:
            break;
        }
      });

      document.addEventListener('click', (event) => {
        const btn = event.target.closest('[data-action="simulate-postseason"]');
        if (btn) simulatePlayoffGame();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          document.querySelector('.modal-bg')?.remove();
        }
      });

      document.getElementById('navBar')?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-page]');
        if (!btn) return;
        setPage(btn.dataset.page);
      });

      render();
      saveState();
    })();
  </script>
</body>
</html>
