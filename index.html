<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e}*{box-sizing:border-box}html,body{margin:0;padding:0;background:radial-gradient(circle at top,#101d2d,#07141d 55%);color:var(--text)}body{min-height:100vh}a,button{font:inherit}button{background:linear-gradient(180deg,#1a2b3d,#0f1d2a);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;cursor:pointer;transition:.18s ease;box-shadow:0 6px 18px rgba(0,0,0,.18)}button:hover{transform:translateY(-1px);border-color:#4a627f}button:focus-visible,a:focus-visible{outline:3px solid rgba(237,195,110,.8);outline-offset:2px}.app{max-width:1280px;margin:0 auto;padding:1rem}.budget{font-weight:700}.hero,.nav,.footer,.card,.row,.actions,.entry,.team-grid{display:flex}.hero,.row{align-items:center;justify-content:space-between;gap:1rem}.card{background:rgba(20,32,45,.88);border:1px solid var(--line);border-radius:18px;padding:1rem;box-shadow:0 12px 32px rgba(3,8,13,.28)}.muted{color:var(--muted)}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0 1.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem}header h1{margin:0;font-size:clamp(1.5rem,3vw,2.4rem)}header small{display:block;color:var(--muted)}.nav{gap:.5rem;flex-wrap:wrap;margin:1rem 0}.nav button{flex:1 1 140px}.actions{gap:.75rem;flex-wrap:wrap}.footer{justify-content:center;padding:1rem 0;color:var(--muted);font-size:.92rem;text-align:center;margin-top:1rem}.toast{position:fixed;right:1rem;bottom:1rem;z-index:9999;background:rgba(7,13,17,.95);color:#eef4fb;border:1px solid rgba(237,195,110,.45);padding:.7rem 1rem;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media (max-width:760px){.app{padding:.8rem}.hero,.row,header{flex-direction:column;align-items:flex-start}.nav button{flex-basis:48%}.actions{width:100%}.actions button{flex:1 1 auto}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style>
<link rel="stylesheet" href="./enhancements.css">
</head>
<body><div class="app">
<header><div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div id="budget" class="budget"></div></header>
<section class="hero"><div class="row"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="save">儲存進度</button><button data-action="new">新遊戲</button></div></div></section>
<nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="market">自由球員／洋將</button><button data-page="standings">排名</button><button data-page="playoffs">季後賽</button></nav>
<div id="pageRoot"></div>
<div class="footer">TPBL 球員池｜新遊戲隨機分隊｜每隊 36 場、聯盟 126 場｜本土薪資上限 200M</div></div>
<script>
(() => {'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=200,FOREIGN_CAP=40000,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','高雄17LIVE鋼鐵人','臺北富邦勇士','新竹御頂攻城獅'];
const POS=['PG','SG','SF','PF','C'];
const LOCAL=`曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家興 許皓程 張維恩 蔡宇謙 鍾明輝 李學林 劉季軒 周士淵 何信華 余德龍 余宗廷`; 
const IMPORTS=`Ray McCallum|Malcolm Miller|Adrien Moerman|Michael Eric|Daron Russell|Kristijan Krajina|Ivan Aska|Nysier Brooks|Austin Daye|Sani Sakakini|Jason Washburn|Kenny Manigault|Axel Toupane|Manny Harris|Tyler Hansbrough|Tim Quarterman|Shawn Long|Kenny Chery|Jalen Jones|Gabe DeVries|Melo Trimble|Marek Blaževič|Jacob Pullen|Brady Manek|Youssou Ndoye|Jordy Tshimanga|Javonte Smart|Deng Geu|Rasheed Sulaimon|Matt Costello|Jerian Grant|Ferrak McGlynn`; 
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function player(name,team,i,imp){const rating=(imp?73:65)+Math.floor(Math.random()*(imp?17:23));return{id:`p-${Math.random().toString(36).slice(2,10)}`,name,team,pos:POS[i%5],age:21+Math.floor(Math.random()*8),rating,potential:Math.min(99,rating+8+Math.floor(Math.random()*12)),salary:imp?Math.round(8+Math.random()*14):Math.round(3+Math.random()*8),salaryUsd:imp?Math.round(9000+Math.random()*16000):0,isForeign:!!imp,starter:Math.random()<0.45,injury:false}} 
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function makeSchedule(){const games=[];for(let i=0;i<TEAMS.length;i++){for(let j=i+1;j<TEAMS.length;j++){for(let k=0;k<2;k++){games.push({a:TEAMS[i],b:TEAMS[j],round:games.length+1})}}}return shuffle(games)}
function fresh(){const locals=shuffle([...new Set(LOCAL.split(/\s+/).filter(Boolean))]),imports=shuffle([...new Set(IMPORTS.split('|'))]),rosters={};TEAMS.forEach(t=>{const ls=locals.splice(0,12),is=imports.splice(0,4);rosters[t]=[...ls.map((name,i)=>player(name,t,i,false)),...is.map((name,i)=>player(name,t,i+12,true))]});return{team:TEAMS[0],manager:'總經理',season:1,standings:blankStandings(),rosters,postseason:null,history:[],schedule:makeSchedule(),budget:CAP,foreignBudget:FOREIGN_CAP}} 
function normalize(raw){if(!raw?.rosters)return fresh();const s={...fresh(),...raw};s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.manager=s.manager||'總經理';s.season=Math.max(1,Number(s.season)||1);s.standings=Object.fromEntries(TEAMS.map(t=>[t,{...blankStandings()[t],...(raw.standings&&raw.standings[t]||{})}]));s.rosters=Object.fromEntries(TEAMS.map(t=>[t,(raw.rosters&&raw.rosters[t]||fresh().rosters[t]).map(p=>({ ...p, id:p.id||`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}` }))]));return s}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}}
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),1800)}
function render(){const r=state.standings[state.team]||{w:0,l:0,g:0};$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').textContent=`預算 ${CAP - Object.values(state.rosters).flat().filter(p=>!p.isForeign).reduce((sum,p)=>sum+Number(p.salary||0),0)}M`}
function homePage(){const r=state.standings[state.team]||{w:0,l:0,g:0};return `<div class="card"><h3>總覽</h3><p class="muted">球隊：${esc(state.team)}｜經理：${esc(state.manager)}｜例行賽 ${r.g}/${GAMES} 場｜總勝 ${r.w}｜總敗 ${r.l}</p><p>實作重點：資金管理、陣容搭配、主場優勢與球員健康狀況。</p></div>`}
function rosterPage(){const players=state.rosters[state.team]||[];return `<div class="card"><h3>球員名單</h3><div class="team-grid">${players.map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating}</b></div>`).join('')}</div></div>`}
function marketPage(){return `<div class="card"><h3>自由球員／洋將</h3><p class="muted">本土薪資上限 200M。洋將最多 ${FOREIGN_LIMIT} 名，總薪資上限 US$${FOREIGN_CAP.toLocaleString()}。</p></div>`}
function standingsPage(){const rows=TEAMS.map(t=>({team:t,...(state.standings[t]||{w:0,l:0,g:0})})).sort((a,b)=>b.w-a.w||b.ptsFor-a.ptsFor||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team));return `<div class="card"><h3>排名</h3>${rows.map((t,i)=>`<div class="entry"><span>${i+1}. ${esc(t.team)}</span><b>${t.w}-${t.l}</b></div>`).join('')}</div>`}
function pageContent(page='home'){switch(page){case 'roster':return rosterPage();case 'market':return marketPage();case 'standings':return standingsPage();case 'playoffs':return `<div class="card"><h3>季後賽</h3><p class="muted">季後賽系統保持開放，請在管理頁面中設定賽程與晉級規則。</p></div>`;default:return homePage();}}
let page='home';document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;const pageName=b.dataset.page;if(action){if(action==='save'){save();notify('已儲存進度');return;}if(action==='new'){state=fresh();save();notify('已重設新遊戲');}if(action==='team'){const team=prompt('輸入新隊名：',state.team);if(team){state.team=TEAMS.includes(team)?team:state.team;notify('球隊已更新');}}return}if(pageName){page=pageName;$('#pageRoot').innerHTML=pageContent(page);return}});
document.addEventListener('DOMContentLoaded',()=>{render();$('#pageRoot').innerHTML=pageContent(page);save();});
render();$('#pageRoot').innerHTML=pageContent(page);save();
})();
</script>
<script src="./enhancements.js" defer></script></body></html>
