<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:1050px;margin:auto;padding:20px}header,.row,.entry,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}header,.actions{flex-wrap:wrap}.muted,small{color:var(--muted)}h1{margin:0}h2,h3{margin:.25em 0}.budget,.badge{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--gold)}.budget small{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:16px 0}.nav button{background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;white-space:nowrap}.nav button.active{color:var(--gold);border-bottom:2px solid var(--gold)}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#26374a;color:var(--text);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:var(--gold);color:#201b11;border-color:var(--gold);font-weight:700}.danger{background:#45292d;border-color:#74444b;color:#ffc7c7}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{padding:10px 0;border-bottom:1px solid #ffffff18}.entry:last-child{border:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:5}.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}.empty{padding:16px;color:var(--muted)}.cut-btn{background:#45292d;border-color:#74444b;color:#ffc7c7;padding:6px 9px;font-size:13px}@media(max-width:700px){.app{padding:12px}.columns{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<header><div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div id="budget" class="budget"></div></header>
<section class="hero"><div class="row"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="new">新賽季</button><button class="danger" data-action="restart">重新開始</button></div></div></section>
<nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="market">自由球員／洋將</button><button data-page="standings">排名與季後賽</button></nav><main id="view"></main>
<div class="footer">TPBL 球員池｜新遊戲隨機分隊｜每隊 36 場、聯盟 126 場｜本土薪資上限 200M</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=200,FOREIGN_CAP=40000,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];let page='home',state;
const LOCAL=`曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家駿 林俊吉 簡偉儒 李德威 史承平 林書緯 蘇培凱 鍾理翔 李愷諺 簡祐哲 王柏智 林彥廷 呂政儒 蘇士軒 林金榜 熊祥泰 梁瀚 盧冠軒 李啓瑋 徐小龍 高國豪 曾柏喻 朱雲豪 田浩 劉丞勳 蕭順議 李家瑞 蔡宸綱 黃泓瀚 簡廷兆 曾文鼎 陳懷安 阿巴西 李睿麒 林安龍 余維豪 魏嘉豪 謝亞軒 林任鴻 曾信武 林韋翰 李沛澄 錢肯尼 張耕淯 雷蒙恩 蘇奕晉 陳冠全 丁聖儒 魏芃禾 江均 劉彥廷 陳文宏 張兆辰 黃聰翰 謝銘駿 孫思堯 余純安 廖偉皓 吳曉謹 勤明慶 魏莨哲 于煥亞 邱子軒 唐維傑 胡瓏貿 施晉堯 呂威霆 吳彥侖 蘇文儒 林書豪 陳盈駿 林庭謙 林秉聖 劉錚 林志傑 陳又瑋 林宜輝 忻沃克 林廷謙`.split(' ');
const IMPORTS=`Ray McCallum|Malcolm Miller|Adrien Moerman|Michael Eric|Daron Russell|Kristijan Krajina|Ivan Aska|Nysier Brooks|Austin Daye|Sani Sakakini|Jason Washburn|Kenny Manigault|Axel Toupane|Lasan Kromah|Devin Williams|Egidijus Mockevičius|Landers Nolley|Earl Clark|Nate Laszewski|Kennedy Meeks|Beau Beech|Markus Lončar|Brandon Gilbeck|Aric Holman|Edgaras Želionis|Craig Sword|Anthony Morse|Kaleb Wesson|Chris McCullough|Cheick Diallo|Trey Thompkins|Ben Bentil|Jalen Harris|Olufemi Olujobi|Drew Pember|Anžejs Pasečņiks|TJ Holyfield|Marin Marić|Nemanja Radović|Viktor Gaddefors|Marko Todorović|Makur Maker|Michael Frazier|Darral Willis|Youssou Ndoye|Hunter Maldonado|Rade Zagorac|Stanton Kidd|Sim Bhullar|Justin Alston|Rosco Allen|Grant Basile|Gabriel Galvanini|Marvin Jones|Vladimir Brodziansky|Michael Beasley|Markel Crawford|Jonathan Lewis|Jaylen Johnson|Antony Diong|McAdoo|Cam Miller|Cromer|Aleksandar Marelja|Tyrus McGee|Bryan Griffin`.split('|');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function player(name,team,i,imp){const rating=(imp?73:65)+Math.floor(Math.random()*(imp?17:23));return{id:`p-${Math.random().toString(36).slice(2,10)}`,name,team,pos:POS[i%5],age:21+Math.floor(Math.random()*13),rating,potential:Math.min(99,rating+10),salary:imp?0:5+Math.floor(Math.random()*10),salaryUsd:imp?8000+Math.floor(Math.random()*2000):null,isForeign:imp,starter:false,injury:0,stats:{gp:0,pts:0}}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}]))}function makeSchedule(){const games=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)games.push({a:TEAMS[i],b:TEAMS[j]});return shuffle(games).map((g,i)=>({...g,id:i+1}))}
function fresh(){const locals=shuffle([...new Set(LOCAL)]),imports=shuffle([...new Set(IMPORTS)]),rosters={};TEAMS.forEach(t=>{const ls=locals.splice(0,12),is=imports.splice(0,4);rosters[t]=[...ls.map((n,i)=>player(n,t,i,false)),...is.map((n,i)=>player(n,t,i,true))];shuffle(rosters[t].filter(p=>!p.isForeign)).slice(0,5).forEach(p=>p.starter=true)});const freeAgents=[...locals.map((n,i)=>player(n,'自由球員',i,false)),...imports.map((n,i)=>player(n,'自由球員',i,true))];return{team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,rosters,standings:blankStandings(),schedule:makeSchedule(),freeAgents,postseason:null}}
function normalize(raw){if(!raw?.rosters)return fresh();const s={...raw};s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.manager=s.manager||'總經理';s.season=Math.max(1,Number(s.season)||1);s.rosters=s.rosters||{};TEAMS.forEach(t=>{const list=Array.isArray(s.rosters[t])?s.rosters[t]:[];s.rosters[t]=list.map((p,i)=>{const imp=!!(p.isForeign||p.foreign);return{...player(p.name||`球員${i+1}`,t,i,imp),...p,id:p.id||`${t}-${i}`,team:t,isForeign:imp,salary:imp?0:Math.max(0,Number(p.salary)||0),salaryUsd:imp?Math.max(0,Number(p.salaryUsd)||10000):null,stats:{gp:0,pts:0,...p.stats}}});const ss=s.rosters[t].filter(p=>p.starter).slice(0,5);s.rosters[t].forEach(p=>p.starter=ss.includes(p));if(ss.length<5)s.rosters[t].filter(p=>!p.isForeign&&!p.starter).slice(0,5-ss.length).forEach(p=>p.starter=true)});s.standings=s.standings||{};TEAMS.forEach(t=>{const r=s.standings[t]||{},w=Math.max(0,Number(r.w)||0),l=Math.max(0,Number(r.l)||0);s.standings[t]={...r,w,l,g:w+l}});if(!Array.isArray(s.schedule)||s.schedule.length!==LEAGUE_GAMES)s.schedule=makeSchedule();s.gameIndex=Math.max(0,Math.min(LEAGUE_GAMES,Number(s.gameIndex)||0));s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:[];s.postseason=s.postseason||null;return s}
try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.remove(),2400)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器儲存空間。');return false}}
function isForeign(p){return!!(p&&(p.isForeign||p.foreign))}function roster(t=state.team){return state.rosters[t]||[]}function domPayroll(t=state.team){return roster(t).filter(p=>!isForeign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0)}function impPayroll(t=state.team){return roster(t).filter(isForeign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0)}function ranked(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l)}function regularComplete(){return TEAMS.every(t=>state.standings[t].g>=GAMES)}
function render(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').innerHTML=`本土薪資 ${domPayroll()} / ${CAP}M<small>洋將 ${roster().filter(isForeign).length}/${FOREIGN_LIMIT} 名 · US$${impPayroll().toLocaleString()}/${FOREIGN_CAP.toLocaleString()}</small>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='roster'?rosterPage():page==='market'?marketPage():page==='standings'?standingsPage():homePage()}
function homePage(){const r=state.standings[state.team],ps=state.postseason;return `<div class="columns"><section class="card"><h3>${ps?'季後賽進行中':'例行賽進度'}</h3><p>${ps?'例行賽已完成':`${r.g}/${GAMES} 場；聯盟賽程 ${state.gameIndex}/${LEAGUE_GAMES}`}</p>${!ps&&!regularComplete()?'<p class="muted">七隊彼此各交手六次，每隊 36 場，共 126 場。</p><button class="gold" data-action="play">模擬下一場聯盟賽事</button>':''}${regularComplete()&&!ps?'<p class="muted">例行賽全部完成，可以開始季後賽。</p><button class="gold" data-action="start-playoffs">進入季後賽</button>':''}${ps&&!ps.champion?`<p>${esc(playoffLabel(ps))}：${esc(currentSeriesTitle(ps))}</p><p class="muted">${esc(currentSeries(ps)?.a||'')} ${currentSeries(ps)?.aw||0} - ${currentSeries(ps)?.bw||0} ${esc(currentSeries(ps)?.b||'')}</p><button class="gold" data-action="playoff-game">模擬下一場季後賽</button>`:''}${ps?.champion?`<p>🏆 本季總冠軍：<b>${esc(ps.champion)}</b></p><button data-action="new">開始新賽季</button>`:''}</section><section class="card"><h3>聯盟戰績</h3>${ranked().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} <small>${x.g}/${GAMES}</small></b></div>`).join('')}</section></div><section class="card"><h3>先發陣容</h3>${roster().filter(p=>p.starter).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating} OVR</b></div>`).join('')}</section>`}
function rosterPage(){return `<section class="card"><h3>球員名單 · ${roster().length}/16</h3><p class="muted">球員來自三季名單池。先發五人；替補球員可直接替換目前先發。開除球員後會成為自由球員，可再簽回。</p>${roster().map(p=>`<div class="entry"><span><b>${esc(p.name)}</b> ${p.starter?'<span class="badge">先發</span>':'<span class="muted">替補</span>'}<small class="muted"><br>${esc(p.pos)} · ${p.age} 歲 · ${isForeign(p)?`洋將 US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 ${Number(p.salary)||0}M`}</small></span><span class="actions"><button data-action="${p.starter?'bench':'replace'}" data-id="${esc(p.id)}">${p.starter?'改為替補':'替換先發'}</button><button class="cut-btn" data-action="cut" data-id="${esc(p.id)}">開除</button></span></div>`).join('')||'<p class="empty">目前名單沒有球員。</p>'}</section>`}
function marketPage(){return `<section class="card"><h3>自由球員簽約</h3><p class="muted">本土薪資上限 200M；洋將最多四名、合計不超過 US$40,000；球員名單最多 16 人。</p>${state.freeAgents.length?state.freeAgents.map(p=>`<div class="entry"><span><b>${esc(p.name)}</b><small class="muted"><br>${isForeign(p)?`洋將 · US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 · ${p.salary}M`} · ${p.rating} OVR</small></span><button data-action="sign" data-id="${esc(p.id)}">簽下</button></div>`).join(''):'<p class="empty">目前沒有自由球員。</p>'}</section>`}
function playoffCard(){const p=state.postseason;if(!p)return `<section class="card"><h3>季後賽</h3><p class="muted">完成七隊各 36 場例行賽後開放。前六名晉級：第 3 對第 6、第 4 對第 5 先打挑戰賽，前兩名直進四強。</p>${regularComplete()?'<button class="gold" data-action="start-playoffs">開始季後賽</button>':`<p>尚未開放：聯盟例行賽進度 ${state.gameIndex}/${LEAGUE_GAMES}</p>`}</section>`;if(p.champion)return `<section class="card"><h3>季後賽結果</h3><p>🏆 第 ${state.season} 季總冠軍：<b>${esc(p.champion)}</b></p><button data-action="new">開始新賽季</button></section>`;const s=currentSeries(p);return `<section class="card"><h3>季後賽｜${esc(playoffLabel(p))}</h3><p class="muted">挑戰賽三戰兩勝、四強五戰三勝、總冠軍賽七戰四勝。</p><div class="entry"><b>${esc(currentSeriesTitle(p))}</b><span>${esc(s.a)} ${s.aw} - ${s.bw} ${esc(s.b)}</span></div><button class="gold" data-action="playoff-game">模擬下一場季後賽</button>${p.challenge?`<h3>挑戰賽</h3>${p.challenge.map((x,i)=>seriesLine(x,`第 ${i+1} 組`)).join('')}`:''}${p.semis?`<h3>四強賽</h3>${p.semis.map((x,i)=>seriesLine(x,`第 ${i+1} 組`)).join('')}`:''}${p.final?`<h3>總冠軍賽</h3>${seriesLine(p.final,'總冠軍賽')}`:''}</section>`}
function seriesLine(s,label){return `<div class="entry"><span>${label}：${esc(s.a)} vs ${esc(s.b)}</span><b>${s.aw}-${s.bw}${s.winner?` · 勝者 ${esc(s.winner)}`:''}</b></div>`}function standingsPage(){return `<section class="card"><h3>例行賽排名</h3>${ranked().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)} ${i<6?'<span class="badge">晉級</span>':''}</span><b>${x.w} 勝 ${x.l} 敗 · ${x.g}/${GAMES}</b></div>`).join('')}</section>${playoffCard()}`}
function playFixture(f){const a=state.standings[f.a],b=state.standings[f.b];if(!a||!b)return;const rating=t=>{const ps=roster(t).filter(p=>p.starter&&!p.injury);return ps.length?ps.reduce((n,p)=>n+(Number(p.rating)||0),0)/ps.length:68};let sa=Math.round(80+Math.random()*22+(rating(f.a)-72)*.55),sb=Math.round(80+Math.random()*22+(rating(f.b)-72)*.55);if(sa===sb)sa++;a.g++;b.g++;if(sa>sb){a.w++;b.l++}else{b.w++;a.l++}for(const [team,score]of[[f.a,sa],[f.b,sb]])roster(team).filter(p=>p.starter&&!p.injury).forEach(p=>{p.stats.gp=(Number(p.stats.gp)||0)+1;p.stats.pts=(Number(p.stats.pts)||0)+Math.floor(score/5)})}
function playNext(){if(state.postseason)return notify('季後賽已開始，請到排名與季後賽頁進行。');if(regularComplete())return notify('例行賽已完成，請開始季後賽。');if(state.gameIndex>=state.schedule.length)return notify('賽程已結束，請檢查聯盟排名。');playFixture(state.schedule[state.gameIndex]);state.gameIndex++;save();render();if(regularComplete())notify('例行賽完成！排名與季後賽頁已開放季後賽。')}
function makeSeries(a,b,best){return{a,b,aw:0,bw:0,best,winner:null}}function startPlayoffs(){if(!regularComplete())return notify('請先完成所有 126 場例行賽。');if(state.postseason)return notify('季後賽已開始。');const order=ranked().map(x=>x.team);state.postseason={stage:'challenge',challenge:[makeSeries(order[2],order[5],3),makeSeries(order[3],order[4],3)],challengeIndex:0,semis:null,semiIndex:0,final:null,champion:null};save();page='standings';render();notify('季後賽開始！前兩名輪空，第三至第六名進行挑戰賽。'}function currentSeries(p=state.postseason){if(!p||p.champion)return null;if(p.stage==='challenge')return p.challenge[p.challengeIndex];if(p.stage==='semis')return p.semis[p.semiIndex];return p.final}function currentSeriesTitle(p){if(!p)return'';return p.stage==='challenge'?`挑戰賽第 ${p.challengeIndex+1} 組`:p.stage==='semis'?`四強賽第 ${p.semiIndex+1} 組`:'總冠軍賽'}function playoffLabel(p){return p.stage==='challenge'?'挑戰賽':p.stage==='semis'?'四強賽':'總冠軍賽'}
function playPlayoffGame(){const p=state.postseason,s=currentSeries(p);if(!s)return notify('目前沒有待進行的季後賽。');const rating=t=>{const ps=roster(t).filter(x=>x.starter&&!x.injury);return ps.length?ps.reduce((n,x)=>n+(Number(x.rating)||0),0)/ps.length:68};let as=Math.round(82+Math.random()*19+(rating(s.a)-72)*.5),bs=Math.round(82+Math.random()*19+(rating(s.b)-72)*.5);if(as===bs)as++;const winner=as>bs?s.a:s.b;if(winner===s.a)s.aw++;else s.bw++;const needed=Math.ceil(s.best/2);if(s.aw>=needed||s.bw>=needed){s.winner=s.aw>=needed?s.a:s.b;advanceSeries(s.winner)}save();render();notify(`${s.a} ${as} - ${bs} ${s.b}${s.winner?`；系列賽由 ${s.winner} 勝出`:`；${winner} 贏得本場`}`)}
function advanceSeries(winner){const p=state.postseason;if(p.stage==='challenge'){p.challengeIndex++;if(p.challengeIndex>=2){const order=ranked().map(x=>x.team),w36=p.challenge[0].winner,w45=p.challenge[1].winner;p.semis=[makeSeries(order[0],w45,5),makeSeries(order[1],w36,5)];p.stage='semis';p.semiIndex=0}return}if(p.stage==='semis'){p.semiIndex++;if(p.semiIndex>=2){p.final=makeSeries(p.semis[0].winner,p.semis[1].winner,7);p.stage='final'}return}if(p.stage==='final'){p.champion=winner;p.stage='complete'}}
function setStarter(id,replace){const p=roster().find(x=>String(x.id)===id);if(!p)return;if(p.injury)return notify('受傷球員不能先發。');if(p.starter){if(roster().filter(x=>x.starter).length<=5)return notify('請以替補球員替換，確保先發維持五人。');p.starter=false}else{const ss=roster().filter(x=>x.starter);if(ss.length>=5){if(!replace)return notify('先發最多五人，請使用替換先發。');const out=ss.filter(x=>!x.injury).sort((a,b)=>(Number(a.rating)||0)-(Number(b.rating)||0))[0];if(!out)return notify('目前沒有可替換的健康先發。');out.starter=false}p.starter=true}save();render()}
function cutPlayer(id){const index=roster().findIndex(p=>String(p.id)===id);if(index<0)return;const p=roster()[index];if(!confirm(`確定開除 ${p.name}？球員會離隊並成為自由球員。`))return;const [removed]=roster().splice(index,1);removed.team='自由球員';removed.starter=false;removed.id=`fa-${Math.random().toString(36).slice(2,10)}`;state.freeAgents.push(removed);save();render();notify(`${removed.name} 已開除並加入自由球員市場。`)}
function signPlayer(p){if(!p)return;const r=roster();if(r.length>=16)return notify('名單已滿（16 人）。');if(isForeign(p)){if(r.filter(isForeign).length>=FOREIGN_LIMIT)return notify('洋將名額已滿。');if(impPayroll()+Number(p.salaryUsd||0)>FOREIGN_CAP)return notify(`洋將薪資超過 US$${FOREIGN_CAP.toLocaleString()} 上限。`)}else if(domPayroll()+Number(p.salary||0)>CAP)return notify(`本土薪資超過 ${CAP}M 上限。`);r.push({...p,id:`signed-${Math.random().toString(36).slice(2,10)}`,team:state.team,starter:false});state.freeAgents=state.freeAgents.filter(x=>x.id!==p.id);save();render();notify(`已簽下 ${p.name}`)}function newSeason(){if(!state.postseason?.champion)return notify('請先完成本季季後賽，才能開始新賽季。');state.season++;state.gameIndex=0;state.standings=blankStandings();state.schedule=makeSchedule();state.postseason=null;TEAMS.forEach(t=>roster(t).forEach(p=>{p.stats={gp:0,pts:0};p.injury=0}));save();page='home';render();notify(`第 ${state.season} 季開始。`)}function restart(){if(!confirm('確定重新開始？目前存檔會清除，並重新隨機分配球員。'))return;state=fresh();page='home';save();render();notify('新遊戲已建立。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}switch(b.dataset.action){case'play':playNext();break;case'start-playoffs':startPlayoffs();break;case'playoff-game':playPlayoffGame();break;case'replace':setStarter(b.dataset.id,true);break;case'bench':setStarter(b.dataset.id,false);break;case'cut':cutPlayer(b.dataset.id);break;case'sign':signPlayer(state.freeAgents.find(p=>String(p.id)===b.dataset.id));break;case'restart':restart();break;case'team':{const t=prompt(`輸入球隊名稱：\n${TEAMS.join('\n')}`,state.team);if(TEAMS.includes(t)){state.team=t;save();render()}break}case'new':newSeason();break}});
render();save();
})();
</script></body></html>
