<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1018">
<title>FRONT OFFICE｜籃球王朝經理</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--card:#141f2d;--card2:#1a2939;--line:#2b3b4f;--muted:#9aabbe;--text:#f1f5f9;--gold:#edc36e;--green:#73d6a0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#2a3c53 0,transparent 42%),var(--bg);color:var(--text);min-height:100vh}.app{max-width:1280px;padding:22px;margin:auto}.top,.brand,.actions,.nav,.row,.cardhead,.stats{display:flex;align-items:center}.top,.cardhead,.row{justify-content:space-between;gap:12px}.brand{gap:12px}.ball{display:grid;place-items:center;width:45px;height:45px;border-radius:13px;background:linear-gradient(145deg,#f3d48f,#b9802c);font-size:23px}.brand h1{font-size:15px;letter-spacing:2px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill,.tag{font-size:11px;padding:6px 9px;border-radius:8px;background:#233247;color:#d4dfeb}.hero{padding:24px;margin:20px 0;border:1px solid #39495c;border-radius:18px;background:linear-gradient(110deg,#1d2c3d,#111a26 70%)}.hero h2{margin:7px 0;font-size:30px}.hero p,.muted{color:var(--muted);font-size:12px}.gold{color:var(--gold)}.stats{gap:10px;margin-top:20px}.stat{flex:1;background:#0b121b99;border:1px solid #ffffff12;border-radius:12px;padding:12px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:21px;margin-top:5px}.nav{gap:7px;margin:18px 0;overflow:auto}.nav button{white-space:nowrap}.button,.nav button{cursor:pointer;color:var(--text);background:#1b2939;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-weight:750;font-size:12px}.button:hover,.nav button:hover{border-color:#8b9db2;transform:translateY(-1px)}.button.primary{background:var(--gold);color:#17130b;border-color:var(--gold)}.button.small{font-size:10px;padding:7px 9px}.nav button.active{border-color:var(--gold);color:var(--gold);background:#283648}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:15px}.stack{display:grid;gap:15px;align-content:start}.card{padding:17px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(150deg,#151f2c,#111923);min-width:0}.card h3{margin:0;font-size:14px}.cardhead{margin-bottom:14px}.cardhead small{color:var(--muted);font-size:10px}.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.player{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card2)}.player b{font-size:12px}.ovr{color:var(--gold);font-size:20px;font-weight:900}.player small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.player .tag{display:inline-block;margin:8px 4px 0 0;font-size:9px}.strength{display:grid;gap:11px}.strengthline{display:grid;grid-template-columns:32px 1fr 30px;gap:8px;align-items:center;font-size:11px}.bar{height:6px;background:#29384a;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ad782c,#f0ce82)}.history{display:grid}.historyitem{padding:11px 0;border-bottom:1px solid #ffffff12;font-size:12px}.historyitem small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.title{margin:8px 0 15px}.title h2{margin:0;font-size:24px}.title p{margin:5px 0;color:var(--muted);font-size:12px}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.notice{border:1px solid #edc36e44;background:#edc36e0d;padding:11px 13px;border-radius:10px;color:#dfc98e;font-size:11px;margin-bottom:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px;font-size:11px}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #ffffff12}th{color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f1f5f9;color:#111a25;padding:11px 16px;border-radius:10px;font-size:12px;font-weight:800;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:8}.modal{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}.modal h3{margin:0 0 8px}.modal input{width:100%;margin:7px 0 13px;background:#0c141e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.err{padding:12px;background:#441f24;border:1px solid #a34a4e;border-radius:10px;color:#ffd2d2;margin:12px 0;font-size:12px}.empty{padding:20px;color:var(--muted);text-align:center;font-size:12px}.footer{text-align:center;color:#738297;font-size:10px;padding:25px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.players,.gridcards{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{display:grid;grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.app{padding:14px}.hero{padding:18px}.hero h2{font-size:25px}.players,.gridcards{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.top .pill{display:none}.card{padding:13px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="ball">🏀</div><div><h1>FRONT OFFICE</h1><small>BUILD YOUR DYNASTY · 球隊經營模擬</small></div></div><div class="actions"><span class="pill" id="seasonBadge"></span><button class="button small" data-action="profile">⚙ 球隊設定</button></div></header>
<section class="hero"><div class="row"><div><div class="gold" style="font-size:10px;letter-spacing:2px">YOUR FRANCHISE · MANAGER MODE</div><h2 id="teamName"></h2><p id="tagline"></p></div><button class="button primary" data-action="advance">⏭ 模擬並推進賽季</button></div><div class="stats" id="stats"></div></section>
<nav class="nav"><button class="active" data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="history">交易歷史</button><button data-page="free">自由球員簽約</button><button data-page="draft">選秀模擬</button><button data-page="training">球員成長</button></nav>
<main id="view"><div class="err">正在載入遊戲…</div></main><div class="footer">單檔 HTML · 不需要安裝套件 · 遊戲進度儲存在此瀏覽器</div></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
const KEY='front-office-playable-v3',positions=['PG','SG','SF','PF','C'];let page='home',toastTimer;const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function makePlayer(o){o=o||{};let r=o.rating??(58+Math.floor(Math.random()*20));return{id:o.id||Date.now()+Math.random(),name:o.name||pick(['林冠廷','陳柏翰','周以安','李承恩','Jordan Carter','Marcus Reed','Kai Brooks','王子豪','張宇','Darius Hill']),pos:o.pos||pick(positions),age:o.age??(19+Math.floor(Math.random()*14)),rating:r,potential:o.potential??clamp(r+8+Math.floor(Math.random()*15),r,99),salary:o.salary??Math.round((r*.2+2)*10)/10,starter:!!o.starter}}
function fresh(){let roster=Array.from({length:12},()=>makePlayer());roster.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true);return{team:'台北雷霆',manager:'總經理',season:1,wins:0,losses:0,budget:100,roster,history:[{title:'球隊成立',detail:'新王朝正式啟動。',season:1}],drafted:[]}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state||!Array.isArray(state.roster))state=fresh()}catch(e){state=fresh()}
state.team||='台北雷霆';state.manager||='總經理';state.season=Number(state.season)||1;state.wins=Number(state.wins)||0;state.losses=Number(state.losses)||0;state.budget=Number(state.budget)||100;state.roster.forEach(p=>{p.starter=!!p.starter;p.salary=Number(p.salary)||8;p.rating=Number(p.rating)||60;p.potential=Number(p.potential)||80;p.age=Number(p.age)||22});state.history=Array.isArray(state.history)?state.history:[];state.drafted=Array.isArray(state.drafted)?state.drafted:[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('瀏覽器無法儲存，請釋放裝置空間。');return false}}function notify(t){let n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),2300)}function payroll(){return state.roster.reduce((s,p)=>s+(Number(p.salary)||0),0)}function overall(list=state.roster){return list.length?Math.round(list.reduce((s,p)=>s+p.rating,0)/list.length):0}function starters(){return state.roster.filter(p=>p.starter)}function addHistory(title,detail){state.history.push({title,detail,season:state.season});state.history=state.history.slice(-100)}
function header(){let avg=overall();$('#teamName').textContent=state.team;$('#seasonBadge').textContent='第 '+state.season+' 季';$('#tagline').textContent=`總經理 ${state.manager}　·　戰力 ${avg} OVR　·　本季戰績 ${state.wins} 勝 ${state.losses} 敗`;$('$stats');$('#stats').innerHTML=`<div class="stat"><small>球隊戰力</small><b>${avg} <small>OVR</small></b></div><div class="stat"><small>本季戰績</small><b>${state.wins}-${state.losses}</b></div><div class="stat"><small>球員人數</small><b>${state.roster.length} <small>人</small></b></div><div class="stat"><small>薪資空間</small><b>${Math.max(0,150-payroll()).toFixed(1)} <small>M</small></b></div><div class="stat"><small>球隊預算</small><b>${state.budget.toFixed(1)} <small>M</small></b></div>`}
function card(p){return `<article class="player"><div class="row"><div><b>${safe(p.name)}</b><small>${p.pos} · ${p.age} 歲 · ${p.starter?'先發':'替補'}</small></div><span class="ovr">${p.rating}</span></div><span class="tag">潛力 ${p.potential}</span><span class="tag">薪資 ${Number(p.salary).toFixed(1)}M</span></article>`}
function strengthPanel(){return `<section class="card"><div class="cardhead"><div><h3>球隊戰力</h3><small>依先發五人各位置分析</small></div><span class="gold"><b>${overall(starters())||overall()}</b> OVR</span></div><div class="strength">${positions.map(pos=>{let list=starters().filter(p=>p.pos===pos),n=list.length?Math.round(list.reduce((s,p)=>s+p.rating,0)/list.length):Math.max(0,overall(starters())-5);return `<div class="strengthline"><b>${pos}</b><div>${list.length?list.map(p=>safe(p.name.split(' ')[0])).join('、'):'待補強'}<div class="bar"><i style="width:${n}%"></i></div></div><b class="gold">${n}</b></div>`}).join('')}</div></section>`}
function home(){let top=state.roster.slice().sort((a,b)=>b.rating-a.rating).slice(0,6);return `<div class="layout"><div class="stack"><section class="card"><div class="cardhead"><div><h3>核心球員</h3><small>球隊評分最高的球員</small></div><button class="button small" data-page="roster">完整名單 →</button></div><div class="players">${top.map(card).join('')}</div></section><section class="card"><div class="cardhead"><div><h3>快速操作</h3><small>開始經營你的球隊</small></div></div><div class="actions"><button class="button" data-page="free">簽自由球員</button><button class="button" data-page="draft">進入選秀</button><button class="button" data-page="training">訓練球員</button><button class="button" data-action="advance">模擬賽季</button></div></section></div><div class="stack">${strengthPanel()}${historyPanel()}</div></div>`}
function historyPanel(){return `<section class="card"><div class="cardhead"><h3>最近動態</h3><button class="button small" data-page="history">全部 →</button></div><div class="history">${state.history.slice(-4).reverse().map(x=>`<div class="historyitem"><b>${safe(x.title)}</b><small>第 ${x.season} 季 · ${safe(x.detail)}</small></div>`).join('')||'<div class="empty">尚無球隊動態</div>'}</div></section>`}
function rosterPage(){return `<div class="cardhead title"><div><h2>球員名單</h2><p>最多設定 5 位先發。完整管理球隊輪換陣容。</p></div><button class="button" data-action="lineup">自動安排先發</button></div><section class="card"><div class="tablewrap"><table><thead><tr><th>球員</th><th>位置</th><th>年齡</th><th>總評</th><th>潛力</th><th>薪資</th><th>狀態</th><th>操作</th></tr></thead><tbody>${state.roster.slice().sort((a,b)=>b.rating-a.rating).map(p=>`<tr><td><b>${safe(p.name)}</b></td><td>${p.pos}</td><td>${p.age}</td><td class="gold"><b>${p.rating}</b></td><td>${p.potential}</td><td>${Number(p.salary).toFixed(1)}M</td><td>${p.starter?'先發':'替補'}</td><td><button class="button small" data-action="starter" data-id="${p.id}">${p.starter?'改替補':'設先發'}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function historyPage(){return `<div class="title"><h2>交易歷史</h2><p>所有簽約、選秀與賽季紀錄。</p></div><section class="card"><div class="history">${state.history.slice().reverse().map(x=>`<div class="historyitem"><b>${safe(x.title)}</b><small>第 ${x.season} 季 · ${safe(x.detail)}</small></div>`).join('')||'<div class="empty">目前沒有紀錄</div>'}</div></section>`}
const agents=[{name:'Marcus Hill',pos:'PG',age:27,rating:78,potential:82,salary:13},{name:'陳昱安',pos:'SF',age:24,rating:74,potential:88,salary:10},{name:'Darius Cole',pos:'C',age:30,rating:81,potential:82,salary:16},{name:'林冠宇',pos:'SG',age:22,rating:69,potential:91,salary:7},{name:'Jalen Brooks',pos:'PF',age:26,rating:76,potential:84,salary:12},{name:'王以辰',pos:'PG',age:20,rating:65,potential:89,salary:5}];
function marketPage(draft){let list=draft?[{name:'陳冠宇',pos:'SG',age:19,rating:69,potential:94,salary:5},{name:'Jaylen Rivers',pos:'PG',age:18,rating:67,potential:92,salary:5},{name:'周昊',pos:'C',age:19,rating:65,potential:91,salary:4.5},{name:'Malik Stone',pos:'PF',age:20,rating:71,potential:89,salary:6},{name:'林柏叡',pos:'SF',age:18,rating:63,potential:95,salary:4.5},{name:'Drew Carter',pos:'SG',age:19,rating:68,potential:90,salary:5}]:agents;let title=draft?'選秀模擬':'自由球員簽約';return `<div class="title"><h2>${title}</h2><p>${draft?'挑選潛力新秀，培養下一代球星。':'補強陣容；簽約需有薪資空間及球隊預算。'} 可用薪資 ${Math.max(0,150-payroll()).toFixed(1)}M</p></div><div class="notice">名單上限 15 人 · 薪資上限 150M · 每次簽約會扣除相應預算。</div><section class="card"><div class="gridcards">${list.map(p=>`<article class="player"><div class="row"><div><b>${safe(p.name)}</b><small>${p.pos} · ${p.age} 歲 · ${draft?'潛力新秀':'自由球員'}</small></div><span class="ovr">${p.rating}</span></div><small>潛力 ${p.potential}　·　薪資 ${p.salary}M</small><button class="button primary small" style="width:100%;margin-top:12px" data-action="sign" data-draft="${draft}" data-name="${safe(p.name)}" data-pos="${p.pos}" data-age="${p.age}" data-rating="${p.rating}" data-potential="${p.potential}" data-salary="${p.salary}">${draft?'選中球員':'簽下球員'}</button></article>`).join('')}</div></section>${draft&&state.drafted.length?`<section class="card" style="margin-top:14px"><h3>已選新秀</h3>${state.drafted.map(p=>`<div class="historyitem">${safe(p.name)} · ${p.rating} OVR · 第 ${p.season} 季</div>`).join('')}</section>`:''}`}
function trainingPage(){return `<div class="title"><h2>球員成長中心</h2><p>訓練消耗 1.5M 預算；球員評分最高不超過潛力。</p></div><div class="notice">訓練年輕球員、開發潛力，打造長期競爭力。</div><section class="card">${state.roster.slice().sort((a,b)=>(b.potential-b.rating)-(a.potential-a.rating)).map(p=>`<div class="row" style="padding:11px 0;border-bottom:1px solid #ffffff12"><div><b>${safe(p.name)} · ${p.rating} OVR</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:5px">${p.age} 歲 · 潛力 ${p.potential} · 還可成長 ${Math.max(0,p.potential-p.rating)} 點</small></div><button class="button small" data-action="train" data-id="${p.id}">訓練 1.5M</button></div>`).join('')||'<div class="empty">沒有球員</div>'}</section>`}
function render(){header();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let view=$('#view');view.innerHTML=page==='home'?home():page==='roster'?rosterPage():page==='history'?historyPage():page==='free'?marketPage(false):page==='draft'?marketPage(true):trainingPage()}
function modal(){let bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h3>球隊設定</h3><p class="muted">設定只保存在這個瀏覽器。</p><label>球隊名稱<input id="teamInput" maxlength="24" value="${safe(state.team)}"></label><label>總經理名稱<input id="managerInput" maxlength="20" value="${safe(state.manager)}"></label><div class="actions" style="justify-content:flex-end"><button class="button" data-action="close-modal">取消</button><button class="button primary" data-action="save-profile">儲存</button></div></div>`;document.body.appendChild(bg)}
document.addEventListener('click',function(e){let btn=e.target.closest('button');if(!btn)return;let dest=btn.dataset.page;if(dest){page=dest;render();window.scrollTo(0,0);return}let a=btn.dataset.action;if(!a)return;
if(a==='profile'){modal();return}if(a==='close-modal'){document.querySelector('.modalbg')?.remove();return}if(a==='save-profile'){state.team=$('#teamInput').value.trim()||state.team;state.manager=$('#managerInput').value.trim()||state.manager;document.querySelector('.modalbg')?.remove();save();render();notify('設定已儲存。');return}
if(a==='starter'){let p=state.roster.find(x=>String(x.id)===btn.dataset.id);if(!p)return;if(!p.starter&&starters().length>=5)return notify('先發最多 5 位，請先調整一位。');p.starter=!p.starter;save();render();return}
if(a==='lineup'){state.roster.forEach(p=>p.starter=false);state.roster.slice().sort((x,y)=>y.rating-x.rating).slice(0,5).forEach(p=>p.starter=true);save();render();notify('已安排評分最高的五位球員先發。');return}
if(a==='sign'){let salary=Number(btn.dataset.salary);if(state.roster.length>=15)return notify('名單已滿，請先調整球員。');if(payroll()+salary>150)return notify('薪資空間不足。');if(state.budget<salary*.3)return notify('球隊預算不足。');let p=makePlayer({name:btn.dataset.name,pos:btn.dataset.pos,age:Number(btn.dataset.age),rating:Number(btn.dataset.rating),potential:Number(btn.dataset.potential),salary});state.roster.push(p);state.budget-=salary*.3;addHistory(btn.dataset.draft==='true'?'選秀簽約':'自由球員簽約',`${p.name} 加入球隊，年薪 ${salary}M。`);if(btn.dataset.draft==='true')state.drafted.push({...p,season:state.season});save();render();notify(`${p.name} 已加入球隊！`);return}
if(a==='train'){let p=state.roster.find(x=>String(x.id)===btn.dataset.id);if(!p)return;if(state.budget<1.5)return notify('訓練預算不足。');if(p.rating>=p.potential)return notify('球員已達潛力上限。');state.budget-=1.5;let gain=Math.min(p.potential-p.rating,1+Math.floor(Math.random()*2));p.rating+=gain;addHistory('球員訓練',`${p.name} 能力提升 ${gain} 點。`);save();render();notify(`${p.name} 成長 ${gain} 點！`);return}
if(a==='advance'){let result=clamp(Math.round(41+(overall()-68)*1.3+(Math.random()*12-6)),15,67);state.wins=result;state.losses=82-result;let changes=[];state.roster.forEach(p=>{p.age++;let delta=p.age<=24?Math.floor(Math.random()*3):p.age>=33?-Math.floor(Math.random()*2):Math.floor(Math.random()*2);p.rating=clamp(p.rating+delta,45,p.potential);if(delta)changes.push(`${p.name} ${delta>0?'+':''}${delta}`)});addHistory('賽季模擬結算',`戰績 ${result} 勝 ${82-result} 敗。`);state.season++;state.wins=0;state.losses=0;state.budget=Math.min(180,state.budget+12);save();render();notify(`賽季結束：${result} 勝 ${82-result} 敗，已進入第 ${state.season} 季。`);return}
});
window.addEventListener('error',function(e){let view=$('#view');if(view)view.innerHTML=`<div class="err"><b>遊戲發生錯誤</b><br>${safe(e.message||'未知錯誤')}<br><small>重新載入頁面；若仍無法遊玩，請清除此網站的本機儲存資料。</small></div>`});
try{render();save()}catch(e){$('#view').innerHTML=`<div class="err">遊戲初始化失敗：${safe(e.message)}。請使用最新版 Chrome、Edge、Firefox 或 Safari 開啟。</div>`}
})();
</script></body></html>
