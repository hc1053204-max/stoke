<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b1018" />
  <title>FRONT OFFICE｜TPBL 籃球經理</title>
  <style>
    :root {
      --bg-1: #07131c;
      --bg-2: #0d1d2b;
      --panel: rgba(18, 29, 40, 0.88);
      --panel-2: rgba(22, 35, 50, 0.94);
      --line: rgba(161, 196, 228, 0.18);
      --text: #edf6ff;
      --muted: #9fb5c6;
      --gold: #edc77b;
      --gold-2: #c89d49;
      --blue: #6ea8ff;
      --blue-2: #3d7df0;
      --green: #7ae0a1;
      --red: #f07b7b;
      --shadow: 0 18px 42px rgba(0,0,0,.28);
      --radius: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(46, 80, 116, 0.52), transparent 35%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    a { color: inherit; }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 20px 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ball {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9b5c, #d86a26);
      box-shadow: 0 10px 18px rgba(255, 140, 74, 0.28);
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.5vw, 2.3rem);
      letter-spacing: 2px;
      line-height: 1;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .budget {
      min-width: 140px;
      text-align: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(13, 21, 31, 0.8);
      border: 1px solid var(--line);
      color: var(--gold);
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px 20px 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(120deg, rgba(19, 35, 52, 0.95), rgba(23, 38, 53, 0.92));
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(255,255,255,0.06), transparent 28%, rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .hero-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 2px;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(1.9rem, 3vw, 3rem);
      line-height: 1.15;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      padding: 12px 14px 10px;
      border-radius: 12px;
      background: rgba(11, 20, 29, 0.58);
      border: 1px solid var(--line);
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 7px;
      font-size: 1.25rem;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .nav button {
      appearance: none;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0 0 8px;
      position: relative;
      font: inherit;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .nav button.active {
      color: var(--gold);
    }

    .nav button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 2px;
      border-radius: 2px;
      background: var(--gold);
    }

    .view {
      min-height: 260px;
    }

    .card {
      background: rgba(15, 24, 34, 0.82);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-head h3 {
      margin: 0;
      font-size: 1.06rem;
    }

    .muted { color: var(--muted); }
    .gold { color: var(--gold); }
    .green { color: var(--green); }
    .red { color: var(--red); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(129, 154, 181, 0.38);
      background: rgba(23, 35, 49, 0.9);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn.gold {
      background: rgba(237, 199, 123, 0.12);
      border-color: rgba(237, 199, 123, 0.46);
      color: var(--gold);
    }
    .btn.red {
      background: rgba(240, 123, 123, 0.12);
      border-color: rgba(240, 123, 123, 0.42);
      color: #ffc1c1;
    }
    .btn.blue {
      background: rgba(110, 168, 255, 0.12);
      border-color: rgba(110, 168, 255, 0.42);
      color: #dfeeff;
    }
    .btn.small {
      padding: 7px 10px;
      font-size: 0.8rem;
    }
    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      background: rgba(20, 33, 44, 0.82);
      border: 1px solid rgba(140, 166, 188, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: #dfeaf4;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    .podium {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }

    .slot {
      padding: 12px 10px;
      border-radius: 12px;
      text-align: center;
      background: rgba(9, 16, 25, 0.78);
      border: 1px solid var(--line);
    }

    .slot strong { display: block; }
    .slot small { color: var(--muted); display: block; margin-top: 5px; }

    .list {
      display: grid;
      gap: 10px;
    }

    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .entry:last-child { border-bottom: 0; }

    .player-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .ovr {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--gold);
      background: rgba(237, 199, 123, 0.12);
      border: 1px solid rgba(237, 199, 123, 0.38);
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      margin-left: 8px;
      border-radius: 999px;
      background: rgba(110,168,255,0.12);
      color: #d8edff;
      border: 1px solid rgba(110,168,255,0.32);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .small-note {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px 12px;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.62);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }

    .modal {
      width: min(420px, 100%);
      background: rgba(17, 29, 40, 0.98);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .modal h3 {
      margin: 0 0 12px;
      font-size: 1.2rem;
    }

    .modal label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(8, 16, 23, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(245,247,250,0.96);
      color: #14212d;
      box-shadow: var(--shadow);
      font-weight: 700;
      z-index: 70;
    }

    @media (max-width: 760px) {
      .app { padding: 16px 12px 28px; }
      .topbar { align-items: flex-start; }
      .hero-row { flex-direction: column; align-items: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .podium { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .entry { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="ball">🏀</div>
        <div>
          <h1>FRONT OFFICE</h1>
          <small>TPBL · Dynasty Manager</small>
        </div>
      </div>
      <div id="budgetBox" class="budget">預算 30.0M</div>
    </header>

    <section class="hero">
      <div class="hero-row">
        <div>
          <div class="eyebrow">Your Franchise · Manager Mode</div>
          <h2 id="teamName">臺北台新戰神</h2>
          <p id="teamMeta">總經理 • 第 1 / 20 季</p>
        </div>
        <button id="settingsBtn" class="btn gold">⚙ 球隊設定</button>
      </div>
      <div id="stats" class="stats"></div>
    </section>

    <nav class="nav" id="navBar">
      <button type="button" class="active" data-page="home">總覽</button>
      <button type="button" data-page="roster">球員名單</button>
      <button type="button" data-page="standings">排名</button>
      <button type="button" data-page="awards">獎項</button>
      <button type="button" data-page="history">紀錄</button>
      <button type="button" data-page="market">市場</button>
      <button type="button" data-page="draft">選秀</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'front-office-tpbl-optimized-v1';
      const TEAM_NAMES = [
        '桃園台啤永豐雲豹',
        '福爾摩沙台新夢想家',
        '新北國王',
        '新竹御嵿攻城獅',
        '新北中信特攻',
        '臺北台新戰神',
        '高雄全家海神'
      ];

      const POSITIONS = ['PG', 'SG', 'SF', 'PF', 'C'];
      const PLAYER_NAMES = {
        '桃園台啤永豐雲豹': ['曹薰襄', '呂濟而', '劉元凱', '高錦瑋', '徐宏瑋', '汪哲宇', '丁冠皓', '莊博元', '林信寬', '王皓吉', '黃鎮', '董永全'],
        '福爾摩沙台新夢想家': ['盧冠良', '蔣淯安', '周柏臣', '陳振傑', '馬建豪', '張宗憲', '吳家駿', '林俊吉', '簡偉儒', '忻沃克', '李德威', '史承平'],
        '新北國王': ['林書緯', '蘇培凱', '鍾理翔', '李愷諺', '簡祐哲', '王柏智', '林彥廷', '呂政儒', '蘇士軒', '林金榜', '熊祥泰', '喬納森'],
        '新竹御嵿攻城獅': ['梁瀚', '盧冠軒', '李啓瑋', '徐小龍', '高國豪', '曾柏喻', '朱雲豪', '田浩', '劉丞勳', '蕭順議', '李家瑞', '蔡宸綱'],
        '新北中信特攻': ['黃泓瀚', '簡廷兆', '曾文鼎', '陳懷安', '阿巴西', '李睿麒', '林安龍', '余維豪', '魏嘉豪', '謝亞軒', '林任鴻', '曾信武'],
        '臺北台新戰神': ['錢肯尼', '張耕淯', '雷蒙恩', '蘇奕晉', '陳冠全', '丁聖儒', '魏芃禾', '江均', '劉彥廷', '陳文宏', '張兆辰', '黃聰翰'],
        '高雄全家海神': ['余純安', '廖偉皓', '吳曉謹', '陳懷安', '勤明慶', '魏莨哲', '于煥亞', '邱子軒', '唐維傑', '胡瓏貿', '施晉堯', '呂威霆']
      };

      let toastTimer = null;
      let currentPage = 'home';

      function safeHtml(value) {
        return String(value ?? '').replace(/[&<>"]|'/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function todayText() {
        return new Date().toLocaleDateString('zh-TW');
      }

      function buildTeamRoster(teamName) {
        return (PLAYER_NAMES[teamName] || []).map((name, index) => ({
          id: `${teamName}-${index}-${Math.random().toString(36).slice(2, 8)}`,
          name,
          team: teamName,
          pos: POSITIONS[(index + teamName.length) % POSITIONS.length],
          age: 20 + ((index * 3 + teamName.length) % 11),
          rating: 68 + ((index * 7 + teamName.length) % 20),
          potential: 75 + ((index * 5 + teamName.length) % 18),
          salary: 4 + ((index * 3 + teamName.length) % 10),
          starter: false,
          stats: { games: 0, points: 0 }
        }));
      }

      function freshState() {
        const rosters = {};
        TEAM_NAMES.forEach((team) => {
          rosters[team] = buildTeamRoster(team);
        });

        const team = '臺北台新戰神';
        rosters[team].slice(0, 5).forEach((player) => player.starter = true);

        return {
          team,
          manager: '總經理',
          season: 1,
          wins: 0,
          losses: 0,
          games: 0,
          budget: 30,
          standings: Object.fromEntries(TEAM_NAMES.map((teamName) => [teamName, { wins: 0, losses: 0, games: 0 }])),
          rosters,
          history: [{ text: '球隊成立，王朝之路正式開始。', date: todayText() }],
          awards: [],
          postseason: null,
          draft: null
        };
      }

      function normalizeState(raw) {
        const base = freshState();
        if (!raw) return base;

        const next = {
          ...base,
          ...raw,
          standings: { ...base.standings, ...(raw.standings || {}) },
          rosters: {}
        };

        TEAM_NAMES.forEach((team) => {
          const source = Array.isArray(raw?.rosters?.[team]) ? raw.rosters[team] : buildTeamRoster(team);
          next.rosters[team] = source.map((player, index) => ({
            id: player.id || `${team}-${index}-${Math.random().toString(36).slice(2, 8)}`,
            name: player.name || (PLAYER_NAMES[team] || [])[index] || `球員${index + 1}`,
            team,
            pos: player.pos || POSITIONS[(index + team.length) % POSITIONS.length],
            age: Number(player.age) || 20 + ((index * 3 + team.length) % 11),
            rating: Number(player.rating) || 70,
            potential: Number(player.potential) || 80,
            salary: Number(player.salary) || 5,
            starter: !!player.starter,
            stats: {
              games: Number(player.stats?.games) || 0,
              points: Number(player.stats?.points) || 0
            }
          }));
        });

        next.team = TEAM_NAMES.includes(raw.team) ? raw.team : base.team;
        next.manager = raw.manager || '總經理';
        next.season = clamp(Number(raw.season) || 1, 1, 20);
        next.wins = Number(raw.wins) || 0;
        next.losses = Number(raw.losses) || 0;
        next.games = Number(raw.games) || 0;
        next.budget = Number(raw.budget) || 30;
        next.history = Array.isArray(raw.history) && raw.history.length ? raw.history : base.history;
        next.awards = Array.isArray(raw.awards) ? raw.awards : [];
        next.postseason = raw.postseason || null;
        next.draft = raw.draft || null;
        return next;
      }

      const state = loadState();

      function loadState() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          return normalizeState(raw);
        } catch (error) {
          return freshState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          toast('儲存失敗，請確認瀏覽器空間。');
          return false;
        }
      }

      function toast(message) {
        const existing = document.getElementById('toast');
        if (existing) existing.remove();
        const node = document.createElement('div');
        node.id = 'toast';
        node.className = 'toast';
        node.textContent = message;
        document.body.appendChild(node);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.remove(), 2200);
      }

      function getRoster(team = state.team) {
        return state.rosters[team] || [];
      }

      function getStarters(team = state.team) {
        return getRoster(team).filter((player) => player.starter);
      }

      function overall(players = getStarters()) {
        if (!players.length) return 0;
        return Math.round(players.reduce((sum, player) => sum + Number(player.rating || 0), 0) / players.length);
      }

      function buildStandings() {
        const entries = TEAM_NAMES.map((team) => {
          const record = state.standings?.[team] || { wins: 0, losses: 0, games: 0 };
          return {
            team,
            wins: Number(record.wins) || 0,
            losses: Number(record.losses) || 0,
            games: Number(record.games) || 0
          };
        }).sort((a, b) => b.wins - a.wins || a.losses - b.losses || TEAM_NAMES.indexOf(a.team) - TEAM_NAMES.indexOf(b.team));
        return entries;
      }

      function rankOf(team) {
        const index = buildStandings().findIndex((entry) => entry.team === team);
        return index >= 0 ? index + 1 : 0;
      }

      function logEvent(text) {
        state.history.unshift({ text, date: todayText() });
        if (state.history.length > 60) state.history.length = 60;
      }

      function renderStatsBar() {
        const statDiv = document.getElementById('stats');
        const teamNameEl = document.getElementById('teamName');
        const teamMetaEl = document.getElementById('teamMeta');
        const budgetBox = document.getElementById('budgetBox');

        teamNameEl.textContent = state.team;
        teamMetaEl.textContent = `總經理 ${state.manager} • 第 ${state.season} / 20 季`;
        budgetBox.textContent = `預算 ${state.budget.toFixed(1)}M`;

        const myRank = rankOf(state.team);
        statDiv.innerHTML = `
          <div class="stat"><small>先發戰力</small><strong>${overall()} OVR</strong></div>
          <div class="stat"><small>本季戰績</small><strong>${state.wins}-${state.losses}</strong></div>
          <div class="stat"><small>聯盟排名</small><strong>第 ${myRank} 名</strong></div>
          <div class="stat"><small>球員人數</small><strong>${getRoster().length}/15</strong></div>
        `;
      }

      function renderHome() {
        const starters = getStarters();
        const standings = buildStandings();
        const topFive = standings.slice(0, 5);

        return `
          <div class="card">
            <div class="card-head">
              <h3>例行賽</h3>
              <span class="muted">${state.games}/40 場</span>
            </div>
            <div class="notice">
              先發 5 人固定出賽，進行 40 場例行賽。整體戰力與球隊防守能量將決定你能否在季後賽衝擊冠軍。
            </div>
            <div class="row">
              <button type="button" class="btn gold" data-action="play-game" ${starters.length !== 5 || state.games >= 40 ? 'disabled' : ''}>🏀 進行下一場</button>
              <button type="button" class="btn blue" data-page="standings">查看排名</button>
              <button type="button" class="btn red" data-action="restart">重新開始</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>先發陣容</h3>
              <span class="gold">${overall()} OVR</span>
            </div>
            <div class="podium">
              ${POSITIONS.map((pos, idx) => {
                const player = starters[idx];
                return `
                  <div class="slot">
                    <strong>${pos}</strong>
                    <small>${player ? player.name : '待安排'}</small>
                    ${player ? `<small>${player.rating} OVR</small>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>聯盟戰績</h3>
            </div>
            <div class="list">
              ${topFive.map((row, index) => `
                <div class="entry">
                  <div>
                    <strong>${index + 1}. ${safeHtml(row.team)}</strong>
                    ${row.team === state.team ? '<span class="badge">我的球隊</span>' : ''}
                  </div>
                  <strong>${row.wins}-${row.losses}</strong>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderRoster() {
        const roster = getRoster();
        return `
          <div class="card">
            <div class="card-head">
              <h3>${safeHtml(state.team)} 球員名單</h3>
              <span class="muted">${roster.length}/15</span>
            </div>
            <div class="list">
              ${roster.map((player) => `
                <div class="entry">
                  <div class="player-main">
                    <div class="ovr">${player.rating}</div>
                    <div>
                      <strong>${safeHtml(player.name)}</strong>
                      <span class="small-note">${safeHtml(player.pos)} • ${player.age}歲 • ${player.starter ? '先發' : '替補'}</span>
                    </div>
                  </div>
                  <div class="row">
                    <button type="button" class="btn small ${player.starter ? 'gold' : ''}" data-action="toggle-starter" data-player-id="${player.id}" ${getStarters().length >= 5 && !player.starter ? 'disabled' : ''}>
                      ${player.starter ? '改為替補' : '設為先發'}
                    </button>
                    <button type="button" class="btn small red" data-action="release-player" data-player-id="${player.id}" ${roster.length <= 5 ? 'disabled' : ''}>釋出</button>
                  </div>
                </div>
              `).join('') || '<div class="empty">目前沒有球員資料</div>'}
            </div>
          </div>
        `;
      }

      function renderStandings() {
        const standings = buildStandings();
        return `
          <div class="card">
            <div class="card-head">
              <h3>聯盟排名</h3>
              <span class="muted">例行賽 40 場</span>
            </div>
            <div class="list">
              ${standings.map((entry, index) => `
                <div class="entry">
                  <div>
                    <strong>${index + 1}. ${safeHtml(entry.team)}</strong>
                    ${entry.team === state.team ? '<span class="badge">我的球隊</span>' : ''}
                    ${index < 3 ? '<span class="badge">季後賽</span>' : ''}
                  </div>
                  <strong>${entry.wins}-${entry.losses}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>季後賽</h3>
              <button type="button" class="btn small gold" data-action="start-playoffs" ${state.games < 40 ? 'disabled' : ''}>開始季後賽</button>
            </div>
            ${state.postseason ? renderPlayoffBlock() : '<div class="empty">例行賽尚未結束，季後賽入口將在 40 場後開放。</div>'}
          </div>
        `;
      }

      function renderPlayoffBlock() {
        if (!state.postseason || !state.postseason.challenge) {
          return '<div class="empty">目前沒有季後賽資訊</div>';
        }

        const challenge = state.postseason.challenge;
        return `
          <div class="list">
            <div class="entry">
              <div><strong>挑戰賽</strong><span class="small-note">${safeHtml(challenge.a)} vs ${safeHtml(challenge.b)}</span></div>
              <strong>${challenge.aw}-${challenge.bw}</strong>
            </div>
            <div class="entry">
              <div><strong>準決賽</strong><span class="small-note">${safeHtml(state.postseason.semis?.[0]?.a || '待定')} vs ${safeHtml(state.postseason.semis?.[0]?.b || '待定')}</span></div>
              <strong>${state.postseason.semis?.[0]?.aw ?? 0}-${state.postseason.semis?.[0]?.bw ?? 0}</strong>
            </div>
            <div class="entry">
              <div><strong>總冠軍賽</strong><span class="small-note">${safeHtml(state.postseason.final?.a || '待定')} vs ${safeHtml(state.postseason.final?.b || '待定')}</span></div>
              <strong>${state.postseason.final?.aw ?? 0}-${state.postseason.final?.bw ?? 0}</strong>
            </div>
          </div>
        `;
      }

      function renderAwards() {
        return `
          <div class="card">
            <div class="card-head"><h3>年度獎項</h3></div>
            ${state.awards.length ? state.awards.map((award) => `
              <div class="notice">
                <strong>第 ${award.season} 季</strong><br />
                冠軍：${safeHtml(award.champion)}<br />
                MVP：${safeHtml(award.mvp.name)} • ${award.mvp.ppg ?? '0.0'} PPG<br />
                最佳防守：${safeHtml(award.dopy.name)}<br />
                最佳新秀：${safeHtml(award.roy.name)}
              </div>
            `).join('') : '<div class="empty">目前還沒有獎項資料。</div>'}
          </div>
        `;
      }

      function renderHistory() {
        return `
          <div class="card">
            <div class="card-head"><h3>球隊紀錄</h3></div>
            <div class="list">
              ${state.history.map((item) => `
                <div class="entry">
                  <div>
                    <strong>${safeHtml(item.text)}</strong>
                  </div>
                  <span class="muted">${safeHtml(item.date)}</span>
                </div>
              `).join('') || '<div class="empty">沒有紀錄</div>'}
            </div>
          </div>
        `;
      }

      function renderMarket() {
        const pool = TEAM_NAMES.filter((team) => team !== state.team)
          .flatMap((team) => getRoster(team).map((player) => ({ ...player, sourceTeam: team })))
          .slice(0, 18);

        return `
          <div class="card">
            <div class="card-head">
              <h3>球員市場</h3>
              <span class="muted">補強戰力</span>
            </div>
            <div class="list">
              ${pool.map((player) => `
                <div class="entry">
                  <div class="player-main">
                    <div class="ovr">${player.rating}</div>
                    <div>
                      <strong>${safeHtml(player.name)}</strong>
                      <span class="small-note">${safeHtml(player.sourceTeam)} • ${safeHtml(player.pos)} • ${player.age}歲 • 薪資 ${player.salary}M</span>
                    </div>
                  </div>
                  <button type="button" class="btn small gold" data-action="sign-player" data-player-id="${player.id}" ${getRoster().length >= 15 || state.budget < player.salary ? 'disabled' : ''}>
                    ${state.budget < player.salary ? '預算不足' : getRoster().length >= 15 ? '名額已滿' : '簽約'}
                  </button>
                </div>
              `).join('') || '<div class="empty">目前沒有可簽約球員。</div>'}
            </div>
          </div>
        `;
      }

      function renderDraft() {
        if (!state.draft) {
          return `
            <div class="card">
              <div class="card-head">
                <h3>選秀</h3>
              </div>
              <div class="notice">例行賽完成 40 場後，選秀階段會依順位產生新秀池。你可以從中選擇年輕潛力球員補強陣容。</div>
              <button type="button" class="btn gold" data-action="start-draft" ${state.games < 40 ? 'disabled' : ''}>開始選秀</button>
            </div>
          `;
        }

        const draft = state.draft;
        const currentTeam = draft.order[draft.pick] || state.team;

        return `
          <div class="card">
            <div class="card-head">
              <h3>選秀階段</h3>
            </div>
            <div class="notice">目前輪到：${safeHtml(currentTeam)}；你的順位：${draft.order.indexOf(state.team) + 1}</div>
            <div class="list">
              ${draft.pool.map((player) => `
                <div class="entry">
                  <div class="player-main">
                    <div class="ovr">${player.rating}</div>
                    <div>
                      <strong>${safeHtml(player.name)}</strong>
                      <span class="small-note">${safeHtml(player.pos)} • ${player.age}歲 • 潛力 ${player.potential}</span>
                    </div>
                  </div>
                  <button type="button" class="btn small gold" data-action="pick-player" data-player-id="${player.id}" ${currentTeam !== state.team || getRoster().length >= 15 ? 'disabled' : ''}>選擇</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function render() {
        renderStatsBar();
        const pageRenderer = {
          home: renderHome,
          roster: renderRoster,
          standings: renderStandings,
          awards: renderAwards,
          history: renderHistory,
          market: renderMarket,
          draft: renderDraft
        };

        document.getElementById('view').innerHTML = (pageRenderer[currentPage] || renderHome)();
        document.querySelectorAll('.nav button').forEach((button) => {
          button.classList.toggle('active', button.dataset.page === currentPage);
        });
      }

      function playGame() {
        const starters = getStarters();
        if (starters.length !== 5) {
          toast('請先安排 5 位先發。');
          return;
        }
        if (state.games >= 40) {
          toast('例行賽已結束，請先進入季後賽。');
          return;
        }

        const opponentTeam = TEAM_NAMES.filter((team) => team !== state.team)[Math.floor(Math.random() * 6)];
        const oppStarters = getStarters(opponentTeam);
        const myOVR = overall(starters);
        const oppOVR = overall(oppStarters.length ? oppStarters : getRoster(opponentTeam));

        let myScore = 72 + Math.random() * 26 + (myOVR - 70) * 0.72;
        let oppScore = 72 + Math.random() * 24 + (oppOVR - 70) * 0.68;
        myScore = Math.round(myScore);
        oppScore = Math.round(oppScore);

        const win = myScore >= oppScore;
        state.games += 1;
        state.standings[state.team] = { wins: state.wins, losses: state.losses, games: state.games };

        const oppRecord = state.standings[opponentTeam] || { wins: 0, losses: 0, games: 0 };
        oppRecord.games = Number(oppRecord.games) + 1;
        if (win) {
          state.wins += 1; 
          oppRecord.losses = Number(oppRecord.losses) + 1;
        } else {
          state.losses += 1;
          oppRecord.wins = Number(oppRecord.wins) + 1;
        }
        state.standings[opponentTeam] = oppRecord;
        state.standings[state.team] = { wins: state.wins, losses: state.losses, games: state.games };

        logEvent(`${state.team} ${myScore}-${oppScore} ${opponentTeam}，${win ? '拿下勝利' : '落敗'}。`);

        starters.forEach((player) => {
          player.stats.games += 1;
          player.stats.points += Math.max(10, Math.round((myScore / 5) * (0.8 + Math.random() * 0.7)));
        });

        if (state.games >= 40) {
          logEvent(`例行賽結束，${state.team} 戰績 ${state.wins}-${state.losses}。`);
        }

        saveState();
        render();
        toast(win ? `勝利 ${myScore}-${oppScore}` : `落敗 ${myScore}-${oppScore}`);
      }

      function startPlayoffs() {
        if (state.games < 40) {
          toast('請先完成 40 場例行賽。');
          return;
        }

        const standings = buildStandings();
        const order = standings.map((entry) => entry.team);
        state.postseason = {
          challenge: { a: order[3], b: order[4], aw: 0, bw: 0 },
          semis: [
            { a: order[0], b: order[3], aw: 0, bw: 0 },
            { a: order[1], b: order[2], aw: 0, bw: 0 }
          ],
          final: { a: '', b: '', aw: 0, bw: 0 }
        };
        logEvent('季後賽正式開始。');
        saveState();
        render();
      }

      function startDraft() {
        if (state.games < 40) {
          toast('請先完成 40 場例行賽。');
          return;
        }

        const order = [...buildStandings()].reverse().map((entry) => entry.team);
        state.draft = {
          order,
          pick: 0,
          pool: [
            { id: 'pick-1', name: '陳冠宇', pos: 'SG', age: 19, rating: 77, potential: 92 },
            { id: 'pick-2', name: '王子維', pos: 'PG', age: 18, rating: 74, potential: 90 },
            { id: 'pick-3', name: '林冠廷', pos: 'PF', age: 20, rating: 76, potential: 89 },
            { id: 'pick-4', name: '張家豪', pos: 'C', age: 19, rating: 75, potential: 88 },
            { id: 'pick-5', name: '周昱翔', pos: 'SF', age: 20, rating: 79, potential: 91 },
            { id: 'pick-6', name: '吳柏廷', pos: 'PG', age: 19, rating: 73, potential: 87 }
          ]
        };
        saveState();
        render();
      }

      function pickDraftPlayer(playerId) {
        if (!state.draft) return;
        const draft = state.draft;
        if (draft.order[draft.pick] !== state.team) {
          toast('這輪不是你的選秀順序。');
          return;
        }

        const player = draft.pool.find((item) => item.id === playerId);
        if (!player) return;

        const roster = getRoster();
        if (roster.length >= 15) {
          toast('名單已滿，請先釋出球員。');
          return;
        }

        roster.push({
          id: `draft-${Date.now()}`,
          name: player.name,
          team: state.team,
          pos: player.pos,
          age: player.age,
          rating: player.rating,
          potential: player.potential,
          salary: 4,
          starter: false,
          stats: { games: 0, points: 0 }
        });

        draft.pool = draft.pool.filter((item) => item.id !== playerId);
        draft.pick += 1;
        logEvent(`${state.team} 選進 ${player.name}。`);

        if (draft.pick >= draft.order.length) {
          state.draft = null;
          state.season += 1;
          state.games = 0;
          state.wins = 0;
          state.losses = 0;
          state.standings = Object.fromEntries(TEAM_NAMES.map((teamName) => [teamName, { wins: 0, losses: 0, games: 0 }]));
          state.postseason = null;
          logEvent(`第 ${state.season} 季開始。`);
        }

        saveState();
        render();
      }

      function toggleStarter(playerId) {
        const roster = getRoster();
        const player = roster.find((item) => item.id === playerId);
        if (!player) return;

        const starters = getStarters();
        if (player.starter) {
          player.starter = false;
        } else {
          if (starters.length >= 5) {
            toast('先發人數已滿 5 位。');
            return;
          }
          player.starter = true;
        }
        saveState();
        render();
      }

      function releasePlayer(playerId) {
        const roster = getRoster();
        const index = roster.findIndex((player) => player.id === playerId);
        if (index < 0) return;
        if (roster.length <= 5) {
          toast('至少保留 5 位球員。');
          return;
        }

        const [removed] = roster.splice(index, 1);
        state.budget += Number(removed.salary || 0) * 0.5;
        logEvent(`${removed.name} 被釋出。`);
        saveState();
        render();
      }

      function signPlayer(playerId) {
        const teamPool = TEAM_NAMES.filter((team) => team !== state.team).flatMap((team) => getRoster(team).map((player) => ({ ...player, sourceTeam: team })));
        const target = teamPool.find((player) => player.id === playerId);
        if (!target) return;

        if (getRoster().length >= 15) {
          toast('名單已滿。');
          return;
        }
        if (state.budget < target.salary) {
          toast('預算不足，無法簽約。');
          return;
        }

        const sourceTeam = target.sourceTeam;
        const sourceRoster = getRoster(sourceTeam);
        const sourceIndex = sourceRoster.findIndex((player) => player.id === target.id);
        if (sourceIndex >= 0) sourceRoster.splice(sourceIndex, 1);

        const signed = { ...target, team: state.team, sourceTeam: undefined, starter: false };
        getRoster().push(signed);
        state.budget -= target.salary;
        logEvent(`${signed.name} 從 ${sourceTeam} 轉投 ${state.team}。`);
        saveState();
        render();
      }

      function showSettings() {
        const modalBg = document.createElement('div');
        modalBg.className = 'modal-bg';
        modalBg.innerHTML = `
          <div class="modal">
            <h3>球隊設定</h3>
            <label>選擇球隊</label>
            <select id="teamSelect">
              ${TEAM_NAMES.map((team) => `<option value="${team}" ${team === state.team ? 'selected' : ''}>${safeHtml(team)}</option>`).join('')}
            </select>
            <label>總經理名稱</label>
            <input id="managerInput" value="${safeHtml(state.manager)}" />
            <div class="modal-actions">
              <button type="button" class="btn small" data-close-modal="1">取消</button>
              <button type="button" class="btn gold small" data-save-settings="1">儲存</button>
            </div>
          </div>
        `;
        document.body.appendChild(modalBg);
      }

      function saveSettings() {
        const select = document.getElementById('teamSelect');
        const input = document.getElementById('managerInput');
        if (!select || !input) return;

        const nextTeam = TEAM_NAMES.includes(select.value) ? select.value : state.team;
        state.team = nextTeam;
        state.manager = input.value.trim() || '總經理';
        if (!state.rosters[state.team]) state.rosters[state.team] = buildTeamRoster(state.team);

        document.querySelector('.modal-bg')?.remove();
        saveState();
        render();
      }

      function restartGame() {
        const ok = confirm('確定要重新開始新王朝？');
        if (!ok) return;

        Object.keys(state).forEach((key) => delete state[key]);
        Object.assign(state, freshState());
        saveState();
        render();
        toast('新王朝開始！');
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.dataset.page) {
          currentPage = button.dataset.page;
          render();
          return;
        }

        if (button.id === 'settingsBtn') {
          showSettings();
          return;
        }

        if (button.dataset.closeModal) {
          document.querySelector('.modal-bg')?.remove();
          return;
        }

        if (button.dataset.saveSettings) {
          saveSettings();
          return;
        }

        const action = button.dataset.action;
        switch (action) {
          case 'play-game':
            playGame();
            break;
          case 'restart':
            restartGame();
            break;
          case 'start-playoffs':
            startPlayoffs();
            break;
          case 'start-draft':
            startDraft();
            break;
          case 'toggle-starter':
            toggleStarter(button.dataset.playerId);
            break;
          case 'release-player':
            releasePlayer(button.dataset.playerId);
            break;
          case 'sign-player':
            signPlayer(button.dataset.playerId);
            break;
          case 'pick-player':
            pickDraftPlayer(button.dataset.playerId);
            break;
          default:
            break;
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          document.querySelector('.modal-bg')?.remove();
        }
      });

      render();
      saveState();
    })();
  </script>
</body>
</html>
