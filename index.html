<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--green:#73d6a0;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:1050px;margin:auto;padding:20px}header,.row,.entry,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}header{flex-wrap:wrap}.muted,small{color:var(--muted)}h1{margin:0}h2,h3{margin:.25em 0}.budget,.badge{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--gold)}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:16px 0}.nav button{background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;white-space:nowrap}.nav button.active{color:var(--gold);border-bottom:2px solid var(--gold)}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#26374a;color:var(--text);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:var(--gold);color:#201b11;border-color:var(--gold);font-weight:700}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{padding:10px 0;border-bottom:1px solid #ffffff18}.entry:last-child{border:0}.form{display:grid;gap:8px;margin:12px 0}.form label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:10px;background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:5}.footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}.empty{padding:16px;color:var(--muted)}@media(max-width:700px){.app{padding:12px}.columns{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><header><div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div id="budget" class="budget"></div></header><section class="hero"><div class="row"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="new">新賽季</button></div></div></section><nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="market">自由球員簽約</button><button data-page="standings">聯盟排名</button></nav><main id="view"></main><div class="footer">每隊例行賽 36 場｜聯盟共 126 場｜本土薪資上限 200M｜進度自動儲存</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=200,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],NAMES=['高錦瑋','林信寬','陳子豪','王皓吉','周柏臣','林冠宇','陳子威','吳承翰','張家維','劉元凱','李明哲','黃建宏'],POS=['PG','SG','SF','PF','C'];let page='home',state;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makePlayer(name,team,i){return{id:`${team}-${i}-${Math.random().toString(36).slice(2,7)}`,name,team,pos:POS[i%5],age:22+i%9,rating:68+(i*7)%18,salary:7+i%8,isForeign:false,starter:false,injury:0,stats:{gp:0,pts:0}}}
function schedule(){const a=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)a.push({a:TEAMS[i],b:TEAMS[j]});for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.map((g,i)=>({...g,id:i+1}))}
function fresh(){const rosters={};TEAMS.forEach((t,ti)=>{rosters[t]=Array.from({length:12},(_,i)=>makePlayer(NAMES[(i+ti)%NAMES.length],t,i));rosters[t].slice(0,5).forEach(p=>p.starter=true)});return{team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,rosters,standings:Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}])),schedule:schedule(),freeAgents:[],history:[]}}
function normalize(raw){if(!raw?.rosters)return fresh();const s={...fresh(),...raw};s.rosters=s.rosters||{};TEAMS.forEach((t,ti)=>{let r=Array.isArray(s.rosters[t])?s.rosters[t]:[];s.rosters[t]=r.map((p,i)=>({...makePlayer(p.name||NAMES[i%NAMES.length],t,i),...p,team:t,id:p.id||`${t}-${i}`,isForeign:!!(p.isForeign||p.foreign),salary:Math.max(0,Number(p.salary)||0),stats:{gp:0,pts:0,...p.stats}}));let n=0;s.rosters[t].forEach(p=>{p.starter=!!p.starter&&n++<5});if(!s.rosters[t].some(p=>p.starter))s.rosters[t].slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)});s.standings={...Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}])),...(s.standings||{})};TEAMS.forEach(t=>s.standings[t]={w:Number(s.standings[t]?.w)||0,l:Number(s.standings[t]?.l)||0,g:(Number(s.standings[t]?.w)||0)+(Number(s.standings[t]?.l)||0)});s.schedule=Array.isArray(s.schedule)&&s.schedule.length===LEAGUE_GAMES?s.schedule:schedule();s.gameIndex=Math.max(0,Math.min(LEAGUE_GAMES,Number(s.gameIndex)||0));s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:[];return s}
try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function notify(m){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=m;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.remove(),2400)}function roster(t=state.team){return state.rosters[t]||[]}function payroll(t=state.team){return roster(t).filter(p=>!p.isForeign).reduce((n,p)=>n+(Number(p.salary)||0),0)}function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l)}
function render(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').textContent=`本土薪資 ${payroll()} / ${CAP}M${payroll()>CAP?'（超額）':''}`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='roster'?rosterPage():page==='market'?marketPage():page==='standings'?standingsPage():homePage()}
function homePage(){const n=state.standings[state.team].g;return `<div class="columns"><section class="card"><h3>例行賽進度</h3><p>${n}/${GAMES} 場；全聯盟 ${state.gameIndex}/${LEAGUE_GAMES} 場</p><p class="muted">七隊各與其他六隊交手六次，總計每隊 36 場、全聯盟 126 場。</p><button class="gold" data-action="play" ${n>=GAMES?'disabled':''}>模擬下一場</button></section><section class="card"><h3>目前戰績</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} <small>${x.g}/${GAMES}</small></b></div>`).join('')}</section></div><section class="card"><h3>先發陣容</h3>${roster().filter(p=>p.starter).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating} OVR</b></div>`).join('')||'<p class="empty">尚未設定先發</p>'}</section>`}
function rosterPage(){return `<section class="card"><h3>球員名單 · ${roster().length}/16</h3><p class="muted">最多五位先發。按鈕可在先發與替補間切換；本土薪資上限 200M。</p>${roster().map(p=>`<div class="entry"><span><b>${esc(p.name)}</b> ${p.starter?'<span class="badge">先發</span>':'<span class="muted">替補</span>'}<small class="muted"><br>${esc(p.pos)} · ${p.age} 歲 · ${p.isForeign?'洋將':`本土 ${p.salary}M`}</small></span><button data-action="toggle" data-id="${esc(p.id)}">設為${p.starter?'替補':'先發'}</button></div>`).join('')}</section>`}
function marketPage(){const fas=state.freeAgents;return `<section class="card"><h3>自由球員簽約</h3><p class="muted">簽下本土球員加入目前球隊。名單最多 16 人、本土薪資總額不得超過 200M。</p><div class="form"><label>球員姓名</label><input id="faName" maxlength="30" placeholder="輸入球員姓名"><label>年薪（M）</label><input id="faSalary" type="number" min="1" max="200" value="8"><button class="gold" data-action="sign">簽約</button></div><h3>自由球員</h3>${fas.length?fas.map(p=>`<div class="entry"><span><b>${esc(p.name)}</b><small class="muted"><br>${esc(p.pos||'SF')} · ${p.rating||70} OVR · ${p.salary}M</small></span><button data-action="sign-existing" data-id="${esc(p.id)}">簽下</button></div>`).join(''):'<p class="empty">目前沒有待簽球員；可使用上方表單建立簽約。</p>'}<div class="entry"><span>目前本土薪資</span><b>${payroll()} / ${CAP}M</b></div></section>`}
function standingsPage(){return `<section class="card"><h3>例行賽排名</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w} 勝 ${x.l} 敗 · ${x.g}/${GAMES} 場</b></div>`).join('')}</section>`}
function playFixture(f){const a=state.standings[f.a],b=state.standings[f.b];if(!a||!b||a.g>=GAMES||b.g>=GAMES)return;const ra=roster(f.a).filter(p=>p.starter).reduce((n,p)=>n+p.rating,0)/Math.max(1,roster(f.a).filter(p=>p.starter).length),rb=roster(f.b).filter(p=>p.starter).reduce((n,p)=>n+p.rating,0)/Math.max(1,roster(f.b).filter(p=>p.starter).length);let sa=Math.round(80+Math.random()*22+(ra-72)*.55),sb=Math.round(80+Math.random()*22+(rb-72)*.55);if(sa===sb)sa++;a.g++;b.g++;if(sa>sb){a.w++;b.l++}else{b.w++;a.l++}for(const [team,score] of [[f.a,sa],[f.b,sb]])roster(team).filter(p=>p.starter).forEach(p=>{p.stats.gp++;p.stats.pts+=(score/5)|0})}
function completeSchedule(){while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];playFixture(f)}TEAMS.forEach(t=>{const r=state.standings[t];if(r.g!==GAMES)repairRemaining(t)});state.gameIndex=state.schedule.length;}
function repairRemaining(team){let needed=GAMES-state.standings[team].g;while(needed>0){const other=TEAMS.find(t=>t!==team&&state.standings[t].g<GAMES);if(!other)break;playFixture({a:team,b:other});needed=GAMES-state.standings[team].g}}
function nextGame(){if(state.standings[state.team].g>=GAMES)return notify('你的例行賽已完成。');let played=false;while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];if(state.standings[f.a]?.g>=GAMES||state.standings[f.b]?.g>=GAMES)continue;playFixture(f);if(f.a===state.team||f.b===state.team){played=true;break}}if(state.standings[state.team].g>=GAMES){completeSchedule();notify('例行賽完成：七隊各 36 場，共 126 場。')}else if(!played){completeSchedule();notify('已完成聯盟例行賽。')}save();render()}
function setStarter(id){const p=roster().find(x=>String(x.id)===id);if(!p)return;if(p.starter){p.starter=false}else{if(roster().filter(x=>x.starter).length>=5)return notify('先發最多五人，請先將一位先發改為替補。');p.starter=true}save();render()}
function sign(name,salary,player=null){name=String(name||'').trim();salary=Number(salary);if(!name||!Number.isFinite(salary)||salary<=0)return notify('請輸入球員姓名及有效年薪。');if(roster().length>=16)return notify('名單已滿（16 人），無法簽約。');if(payroll()+salary>CAP)return notify(`簽約後本土薪資將超過 ${CAP}M 上限。`);const p=player?{...player}:makePlayer(name,state.team,roster().length);p.id=`fa-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;p.name=name;p.team=state.team;p.salary=salary;p.isForeign=false;p.starter=false;p.injury=0;p.stats=p.stats||{gp:0,pts:0};roster().push(p);if(player)state.freeAgents=state.freeAgents.filter(x=>x.id!==player.id);save();render();notify(`已簽下 ${name}。`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}switch(b.dataset.action){case'play':nextGame();break;case'toggle':setStarter(b.dataset.id);break;case'sign':sign($('#faName').value,$('#faSalary').value);break;case'sign-existing':{const p=state.freeAgents.find(x=>String(x.id)===b.dataset.id);if(p)sign(p.name,p.salary,p);break}case'team':{const t=prompt(`輸入球隊名稱：\n${TEAMS.join('\n')}`,state.team);if(TEAMS.includes(t)){state.team=t;save();render()}break}case'new':if(confirm('開始新賽季？目前戰績與賽程將重置，球員及薪資保留。')){state.season++;state.gameIndex=0;state.standings=Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}]));state.schedule=schedule();roster().forEach(p=>p.stats={gp:0,pts:0});save();render()}break}});
render();save();
})();
</script></body></html>
