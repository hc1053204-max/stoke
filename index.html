<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09131d"><meta name="description" content="TPBL 籃球經理模擬器：管理球隊、簽約交易、推進賽季並爭奪冠軍。"><title>FRONT OFFICE｜TPBL 經理模擬器</title>
<style>
:root{color-scheme:dark;--bg:#08121b;--panel:#111f2c;--panel2:#172838;--line:#294054;--text:#edf4fa;--muted:#9aafc1;--gold:#edc36e;--green:#73d6a0;--red:#ff8888;--blue:#8ebeff;font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 70% -20%,#263c4b 0,transparent 45%),linear-gradient(160deg,#09131d,#071019 68%)}button,select,input{font:inherit}button{color:var(--text);background:linear-gradient(180deg,#20364a,#142534);border:1px solid #38536a;border-radius:10px;padding:.68rem .9rem;cursor:pointer;transition:transform .18s,border-color .18s,filter .18s}button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);filter:brightness(1.12)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #edc36e;outline-offset:2px}.app{max-width:1260px;padding:20px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0 18px;border-bottom:1px solid var(--line)}.brand h1{font-size:clamp(1.25rem,3vw,2rem);letter-spacing:.04em;margin:0}.brand small,.muted{color:var(--muted)}.top-actions,.actions,.tabs,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero{position:relative;overflow:hidden;margin:18px 0;padding:24px;border:1px solid #3d5263;border-radius:20px;background:linear-gradient(115deg,rgba(24,44,58,.97),rgba(12,25,36,.94));box-shadow:0 20px 55px #0005}.hero:after{content:'🏀';position:absolute;right:5%;top:-20px;font-size:clamp(90px,18vw,180px);opacity:.07;transform:rotate(-18deg);pointer-events:none}.hero-content{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.hero h2{margin:0 0 6px;font-size:clamp(1.4rem,4vw,2.4rem)}.hero p{margin:0}.hero .actions{max-width:470px}.tabs{margin:16px 0}.tabs button{flex:1 1 125px}.tabs button.active{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,#3b3527,#202a31);box-shadow:0 0 0 1px #edc36e33}.page{animation:pageIn .35s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{grid-column:span 12;background:linear-gradient(145deg,rgba(20,36,50,.96),rgba(14,26,37,.96));border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 12px 30px #0003;animation:cardIn .4s ease both}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.card h3{margin:0 0 14px;font-size:1.04rem}.card h3 small{font-weight:400;color:var(--muted)}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:13px;border:1px solid #304658;border-radius:12px;background:#0b1823;min-width:0}.metric small{display:block;color:var(--muted);font-size:.77rem}.metric strong{display:block;margin-top:5px;font-size:1.45rem;font-variant-numeric:tabular-nums}.progress{height:8px;border-radius:20px;background:#263a49;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#56c78d,#edc36e);transition:width .6s ease}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #293e50;white-space:nowrap}th{font-size:.78rem;color:var(--muted);font-weight:600}tbody tr{transition:background .16s}tbody tr:hover{background:#ffffff08}.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #293e50}.entry:last-child{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;background:#23384a;color:#c5d5e0;font-size:.75rem}.pill.good{background:#153a2b;color:#8ce3ae}.pill.warn{background:#423322;color:#f5ce85}.pill.bad{background:#442629;color:#ffaaaa}.gold{color:var(--gold)}.positive{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted)}.notice{padding:11px 13px;border:1px solid #846d3c;background:#edc36e12;border-radius:11px;color:#e8d5a9}.actions button.primary{background:linear-gradient(180deg,#b98436,#815923);border-color:#e9bf6b;color:#fff}.actions button.danger{border-color:#75494a}.filter-input,select,input[type=text]{min-width:150px;padding:9px 10px;color:var(--text);background:#091721;border:1px solid var(--line);border-radius:9px}.fixture{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #293e50}.fixture .away{text-align:right}.score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}.empty{text-align:center;padding:24px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:9;padding:12px 16px;border:1px solid #b9934f;border-radius:12px;background:#101c26;box-shadow:0 12px 36px #0008;opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:none}.footer{text-align:center;color:var(--muted);padding:24px 0;font-size:.83rem}.champion{font-size:1.15rem;color:var(--gold);font-weight:800}.small{font-size:.83rem}.spacer{height:9px}@media(max-width:800px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.metric-row{grid-template-columns:repeat(2,1fr)}.app{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.hero{padding:18px}.fixture{gap:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="brand"><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div class="top-actions"><button data-action="save">儲存存檔</button><button data-action="export">匯出存檔</button><label class="pill" style="cursor:pointer">匯入存檔<input id="importFile" type="file" accept="application/json" hidden></label></div></header>
<section class="hero"><div class="hero-content"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="manager">設定經理</button><button data-action="new" class="danger">重新開局</button></div></div></section>
<nav class="tabs" aria-label="遊戲選單"><button data-page="home">📊 總管中心</button><button data-page="roster">🧑‍🤝‍🧑 球員名單</button><button data-page="market">🔄 市場與交易</button><button data-page="season">📅 賽季賽程</button><button data-page="standings">🏆 排名與季後賽</button><button data-page="history">📰 球隊新聞</button></nav>
<div id="pageRoot" class="page"></div><footer class="footer">TPBL 經理模擬器 · 存檔僅保存在此瀏覽器 · 非官方球迷作品</footer></main>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',DOM_CAP=200,IMP_CAP=40000,ROSTER_CAP=16,IMPORT_CAP=4,GAMES=36;
const TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北中信特攻','新竹御嵿攻城獅','臺北台新戰神','高雄全家海神','臺北富邦勇士'];
const POS=['PG','SG','SF','PF','C'];
const LOCAL=`曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家興 許皓程 張維恩 蔡宇謙 鍾明輝 李學林 劉季軒 周士淵 何信華 余德龍 余宗廷 林冠宇 陳子豪 張家維 王俊凱 李明哲 周柏安 吳承翰 黃建宏 蔡昱廷 許博翔 鄭宇翔 郭柏廷`;const IMPORTS='Ray McCallum|Malcolm Miller|Adrien Moerman|Michael Eric|Daron Russell|Kristijan Krajina|Ivan Aska|Nysier Brooks|Austin Daye|Sani Sakakini|Jason Washburn|Kenny Manigault|Axel Toupane|Manny Harris|Tyler Hansbrough|Shawn Long|Jalen Jones|Melo Trimble|Jacob Pullen|Brady Manek|Rasheed Sulaimon|Matt Costello|Jerian Grant|Javonte Smart|Lorenzo Brown|Shabazz Napier|Tyler Cavanaugh|Nathan Knight';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`,rand=(a,b)=>Math.floor(Math.random()*(b-a+1));
function makePlayer(name,team,foreign=false,i=0){const rating=foreign?rand(72,88):rand(62,84);return{id:uid(),name,team,pos:POS[i%5],age:rand(20,33),rating,potential:Math.min(99,rating+rand(2,18)),salary:foreign?0:rand(4,16),salaryUsd:foreign?rand(7000,16000):0,isForeign:foreign,starter:false,injury:0,years:rand(1,3)}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function makeSchedule(){const games=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)games.push({id:`g-${games.length+1}`,a:TEAMS[i],b:TEAMS[j],played:false,home:k%2===0?TEAMS[i]:TEAMS[j]});return games}
function makeFreeAgents(){const locals=LOCAL.split(/\s+/).slice(0,20).map((n,i)=>makePlayer(n,'自由球員',false,i));const imports=IMPORTS.split('|').slice(0,16).map((n,i)=>makePlayer(n,'自由球員',true,i));return [...locals,...imports]}
function fresh(){const locals=LOCAL.split(/\s+/).sort(()=>Math.random()-.5),imports=IMPORTS.split('|').sort(()=>Math.random()-.5),rosters={};TEAMS.forEach((t,ti)=>{rosters[t]=[];for(let i=0;i<10;i++)rosters[t].push(makePlayer(locals.pop()||`本土球員${ti}-${i}`,t,false,i));for(let i=0;i<3;i++)rosters[t].push(makePlayer(imports.pop()||`Import ${ti}-${i}`,t,true,i));rosters[t].slice(0,5).forEach(p=>p.starter=true)});return{version:2,team:TEAMS[0],manager:'總經理',season:1,rosters,freeAgents:makeFreeAgents(),standings:blankStandings(),schedule:makeSchedule(),gameIndex:0,history:[{date:new Date().toLocaleDateString('zh-TW'),text:'新賽季正式開幕，祝各隊好運！'}],postseason:null,champions:[]}}
function normalize(raw){if(!raw||!raw.rosters)return fresh();const base=fresh();const s={...base,...raw};s.team=TEAMS.includes(raw.team)?raw.team:TEAMS[0];s.manager=String(raw.manager||'總經理');s.season=Math.max(1,Number(raw.season)||1);s.rosters={};TEAMS.forEach(t=>{s.rosters[t]=(Array.isArray(raw.rosters[t])?raw.rosters[t]:base.rosters[t]).map((p,i)=>({...p,id:p.id||uid(),team:t,pos:p.pos||POS[i%5],rating:Number(p.rating)||70,potential:Number(p.potential)||75,age:Number(p.age)||24,salary:Number(p.salary)||5,salaryUsd:Number(p.salaryUsd)||0,isForeign:Boolean(p.isForeign||p.foreign),starter:Boolean(p.starter),injury:Math.max(0,Number(p.injury)||0),years:Number(p.years)||1}))});});s.freeAgents=Array.isArray(raw.freeAgents)?raw.freeAgents:makeFreeAgents();s.standings={...blankStandings(),...(raw.standings||{})};TEAMS.forEach(t=>s.standings[t]={...blankStandings()[t],...(raw.standings?.[t]||{})});s.schedule=Array.isArray(raw.schedule)&&raw.schedule.length===126?raw.schedule:makeSchedule();s.gameIndex=Math.max(0,Math.min(126,Number(raw.gameIndex)||0));if(s.schedule.some(g=>g.played)){s.gameIndex=Math.max(s.gameIndex,s.schedule.filter(g=>g.played).length)}else s.schedule.forEach((g,i)=>{g.played=i<s.gameIndex});s.history=Array.isArray(raw.history)?raw.history:[];s.champions=Array.isArray(raw.champions)?raw.champions:[];return s}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{state=fresh()}
let page='home',marketFilter='all',tradeOwn='',tradeTarget='';
const roster=t=>state.rosters[t]||[],foreign=p=>!!p.isForeign,domPayroll=t=>roster(t).filter(p=>!foreign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0),impPayroll=t=>roster(t).filter(foreign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0),ranked=()=>TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||b.ptsFor-a.ptsFor),average=t=>{const x=roster(t);return x.length?x.reduce((n,p)=>n+p.rating,0)/x.length:65},strength=t=>{const ps=roster(t).filter(p=>p.starter&&!p.injury);return(ps.length?ps.reduce((n,p)=>n+p.rating,0)/ps.length:average(t))+(roster(t).filter(p=>p.injury).length?-3:0)};
function save(silent=false){try{localStorage.setItem(KEY,JSON.stringify(state));if(!silent)toast('存檔成功');return true}catch{if(!silent)toast('儲存失敗，請檢查瀏覽器空間');return false}}
function toast(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';n.setAttribute('role','status');n.setAttribute('aria-live','polite');document.body.appendChild(n)}n.textContent=msg;n.classList.add('show');clearTimeout(n.timer);n.timer=setTimeout(()=>n.classList.remove('show'),2100)}
function event(text){state.history.unshift({date:new Date().toLocaleDateString('zh-TW'),text});state.history=state.history.slice(0,150)}
function header(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager}｜第 ${state.season} 季｜例行賽 ${r.g}/${GAMES} 場｜${state.postseason?'季後賽中':'常規賽'}`}
function card(title,body,cls=''){return `<section class="card ${cls}"><h3>${title}</h3>${body}</section>`}
function homePage(){const r=state.standings[state.team],pct=r.g?Math.round(r.w/r.g*100):0,rank=ranked().findIndex(x=>x.team===state.team)+1,next=state.schedule.slice(state.gameIndex).find(g=>!g.played),teamRoster=roster(state.team),starts=teamRoster.filter(p=>p.starter),inj=teamRoster.filter(p=>p.injury);const bar=(label,value,max)=>`<div class="entry"><span>${label}</span><b>${value}</b></div><div class="progress"><i style="width:${Math.min(100,Math.max(0,value/max*100))}%"></i></div>`;let nextHtml=next?`<div class="fixture"><span>${esc(next.a)}</span><b class="score">VS</b><span>${esc(next.b)}</span></div><button class="primary" data-action="play" style="width:100%;margin-top:12px">▶ 模擬下一場比賽</button>`:`<p class="muted">例行賽已結束，準備進入季後賽。</p><button data-action="start-playoffs">開啟季後賽</button>`;return `<div class="grid">${card('賽季戰況',`<div class="metric-row"><div class="metric"><small>戰績</small><strong>${r.w}-${r.l}</strong></div><div class="metric"><small>聯盟排名</small><strong>#${rank}</strong></div><div class="metric"><small>勝率</small><strong>${pct}%</strong></div><div class="metric"><small>球隊戰力</small><strong>${Math.round(strength(state.team))}</strong></div></div><div class="spacer"></div>${bar('例行賽進度',r.g,GAMES)}<div class="spacer"></div><div class="row muted small"><span>得分 ${r.ptsFor||0}</span><span>失分 ${r.ptsAgainst||0}</span><span>分差 ${(r.ptsFor||0)-(r.ptsAgainst||0)}</span></div>`,'span-8')}${card('下一步',nextHtml,'span-4')}${card('球隊營運',`<div class="entry"><span>本土薪資空間</span><b>${Math.max(0,DOM_CAP-domPayroll(state.team))}M <small class="muted">/ ${DOM_CAP}M</small></b></div>${bar('本土薪資使用',domPayroll(state.team),DOM_CAP)}<div class="entry"><span>洋將名額</span><b>${teamRoster.filter(foreign).length}/${IMPORT_CAP}</b></div><div class="entry"><span>洋將薪資</span><b>US$${impPayroll(state.team).toLocaleString()} / ${IMP_CAP.toLocaleString()}</b></div><div class="entry"><span>球員健康</span><b>${inj.length?`⚠ ${inj.length} 人傷兵`:'全員可出賽'}</b></div>`,'span-6')}${card('先發五人',starts.length?starts.map(p=>`<div class="entry"><span>${esc(p.name)} <span class="pill">${esc(p.pos)}</span></span><b>${p.rating}</b></div>`).join(''):'<p class="muted">尚未設定先發，前往球員名單調整。</p>','span-6')}${card('最近賽果',recentGames(),'span-12')}</div>`}
function recentGames(){const done=state.schedule.filter(g=>g.played&&g.score).slice(-5).reverse();return done.length?done.map(g=>`<div class="fixture"><span>${esc(g.a)}</span><b class="score">${g.score[0]} : ${g.score[1]}</b><span>${esc(g.b)} ${g.winner===state.team?'<span class="pill good">勝</span>':''}</span></div>`).join(''):'<p class="muted">尚未進行比賽。</p>'}
function rosterPage(){const ps=roster(state.team);return `<div class="grid">${card(`球員名單 <small>${ps.length}/${ROSTER_CAP}</small>`, `<div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>年齡</th><th>評價</th><th>潛力</th><th>薪資</th><th>健康</th><th>操作</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.starter?'⭐ ':''}${esc(p.name)} ${p.isForeign?'<span class="pill">洋將</span>':''}</td><td>${esc(p.pos)}</td><td>${p.age}</td><td><b>${p.rating}</b></td><td>${p.potential}</td><td>${p.isForeign?`US$${p.salaryUsd.toLocaleString()}`:`${p.salary}M`}</td><td>${p.injury?`傷停 ${p.injury} 場`:'健康'}</td><td><button data-player-action="starter" data-id="${esc(p.id)}">${p.starter?'取消先發':'設為先發'}</button> <button data-player-action="cut" data-id="${esc(p.id)}">釋出</button></td></tr>`).join('')}</tbody></table></div><p class="muted small">先發最多五人。比賽會隨機造成短期傷病，傷兵康復後可重新安排。</p>`,'span-12')}${card('陣容戰力',`<div class="metric-row"><div class="metric"><small>先發平均</small><strong>${Math.round(ps.filter(p=>p.starter).reduce((n,p)=>n+p.rating,0)/Math.max(1,ps.filter(p=>p.starter).length))}</strong></div><div class="metric"><small>全隊平均</small><strong>${Math.round(average(state.team))}</strong></div><div class="metric"><small>本土球員</small><strong>${ps.filter(p=>!p.isForeign).length}</strong></div><div class="metric"><small>洋將</small><strong>${ps.filter(foreign).length}/${IMPORT_CAP}</strong></div></div>`,'span-12')}</div>`}
function marketPage(){const available=state.freeAgents.filter(p=>marketFilter==='all'||(marketFilter==='local'&&!p.isForeign)||(marketFilter==='import'&&p.isForeign));const rivals=TEAMS.filter(t=>t!==state.team);const otherPlayers=rivals.flatMap(t=>roster(t).map(p=>({...p,team:t})));const own=roster(state.team);return `<div class="grid">${card('自由球員市場',`<div class="row"><p class="muted">名單上限 ${ROSTER_CAP} 人；符合本土與洋將薪資上限即可簽約。</p><div class="filters"><button data-filter="all">全部</button><button data-filter="local">本土</button><button data-filter="import">洋將</button></div></div><div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>年齡</th><th>評價</th><th>薪資</th><th>操作</th></tr></thead><tbody>${available.length?available.map(p=>`<tr><td>${esc(p.name)} ${p.isForeign?'<span class="pill">洋將</span>':''}</td><td>${p.pos}</td><td>${p.age}</td><td>${p.rating}</td><td>${p.isForeign?`US$${p.salaryUsd.toLocaleString()}`:`${p.salary}M`}</td><td><button data-sign="${esc(p.id)}">簽約</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">此分類目前沒有自由球員。</td></tr>'}</tbody></table></div>`,'span-12')}${card('球員交易',`<p class="muted">挑選一名我方球員與另一隊球員進行一對一交易。交易後仍須符合名單與薪資規則。</p><div class="filters"><select id="tradeOwn"><option value="">選擇我方球員</option>${own.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${p.rating})</option>`).join('')}</select><span>⇄</span><select id="tradeTarget"><option value="">選擇對手球員</option>${otherPlayers.map(p=>`<option value="${esc(p.id)}" data-team="${esc(p.team)}">${esc(p.name)} · ${esc(p.team)} (${p.rating})</option>`).join('')}</select><button class="primary" data-action="trade">提出並完成交易</button></div>`,'span-12')}</div>`}
function seasonPage(){const pending=state.schedule.slice(state.gameIndex).filter(g=>!g.played).slice(0,12);return `<div class="grid">${card(`第 ${state.season} 季例行賽`, `<div class="metric-row"><div class="metric"><small>已完成賽事</small><strong>${state.schedule.filter(g=>g.played).length}/126</strong></div><div class="metric"><small>球隊賽程</small><strong>${state.standings[state.team].g}/36</strong></div><div class="metric"><small>勝率</small><strong>${state.standings[state.team].g?Math.round(state.standings[state.team].w/state.standings[state.team].g*100):0}%</strong></div><div class="metric"><small>戰力值</small><strong>${Math.round(strength(state.team))}</strong></div></div><div class="spacer"></div><div class="progress"><i style="width:${state.schedule.filter(g=>g.played).length/126*100}%"></i></div><div class="row" style="margin-top:14px"><span class="muted">接下來的賽程（模擬任何一場會更新兩隊戰績）</span><button class="primary" data-action="play">模擬下一場</button></div>${pending.length?pending.map(g=>`<div class="fixture"><span>${esc(g.a)}</span><b class="score">VS</b><span>${esc(g.b)}</span></div>`).join(''):'<p class="empty">例行賽已完成。</p>'}`,'span-8')}${card('賽季規則',`<div class="entry"><span>例行賽</span><b>每隊 36 場 · 聯盟 126 場</b></div><div class="entry"><span>季後賽資格</span><b>排名前六名</b></div><div class="entry"><span>本土薪資上限</span><b>200M</b></div><div class="entry"><span>洋將規則</span><b>最多 4 人 · US$40,000</b></div><p class="muted small">比賽結果由球隊戰力、主場優勢與隨機賽事波動共同決定。傷病會在後續賽事逐步恢復。</p>`,'span-4')}${card('已完成賽事',recentGames(),'span-12')}</div>`}
function standingsPage(){const rows=ranked(),r=state.standings[state.team],finished=r.g===GAMES,post=state.postseason;let playoff='';if(!post)playoff=finished?'<p class="notice">例行賽完成！前六名晉級季後賽。</p><button class="primary" data-action="start-playoffs">開始季後賽</button>':'<p class="muted">完成全部例行賽後即可啟動季後賽。</p>';else playoff=playoffView(post);return `<div class="grid">${card('聯盟排名',`<div class="table-wrap"><table><thead><tr><th>#</th><th>球隊</th><th>勝</th><th>敗</th><th>勝率</th><th>場差</th><th>得失分</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i<6?'<span class="gold">'+(i+1)+'</span>':i+1}</td><td>${esc(t.team)} ${t.team===state.team?'<span class="pill good">我的球隊</span>':''}</td><td>${t.w}</td><td>${t.l}</td><td>${t.g?Math.round(t.w/t.g*100):0}%</td><td>${rows[0].w-t.w}</td><td>${(t.ptsFor||0)-(t.ptsAgainst||0)}</td></tr>`).join('')}</tbody></table></div>`,'span-7')}${card('季後賽｜六強制',playoff,'span-5')}${card('歷屆冠軍',state.champions.length?state.champions.slice().reverse().map(c=>`<div class="entry"><span>第 ${c.season} 季</span><b class="champion">${esc(c.team)}</b></div>`).join(''):'<p class="muted">尚無冠軍紀錄，衝擊隊史首冠吧！</p>','span-12')}</div>`}
function playoffView(p){if(p.champion)return `<p class="champion">🏆 第 ${state.season} 季冠軍：${esc(p.champion)}</p><p class="muted">恭喜奪冠！請開始新賽季，建立王朝。</p><button class="primary" data-action="new-season">開啟新賽季</button>`;const series=p.series[p.index];return `<p class="notice">${esc(p.stageLabel)} · 系列賽採${p.stage==='final'?'七戰四勝':'五戰三勝'}制</p>${series?`<div class="fixture"><span>${esc(series.a)}</span><b class="score">${series.aw} : ${series.bw}</b><span>${esc(series.b)}</span></div><p class="muted">系列賽 ${Math.max(series.aw,series.bw)} 勝即晉級。</p><button class="primary" data-action="play-playoff">模擬季後賽</button>`:'<p>系列賽準備中…</p>'}`}
function historyPage(){return `<div class="grid">${card('球隊新聞與交易紀錄',state.history.length?state.history.map(h=>`<div class="entry"><span>${esc(h.text)}</span><small class="muted">${esc(h.date)}</small></div>`).join(''):'<p class="empty">目前沒有新聞。</p>','span-12')}</div>`}
function content(){switch(page){case'roster':return rosterPage();case'market':return marketPage();case'season':return seasonPage();case'standings':return standingsPage();case'history':return historyPage();default:return homePage()}}
function render(){header();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageRoot').innerHTML=content()}
function simulate(f){const a=f.a,b=f.b,ra=state.standings[a],rb=state.standings[b];const baseA=82+Math.random()*22+(strength(a)-70)*.48+(f.home===a?2.5:0),baseB=82+Math.random()*22+(strength(b)-70)*.48+(f.home===b?2.5:0);let sa=Math.max(65,Math.round(baseA)),sb=Math.max(65,Math.round(baseB));if(sa===sb){if(Math.random()<.5)sa++;else sb++}ra.g++;rb.g++;ra.ptsFor+=sa;ra.ptsAgainst+=sb;rb.ptsFor+=sb;rb.ptsAgainst+=sa;const winner=sa>sb?a:b;(winner===a?ra:rb).w++;(winner===a?rb:ra).l++;f.played=true;f.score=[sa,sb];f.winner=winner;state.gameIndex=state.schedule.filter(g=>g.played).length;for(const t of [a,b])for(const p of roster(t)){if(p.injury>0)p.injury--;else if(Math.random()<.009)p.injury=rand(1,3)}event(`${a} ${sa}：${sb} ${b}｜${winner} 獲勝`);if(TEAMS.every(t=>state.standings[t].g>=GAMES))event('例行賽正式結束，前六名晉級季後賽。')}
function playNext(){if(state.postseason)return toast('季後賽期間請使用季後賽模擬。');const f=state.schedule.find(g=>!g.played);if(!f)return toast('例行賽已完成！');simulate(f);save(true);render();toast(`${f.a} ${f.score[0]}：${f.score[1]} ${f.b}`)}
function signPlayer(id){const i=state.freeAgents.findIndex(p=>p.id===id);if(i<0)return;const p=state.freeAgents[i],r=roster(state.team);if(r.length>=ROSTER_CAP)return toast('名單已滿，請先釋出球員。');if(p.isForeign){if(r.filter(foreign).length>=IMPORT_CAP)return toast('洋將名額已滿。');if(impPayroll(state.team)+p.salaryUsd>IMP_CAP)return toast('超過洋將薪資上限。')}else if(domPayroll(state.team)+p.salary>DOM_CAP)return toast('超過本土薪資上限。');p.team=state.team;r.push(p);state.freeAgents.splice(i,1);event(`簽下自由球員 ${p.name}`);save(true);render();toast(`已簽下 ${p.name}`)}
function cutPlayer(id){const r=roster(state.team),i=r.findIndex(p=>p.id===id);if(i<0)return;const [p]=r.splice(i,1);p.team='自由球員';p.starter=false;state.freeAgents.push(p);event(`釋出球員 ${p.name}`);save(true);render();toast(`已釋出 ${p.name}`)}
function toggleStarter(id){const p=roster(state.team).find(x=>x.id===id);if(!p)return;if(p.injury)return toast('傷兵無法列入先發。');if(!p.starter&&roster(state.team).filter(x=>x.starter).length>=5)return toast('先發最多五人。');p.starter=!p.starter;save(true);render();toast(p.starter?'已列入先發':'已移至替補')}
function trade(){const ownId=$('#tradeOwn')?.value,targetId=$('#tradeTarget')?.value;if(!ownId||!targetId)return toast('請選擇交易雙方球員。');const own=roster(state.team).find(p=>p.id===ownId);let targetTeam=TEAMS.find(t=>t!==state.team&&roster(t).some(p=>p.id===targetId));if(!targetTeam)return toast('找不到對手球員。');const target=roster(targetTeam).find(p=>p.id===targetId);if(!own||!target)return;const next=[...roster(state.team).filter(p=>p.id!==own.id),target],foreignCount=next.filter(foreign).length,dom=next.filter(p=>!foreign(p)).reduce((n,p)=>n+p.salary,0),imp=next.filter(foreign).reduce((n,p)=>n+p.salaryUsd,0);if(foreignCount>IMPORT_CAP||dom>DOM_CAP||imp>IMP_CAP)return toast('交易後會超出名單或薪資上限。');const oi=roster(state.team).findIndex(p=>p.id===own.id),ti=roster(targetTeam).findIndex(p=>p.id===target.id);state.rosters[state.team][oi]=target;state.rosters[targetTeam][ti]=own;own.team=targetTeam;target.team=state.team;event(`交易完成：${own.name} 前往 ${targetTeam}，${target.name} 加盟本隊`);save(true);render();toast('交易完成！')}
function playoffRound(a,b,label,best){return{a,b,aw:0,bw:0,label,best,winner:null}}
function startPlayoffs(){if(!TEAMS.every(t=>state.standings[t].g>=GAMES))return toast('所有球隊都需完成 36 場例行賽。');if(state.postseason)return toast('季後賽已開始。');const r=ranked();state.postseason={stage:'playin',stageLabel:'附加賽',series:[playoffRound(r[2].team,r[5].team,'附加賽',3),playoffRound(r[3].team,r[4].team,'附加賽',3)],index:0,champion:null,qualifiers:[r[0].team,r[1].team]};event('季後賽附加賽開打！');save(true);render()}
function currentSeries(){const p=state.postseason;return p?.series[p.index]||null}
function playoffGame(){const p=state.postseason,s=currentSeries();if(!p||!s)return;if(s.winner)return;const ra=strength(s.a)+(s.aw+1<s.best?1.5:0),rb=strength(s.b)+(s.bw+1<s.best?1.5:0);const sa=Math.round(86+Math.random()*18+(ra-70)*.5),sb0=Math.round(86+Math.random()*18+(rb-70)*.5),sb=sa===sb0?sb0+1:sb0,winner=sa>sb?s.a:s.b;if(winner===s.a)s.aw++;else s.bw++;event(`季後賽：${s.a} ${sa}：${sb} ${s.b}｜${winner} 勝`);if(s.aw>=Math.ceil(s.best/2)||s.bw>=Math.ceil(s.best/2)){s.winner=s.aw>s.bw?s.a:s.b;advancePlayoffs()}save(true);render();toast(`${s.a} ${sa}：${sb} ${s.b}`)}
function advancePlayoffs(){const p=state.postseason;if(p.index<p.series.length-1){p.index++;return}if(p.stage==='playin'){const [r1,r2]=p.series.map(s=>s.winner);p.stage='semifinal';p.stageLabel='季後賽四強';p.series=[playoffRound(p.qualifiers[0],r2,'四強',5),playoffRound(p.qualifiers[1],r1,'四強',5)];p.index=0;event('附加賽結束，四強系列賽開打！');return}if(p.stage==='semifinal'){const [a,b]=p.series.map(s=>s.winner);p.stage='final';p.stageLabel='總冠軍賽';p.series=[playoffRound(a,b,'總冠軍賽',7)];p.index=0;event('總冠軍賽正式開打！');return}p.champion=p.series[0].winner;state.champions.push({season:state.season,team:p.champion});event(`🏆 ${p.champion} 奪下第 ${state.season} 季總冠軍！`)}
function newSeason(){if(!state.postseason?.champion)return toast('請先完成季後賽。');state.season++;state.standings=blankStandings();state.schedule=makeSchedule();state.gameIndex=0;state.postseason=null;for(const t of TEAMS){for(const p of roster(t)){p.age++;p.starter=false;p.injury=0;p.rating=Math.min(p.potential,p.rating+(Math.random()<.55?1:0));p.years=Math.max(0,p.years-1)}const freeable=roster(t).filter(p=>p.years<=0);for(const p of freeable){state.rosters[t]=roster(t).filter(x=>x!==p);p.team='自由球員';p.starter=false;state.freeAgents.push(p)}roster(t).slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)}state.freeAgents.push(...makeFreeAgents().slice(0,8));event(`第 ${state.season} 季開幕！球員年齡、合約與能力已更新。`);page='home';save(true);render();toast(`第 ${state.season} 季開始！`)}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tpbl-manager-season-${state.season}.json`;a.click();URL.revokeObjectURL(url)}
function importSave(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=normalize(JSON.parse(reader.result));save(true);render();toast('存檔匯入成功')}catch{toast('匯入失敗：檔案格式無效')}};reader.readAsText(file)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.filter){marketFilter=b.dataset.filter;render();return}if(b.dataset.sign){signPlayer(b.dataset.sign);return}if(b.dataset.playerAction){b.dataset.playerAction==='starter'?toggleStarter(b.dataset.id):cutPlayer(b.dataset.id);return}if(b.dataset.action){switch(b.dataset.action){case'save':save();break;case'export':exportSave();break;case'new':if(confirm('重新開局會覆蓋目前存檔，建議先匯出備份。確定繼續？')){state=fresh();save(true);page='home';render();toast('新賽季已建立')}break;case'team':{const chosen=prompt(`輸入球隊編號 1-${TEAMS.length}：\n${TEAMS.map((t,i)=>`${i+1}. ${t}`).join('\n')}`,String(TEAMS.indexOf(state.team)+1));const idx=Number(chosen)-1;if(Number.isInteger(idx)&&TEAMS[idx]){state.team=TEAMS[idx];save(true);render()}}break;case'manager':{const name=prompt('輸入總經理名稱：',state.manager);if(name?.trim()){state.manager=name.trim().slice(0,24);save(true);render()}}break;case'play':playNext();break;case'trade':trade();break;case'start-playoffs':startPlayoffs();break;case'play-playoff':playoffGame();break;case'new-season':newSeason();break}}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importSave(e.target.files?.[0])});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save(true)});
render();save(true);
})();
</script></body></html>
