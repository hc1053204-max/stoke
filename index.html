'2026-27':'曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家駿 林俊吉 簡偉儒 忻沃克 李德威 史承平 梁瀚 盧冠軒 李啓瑋 徐小龍 高國豪 曾柏喻 朱雲豪 田浩 劉丞勳 蕭順議 李家瑞 蔡宸綱 黃泓瀚 簡廷兆 曾文鼎 陳懷安 阿巴西 李睿麒 林安龍 余維豪 魏嘉豪 謝亞軒 林任鴻 曾信武 林韋翰 李沛澄 林書緯 蘇培凱 鍾理翔 李愷諺 簡祐哲 王柏智 林彥廷 呂政儒 蘇士軒 林金榜 熊祥泰 余純安 廖偉皓 吳曉謹 勤明慶 魏莨哲 于煥亞 邱子軒 唐維傑 胡瓏貿 施晉堯 呂威霆 吳彥侖 蘇文儒 錢肯尼 張耕淯 蘇奕晉 陳冠全 丁聖儒 魏芃禾 江均 劉彥廷 陳文宏 張兆辰 黃聰翰 謝銘駿 孫思堯 雷蒙恩 林廷謙'};
const IMPORT_BY_SEASON={
'2024-25':'Ray McCallum Malcolm Miller Adrien Moerman Michael Eric Daron Russell Kristijan Krajina Ivan Aska Nysier Brooks Austin Daye Sani Sakakini Jason Washburn Kenny Manigault Axel Toupane Lasan Kromah Devin Williams Egidijus Mockevicius Landers Nolley Earl Clark Nate Laszewski Kennedy Meeks Beau Beech Markus Loncar Brandon Gilbeck Aric Holman Edgaras Zelionis Craig Sword Anthony Morse Kaleb Wesson',
'2025-26':'Chris McCullough Malcolm Miller Lasan Kromah Cheick Diallo Trey Thompkins Brandon Gilbeck Aric Holman Ben Bentil Jalen Harris Olufemi Olujobi Austin Daye Jason Washburn Drew Pember Anzejs Pasecniks TJ Holyfield Marin Maric Beau Beech Nemanja Radovic Viktor Gaddefors Marko Todorovic Makur Maker Michael Frazier Darral Willis Youssou Ndoye Edgaras Zelionis Kristijan Krajina Hunter Maldonado Rade Zagorac',
'2026-27':'Trey Thompkins Ben Bentil Aric Holman Brandon Gilbeck Stanton Kidd Drew Pember Cheick Diallo Sim Bhullar Justin Alston Hunter Maldonado Rosco Allen Grant Basile Gabriel Galvanini Marvin Jones Vladimir Brodziansky Michael Beasley Markel Crawford Jonathan Lewis Jaylen Johnson Antony Diong Jason Washburn McAdoo Cam Miller Cromer Aleksandar Marelja Tyrus McGee Marin Maric Bryan Griffin'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniquePool(source){return [...new Set(Object.values(source).flatMap(s=>s.split(/\s+/).filter(Boolean)))].sort(()=>Math.random()-.5)}
function player(name,team,i,isForeign){const rating=(isForeign?73:65)+Math.floor(Math.random()*(isForeign?17:23));return{id:`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,name,team,pos:POS[i%POS.length],age:21+Math.floor(Math.random()*13),rating,potential:Math.min(99,rating+Math.floor(Math.random()*12)),salary:isForeign?0:5+Math.floor(Math.random()*10),salaryUsd:isForeign?8000+Math.floor(Math.random()*2500):null,isForeign,starter:false,injury:0,stats:{gp:0,pts:0}}}
function makeSchedule(){const a=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)a.push({a:TEAMS[i],b:TEAMS[j]});return shuffle(a).map((g,i)=>({...g,id:i+1}))}
function fresh(){const locals=uniquePool(LOCAL_BY_SEASON),imports=uniquePool(IMPORT_BY_SEASON),rosters={};TEAMS.forEach((t,ti)=>{const teamLocals=locals.splice(0,12),teamImports=imports.splice(0,4);rosters[t]=[...teamLocals.map((n,i)=>player(n,t,i,false)),...teamImports.map((n,i)=>player(n,t,i,true))];const starters=shuffle(rosters[t].filter(p=>!p.isForeign)).slice(0,5);starters.forEach(p=>p.starter=true)});const freeAgents=[...locals.map((n,i)=>player(n,'自由球員',i,false)),...imports.map((n,i)=>player(n,'自由球員',i,true))];return{team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,rosters,standings:Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}])),schedule:makeSchedule(),freeAgents,history:[]}}
function normalize(raw){if(!raw?.rosters)return fresh();const s={...fresh(),...raw};s.rosters=s.rosters||{};TEAMS.forEach(t=>{const list=Array.isArray(s.rosters[t])?s.rosters[t]:[];s.rosters[t]=list.map((p,i)=>{const f=!!(p.isForeign||p.foreign);return{...player(p.name||`球員${i+1}`,t,i,f),...p,team:t,id:p.id||`${t}-${i}`,isForeign:f,salary:f?0:Math.max(0,Number(p.salary)||0),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):null,stats:{gp:0,pts:0,...p.stats}}});let starters=s.rosters[t].filter(p=>p.starter);s.rosters[t].forEach(p=>p.starter=starters.includes(p)&&starters.indexOf(p)<5);if(!s.rosters[t].some(p=>p.starter))s.rosters[t].filter(p=>!p.isForeign).slice(0,5).forEach(p=>p.starter=true)});s.standings={...Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}])),...(s.standings||{})};TEAMS.forEach(t=>{const r=s.standings[t]||{},w=Number(r.w)||0,l=Number(r.l)||0;s.standings[t]={...r,w,l,g:w+l}});s.schedule=Array.isArray(s.schedule)&&s.schedule.length===LEAGUE_GAMES?s.schedule:makeSchedule();s.gameIndex=Math.max(0,Math.min(LEAGUE_GAMES,Number(s.gameIndex)||0));s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:[];return s}
try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器儲存空間。');return false}}
function notify(m){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=m;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.remove(),2500)}
function foreign(p){return !!(p && (p.isForeign || p.foreign));}
function roster(t=state.team){return state.rosters[t]||[]}
function domesticPayroll(t=state.team){return roster(t).filter(p=>!foreign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0)}
function foreignPayroll(t=state.team){return roster(t).filter(foreign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0)}
function render(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').innerHTML=`本土薪資 ${domesticPayroll()} / ${CAP}M<small>洋將 ${roster().filter(foreign).length} / ${FOREIGN_LIMIT} 名 · US$${foreignPayroll().toLocaleString()} / ${FOREIGN_CAP.toLocaleString()}</small>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='roster'?rosterPage():page==='market'?marketPage():page==='standings'?standingsPage():homePage()}
function homePage(){const r=state.standings[state.team];return `<div class="columns"><section class="card"><h3>例行賽進度</h3><p>${r.g}/${GAMES} 場；全聯盟 ${state.gameIndex}/${LEAGUE_GAMES} 場</p><p class="muted">七隊彼此各交手六次，每隊 36 場、聯盟共 126 場。</p><button class="gold" data-action="play" ${r.g>=GAMES?'disabled':''}>模擬下一場</button></section><section class="card"><h3>聯盟戰績</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} <small>${x.g}/${GAMES}</small></b></div>`).join('')}</section></div><section class="card"><h3>先發陣容</h3>${roster().filter(p=>p.starter).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating} OVR</b></div>`).join('')||'<p class="empty">尚未設定先發</p>'}</section>`}
function rosterPage(){return `<section class="card"><h3>球員名單 · ${roster().length}/16</h3><p class="muted">球員來自 TPBL 三個賽季的公開名單，建立新遊戲時隨機分配。先發最多五人。</p>${roster().map(p=>`<div class="entry"><span><b>${esc(p.name)}</b> ${p.starter?'<span class="badge">先發</span>':'<span class="muted">替補</span>'}<small class="muted"><br>${esc(p.pos)} · ${p.age} 歲 · ${foreign(p)?`洋將 US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 ${Number(p.salary)||0}M`}</small></span><button data-action="${p.starter?'bench':'replace'}" data-id="${esc(p.id)}">${p.starter?'改為替補':'替換先發'}</button></div>`).join('')}</section>`}
function marketPage(){return `<section class="card"><h3>自由球員簽約</h3><p class="muted">本土薪資上限 200M；洋將最多四名、合計不超過 US$40,000；球員名單上限 16 人。</p>${state.freeAgents.length?state.freeAgents.map(p=>`<div class="entry"><span><b>${esc(p.name)}</b><small class="muted"><br>${foreign(p)?`洋將 · US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 · ${p.salary}M`} · ${p.rating} OVR</small></span><button data-action="sign" data-id="${esc(p.id)}">簽下</button></div>`).join(''):'<p class="empty">自由球員已簽完。</p>'}<div class="entry"><span>目前本土薪資</span><b>${domesticPayroll()} / ${CAP}M</b></div><div class="entry"><span>洋將使用額度</span><b>${roster().filter(foreign).length}/${FOREIGN_LIMIT} 名 · US$${foreignPayroll().toLocaleString()}/${FOREIGN_CAP.toLocaleString()}</b></div></section>`}
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l)}
function standingsPage(){return `<section class="card"><h3>例行賽排名</h3>${standings().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w} 勝 ${x.l} 敗 · ${x.g}/${GAMES} 場</b></div>`).join('')}</section>`}
function playFixture(f){const a=state.standings[f.a],b=state.standings[f.b];if(!a||!b||a.g>=GAMES||b.g>=GAMES)return;const avg=t=>{const ps=roster(t).filter(p=>p.starter&&!p.injury);return ps.length?ps.reduce((n,p)=>n+p.rating,0)/ps.length:68};let sa=Math.round(80+Math.random()*22+(avg(f.a)-72)*.55),sb=Math.round(80+Math.random()*22+(avg(f.b)-72)*.55);if(sa===sb)sa++;a.g++;b.g++;if(sa>sb){a.w++;b.l++}else{b.w++;a.l++}for(const [team,score]of[[f.a,sa],[f.b,sb]])roster(team).filter(p=>p.starter).forEach(p=>{p.stats.gp++;p.stats.pts+=Math.floor(score/5)})}
function nextGame(){if(state.standings[state.team].g>=GAMES)return notify('你的例行賽已完成。');let found=false;while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];if(state.standings[f.a].g>=GAMES||state.standings[f.b].g>=GAMES)continue;playFixture(f);if(f.a===state.team||f.b===state.team){found=true;break}}if(state.standings[state.team].g>=GAMES){while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];if(state.standings[f.a].g<GAMES&&state.standings[f.b].g<GAMES)playFixture(f)}notify('例行賽完成：七隊各 36 場。')}else if(!found)notify('賽程已結束。');save();render()}
function toggleStarter(id,replace=false){const p=roster().find(x=>String(x.id)===id);if(!p)return;if(p.starter){if(roster().filter(x=>x.starter).length<=5)return notify('至少需保留五位先發，請改用替換功能。');p.starter=false}else{const starters=roster().filter(x=>x.starter);if(starters.length>=5){if(!replace)return notify('先發最多五人，請使用替換先發。');const out=starters.filter(x=>!foreign(x)).sort((a,b)=>a.rating-b.rating)[0];if(!out)return notify('找不到可替換的先發。');out.starter=false}p.starter=true}save();render()}
function signPlayer(p){if(!p)return;const teamRoster=roster();if(teamRoster.length>=16)return notify('球員名單已滿（16 人）。');if(foreign(p)){if(teamRoster.filter(foreign).length>=FOREIGN_LIMIT)return notify('洋將名額已滿。');if(foreignPayroll()+Number(p.salaryUsd||0)>FOREIGN_CAP)return notify(`洋將薪資超過 US$${FOREIGN_CAP.toLocaleString()} 上限。`)}else if(domesticPayroll()+Number(p.salary||0)>CAP)return notify(`本土薪資將超過 ${CAP}M 上限。`);const signed={...p,id:`signed-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,team:state.team,starter:false};teamRoster.push(signed);state.freeAgents=state.freeAgents.filter(x=>x.id!==p.id);save();render();notify(`已簽下 ${p.name}`)}
function restart(){if(!confirm('確定重新開始？目前賽季資料會清除，將重新隨機分配三季球員到各隊。'))return;state=fresh();page='home';save();render();notify('新遊戲已建立，球員已隨機分隊。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}switch(b.dataset.action){case'play':nextGame();break;case'replace':toggleStarter(b.dataset.id,true);break;case'bench':toggleStarter(b.dataset.id,false);break;case'sign':signPlayer(state.freeAgents.find(p=>String(p.id)===b.dataset.id));break;case'restart':restart();break;case'team':{const t=prompt(`輸入球隊名稱：\n${TEAMS.join('\n')}`,state.team);if(TEAMS.includes(t)){state.team=t;save();render()}break}case'new':if(confirm('開始新賽季？球隊名單保留，賽程及戰績重置。')){state.season++;state.gameIndex=0;state.standings=Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}]));state.schedule=makeSchedule();TEAMS.forEach(t=>roster(t).forEach(p=>p.stats={gp:0,pts:0}));save();render()}break}});
render();save();
})();
</script></body></html>
