<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;--bg:#09131d;--panel:#14202d;--panel2:#0e1924;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e;--blue:#8ebeff;--green:#73d6a0;--red:#ff9292;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(ellipse at top,#193047 0,#0a141e 56%,#08111a 100%);min-height:100vh}.app{max-width:1160px;margin:auto;padding:20px}.top,.brand,.hero-row,.stats,.nav,.card-head,.row,.entry,.actions,.modal-actions{display:flex;align-items:center;gap:12px}.top,.hero-row,.card-head,.entry{justify-content:space-between}.brand{gap:12px}.ball{font-size:30px}.brand h1{margin:0;letter-spacing:2px;font-size:21px}.brand small{color:var(--muted);font-size:11px;letter-spacing:1px}.budget{padding:10px 14px;border:1px solid var(--line);border-radius:11px;color:var(--gold);font-weight:750;background:#0a1520}.hero{padding:20px;border:1px solid var(--line);border-radius:17px;margin:17px 0;background:linear-gradient(115deg,#182d40,#172331 65%,#30291d)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}.hero h2{margin:6px 0;font-size:clamp(22px,4vw,32px)}.hero p{margin:0;color:var(--muted)}.stats{flex-wrap:wrap;margin-top:18px}.stat{flex:1;min-width:125px;padding:11px 13px;border:1px solid #ffffff12;background:#09141eaa;border-radius:11px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font-size:19px;margin-top:4px}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:18px;gap:22px}.nav button{background:none;border:0;color:var(--muted);padding:11px 0;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;font:inherit}.nav button.active{color:var(--gold);border-color:var(--gold)}.card{padding:17px;background:#121e2acc;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.card h3{margin:0}.card-head{margin-bottom:12px}.muted,small{color:var(--muted)}.notice{padding:11px 13px;background:#19293a;border:1px solid #34495e;border-radius:9px;color:#d4e2f1;margin:10px 0;line-height:1.55}.btn{border:1px solid var(--line);background:#26374a;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit;font-weight:700}.btn.gold{color:#201b11;background:var(--gold);border-color:var(--gold)}.btn.blue{color:#dcecff;background:#244367;border-color:#41628a}.btn.red{color:#ffc7c7;background:#45292d;border-color:#74444b}.btn.small{font-size:12px;padding:7px 9px}.btn:disabled{opacity:.42;cursor:not-allowed}.entry{padding:10px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border-bottom:0}.meta{display:block;font-size:12px;margin-top:4px;color:var(--muted)}.ovr{color:var(--gold);font-weight:800;font-size:18px}.actions{justify-content:flex-end;flex-wrap:wrap}.columns{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{background:#0b1520;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center;font-size:12px}.slot b{display:block;margin:6px 0}.badge{display:inline-block;font-size:10px;border:1px solid #927941;border-radius:99px;color:var(--gold);padding:3px 7px;margin-left:5px}.tableline{display:grid;grid-template-columns:36px 1fr 70px 66px;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #ffffff12}.tableline:last-child{border:0}.rank{color:var(--gold);font-weight:800}.formrow{display:grid;gap:6px;margin:10px 0}.formrow label{font-size:12px;color:var(--muted)}select,input{font:inherit;color:var(--text);background:#0a1520;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.injury{color:var(--red)}.healthy{color:var(--green)}.empty{text-align:center;padding:20px;color:var(--muted)}.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.series{background:#0a1520;border:1px solid var(--line);padding:12px;border-radius:10px}.series b{display:block;margin-bottom:7px}.series .entry{font-size:13px}.modalbg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}.modal label{display:block;margin:12px 0 5px;color:var(--muted)}.modal-actions{justify-content:flex-end;margin-top:16px}.toast{position:fixed;z-index:9;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;box-shadow:0 6px 25px #0008}.footer{text-align:center;color:var(--muted);font-size:11px;padding:14px}.hidden{display:none!important}@media(max-width:750px){.app{padding:12px}.hero{padding:16px}.hero-row{align-items:flex-start}.columns{grid-template-columns:1fr}.lineup{grid-template-columns:repeat(2,1fr)}.bracket{grid-template-columns:1fr}.stats{gap:7px}.stat{min-width:calc(50% - 8px)}.tableline{grid-template-columns:28px 1fr 52px 50px;font-size:12px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="ball">🏀</div><div><h1>FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div></div><div id="budget" class="budget">薪資 0 / 100M</div></header>
<section class="hero"><div class="hero-row"><div><div class="eyebrow">YOUR FRANCHISE · MANAGER MODE</div><h2 id="teamName"></h2><p id="teamMeta"></p></div><button class="btn blue" data-action="settings">⚙ 球隊設定</button></div><div id="stats" class="stats"></div></section>
<nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="standings">排名與季後賽</button><button data-page="market">交易窗口</button><button data-page="awards">年度獎項</button><button data-page="history">聯盟紀錄</button></nav>
<main id="view"></main><div class="footer">每隊例行賽 36 場｜聯盟共 126 場｜薪資上限 100M｜交易窗口第 8–32 場｜遊戲進度自動儲存</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=100,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];
const DATA=[['曹薰襄','呂濟而','劉元凱','高錦瑋','徐宏瑋','汪哲宇','丁冠皓','莊博元','林信寬','王皓吉','黃鎮','董永全'],['盧冠良','蔣淯安','周柏臣','陳振傑','馬建豪','張宗憲','吳家駿','林俊吉','簡偉儒','忻沃克','李德威','史承平'],['林書緯','蘇培凱','鍾理翔','李愷諺','簡祐哲','王柏智','林彥廷','呂政儒','蘇士軒','林金榜','熊祥泰','喬納森'],['梁瀚','盧冠軒','李啓瑋','徐小龍','高國豪','曾柏喻','朱雲豪','田浩','劉丞勳','蕭順議','李家瑞','蔡宸綱'],['黃泓瀚','簡廷兆','曾文鼎','陳懷安','阿巴西','李睿麒','林安龍','余維豪','魏嘉豪','謝亞軒','林任鴻','曾信武'],['錢肯尼','張耕淯','雷蒙恩','蘇奕晉','陳冠全','丁聖儒','魏芃禾','江均','劉彥廷','陳文宏','張兆辰','黃聰翰'],['余純安','廖偉皓','吳曉謹','陳懷安','勤明慶','魏莨哲','于煥亞','邱子軒','唐維傑','胡瓏貿','施晉堯','呂威霆']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let page='home',toastTimer;
function mkPlayer(name,ti,i){let rating=67+(i*7+ti*3)%20;return{id:`${ti}-${i}-${Math.random().toString(36).slice(2,6)}`,name,team:TEAMS[ti],pos:POS[(i+ti)%5],age:20+(i*3+ti)%12,rating,potential:Math.min(99,rating+8+(i%8)),salary:5+((i*3+ti)%6),starter:false,injury:0,stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}}}
function blankStandings(){return Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0,ptsFor:0,ptsAgainst:0}]))}
function fresh(){let rosters={};TEAMS.forEach((t,ti)=>{rosters[t]=DATA[ti].map((n,i)=>mkPlayer(n,ti,i));rosters[t].slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)});const s={team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,wins:0,losses:0,budget:20,pace:'balanced',rosters,standings:blankStandings(),schedule:makeSchedule(),history:[{text:'聯盟新賽季正式開始。',date:today()}],awards:[],seasonRecords:[],tradeUsed:false,postseason:null};return s}
function today(){return new Date().toLocaleDateString('zh-TW')}
// 六隊各交手六場：每隊36場，聯盟共126場。
function makeSchedule(){let games=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)games.push({a:k%2?TEAMS[j]:TEAMS[i],b:k%2?TEAMS[i]:TEAMS[j]});for(let i=games.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[games[i],games[j]]=[games[j],games[i]]}return games.map((g,i)=>({...g,id:i+1}))}
function normalize(raw){if(!raw||!raw.rosters)return fresh();let s={...fresh(),...raw};s.rosters=s.rosters||{};TEAMS.forEach((t,ti)=>{let players=Array.isArray(s.rosters[t])?s.rosters[t]:DATA[ti].map((n,i)=>mkPlayer(n,ti,i));s.rosters[t]=players.map((p,i)=>({...mkPlayer(p.name||DATA[ti][i%12],ti,i),...p,team:t,id:p.id||`${ti}-${i}`,injury:Math.max(0,Number(p.injury)||0),stats:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,...p.stats}}));if(!s.rosters[t].some(p=>p.starter))s.rosters[t].slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true)});s.season=Math.max(1,Number(s.season)||1);s.wins=Number(s.wins)||0;s.losses=Number(s.losses)||0;s.budget=Number.isFinite(+s.budget)?+s.budget:20;s.standings={...blankStandings(),...(s.standings||{})};TEAMS.forEach(t=>s.standings[t]={...blankStandings()[t],...(s.standings[t]||{})});const oldFormat=Array.isArray(raw.schedule)&&(raw.schedule.length!==LEAGUE_GAMES||TEAMS.some(t=>Number(raw.standings?.[t]?.g||0)>GAMES));s.schedule=oldFormat?makeSchedule():(Array.isArray(s.schedule)&&s.schedule.length?s.schedule:makeSchedule());s.gameIndex=oldFormat?0:clamp(Number(s.gameIndex)||Number(s.games)||0,0,LEAGUE_GAMES);if(oldFormat){s.standings=blankStandings();s.wins=0;s.losses=0;s.postseason=null;TEAMS.forEach(t=>rosterForMigration(s,t).forEach(p=>p.stats={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0}));s.history=Array.isArray(s.history)?s.history:[];s.history.unshift({text:'聯盟賽制更新為每隊36場；本季例行賽進度已重置以符合新賽程。',date:today()})}s.history=Array.isArray(s.history)?s.history:[];s.awards=Array.isArray(s.awards)?s.awards:[];s.seasonRecords=Array.isArray(s.seasonRecords)?s.seasonRecords:[];s.pace=['slow','balanced','fast'].includes(s.pace)?s.pace:'balanced';s.postseason=s.postseason||null;s.tradeUsed=!!s.tradeUsed;return s}
function rosterForMigration(s,t){return s.rosters[t]||[]}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器空間。');return false}}function notify(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2400)}function roster(t=state.team){return state.rosters[t]||[]}function availableStarters(t){return roster(t).filter(p=>p.starter&&p.injury<=0).sort((a,b)=>b.rating-a.rating).slice(0,5)}function teamOVR(t){let p=availableStarters(t);if(p.length<5)p=roster(t).filter(x=>x.injury<=0).sort((a,b)=>b.rating-a.rating).slice(0,5);return p.length?Math.round(p.reduce((a,x)=>a+x.rating,0)/p.length):45}function payroll(t=state.team){return roster(t).reduce((a,p)=>a+(Number(p.salary)||0),0)}function log(text){state.history.unshift({text,date:today()});if(state.history.length>250)state.history.length=250}
function standings(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l||TEAMS.indexOf(a.team)-TEAMS.indexOf(b.team))}
function renderHeader(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`總經理 ${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').textContent=`薪資 ${payroll()} / ${CAP}M`+ (payroll()>CAP?' 超額':'');$('#stats').innerHTML=`<div class="stat"><small>先發戰力</small><b>${teamOVR(state.team)} OVR</b></div><div class="stat"><small>戰績</small><b>${state.wins}-${state.losses}</b></div><div class="stat"><small>排名</small><b>第 ${standings().findIndex(x=>x.team===state.team)+1} 名</b></div><div class="stat"><small>聯盟賽程</small><b>${state.gameIndex}/${state.schedule.length} 場</b></div>`}
function playerRow(p,extra=''){return `<div class="entry"><div><b>${esc(p.name)}</b>${p.starter?'<span class="badge">先發</span>':''}<small class="meta">${esc(p.pos)} · ${p.age}歲 · ${p.salary}M · ${p.injury?`傷兵 ${p.injury} 場`:'健康'} · ${p.stats.gp?`${(p.stats.pts/p.stats.gp).toFixed(1)}分 ${(p.stats.reb/p.stats.gp).toFixed(1)}籃 ${(p.stats.ast/p.stats.gp).toFixed(1)}助`:'尚無數據'}</small></div><div class="actions"><span class="ovr">${p.rating}</span>${extra}</div></div>`}
function lineupHtml(){return `<div class="lineup">${POS.map((pos,i)=>{let p=availableStarters(state.team)[i];return `<div class="slot">${pos}<b>${p?esc(p.name):'輪替球員'}</b>${p?`${p.rating} OVR`:''}</div>`}).join('')}</div>`}
function home(){let next=state.schedule[state.gameIndex],played=state.standings[state.team].g;return `<div class="columns"><section class="card"><div class="card-head"><div><h3>${state.postseason?'季後賽':'例行賽'}</h3><small>${played}/${GAMES} 球隊賽事完成 · ${state.gameIndex}/${state.schedule.length} 聯盟賽事完成</small></div><span class="gold">${state.postseason?.champion?'賽季結束':''}</span></div>${state.postseason?playoffPanel():`<div class="notice">${played>=GAMES?'例行賽完成，請到「排名與季後賽」開始季後賽。':next?`下一場：${esc(next.a)} 對 ${esc(next.b)}。系統會按固定賽程模擬至你的下一場比賽，每隊共 ${GAMES} 場。`:'賽季賽程已完成。'}</div><div class="formrow"><label for="pace">球隊進攻節奏</label><select id="pace"><option value="slow" ${state.pace==='slow'?'selected':''}>慢節奏｜降低失誤、減少回合</option><option value="balanced" ${state.pace==='balanced'?'selected':''}>均衡節奏｜穩定攻守</option><option value="fast" ${state.pace==='fast'?'selected':''}>快速節奏｜增加得分與體能消耗</option></select></div><button class="btn gold" data-action="next-game" ${played>=GAMES||state.postseason?'disabled':''}>🏀 進行下一場</button>`}<button class="btn blue" data-page="standings">查看排名</button></section><section class="card"><div class="card-head"><h3>先發五人</h3><span class="gold">${teamOVR(state.team)} OVR</span></div>${lineupHtml()}<div class="notice">戰術節奏與先發球員能力會影響得分、籃板、助攻及勝率。</div></section></div><section class="card"><div class="card-head"><h3>聯盟排名</h3><small>全聯盟球隊同一賽程，每隊 ${GAMES} 場</small></div>${standings().map((x,i)=>`<div class="tableline"><span class="rank">${i+1}</span><span>${esc(x.team)}${x.team===state.team?'<span class="badge">我的球隊</span>':''}</span><b>${x.w}-${x.l}</b><small>${x.g}/${GAMES}</small></div>`).join('')}</section><section class="card"><div class="card-head"><h3>最近動態</h3><button class="btn small" data-page="history">全部紀錄</button></div>${state.history.slice(0,5).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')}</section>`}
function rosterPage(){return `<div class="card"><div class="card-head"><div><h3>固定陣容與替補深度</h3><small>每隊固定 12 位球員；你可調整先發輪換與管理傷兵。</small></div><span class="gold">薪資 ${payroll()} / ${CAP}M</span></div>${roster().map(p=>playerRow(p,`<button class="btn small" data-action="starter" data-id="${esc(p.id)}" ${p.injury?'disabled':''}>${p.starter?'改替補':'設先發'}</button>`)).join('')}</div>`}
function standingsPage(){const table=standings();let ps=state.postseason;return `<div class="card"><div class="card-head"><h3>年度總排名</h3><small>七隊完整聯盟戰績</small></div>${table.map((x,i)=>`<div class="tableline"><span class="rank">${i+1}</span><span>${esc(x.team)}${i<3?'<span class="badge">直晉</span>':i<5?'<span class="badge">挑戰賽</span>':''}</span><b>${x.w}-${x.l}</b><small>${x.g}/${GAMES}</small></div>`).join('')}</div><div class="card"><div class="card-head"><h3>季後賽分組</h3>${!ps&&state.standings[state.team].g===GAMES?'<button class="btn gold" data-action="start-playoffs">開始季後賽</button>':''}</div>${ps?playoffPanel():`<div class="notice">排名 1–3 直晉季後賽；第 4、5 名進行單場決勝挑戰賽，勝者對第 1 名；另一組由第 2 名對第 3 名。準決賽五戰三勝，總冠軍賽七戰四勝；第 6、7 名淘汰。</div>${state.standings[state.team].g<GAMES?'<small>完成例行賽後開放季後賽。</small>':''}`}</div><div class="card"><h3>本季球員數據</h3>${leagueLeaders()}</div>`}
function leagueLeaders(){let players=TEAMS.flatMap(t=>roster(t)).filter(p=>p.stats.gp>0).sort((a,b)=>b.stats.pts/b.stats.gp-a.stats.pts/a.stats.gp).slice(0,8);return players.length?players.map((p,i)=>`<div class="entry"><span>${i+1}. ${esc(p.name)} <small>(${esc(p.team)})</small></span><b>${(p.stats.pts/p.stats.gp).toFixed(1)} PPG · ${(p.stats.reb/p.stats.gp).toFixed(1)} RPG · ${(p.stats.ast/p.stats.gp).toFixed(1)} APG</b></div>`).join(''):'<div class="empty">尚無球員賽事數據。</div>'}
function playoffPanel(){const p=state.postseason;if(!p)return '';if(p.champion)return `<div class="notice">🏆 第 ${state.season} 季總冠軍：${esc(p.champion)}</div><button class="btn gold" data-action="new-season" ${state.season>=20?'disabled':''}>開始下一季</button>${state.season>=20?'<div class="notice">已達 20 季上限，請重新開始新王朝。</div>':''}`;let series=p.stage==='challenge'?p.challenge:p.stage==='semis'?p.semis[p.semiIndex]:p.final;return `<div class="bracket">${seriesBox(p.challenge,'挑戰賽｜4 vs 5')}${(p.semis||[]).map((s,i)=>seriesBox(s,`準決賽 ${i+1}`)).join('')}${p.final?seriesBox(p.final,'總冠軍賽'):''}</div><div class="notice">目前系列賽：${esc(series.a)} ${series.aw}-${series.bw} ${esc(series.b)} · ${series.best===1?'單場決勝':series.best===5?'五戰三勝':'七戰四勝'}</div><button class="btn gold" data-action="playoff-game">模擬系列賽下一場</button>`}
function seriesBox(s,title){return `<div class="series"><b>${title}</b><div class="entry"><span>${esc(s.a)}</span><strong>${s.aw}</strong></div><div class="entry"><span>${esc(s.b)}</span><strong>${s.bw}</strong></div><small>${s.winner?`勝者 ${esc(s.winner)}`:s.best===1?'單場決勝':s.best===5?'五戰三勝':'七戰四勝'}</small></div>`}
function marketPage(){let inWindow=state.standings[state.team].g>=8&&state.standings[state.team].g<=32&&!state.postseason;let teamsOther=TEAMS.filter(t=>t!==state.team);return `<div class="card"><div class="card-head"><div><h3>交易窗口</h3><small>例行賽第 8–32 場開放；球隊薪資上限 ${CAP}M。</small></div><span class="${inWindow?'green':'muted'}">${inWindow?'交易開放':'交易關閉'}</span></div><div class="notice">交易採一換一，雙方薪資總額交易後均不可超過 ${CAP}M。每個交易窗口可完成一次交易；傷兵也可交易。</div>${!inWindow?`<div class="empty">${state.postseason?'季後賽期間不可交易。':`目前你的賽程進度為第 ${state.standings[state.team].g} 場；請在第 8–32 場期間交易。`}</div>`:`<div class="formrow"><label>選擇交易球隊</label><select id="tradeTeam">${teamsOther.map(t=>`<option value="${esc(t)}">${esc(t)}（薪資 ${payroll(t)}M）</option>`).join('')}</select></div><div class="formrow"><label>你要送出的球員</label><select id="tradeMine">${roster().map(p=>`<option value="${esc(p.id)}">${esc(p.name)}｜${p.salary}M</option>`).join('')}</select></div><div class="formrow"><label>對方球員</label><select id="tradeTarget"></select></div><button class="btn gold" data-action="trade">確認交易</button>`}</div><div class="card"><h3>薪資狀況</h3><div class="entry"><span>目前薪資總額</span><b>${payroll()}M / ${CAP}M</b></div><div class="entry"><span>剩餘薪資空間</span><b>${Math.max(0,CAP-payroll())}M</b></div></div>`}
function awardsPage(){return state.awards.length?state.awards.slice().reverse().map(a=>`<div class="card"><div class="card-head"><h3>第 ${a.season} 季年度獎項</h3><span class="badge">總冠軍 ${esc(a.champion)}</span></div><div class="entry"><span>年度 MVP</span><b>${esc(a.mvp.name)} · ${a.mvp.ppg} PPG</b></div><div class="entry"><span>得分王</span><b>${esc(a.scoring.name)} · ${a.scoring.ppg} PPG</b></div><div class="entry"><span>年度最佳防守</span><b>${esc(a.defense.name)} · ${esc(a.defense.team)}</b></div><div class="entry"><span>年度最佳新秀</span><b>${esc(a.roy.name)} · ${esc(a.roy.team)}</b></div></div>`).join(''):'<div class="card empty">賽季總冠軍出爐後將自動公布 MVP、得分王、防守球員及年度新秀。</div>'}
function historyPage(){return `<div class="card"><div class="card-head"><h3>聯盟歷史紀錄</h3><small>${state.seasonRecords.length} 個已完成球季</small></div>${state.seasonRecords.length?state.seasonRecords.slice().reverse().map(r=>`<div class="entry"><div><b>第 ${r.season} 季｜冠軍：${esc(r.champion)}</b><small class="meta">例行賽排名：${r.standings.map((x,i)=>`${i+1}.${esc(x.team)} ${x.w}-${x.l}`).join('　')}</small><small class="meta">MVP：${esc(r.mvp)}</small></div><span>${esc(r.myRecord||'')}</span></div>`).join(''):'<div class="empty">完成第一季後，聯盟排名、冠軍與獎項會保存在這裡。</div>'}</div><div class="card"><h3>最近事件</h3>${state.history.slice(0,25).map(x=>`<div class="entry"><span>${esc(x.text)}</span><small>${esc(x.date)}</small></div>`).join('')}</div>`}
function render(){renderHeader();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='home'?home():page==='roster'?rosterPage():page==='standings'?standingsPage():page==='market'?marketPage():page==='awards'?awardsPage():historyPage();if(page==='market')fillTradeOptions()}
function fillTradeOptions(){let t=$('#tradeTeam'),dest=$('#tradeTarget');if(!t||!dest)return;const team=t.value||TEAMS.find(x=>x!==state.team);dest.innerHTML=roster(team).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}｜${p.salary}M｜${p.rating} OVR</option>`).join('')}
function gameFor(a,b){const startersA=availableStarters(a),startersB=availableStarters(b);const avgA=teamOVR(a),avgB=teamOVR(b);const pace=state.pace;const paceModifier=pace==='fast'?3:pace==='slow'?-2:0;let scoreA=Math.round(76+Math.random()*22+(avgA-70)*.65+paceModifier),scoreB=Math.round(76+Math.random()*22+(avgB-70)*.65+(pace==='fast'?2:pace==='slow'?-1:0));const tempoSuppression=(pace==='slow'&&Math.random()<.42)||(pace==='fast'&&Math.random()<.2);if(tempoSuppression){scoreA-=Math.floor(Math.random()*8);scoreB-=Math.floor(Math.random()*8)}if(scoreA===scoreB)scoreA+=1;const winner=scoreA>scoreB?a:b;const ra=state.standings[a],rb=state.standings[b];ra.g++;rb.g++;ra.ptsFor+=scoreA;ra.ptsAgainst+=scoreB;rb.ptsFor+=scoreB;rb.ptsAgainst+=scoreA;ra[winner===a?'w':'l']++;rb[winner===b?'w':'l']++;if(a===state.team){state.wins=ra.w;state.losses=ra.l}if(b===state.team){state.wins=rb.w;state.losses=rb.l}recordPlayerStats(a,scoreA,startersA,pace);recordPlayerStats(b,scoreB,startersB,pace);recoverAndInjure(a);recoverAndInjure(b);return{a,b,scoreA,scoreB,winner,tempoSuppression}}
function recordPlayerStats(team,score,starting,pace){let lineup=starting.length?starting:roster(team).filter(p=>p.injury<=0).sort((a,b)=>b.rating-a.rating).slice(0,5);let active=roster(team).filter(p=>p.injury<=0).sort((a,b)=>Number(b.starter)-Number(a.starter)||b.rating-a.rating).slice(0,8);if(!active.length)return;active.forEach((p,i)=>{p.stats.gp++;let share=i<5?.13:.055;let points=Math.max(0,Math.round(score*share+(p.rating-70)*.22+(pace==='fast'?1.5:0)+(Math.random()*5-2)));p.stats.pts+=points;p.stats.reb+=Math.max(0,Math.round((p.pos==='C'?6:2)+Math.random()*5+(p.rating-70)*.08));p.stats.ast+=Math.max(0,Math.round((p.pos==='PG'?4:1)+Math.random()*4+(p.rating-70)*.06));p.stats.stl+=Math.random()<.65?1:0;p.stats.blk+=(p.pos==='C'||p.pos==='PF')&&Math.random()<.48?1:0})}
function recoverAndInjure(team){for(const p of roster(team)){if(p.injury>0)p.injury--;else if(Math.random()<.012){p.injury=2+Math.floor(Math.random()*4);if(team===state.team)log(`${p.name} 比賽中受傷，預計缺席 ${p.injury} 場。`)}}}
function playNext(){if(state.postseason)return notify('季後賽進行中，請到排名頁模擬系列賽。');if(state.standings[state.team].g>=GAMES)return notify('你的 36 場例行賽已完成。');if($('#pace'))state.pace=$('#pace').value;const targetGames=state.standings[state.team].g+1;let report=null,simulated=0;while(state.gameIndex<state.schedule.length&&state.standings[state.team].g<targetGames){const fixture=state.schedule[state.gameIndex++];const result=gameFor(fixture.a,fixture.b);simulated++;if(fixture.a===state.team||fixture.b===state.team)report=result}if(targetGames===GAMES){while(state.gameIndex<state.schedule.length){const fixture=state.schedule[state.gameIndex++];const result=gameFor(fixture.a,fixture.b);simulated++;if(fixture.a===state.team||fixture.b===state.team)report=result}}if(state.gameIndex>=state.schedule.length)finishRegularSchedule();save();render();if(report)notify(`${report.winner===state.team?'獲勝':'落敗'}！${report.a} ${report.scoreA}：${report.scoreB} ${report.b} · 同步模擬 ${simulated} 場聯盟賽事`);else notify('聯盟賽程完成，已整理年度排名。')}
function finishRegularSchedule(){TEAMS.forEach(t=>{state.standings[t].g=GAMES});const me=state.standings[state.team];state.wins=me.w;state.losses=me.l;log(`全聯盟例行賽完成：七隊各打 ${GAMES} 場（共 ${LEAGUE_GAMES} 場）。${state.team} 戰績 ${me.w}-${me.l}，排名第 ${standings().findIndex(x=>x.team===state.team)+1}。`)}
function startPlayoffs(){if(state.standings[state.team].g<GAMES)return notify('完成每隊 36 場例行賽後才能進季後賽。');let order=standings().map(x=>x.team);state.postseason={stage:'challenge',challenge:{a:order[3],b:order[4],aw:0,bw:0,best:1,winner:null},semis:[],semiIndex:0,final:null,champion:null};log('季後賽分組完成：第 4 名對第 5 名進行單場決勝挑戰賽。');save();render()}
function currentSeries(){let p=state.postseason;if(!p||p.champion)return null;if(p.stage==='challenge')return p.challenge;if(p.stage==='semis')return p.semis[p.semiIndex];return p.final}
function playPlayoff(){const p=state.postseason,s=currentSeries();if(!s)return;let aOVR=teamOVR(s.a),bOVR=teamOVR(s.b),as=Math.round(82+Math.random()*18+(aOVR-70)*.6),bs=Math.round(82+Math.random()*18+(bOVR-70)*.6);if(as===bs)as++;if(as>bs)s.aw++;else s.bw++;log(`${s.a} ${as}：${bs} ${s.b}（系列賽 ${s.aw}-${s.bw}）。`);let needed=Math.ceil(s.best/2),winner=s.aw>=needed?s.a:s.bw>=needed?s.b:null;if(winner)advanceSeries(winner);save();render();notify(winner?`${winner} 贏下系列賽！`:`系列賽戰況 ${s.a} ${s.aw}-${s.bw} ${s.b}`)}
function advanceSeries(w){let p=state.postseason;if(p.stage==='challenge'){let order=standings().map(x=>x.team);p.challenge.winner=w;p.semis=[{a:order[0],b:w,aw:0,bw:0,best:5,winner:null},{a:order[1],b:order[2],aw:0,bw:0,best:5,winner:null}];p.stage='semis';p.semiIndex=0;log(`${w} 贏得單場挑戰賽，晉級對戰第一名 ${order[0]}。`);return}if(p.stage==='semis'){p.semis[p.semiIndex].winner=w;if(p.semiIndex===0){p.semiIndex=1;return}p.final={a:p.semis[0].winner,b:p.semis[1].winner,aw:0,bw:0,best:7,winner:null};p.stage='final';log(`總冠軍賽：${p.final.a} 對 ${p.final.b}。`);return}if(p.stage==='final'){p.champion=w;log(`🏆 ${w} 獲得第 ${state.season} 季總冠軍！`);awardSeason(w)}}
function awardSeason(champ){let players=TEAMS.flatMap(t=>roster(t)),qual=players.filter(p=>p.stats.gp);let avg=p=>p.stats.gp?p.stats.pts/p.stats.gp:0;let mvp=[...qual].sort((a,b)=>(avg(b)*.6+b.rating*.4)-(avg(a)*.6+a.rating*.4))[0]||players[0],scoring=[...qual].sort((a,b)=>avg(b)-avg(a))[0]||players[0],def=[...players].sort((a,b)=>(b.rating+b.stats.stl*2+b.stats.blk*2)-(a.rating+a.stats.stl*2+a.stats.blk*2))[0],rook=[...players].filter(p=>p.age<=22).sort((a,b)=>b.rating-a.rating)[0]||players[0];let rank=standings().map(x=>({...x}));let a={season:state.season,champion:champ,mvp:{name:mvp.name,ppg:avg(mvp).toFixed(1)},scoring:{name:scoring.name,ppg:avg(scoring).toFixed(1)},defense:{name:def.name,team:def.team},roy:{name:rook.name,team:rook.team}};state.awards.push(a);state.seasonRecords.push({season:state.season,champion,standings:rank,myRecord:`${state.wins}-${state.losses}`,mvp:mvp.name});log(`年度獎項：MVP ${mvp.name}、得分王 ${scoring.name}、最佳防守 ${def.name}、最佳新秀 ${rook.name}。`)}
function nextSeason(){if(state.season>=20)return notify('已達 20 季上限。');state.season++;state.gameIndex=0;state.wins=state.losses=0;state.budget+=12;state.standings=blankStandings();state.schedule=makeSchedule();state.postseason=null;state.tradeUsed=false;TEAMS.forEach(t=>roster(t).forEach(p=>{p.stats={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0};p.age++;p.injury=0;if(p.age>32&&Math.random()<.25)p.rating=Math.max(45,p.rating-1)}));log(`第 ${state.season} 季開始，聯盟新賽程已建立，每隊 ${GAMES} 場，共 ${LEAGUE_GAMES} 場。`);save();render()}
function trade(){if(state.standings[state.team].g<8||state.standings[state.team].g>32||state.postseason)return notify('交易窗口只在例行賽第 8–32 場開放。');if(state.tradeUsed)return notify('本次交易窗口已完成一筆交易。');let other=$('#tradeTeam')?.value,mine=roster().find(p=>p.id===$('#tradeMine')?.value),theirs=roster(other).find(p=>p.id===$('#tradeTarget')?.value);if(!mine||!theirs)return notify('請選擇交易雙方球員。');let myPayroll=payroll()-mine.salary+theirs.salary,otherPayroll=payroll(other)-theirs.salary+mine.salary;if(myPayroll>CAP||otherPayroll>CAP)return notify(`交易會超過薪資上限 ${CAP}M，無法完成。`);let mi=roster().indexOf(mine),oi=roster(other).indexOf(theirs);roster()[mi]=theirs;roster()[mi].team=state.team;roster()[mi].starter=mine.starter;roster(other)[oi]=mine;roster(other)[oi].team=other;roster(other)[oi].starter=theirs.starter;state.tradeUsed=true;log(`交易完成：${state.team} 送出 ${mine.name}，換回 ${theirs.name}（${other}）。`);save();render();notify('交易完成！')}
function starter(id){let p=roster().find(x=>x.id===id);if(!p)return;if(p.injury)return notify('受傷球員不可設定為先發。');if(p.starter){if(roster().filter(x=>x.starter).length<=5)return notify('至少需保留五位先發。');p.starter=false}else{if(roster().filter(x=>x.starter).length>=5)return notify('先發最多五位，請先替換一位。');p.starter=true}save();render()}
function settings(){let bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h3>球隊設定</h3><label>選擇經營球隊</label><select id="teamChoice">${TEAMS.map(t=>`<option ${t===state.team?'selected':''}>${esc(t)}</option>`).join('')}</select><label>總經理</label><input id="managerChoice" maxlength="24" value="${esc(state.manager)}"><div class="modal-actions"><button class="btn" data-action="close">取消</button><button class="btn gold" data-action="save-settings">儲存</button></div></div>`;document.body.appendChild(bg)}
function restart(){if(!confirm('確定重新開始？目前所有賽季資料會清除。'))return;state=fresh();page='home';save();render();notify('新王朝開始。')}
document.addEventListener('change',e=>{if(e.target.id==='tradeTeam')fillTradeOptions();if(e.target.id==='pace'){state.pace=e.target.value;save()}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0);return}switch(b.dataset.action){case'settings':settings();break;case'close':b.closest('.modalbg')?.remove();break;case'save-settings':state.team=$('#teamChoice').value;state.manager=$('#managerChoice').value.trim()||'總經理';state.wins=state.standings[state.team].w;state.losses=state.standings[state.team].l;save();render();document.querySelector('.modalbg')?.remove();break;case'next-game':playNext();break;case'starter':starter(b.dataset.id);break;case'trade':trade();break;case'start-playoffs':startPlayoffs();break;case'playoff-game':playPlayoff();break;case'new-season':nextSeason();break;case'restart':restart();break}});
function renderPageSafe(){try{render();save()}catch(err){console.error(err);$('#view').innerHTML=`<section class="card"><h3>遊戲載入遇到問題</h3><p class="muted">${esc(err.message||'未知錯誤')}</p><button class="btn" onclick="location.reload()">重新載入</button></section>`}}
renderPageSafe();
})();
</script></body></html>
