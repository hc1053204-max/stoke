<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1018">
<meta name="description" content="管理 TPBL 球隊陣容、薪資與賽季，朝總冠軍邁進。">
<title>FRONT OFFICE｜TPBL 籃球經理</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="awards.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div>
    <div class="top-actions"><button data-action="save">儲存</button><button data-action="export">匯出存檔</button><label class="button-label">匯入存檔<input id="importFile" type="file" accept="application/json" hidden></label></div>
  </header>
  <section class="hero"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="manager">經理名稱</button><button data-action="new" class="danger">重新開局</button></div></section>
  <nav class="tabs" aria-label="遊戲選單">
    <button data-page="home">總管中心</button><button data-page="roster">球員名單</button><button data-page="market">自由球員與交易</button><button data-page="season">賽季進度</button><button data-page="standings">排名與季後賽</button><button data-page="history">球隊日誌</button>
  </nav>
  <div id="pageRoot" aria-live="polite"></div>
  <footer class="footer">TPBL 球員池 · 存檔保存在此瀏覽器 · 非官方球迷作品</footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/schedule.js"></script>
<script src="js/trades.js"></script>
<script src="js/playoffs.js"></script>
<script src="js/awards.js"></script>
<script src="js/ui.js"></script>
<script src="js/awards-ui.js"></script>
</body>
</html>
