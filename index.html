<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#09131d;--panel:#14202d;--line:#2b3d50;--text:#eef4fb;--muted:#9cacc0;--gold:#edc36e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:1050px;margin:auto;padding:20px}header,.row,.entry,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}header,.actions{flex-wrap:wrap}.muted,small{color:var(--muted)}h1{margin:0}h2,h3{margin:.25em 0}.budget,.badge{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--gold)}.budget small{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:16px 0}.nav button{background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;white-space:nowrap}.nav button.active{color:var(--gold);border-bottom:2px solid var(--gold)}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#26374a;color:var(--text);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:var(--gold);color:#201b11;border-color:var(--gold);font-weight:700}.danger{background:#45292d;border-color:#74444b;color:#ffc7c7}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{padding:10px 0;border-bottom:1px solid #ffffff18}.entry:last-child{border:0}.form{display:grid;gap:8px;margin:12px 0}.form label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:10px;background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:5}.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}.empty{padding:16px;color:var(--muted)}@media(max-width:700px){.app{padding:12px}.columns{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<header><div><h1>🏀 FRONT OFFICE</h1><small>TPBL · DYNASTY MANAGER</small></div><div id="budget" class="budget"></div></header>
<section class="hero"><div class="row"><div><h2 id="teamName"></h2><p id="teamMeta" class="muted"></p></div><div class="actions"><button data-action="team">選擇球隊</button><button data-action="new">新賽季</button><button class="danger" data-action="restart">重新開始</button></div></div></section>
<nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="market">自由球員／洋將</button><button data-page="standings">聯盟排名</button></nav><main id="view"></main>
<div class="footer">TPBL 2024–25、2025–26、2026–27 賽季球員池｜新遊戲隨機分隊｜每隊 36 場、聯盟 126 場｜本土薪資上限 200M</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-optimized-v1',CAP=200,FOREIGN_CAP=40000,FOREIGN_LIMIT=4,GAMES=36,LEAGUE_GAMES=126,TEAMS=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'],POS=['PG','SG','SF','PF','C'];let page='home',state;
// 合併三個賽季的公開球員資料；同名去重。洋將以 | 分隔全名，避免把英文姓名拆成多位球員。
const LOCAL=['曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家駿 林俊吉 簡偉儒 李德威 史承平 林書緯 蘇培凱 鍾理翔 李愷諺 簡祐哲 王柏智 林彥廷 呂政儒 蘇士軒 林金榜 熊祥泰 梁瀚 盧冠軒 李啓瑋 徐小龍 高國豪 曾柏喻 朱雲豪 田浩 劉丞勳 蕭順議 李家瑞 蔡宸綱 黃泓瀚 簡廷兆 曾文鼎 陳懷安 阿巴西 李睿麒 林安龍 余維豪 魏嘉豪 謝亞軒 林任鴻 曾信武 林韋翰 李沛澄 錢肯尼 張耕淯 雷蒙恩 蘇奕晉 陳冠全 丁聖儒 魏芃禾 江均 劉彥廷 陳文宏 張兆辰 黃聰翰 謝銘駿 孫思堯 余純安 廖偉皓 吳曉謹 勤明慶 魏莨哲 于煥亞 邱子軒 唐維傑 胡瓏貿 施晉堯 呂威霆 吳彥侖 蘇文儒 林書豪 陳盈駿 林庭謙 林秉聖 劉錚 林志傑 陳又瑋 林宜輝'.split(' '),
'曹薰襄 呂濟而 劉元凱 高錦瑋 徐宏瑋 汪哲宇 丁冠皓 莊博元 林信寬 王皓吉 黃鎮 董永全 盧冠良 蔣淯安 周柏臣 陳振傑 馬建豪 張宗憲 吳家駿 林俊吉 簡偉儒 忻沃克 李德威 史承平 林書緯 蘇培凱 鍾理翔 李愷諺 簡祐哲 王柏智 林彥廷 呂政儒 蘇士軒 梁瀚 盧冠軒 李啓瑋 徐小龍 高國豪 曾柏喻 朱雲豪 田浩 劉丞勳 蕭順議 李家瑞 蔡宸綱 黃泓瀚 簡廷兆 曾文鼎 陳懷安 阿巴西 李睿麒 林安龍 余維豪 魏嘉豪 謝亞軒 林任鴻 曾信武 林韋翰 李沛澄 錢肯尼 張耕淯 雷蒙恩 蘇奕晉 陳冠全 丁聖儒 魏芃禾 江均 劉彥廷 陳文宏 張兆辰 黃聰翰 謝銘駿 孫思堯 余純安 廖偉皓 吳曉謹 勤明慶 魏莨哲 于煥亞 邱子軒 唐維傑 胡瓏貿 施晉堯 呂威霆 吳彥侖 蘇文儒 林廷謙'.split(' ')];
const IMPORTS='Ray McCallum|Malcolm Miller|Adrien Moerman|Michael Eric|Daron Russell|Kristijan Krajina|Ivan Aska|Nysier Brooks|Austin Daye|Sani Sakakini|Jason Washburn|Kenny Manigault|Axel Toupane|Lasan Kromah|Devin Williams|Egidijus Mockevicius|Landers Nolley|Earl Clark|Nate Laszewski|Kennedy Meeks|Beau Beech|Markus Loncar|Brandon Gilbeck|Aric Holman|Edgaras Zelionis|Craig Sword|Anthony Morse|Kaleb Wesson|Chris McCullough|Cheick Diallo|Trey Thompkins|Ben Bentil|Jalen Harris|Olufemi Olujobi|Drew Pember|Anzejs Pasecniks|TJ Holyfield|Marin Maric|Nemanja Radovic|Viktor Gaddefors|Marko Todorovic|Makur Maker|Michael Frazier|Darral Willis|Youssou Ndoye|Hunter Maldonado|Rade Zagorac|Stanton Kidd|Sim Bhullar|Justin Alston|Rosco Allen|Grant Basile|Gabriel Galvanini|Marvin Jones|Vladimir Brodziansky|Michael Beasley|Markel Crawford|Jonathan Lewis|Jaylen Johnson|Antony Diong|McAdoo|Cam Miller|Cromer|Aleksandar Marelja|Tyrus McGee|Bryan Griffin'.split('|');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function player(name,team,i,isForeign){const rating=(isForeign?73:65)+Math.floor(Math.random()*(isForeign?17:23));return{id:`p-${Math.random().toString(36).slice(2,10)}`,name,team,pos:POS[i%5],age:21+Math.floor(Math.random()*13),rating,potential:Math.min(99,rating+Math.floor(Math.random()*12)),salary:isForeign?0:5+Math.floor(Math.random()*10),salaryUsd:isForeign?8000+Math.floor(Math.random()*2000):null,isForeign,starter:false,injury:0,stats:{gp:0,pts:0}}}
function makeSchedule(){const a=[];for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++)for(let k=0;k<6;k++)a.push({a:TEAMS[i],b:TEAMS[j]});return shuffle(a).map((g,i)=>({...g,id:i+1}))}
function fresh(){const locals=shuffle([...new Set(LOCAL.flat())]),imports=shuffle([...new Set(IMPORTS)]),rosters={};TEAMS.forEach(t=>{const ls=locals.splice(0,12),fs=imports.splice(0,4);rosters[t]=[...ls.map((n,i)=>player(n,t,i,false)),...fs.map((n,i)=>player(n,t,i,true))];shuffle(rosters[t].filter(p=>!p.isForeign)).slice(0,5).forEach(p=>p.starter=true)});const freeAgents=[...locals.map((n,i)=>player(n,'自由球員',i,false)),...imports.map((n,i)=>player(n,'自由球員',i,true))];return{team:TEAMS[5],manager:'總經理',season:1,gameIndex:0,rosters,standings:Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}])),schedule:makeSchedule(),freeAgents}}
function normalize(raw){if(!raw||!raw.rosters)return fresh();const s={...raw};s.team=TEAMS.includes(s.team)?s.team:TEAMS[0];s.manager=s.manager||'總經理';s.season=Math.max(1,Number(s.season)||1);s.rosters=s.rosters||{};TEAMS.forEach((t,ti)=>{let list=Array.isArray(s.rosters[t])?s.rosters[t]:[];s.rosters[t]=list.map((p,i)=>{const f=!!(p.isForeign||p.foreign);return{...player(p.name||`球員${i+1}`,t,i,f),...p,team:t,id:p.id||`${t}-${i}`,isForeign:f,salary:f?0:Math.max(0,Number(p.salary)||0),salaryUsd:f?Math.max(0,Number(p.salaryUsd)||10000):null,stats:{gp:0,pts:0,...p.stats}}});let starters=s.rosters[t].filter(p=>p.starter).slice(0,5);s.rosters[t].forEach(p=>p.starter=starters.includes(p));if(starters.length<5)s.rosters[t].filter(p=>!p.isForeign&&!p.starter).slice(0,5-starters.length).forEach(p=>p.starter=true)});s.standings=s.standings||{};TEAMS.forEach(t=>{const r=s.standings[t]||{},w=Math.max(0,Number(r.w)||0),l=Math.max(0,Number(r.l)||0);s.standings[t]={...r,w,l,g:w+l}});if(!Array.isArray(s.schedule)||s.schedule.length!==LEAGUE_GAMES)s.schedule=makeSchedule();s.gameIndex=Math.max(0,Math.min(LEAGUE_GAMES,Number(s.gameIndex)||0));s.freeAgents=Array.isArray(s.freeAgents)?s.freeAgents:[];return s}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify('儲存失敗，請檢查瀏覽器儲存空間。');return false}}
function notify(msg){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=msg;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.remove(),2400)}
function isForeign(p){return!!(p&&(p.isForeign||p.foreign))}function roster(t=state.team){return state.rosters[t]||[]}function domPayroll(t=state.team){return roster(t).filter(p=>!isForeign(p)).reduce((n,p)=>n+(Number(p.salary)||0),0)}function impPayroll(t=state.team){return roster(t).filter(isForeign).reduce((n,p)=>n+(Number(p.salaryUsd)||0),0)}function ranked(){return TEAMS.map(t=>({team:t,...state.standings[t]})).sort((a,b)=>b.w-a.w||a.l-b.l)}
function render(){const r=state.standings[state.team];$('#teamName').textContent=state.team;$('#teamMeta').textContent=`${state.manager} · 第 ${state.season} 季 · 例行賽 ${r.g}/${GAMES} 場`;$('#budget').innerHTML=`本土薪資 ${domPayroll()} / ${CAP}M<small>洋將 ${roster().filter(isForeign).length}/${FOREIGN_LIMIT} 名 · US$${impPayroll().toLocaleString()}/${FOREIGN_CAP.toLocaleString()}</small>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='roster'?rosterPage():page==='market'?marketPage():page==='standings'?standingsPage():homePage()}
function homePage(){const r=state.standings[state.team];return `<div class="columns"><section class="card"><h3>例行賽進度</h3><p>${r.g}/${GAMES} 場；聯盟進度 ${state.gameIndex}/${LEAGUE_GAMES}</p><p class="muted">七隊彼此各交手六次，每隊 36 場、聯盟共 126 場。</p><button class="gold" data-action="play" ${r.g>=GAMES?'disabled':''}>模擬下一場</button></section><section class="card"><h3>聯盟戰績</h3>${ranked().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w}-${x.l} <small>${x.g}/${GAMES}</small></b></div>`).join('')}</section></div><section class="card"><h3>先發陣容</h3>${roster().filter(p=>p.starter).map(p=>`<div class="entry"><span>${esc(p.name)} · ${esc(p.pos)}</span><b>${p.rating} OVR</b></div>`).join('')}</section>`}
function rosterPage(){return `<section class="card"><h3>球員名單 · ${roster().length}/16</h3><p class="muted">新遊戲會從三季球員池隨機分隊。先發五人；「替換先發」可直接讓替補球員頂替。</p>${roster().map(p=>`<div class="entry"><span><b>${esc(p.name)}</b> ${p.starter?'<span class="badge">先發</span>':'<span class="muted">替補</span>'}<small class="muted"><br>${esc(p.pos)} · ${p.age} 歲 · ${isForeign(p)?`洋將 US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 ${Number(p.salary)||0}M`}</small></span><button data-action="${p.starter?'bench':'replace'}" data-id="${esc(p.id)}">${p.starter?'改為替補':'替換先發'}</button></div>`).join('')}</section>`}
function marketPage(){return `<section class="card"><h3>自由球員簽約</h3><p class="muted">本土薪資上限 200M；洋將最多四名、合計不超過 US$40,000；球員名單最多 16 人。</p>${state.freeAgents.length?state.freeAgents.map(p=>`<div class="entry"><span><b>${esc(p.name)}</b><small class="muted"><br>${isForeign(p)?`洋將 · US$${Number(p.salaryUsd||0).toLocaleString()}`:`本土 · ${p.salary}M`} · ${p.rating} OVR</small></span><button data-action="sign" data-id="${esc(p.id)}">簽下</button></div>`).join(''):'<p class="empty">目前沒有自由球員。</p>'}</section>`}
function standingsPage(){return `<section class="card"><h3>例行賽排名</h3>${ranked().map((x,i)=>`<div class="entry"><span>${i+1}. ${esc(x.team)}</span><b>${x.w} 勝 ${x.l} 敗 · ${x.g}/${GAMES}</b></div>`).join('')}</section>`}
function playFixture(f){const a=state.standings[f.a],b=state.standings[f.b];if(!a||!b||a.g>=GAMES||b.g>=GAMES)return;const rating=t=>{const ps=roster(t).filter(p=>p.starter&&!p.injury);return ps.length?ps.reduce((n,p)=>n+(Number(p.rating)||0),0)/ps.length:68};let sa=Math.round(80+Math.random()*22+(rating(f.a)-72)*.55),sb=Math.round(80+Math.random()*22+(rating(f.b)-72)*.55);if(sa===sb)sa++;a.g++;b.g++;if(sa>sb){a.w++;b.l++}else{b.w++;a.l++}for(const [team,score]of[[f.a,sa],[f.b,sb]])roster(team).filter(p=>p.starter&&!p.injury).forEach(p=>{p.stats.gp=(Number(p.stats.gp)||0)+1;p.stats.pts=(Number(p.stats.pts)||0)+Math.floor(score/5)})}
function playNext(){if(state.standings[state.team].g>=GAMES)return notify('你的例行賽已完成。');let found=false;while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];if(state.standings[f.a].g>=GAMES||state.standings[f.b].g>=GAMES)continue;playFixture(f);if(f.a===state.team||f.b===state.team){found=true;break}}if(state.standings[state.team].g>=GAMES){while(state.gameIndex<state.schedule.length){const f=state.schedule[state.gameIndex++];if(state.standings[f.a].g<GAMES&&state.standings[f.b].g<GAMES)playFixture(f)}notify('例行賽完成：七隊各 36 場。')}else if(!found)notify('賽程已結束，請重新開始賽季。');save();render()}
function setStarter(id,replace){const p=roster().find(x=>String(x.id)===id);if(!p)return;if(p.injury)return notify('受傷球員不能先發。');if(p.starter){if(roster().filter(x=>x.starter).length<=5)return notify('請以替補球員替換，確保先發維持五人。');p.starter=false}else{const ss=roster().filter(x=>x.starter);if(ss.length>=5){if(!replace)return notify('先發最多五人，請使用替換先發。');const out=ss.filter(x=>!x.injury).sort((a,b)=>(Number(a.rating)||0)-(Number(b.rating)||0))[0];if(!out)return notify('目前沒有可替換的健康先發。');out.starter=false}p.starter=true}save();render()}
function signPlayer(p){if(!p)return;const r=roster();if(r.length>=16)return notify('名單已滿（16 人）。');if(isForeign(p)){if(r.filter(isForeign).length>=FOREIGN_LIMIT)return notify('洋將名額已滿。');if(impPayroll()+Number(p.salaryUsd||0)>FOREIGN_CAP)return notify(`洋將薪資超過 US$${FOREIGN_CAP.toLocaleString()} 上限。`)}else if(domPayroll()+Number(p.salary||0)>CAP)return notify(`本土薪資超過 ${CAP}M 上限。`);r.push({...p,id:`signed-${Math.random().toString(36).slice(2,10)}`,team:state.team,starter:false});state.freeAgents=state.freeAgents.filter(x=>x.id!==p.id);save();render();notify(`已簽下 ${p.name}`)}
function restart(){if(!confirm('確定重新開始？目前存檔會清除，並重新隨機分配三季球員。'))return;state=fresh();page='home';save();render();notify('新遊戲已建立，球員已隨機分隊。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}switch(b.dataset.action){case'play':playNext();break;case'replace':setStarter(b.dataset.id,true);break;case'bench':setStarter(b.dataset.id,false);break;case'sign':signPlayer(state.freeAgents.find(p=>String(p.id)===b.dataset.id));break;case'restart':restart();break;case'team':{const t=prompt(`輸入球隊名稱：\n${TEAMS.join('\n')}`,state.team);if(TEAMS.includes(t)){state.team=t;save();render()}break}case'new':if(confirm('開始新賽季？保留球員名單，重新計算戰績及賽程。')){state.season++;state.gameIndex=0;state.standings=Object.fromEntries(TEAMS.map(t=>[t,{w:0,l:0,g:0}]));state.schedule=makeSchedule();TEAMS.forEach(t=>roster(t).forEach(p=>p.stats={gp:0,pts:0}));save();render()}break}});
render();save();
})();
</script></body></html>
