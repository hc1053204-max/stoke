<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>FRONT OFFICE｜TPBL 籃球經理</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--card:#141f2d;--line:#2b3b4f;--muted:#9aabbe;--text:#f1f5f9;--gold:#edc36e;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17283a,#0b1018 60%);color:var(--text);min-height:100vh}.app{max-width:1100px;margin:auto;padding:20px}.top,.row,.cardhead,.nav,.stats,.item,.actions,.modal-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:18px;letter-spacing:2px;margin:0}.brand small,small,.muted{color:var(--muted)}.balance,.stat,.card,.hero{border:1px solid var(--line);border-radius:14px}.balance{padding:10px 14px;color:var(--gold);font-weight:bold}.hero{padding:22px;margin:18px 0;background:linear-gradient(120deg,#1d3043,#17212d 65%,#30291d)}.hero h2{margin:6px 0;font-size:26px}.hero p{margin:0;color:var(--muted)}.gold{color:var(--gold)}.stats{justify-content:flex-start;flex-wrap:wrap;margin-top:18px}.stat{background:#0b1420aa;padding:10px 14px;min-width:125px}.stat small{display:block}.stat b{font-size:19px}.nav{justify-content:flex-start;overflow:auto;border-bottom:1px solid var(--line);margin:12px 0 18px}.nav button{white-space:nowrap;background:none;border:0;color:var(--muted);padding:11px 13px;border-bottom:2px solid transparent}.nav button.active{color:var(--gold);border-color:var(--gold)}.card{background:var(--card);padding:17px;margin-bottom:14px}.card h3{margin:0}.cardhead{margin-bottom:13px}.title{margin:12px 0}.title h2{margin:0}.title p{margin:5px 0;color:var(--muted)}.button{background:var(--gold);color:#18202a;border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.button.secondary{background:#26374a;color:var(--text);border:1px solid var(--line)}.button:disabled{opacity:.45;cursor:not-allowed}.button.small{font-size:12px;padding:7px 10px}.item{padding:11px 0;border-bottom:1px solid #ffffff12}.item:last-child{border:0}.meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}.ovr{color:var(--gold);font-weight:800;font-size:18px}.notice{background:#18283a;border:1px solid #314761;border-radius:9px;padding:11px;margin:10px 0;color:#c5d5e5}.empty{padding:22px;text-align:center;color:var(--muted)}.history{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff12}.modalbg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.modal label{display:block;margin:10px 0 4px;color:var(--muted)}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b1420;color:var(--text)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#111;padding:11px 16px;border-radius:9px;z-index:8}.footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{border:1px solid #967a43;border-radius:9px;padding:9px;text-align:center;background:#211f19;font-size:12px}.slot b{display:block;margin-top:5px}.actions{justify-content:flex-end}@media(max-width:700px){.app{padding:12px}.hero{padding:16px}.hero h2{font-size:22px}.stats{gap:7px}.stat{flex:1;min-width:calc(50% - 8px)}.lineup{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div style="font-size:28px">🏀</div><div><h1>FRONT OFFICE</h1><small>TPBL · BUILD YOUR DYNASTY</small></div></div><div class="balance" id="balance"></div></header><section class="hero"><div class="row"><div><div class="gold">YOUR FRANCHISE · MANAGER MODE</div><h2 id="teamName"></h2><p id="tagline"></p></div><button class="button secondary" data-action="settings">⚙ 球隊設定</button></div><div class="stats" id="stats"></div></section><nav class="nav"><button data-page="home">總覽</button><button data-page="roster">球員名單</button><button data-page="history">球隊紀錄</button><button data-page="market">球員市場</button><button data-page="draft">選秀</button></nav><main id="view"></main><div class="footer">球員姓名參考 TPBL 名單；遊戲評分與比賽結果為模擬數值。最多 20 季，進度自動儲存於此瀏覽器。</div></div>
<script>
(()=>{'use strict';
const KEY='front-office-tpbl-v5',MAX_SEASONS=20,GAMES=30,teams=['桃園台啤永豐雲豹','福爾摩沙台新夢想家','新北國王','新竹御嵿攻城獅','新北中信特攻','臺北台新戰神','高雄全家海神'];
const people=[['桃園台啤永豐雲豹','曹薰襄','呂濟而','劉元凱','高錦瑋','徐宏瑋','汪哲宇','丁冠皓','莊博元','林信寬','王皓吉','黃鎮','董永全','麥卡洛','米勒','克羅馬','迪亞洛'],['福爾摩沙台新夢想家','盧冠良','蔣淯安','周柏臣','湯普金斯','高柏鎧','霍爾曼','班提爾','陳振傑','馬建豪','張宗憲','吳家駿','林俊吉','簡偉儒','忻沃克','李德威','史承平'],['新北國王','林書緯','蘇培凱','鍾理翔','李愷諺','簡祐哲','王柏智','林彥廷','呂政儒','蘇士軒','林金榜','熊祥泰','喬納森','杰倫','飛米','奧帝','沃許本'],['新竹御忿攻城獅','梁瀚','盧冠軒','李啓瑋','徐小龍','高國豪','曾柏喻','朱雲豪','田浩','劉丞勳','蕭順議','李家瑞','蔡宸綱','德魯','帕塞獅','提傑','馬力'],['新北中信特攻','黃泓瀚','簡廷兆','曾文鼎','陳懷安','阿巴西','李睿麒','林安龍','余維豪','魏嘉豪','謝亞軒','林任鴻','曾信武','林韋翰','李沛澄','貝奇','內馬','飛克','馬可'],['臺北台新戰神','錢肯尼','張耕淯','雷蒙恩','蘇奕晉','陳冠全','梅克','弗利沙','威力斯','恩多','丁聖儒','魏芃禾','江均','劉彥廷','陳文宏','張兆辰','黃聰翰','謝銘駿','孫思堯'],['高雄全家海神','余純安','廖偉皓','吳曉謹','陳懷安','勤明慶','艾德','克力斯','杭特','賽克維奇','魏莨哲','于煥亞','邱子軒','唐維傑','胡瓏貿','施晉堯','呂威霆','吳彥侖','蘇文儒']];
const allPlayers=people.flatMap((row,ti)=>row.slice(1).map((name,i)=>({name,club:teams[ti],pos:['PG','SG','SF','PF','C'][i%5],age:20+(i*7+ti*3)%14,rating:64+(i*11+ti*5)%21,potential:77+(i*7+ti*3)%22,salary:5+((i*3+ti)%10)})));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let page='home',toastTimer;
function make(p,starter=false){return {...p,id:'p'+Math.random().toString(36).slice(2,10),starter}}
function fresh(){const chosen=[];const copy=allPlayers.slice();while(chosen.length<12){const i=Math.floor(Math.random()*copy.length);chosen.push(make(copy.splice(i,1)[0]))}chosen.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).forEach(p=>p.starter=true);return{team:teams[5],manager:'總經理',season:1,wins:0,losses:0,games:0,budget:30,roster:chosen,history:[{text:'球隊成立，王朝之路開始。',date:today()}],draft:null}}
function today(){return new Date().toLocaleDateString('zh-TW')}
function normalize(s){if(!s||!Array.isArray(s.roster))return fresh();s.season=clamp(Number(s.season)||1,1,MAX_SEASONS);s.wins=Number(s.wins)||0;s.losses=Number(s.losses)||0;s.games=Number(s.games)||s.wins+s.losses;s.budget=Number.isFinite(Number(s.budget))?Number(s.budget):30;s.history=Array.isArray(s.history)?s.history:[];s.roster=s.roster.map(p=>({...p,id:p.id||'p'+Math.random().toString(36).slice(2),starter:!!p.starter}));s.team=teams.includes(s.team)?s.team:teams[5];s.manager=s.manager||'總經理';return s}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('儲存失敗，請檢查瀏覽器空間。');return false}}
function toast(t){let n=$('#toast');if(!n){n=document.createElement('div');n.id='toast';n.className='toast';document.body.appendChild(n)}n.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2500)}
function starters(){return state.roster.filter(p=>p.starter)}function ovr(a=starters()){return a.length?Math.round(a.reduce((n,p)=>n+p.rating,0)/a.length):0}function log(text){state.history.push({text,date:today()});if(state.history.length>120)state.history.shift()}
function renderHeader(){$('#teamName').textContent=state.team;$('#balance').textContent=`預算 ${state.budget.toFixed(1)}M`;$ ('#tagline').textContent=`總經理 ${state.manager} · 第 ${state.season}/${MAX_SEASONS} 季 · ${state.draft?'選秀進行中':state.games>=GAMES?'本季結束':`例行賽 ${state.games}/${GAMES}`}`;$('#stats').innerHTML=`<div class="stat"><small>先發戰力</small><b>${ovr()} OVR</b></div><div class="stat"><small>本季戰績</small><b>${state.wins}-${state.losses}</b></div><div class="stat"><small>球員人數</small><b>${state.roster.length}/15</b></div><div class="stat"><small>選秀順位</small><b>${draftPosition()}${draftPosition()?' 順位':'—'}</b></div>`}
function draftPosition(){if(state.draft?.order)return state.draft.order.findIndex(x=>x===state.team)+1||0;const sorted=teams.slice().sort((a,b)=>winsFor(a)-winsFor(b));return sorted.indexOf(state.team)+1}function winsFor(t){return t===state.team?state.wins:Math.max(0,Math.floor((ovr(state.roster)-65)/2)+Math.floor(Math.random()*5))}
function card(p,extra=''){return `<div class="item"><div><b>${esc(p.name)}</b><small class="meta">${esc(p.club||'TPBL')} · ${p.pos} · ${p.age}歲 · ${p.starter?'先發':'替補'} · 薪資 ${p.salary}M</small></div><div class="actions"><span class="ovr">${p.rating}</span>${extra}</div></div>`}
function home(){return `<div class="card"><div class="cardhead"><div><h3>例行賽</h3><small class="muted">完成 ${GAMES} 場後參加選秀；最多 20 季。</small></div></div><div class="notice">先發陣容 ${starters().length}/5 · 五位先發才能進行比賽。</div><button class="button" data-action="game" ${starters().length!==5||state.games>=GAMES||state.draft?'disabled':''}>🏀 進行下一場</button> <button class="button secondary" data-page="draft" ${state.games<GAMES&&!state.draft?'disabled':''}>前往選秀</button> <button class="button secondary" data-action="restart">重新開始</button>${state.season>=MAX_SEASONS&&state.games>=GAMES?'<div class="notice">恭喜完成第 20 季！可重新開始新的王朝。</div>':''}</div><div class="card"><div class="cardhead"><h3>先發陣容</h3><span class="gold">${ovr()} OVR</span></div><div class="lineup">${['PG','SG','SF','PF','C'].map((pos,i)=>{const p=starters()[i];return `<div class="slot">${pos}<b>${p?esc(p.name):'待安排'}</b>${p?p.rating+' OVR':''}</div>`}).join('')}</div></div><div class="card"><div class="cardhead"><h3>最近紀錄</h3><button class="button small secondary" data-page="history">查看全部</button></div>${state.history.slice(-4).reverse().map(h=>`<div class="history"><span>${esc(h.text)}</span><small>${esc(h.date)}</small></div>`).join('')}</div>`}
function rosterPage(){return `<div class="title"><h2>TPBL 球員名單</h2><p>調整五位先發；本遊戲姓名參考 TPBL 球員名單。</p></div><div class="card">${state.roster.length?state.roster.map(p=>card(p,`<button class="button small ${p.starter?'secondary':''}" data-action="toggle" data-id="${esc(p.id)}">${p.starter?'改替補':'設先發'}</button>`)).join(''):'<div class="empty">尚無球員</div>'}</div>`}
function historyPage(){return `<div class="title"><h2>球隊紀錄</h2></div><div class="card">${state.history.slice().reverse().map(h=>`<div class="history"><span>${esc(h.text)}</span><small>${esc(h.date)}</small></div>`).join('')||'<div class="empty">尚無紀錄</div>'}</div>`}
function marketPage(){const names=new Set(state.roster.map(p=>p.name));const list=allPlayers.filter(p=>!names.has(p.name)).slice(0,25);return `<div class="title"><h2>TPBL 球員市場</h2><p>簽約扣除薪資預算；名單上限 15 人。</p></div><div class="card">${list.map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><small class="meta">${esc(p.club)} · ${p.pos} · ${p.age}歲 · 潛力 ${p.potential} · 薪資 ${p.salary}M</small></div><div class="actions"><span class="ovr">${p.rating}</span><button class="button small" data-action="sign" data-index="${i}" ${state.roster.length>=15||state.budget<p.salary?'disabled':''}>${state.roster.length>=15?'名單已滿':state.budget<p.salary?'預算不足':'簽約'}</button></div></div>`).join('')||'<div class="empty">沒有可簽約球員</div>'}</div>`}
function startDraft(){if(state.games<GAMES)return toast('完成本季 30 場賽事後才能選秀。');if(state.season>=MAX_SEASONS)return toast('已完成第 20 季，請重新開始。');const otherWins=teams.filter(t=>t!==state.team).map((t,i)=>({t,w:Math.floor(10+Math.random()*18)}));const order=[{t:state.team,w:state.wins},...otherWins].sort((a,b)=>a.w-b.w).map(x=>x.t);const owned=new Set(state.roster.map(p=>p.name));const pool=allPlayers.filter(p=>!owned.has(p.name)).sort(()=>Math.random()-.5).slice(0,Math.min(14,allPlayers.length-owned.size));state.draft={order,round:1,pick:0,pool,selected:[]};log(`第 ${state.season} 季結束；抽籤後取得第 ${order.indexOf(state.team)+1} 順位。`);save()}
function draftPage(){if(!state.draft)return `<div class="title"><h2>TPBL 選秀</h2><p>每季例行賽結束後進行一輪七隊選秀，戰績較差球隊順位較前。</p></div><div class="card"><div class="notice">${state.games<GAMES?`完成 ${GAMES-state.games} 場比賽後開放選秀。`:`第 ${state.season} 季例行賽已完成，可以開始選秀。`}</div><button class="button" data-action="start-draft" ${state.games<GAMES||state.season>=MAX_SEASONS?'disabled':''}>開始選秀</button></div>`;const d=state.draft,team=d.order[d.pick],myTurn=team===state.team;return `<div class="title"><h2>第 ${state.season} 季選秀 · 第 ${d.round} 輪</h2><p>你的順位：第 ${d.order.indexOf(state.team)+1} 順位 · 目前第 ${d.pick+1}/${d.order.length} 順位</p></div><div class="card"><div class="notice">${myTurn?'輪到你選人！':`目前 ${esc(team)} 選秀中…`}</div><h3>選秀順序</h3>${d.order.map((t,i)=>`<div class="item"><span>${i+1}. ${esc(t)} ${i===d.pick?'← 選擇中':''}</span><small>${i<d.pick?'已完成':'等待'}</small></div>`).join('')}</div><div class="card"><h3>可選球員</h3>${d.pool.length?d.pool.map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><small class="meta">${esc(p.club)} · ${p.pos} · ${p.age}歲 · 潛力 ${p.potential}</small></div><div class="actions"><span class="ovr">${p.rating}</span><button class="button small" data-action="pick-player" data-index="${i}" ${!myTurn||state.roster.length>=15?'disabled':''}>${state.roster.length>=15?'名單已滿':'選擇'}</button></div></div>`).join(''):'<div class="empty">沒有可選球員</div>'}</div>`}
function render(){renderHeader();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#view').innerHTML=page==='home'?home():page==='roster'?rosterPage():page==='history'?historyPage():page==='market'?marketPage():draftPage()}
function nextPick(){const d=state.draft;if(d.pick>=d.order.length){state.draft=null;state.season=Math.min(MAX_SEASONS,state.season+1);state.games=state.wins=state.losses=0;state.budget=Math.round((state.budget+8)*10)/10;state.roster.forEach(p=>{p.age++;if(p.age>31&&Math.random()<.3)p.rating=Math.max(40,p.rating-1)});log(`進入第 ${state.season} 季，獲得 8M 預算。`);return}if(d.order[d.pick]!==state.team&&d.pool.length){const p=d.pool.splice(0,1)[0];d.selected.push({team:d.order[d.pick],name:p.name});log(`${d.order[d.pick]} 選擇 ${p.name}。`);d.pick++}if(d.pick>=d.order.length){nextPick();return}if(d.order[d.pick]!==state.team){nextPick()}}
function choose(i){const d=state.draft;if(!d||d.order[d.pick]!==state.team)return toast('尚未輪到你的選秀順位。');if(state.roster.length>=15)return toast('名單已滿，請先調整至 14 人以下。');const p=d.pool[i];if(!p)return;state.roster.push(make(p,false));d.selected.push({team:state.team,name:p.name});log(`選秀第 ${d.pick+1} 順位：${p.name}（${p.club}）。`);d.pool.splice(i,1);d.pick++;nextPick();save();render();toast('選秀完成！')}
function simulate(){if(starters().length!==5)return toast('請先安排五位先發。');if(state.games>=GAMES)return toast('本季已結束，請前往選秀。');if(state.draft)return toast('選秀進行中。');const won=ovr()+Math.random()*22>=76+Math.random()*20;state.games++;if(won)state.wins++;else state.losses++;log(`第 ${state.games} 場：${won?'獲勝':'落敗'}。`);if(state.games===GAMES)log(`第 ${state.season} 季例行賽結束，戰績 ${state.wins}-${state.losses}。`);save();render();toast(won?'比賽獲勝！':'比賽落敗，再接再厲！')}
function settings(){const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><h3>球隊設定</h3><label>球隊</label><select id="teamChoice">${teams.map(t=>`<option ${t===state.team?'selected':''}>${esc(t)}</option>`).join('')}</select><label>總經理名稱</label><input id="managerChoice" maxlength="24" value="${esc(state.manager)}"><div class="modal-actions"><button class="button secondary" data-action="close">取消</button><button class="button" data-action="save-settings">儲存</button></div></div>`;document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()}}
function restart(){if(!confirm('確定要重新開始？目前球隊、紀錄與進度都會清除。'))return;state=fresh();page='home';save();render();toast('新王朝已開始！')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();scrollTo(0,0);return}switch(b.dataset.action){case'settings':settings();break;case'close':b.closest('.modalbg').remove();break;case'save-settings':state.team=$('#teamChoice').value;state.manager=$('#managerChoice').value.trim()||'總經理';b.closest('.modalbg').remove();save();render();break;case'restart':restart();break;case'game':simulate();break;case'toggle':{const p=state.roster.find(x=>x.id===b.dataset.id);if(!p)return;if(p.starter&&starters().length<=5)return toast('至少需要五位先發。');if(!p.starter&&starters().length>=5)return toast('先發最多五位，請先調整一位。');p.starter=!p.starter;save();render();break}case'sign':{const list=allPlayers.filter(p=>!new Set(state.roster.map(x=>x.name)).has(p.name)).slice(0,25),p=list[Number(b.dataset.index)];if(!p)return;if(state.roster.length>=15)return toast('球員名單已滿。');if(state.budget<p.salary)return toast('預算不足。');state.roster.push(make(p));state.budget=Math.round((state.budget-p.salary)*10)/10;log(`簽下 TPBL 球員 ${p.name}（${p.club}），薪資 ${p.salary}M。`);save();render();toast('簽約完成！');break}case'start-draft':startDraft();nextPick();save();render();break;case'pick-player':choose(Number(b.dataset.index));break}});
render();save();
})();
</script></body></html>
