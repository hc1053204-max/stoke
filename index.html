<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#0e1420;--panel:#172131;--panel2:#1d2a3d;--line:#34445a;--muted:#aab8ca;--gold:#f3c76b;--green:#73d3ad;--red:#fa8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#293954,var(--bg) 62%);color:#f4f6fa;min-height:100vh}.app{width:min(1160px,100%);margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border:1px solid #53667f;border-radius:13px;background:linear-gradient(145deg,#293b54,#172232);font-size:23px}.brand h1{font-size:clamp(18px,3vw,26px);margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.btn{border:1px solid #51637a;border-radius:9px;padding:10px 15px;background:#26364b;color:#f5f7fb;font:650 13px inherit;font-family:inherit;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}.btn.primary{background:var(--gold);border-color:#ffe19b;color:#1b2028}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px}.side,.panel{background:linear-gradient(150deg,#1b2738f5,#141d2af5);border:1px solid var(--line);border-radius:14px}.side{padding:14px;height:max-content;position:sticky;top:14px}.team-summary{padding:12px;border-radius:10px;background:#222f42;margin-bottom:13px}.team-summary .label,.muted{color:var(--muted);font-size:12px}.team-summary strong{display:block;color:var(--gold);font-size:18px;margin:5px 0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#c5d0df;border:0;text-align:left;padding:11px 12px;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#2a3b52;color:#fff}.side-note{margin-top:14px;padding:11px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.55}.main{min-width:0}.panel{padding:clamp(16px,3vw,25px);min-height:420px}.intro{max-width:760px;margin:auto;padding:24px 0}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.13em}.intro h2{font-size:clamp(30px,5vw,52px);line-height:1.13;margin:12px 0}.intro>p{color:#bdc9d8;line-height:1.8}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.feature{padding:14px;background:#202d40;border:1px solid #35465d;border-radius:11px}.feature b{display:block;margin-bottom:5px}.feature span{color:var(--muted);font-size:12px;line-height:1.5}.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:22px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.field input,.field select{background:#101a28;color:#fff;border:1px solid #4a5b72;border-radius:8px;padding:11px 12px;font:inherit;min-width:200px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.title-row h2{margin:0;font-size:25px}.title-row p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{padding:14px;border:1px solid var(--line);border-radius:10px;background:#1e2b3d}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:7px;color:var(--gold)}.stat small{color:var(--muted);font-size:11px}.grid-two{display:grid;grid-template-columns:1.1fr .9fr;gap:13px}.box{padding:15px;border:1px solid var(--line);background:#192536;border-radius:11px;margin:10px 0}.box h3{margin:0 0 11px;font-size:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{text-align:left;color:#9eafc4;font-weight:600;padding:9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #2c394a}tr:last-child td{border-bottom:0}.player-name{font-weight:700}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#293b52;color:#bdcde0;font-size:10px}.rating{color:var(--gold);font-weight:800}.positive{color:var(--green)}.negative{color:var(--red)}.notice{padding:12px 14px;border:1px solid #8a7047;background:#42351f80;border-radius:9px;color:#ffdfa0;line-height:1.55;font-size:13px;margin:12px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.player-card{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:#1b283a;border-radius:10px;padding:12px}.player-card .info{min-width:0}.player-card b{display:block;font-size:13px}.player-card small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.selection-count{color:var(--gold);font-weight:700}.bar{height:8px;background:#344256;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6acba6,#f3c76b)}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.history-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.footer{color:#8594a8;text-align:center;font-size:11px;line-height:1.65;margin:22px auto 0;max-width:850px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f3c76b;color:#161c25;padding:11px 17px;border-radius:9px;font-weight:750;font-size:13px;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#050910c9;display:grid;place-items:center;padding:16px;z-index:4}.modal{width:min(580px,100%);background:#1a2637;border:1px solid #52647a;border-radius:14px;padding:22px}.modal h2{margin:0 0 7px}.modal p{color:#b7c5d6;line-height:1.65;font-size:13px}.modal select{width:100%;padding:11px;margin:9px 0 15px;background:#101a28;color:#fff;border:1px solid #53657c;border-radius:8px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px 3px;font-size:11px}.team-summary{display:flex;align-items:center;justify-content:space-between;gap:10px}.team-summary strong{margin:0}.team-summary .label{display:none}.side-note{display:none}}@media(max-width:560px){.app{padding:14px 10px 35px}.topright .save-label{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid-two,.player-grid{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.title-row{flex-direction:column}.panel{padding:14px}.nav{grid-template-columns:repeat(5,minmax(0,1fr))}.nav button{font-size:10px}.setup .field,.field input,.field select{width:100%;min-width:0}.setup{display:grid}.history-row{grid-template-columns:50px 1fr auto}}
</style>

<body><div class="app"><header class="top"><div class="brand"><div class="logo">🏀</div><div><h1>NBA Fantasy 王朝</h1><p>二十季重建聯盟 · 球隊總經理模擬</p></div></div><div class="topright"><span id="saveStatus">存檔保存在此瀏覽器</span><button class="btn small" id="resetBtn">新開存檔</button></div></header><div id="root"></div><footer class="footer">本作為非官方籃球經營模擬作品。球員及球隊資料皆為虛構或遊戲模擬內容，不代表真實評價，亦不代表與任何聯盟、球隊或球員有所隸屬、授權或合作。遊戲存檔只存在你的瀏覽器中。</footer></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='neon-dynasty-save-v1';
const franchises=['波士頓','布魯克林','紐約','費城','多倫多','芝加哥','克里夫蘭','底特律','印第安納','密爾瓦基','亞特蘭大','夏洛特','邁阿密','奧蘭多','華盛頓','丹佛','明尼蘇達','奧克拉荷馬城','波特蘭','猶他','金州','洛杉磯（快艇）','洛杉磯（湖人）','鳳凰城','沙加緬度','達拉斯','休士頓','曼菲斯','紐奧良','聖安東尼奧'];
const first=['林恩','陳凱','王子豪','張宇','林冠廷','陳柏翰','周以安','李承恩','黃睿哲','吳家豪','許皓鈞','趙明軒','楊曜任','郭品澤','方允成','高晨','江昀','鄭翔','羅子維','蔡昀哲','Miles','Jordan','Cameron','Darius','Jalen','Noah','Kai','Ethan','Marcus','Zion','Trey','Devin','Andre','Isaiah','Cole','Rico','Nico','Jamal','Tyler','Dylan'];
const last=['周','林','陳','高','黃','吳','王','李','張','楊','郭','許','鄭','蔡','葉','沈','杜','趙','何','劉','Carter','Brooks','Reed','Bennett','Mitchell','Turner','Hayes','Foster','Cooper','Parker','Young','Ward','Price','Powell','Bailey','Ross','Gray','Evans','Morris','Bell'];
const positions=['PG','SG','SF','PF','C'];let uid=1;
function seededPlayer(ratingMin=48,ratingMax=85,year=1){const pos=positions[Math.floor(Math.random()*5)],rating=Math.floor(ratingMin+Math.random()*(ratingMax-ratingMin+1));const age=year===1?Math.floor(20+Math.random()*13):Math.floor(19+Math.random()*9);return{id:uid++,name:`${first[Math.floor(Math.random()*first.length)]} ${last[Math.floor(Math.random()*last.length)]}`,pos,rating,potential:Math.min(99,rating+Math.floor(Math.random()*22)),age,salary:Math.max(1,Math.round((rating-35)*.38+Math.random()*5)),years:1+Math.floor(Math.random()*4),injured:0,rookie:false};}
function rosterRating(r){if(!r?.length)return 50;return Math.round(r.slice().sort((a,b)=>b.rating-a.rating).slice(0,8).reduce((s,p)=>s+p.rating,0)/Math.min(8,r.length));}
function totalSalary(r){return (r||[]).reduce((s,p)=>s+p.salary,0);}
function makeTeam(name,isUser=false){const roster=Array.from({length:10},()=>seededPlayer(53,83,1));return{name,isUser,roster,wins:0,losses:0,owner:70,championships:0};}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.userTeam&&Array.isArray(d.teams)){uid=d.nextId||5000;return d;}}catch(e){}return null;}
let state=load(),tab='home',setupPool=[],draftPool=[],toastTimer;
const root=document.querySelector('#root');
function save(){if(state){state.nextId=uid;localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#saveStatus').textContent='已自動存檔';}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return `$${n}M`;}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100);}
function fmtPlayer(p){return `<span class="player-name">${esc(p.name)}</span> <span class="tag">${p.pos}</span>`;}
function startSetup(){const name=document.querySelector('#teamName').value.trim()||'新城拓荒者';const team=makeTeam(name,true);const others=franchises.map(n=>makeTeam(n));setupPool=Array.from({length:50},()=>seededPlayer(58,88,1)).sort((a,b)=>b.rating-a.rating);state={userTeam:name,teams:[...others,team],year:1,phase:'expansion',expansion:[],history:[],awards:[],champion:null,seasonLog:[],draftPick:null,playoffTeams:[],round:0,rounds:[],tactic:null};tab='roster';render();}
function enterLeague(){const u=user();u.roster=[...state.expansion];if(u.roster.length<8){toast('請至少選 8 位球員');return;}state.phase='regular';state.expansion=null;save();tab='home';render();toast('聯盟成立！二十季王朝現在開始。');}
function user(){return state.teams.find(t=>t.isUser);}
function nav(){return `<aside class="side"><div class="team-summary"><div><div class="label">你的球隊</div><strong>${esc(state.userTeam)}</strong></div><div class="muted">第 ${state.year} 季 · ${state.phase==='playoffs'?'季後賽':state.phase==='regular'?'例行賽':state.phase==='draft'?'選秀':'擴編選秀'}</div></div><nav class="nav">${[['home','總覽'],['roster','陣容'],['market','自由市場'],['standings','戰績'],['history','王朝史']].map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav><div class="side-note">球隊評分 <b class="rating">${rosterRating(user().roster)}</b><br>薪資 ${money(totalSalary(user().roster))} / ${money(state.cap)}<br>老闆耐心 ${user().owner}%</div></aside>`;}
function shell(content){root.innerHTML=`<div class="layout">${nav()}<main class="main"><section class="panel">${content}</section></main></div>`;root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});}
function render(){if(!state){renderIntro();return;}if(state.phase==='expansion'){renderExpansion();return;}const content={home:homeHTML,roster:rosterHTML,market:marketHTML,standings:standingsHTML,history:historyHTML}[tab]();shell(content);bindActions();}
function renderIntro(){root.innerHTML=`<section class="panel"><div class="intro"><div class="eyebrow">FREE · BROWSER GM SIMULATION</div><h2>從一張白紙，<br><span style="color:var(--gold)">打造二十季王朝。</span></h2><p>建立你的擴張球隊，從候選球員中挑選首批陣容，在薪資上限下經營球隊、簽下自由球員、培養新秀並挑戰季後賽。每個球季都會留下記錄，存檔保存在你的瀏覽器。</p><div class="feature-grid"><div class="feature"><b>🧢 擴編選秀</b><span>從候選池挑選球員，在薪資上限內組成首發陣容。</span></div><div class="feature"><b>📈 經營球隊</b><span>球員成長與老化、合約到期、傷病與老闆耐心。</span></div><div class="feature"><b>🏆 季後賽戰術</b><span>逐輪選擇戰術，依球隊實力和對手陣容模擬系列賽。</span></div><div class="feature"><b>💾 二十季存檔</b><span>自由球員、年度選秀、冠軍紀錄與獎項都會自動保存。</span></div></div><div class="setup"><label class="field">你的擴張隊名稱<input id="teamName" maxlength="24" placeholder="例如：新城拓荒者" value="新城拓荒者"></label><button class="btn primary" id="createLeague">建立聯盟並選球員</button></div><p class="muted" style="font-size:11px">提示：本作是簡化版球隊經營模擬。球員資料為隨機生成的虛構遊戲數值，不代表任何真實球員。</p></div></section>`;document.querySelector('#createLeague').onclick=startSetup;}
function renderExpansion(){const picked=state.expansion||[];root.innerHTML=`<section class="panel"><div class="title-row"><div><div class="eyebrow">EXPANSION DRAFT · SEASON 1</div><h2>為 ${esc(state.userTeam)} 挑選建隊核心</h2><p>從候選球員中選出 8–12 人。球隊薪資上限為 ${money(state.cap)}，留意總薪資和球員評分。</p></div><div class="selection-count">已選 ${picked.length} / 8–12 人</div></div><div class="cards"><div class="stat"><span>目前球隊評分</span><strong>${rosterRating(picked)}</strong></div><div class="stat"><span>總薪資</span><strong>${money(totalSalary(picked))}</strong></div><div class="stat"><span>剩餘薪資空間</span><strong>${money(Math.max(0,state.cap-totalSalary(picked)))}</strong></div><div class="stat"><span>球員名額</span><strong>${picked.length} / 15</strong></div></div><div class="notice">候選池包含 50 位可選球員。評分較高的球員通常薪資也較高；至少選 8 人後即可開始聯盟。</div><div class="player-grid">${setupPool.map(p=>{const yes=picked.some(x=>x.id===p.id);const disabled=!yes&&(picked.length>=15||totalSalary(picked)+p.salary>state.cap);return `<div class="player-card"><div class="info">${fmtPlayer(p)}<small>評分 ${p.rating} · 年齡 ${p.age} · 薪資 ${money(p.salary)} · 合約 ${p.years} 年</small></div><button class="btn small ${yes?'primary':''}" data-pick="${p.id}" ${disabled?'disabled':''}>${yes?'已選 ✓':'選擇'}</button></div>`;}).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" id="finishExpansion" ${picked.length<8?'disabled':''}>完成選秀，進入第 1 季</button><button class="btn" id="clearExpansion">重選</button></div></section>`;root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const p=setupPool.find(x=>x.id==b.dataset.pick),arr=state.expansion;if(arr.some(x=>x.id===p.id))state.expansion=arr.filter(x=>x.id!==p.id);else if(arr.length<15&&totalSalary(arr)+p.salary<=state.cap)state.expansion.push(p);else toast('名額已滿或超過薪資上限');renderExpansion();});document.querySelector('#finishExpansion').onclick=enterLeague;document.querySelector('#clearExpansion').onclick=()=>{state.expansion=[];renderExpansion();};}
function homeHTML(){const u=user(),sorted=state.teams.slice().sort((a,b)=>b.wins-a.wins||rosterRating(b.roster)-rosterRating(a.roster)),rank=sorted.findIndex(t=>t.isUser)+1,rec=state.history.at(-1),top=u.roster.slice().sort((a,b)=>b.rating-a.rating).slice(0,3);let phaseBlock='';if(state.phase==='regular')phaseBlock=`<div class="notice"><b>第 ${state.year} 季進行中。</b> 你可以先調整陣容，再開始模擬例行賽（每隊 82 場）。模擬後前 8 名進入季後賽。</div><div class="actions"><button class="btn primary" data-action="simulate">模擬 82 場例行賽</button><button class="btn" data-tab="market">前往自由市場</button></div>`;else if(state.phase==='playoffs')phaseBlock=playoffPanel();else if(state.phase==='draft')phaseBlock=`<div class="notice"><b>休賽季選秀。</b> 選擇一位新秀加入球隊，之後開始第 ${state.year} 季。</div><div class="actions"><button class="btn primary" data-tab="roster">查看選秀名單</button></div>`;else phaseBlock=`<div class="notice">二十季旅程已完成！你可以繼續查看陣容、戰績與王朝史，也可以建立新存檔。</div>`;return `<div class="title-row"><div><div class="eyebrow">FRONT OFFICE · SEASON ${state.year}</div><h2>${esc(state.userTeam)} 總經理辦公室</h2><p>${state.phase==='regular'?'新賽季已準備就緒。決定你的球隊策略，向季後賽邁進。':state.phase==='playoffs'?'季後賽每輪都要下達戰術指令。':state.phase==='draft'?'選秀與休賽季管理。':'王朝之旅'}</p></div><span class="tag">${state.year} / 20 季</span></div><div class="cards"><div class="stat"><span>球隊評分</span><strong>${rosterRating(u.roster)}</strong><small>聯盟第 ${rank} 名</small></div><div class="stat"><span>陣容人數</span><strong>${u.roster.length}<small> / 15 人</small></strong></div><div class="stat"><span>薪資上限</span><strong>${money(totalSalary(u.roster))}</strong><small>上限 ${money(state.cap)}</small></div><div class="stat"><span>老闆耐心</span><strong>${u.owner}%</strong><small>${u.championships} 次總冠軍</small></div></div>${phaseBlock}<div class="grid-two"><div class="box"><h3>球隊核心</h3>${top.length?`<div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>評分</th><th>年齡</th></tr></thead><tbody>${top.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="tag">${p.pos}</span></td><td class="rating">${p.rating}</td><td>${p.age}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未加入球員</div>'}</div><div class="box"><h3>最近賽季</h3>${rec?`<p style="line-height:1.8;color:#c7d2df">第 ${rec.year} 季：${rec.wins} 勝 ${rec.losses} 敗<br>聯盟排名第 ${rec.rank} 名<br>${rec.champion===u.name?'<b class="positive">🏆 總冠軍</b>':`冠軍：${esc(rec.champion)}`}</p>`:`<p class="muted">還沒有完成的球季。第一步：打造陣容並開始例行賽。</p>`}</div></div>`;}
function rosterHTML(){const u=user(),players=u.roster.slice().sort((a,b)=>b.rating-a.rating);return `<div class="title-row"><div><div class="eyebrow">TEAM ROSTER</div><h2>球隊陣容</h2><p>球員會隨年齡與出場表現成長或衰退，合約到期後會進入自由市場。</p></div><span class="tag">${players.length} / 15 人</span></div><div class="cards"><div class="stat"><span>球隊評分</span><strong>${rosterRating(players)}</strong></div><div class="stat"><span>薪資總額</span><strong>${money(totalSalary(players))}</strong></div><div class="stat"><span>薪資上限</span><strong>${money(state.cap)}</strong></div><div class="stat"><span>球員平均年齡</span><strong>${players.length?(players.reduce((s,p)=>s+p.age,0)/players.length).toFixed(1):'—'}</strong></div></div><div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>評分</th><th>潛力</th><th>年齡</th><th>薪資</th><th>合約</th><th></th></tr></thead><tbody>${players.map(p=>`<tr><td>${esc(p.name)}${p.injured?` <span class="tag">傷停 ${p.injured}週</span>`:''}${p.rookie?' <span class="tag">新秀</span>':''}</td><td><span class="tag">${p.pos}</span></td><td class="rating">${p.rating}</td><td>${p.potential}</td><td>${p.age}</td><td>${money(p.salary)}</td><td>${p.years} 年</td><td><button class="btn small" data-release="${p.id}" ${state.phase==='playoffs'?'disabled':''}>釋出</button></td></tr>`).join('')}</tbody></table></div><div class="notice">球隊薪資上限 ${money(state.cap)}。釋出球員不會退還已承諾薪資；請在自由市場補足陣容。</div>`;}
function marketHTML(){const u=user(),pool=state.freeAgents||[];return `<div class="title-row"><div><div class="eyebrow">FREE AGENCY</div><h2>自由球員市場</h2><p>薪資空間與球員名額足夠即可簽約。自由球員名單每季更新。</p></div><span class="tag">${pool.length} 位可簽</span></div><div class="cards"><div class="stat"><span>目前薪資</span><strong>${money(totalSalary(u.roster))}</strong></div><div class="stat"><span>剩餘空間</span><strong>${money(Math.max(0,state.cap-totalSalary(u.roster)))}</strong></div><div class="stat"><span>球員名額</span><strong>${u.roster.length} / 15</strong></div><div class="stat"><span>老闆耐心</span><strong>${u.owner}%</strong></div></div>${pool.length?`<div class="player-grid">${pool.slice().sort((a,b)=>b.rating-a.rating).map(p=>`<div class="player-card"><div class="info">${fmtPlayer(p)}<small>評分 ${p.rating} · 潛力 ${p.potential} · ${p.age} 歲 · ${money(p.salary)} / ${p.years} 年</small></div><button class="btn small" data-sign="${p.id}" ${u.roster.length>=15||totalSalary(u.roster)+p.salary>state.cap?'disabled':''}>簽約</button></div>`).join('')}</div>`:'<div class="empty">目前沒有自由球員。完成本季後將更新市場。</div>'}`;}
function standingsHTML(){const rows=state.teams.slice().sort((a,b)=>b.wins-a.wins||b.losses-a.losses||rosterRating(b.roster)-rosterRating(a.roster));return `<div class="title-row"><div><div class="eyebrow">LEAGUE STANDINGS</div><h2>聯盟戰績</h2><p>例行賽每隊進行 82 場比賽。排名前八的球隊晉級季後賽。</p></div></div><div class="table-wrap"><table><thead><tr><th>排名</th><th>球隊</th><th>勝</th><th>敗</th><th>勝率</th><th>球隊評分</th></tr></thead><tbody>${rows.map((t,i)=>`<tr style="${t.isUser?'background:#2d3e53':''}"><td>${i+1}${i===7?' · 季後賽線':''}</td><td>${t.isUser?`<b style="color:var(--gold)">${esc(t.name)} (你)</b>`:esc(t.name)}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.wins?(t.wins/82).toFixed(3):'—'}</td><td class="rating">${rosterRating(t.roster)}</td></tr>`).join('')}</tbody></table></div>`;}
function historyHTML(){return `<div class="title-row"><div><div class="eyebrow">DYNASTY ARCHIVE</div><h2>王朝歷史與獎項</h2><p>冠軍、賽季戰績與個人榮譽將保存在這個瀏覽器存檔中。</p></div><span class="tag">${state.history.filter(h=>h.champion===state.userTeam).length} 次冠軍</span></div>${state.history.length?`<div class="box"><h3>歷年戰績</h3>${state.history.slice().reverse().map(h=>`<div class="history-row"><b>第 ${h.year} 季</b><span>${esc(h.name)}：${h.wins} 勝 ${h.losses} 敗 · 第 ${h.rank} 名</span><b>${h.champion===state.userTeam?'<span class="positive">🏆 冠軍</span>':esc(h.champion)}</b></div>`).join('')}</div>`:'<div class="empty">王朝故事尚未開始，完成第一個球季後，歷史會顯示在這裡。</div>'}${state.awards?.length?`<div class="box"><h3>獎牌收藏</h3><div class="player-grid">${state.awards.map(a=>`<div class="player-card"><div class="info"><b>${a.icon} ${esc(a.title)}</b><small>${esc(a.description)}</small></div><span class="tag">第 ${a.year} 季</span></div>`).join('')}</div></div>`:''}`;}
function playoffPanel(){const r=state.round, names=['第一輪','分區準決賽','分區決賽','總冠軍賽'];if(r>=4)return `<div class="notice"><b>本季季後賽已結束。</b> 總冠軍是 ${esc(state.champion)}。${state.champion===state.userTeam?'恭喜你奪下總冠軍！':'下季再戰，繼續重建。'}</div><div class="actions"><button class="btn primary" data-action="offseason">開始休賽季與下一季</button></div>`;const tactics=['均衡進攻','外線火力','禁區強攻','鐵血防守'];return `<div class="notice"><b>季後賽 · ${names[r]}</b><br>請選擇本輪戰術指令。球隊能力、對手強度與戰術適配都會影響系列賽結果。</div><div class="actions">${tactics.map((t,i)=>`<button class="btn ${state.tactic===i?'primary':''}" data-tactic="${i}">${t}</button>`).join('')}</div><p class="muted">${state.tactic===null?'選好戰術後，開始模擬本輪系列賽。':'本輪戰術已選定。'}</p><button class="btn primary" data-action="playRound" ${state.tactic===null?'disabled':''}>模擬 ${names[r]}</button>${state.lastRound?`<div class="box"><h3>上一輪結果</h3><p>${esc(state.lastRound)}</p></div>`:''}`;}
function bindActions(){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action));root.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>sign(b.dataset.sign));root.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>release(b.dataset.release));root.querySelectorAll('[data-tactic]').forEach(b=>b.onclick=()=>{state.tactic=Number(b.dataset.tactic);save();render();});root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});}
function simulateRegular(){if(state.phase!=='regular')return;const sorted=state.teams.slice().sort((a,b)=>rosterRating(b.roster)-rosterRating(a.roster));for(const t of state.teams){const r=rosterRating(t.roster),strength=clamp(.5+(r-70)*.009+(Math.random()-.5)*.24,.15,.85);t.wins=Math.round(82*strength);t.losses=82-t.wins;}state.playoffTeams=state.teams.slice().sort((a,b)=>b.wins-a.wins||rosterRating(b.roster)-rosterRating(a.roster)).slice(0,8).map(t=>t.name);state.phase='playoffs';state.round=0;state.rounds=[];state.tactic=null;state.lastRound='';user().owner=clamp(user().owner+(user().wins>40?4:-3),15,100);for(const p of user().roster){if(Math.random()<.1)p.injured=1+Math.floor(Math.random()*4);}save();tab='home';render();toast(`例行賽完成！${user().wins} 勝，聯盟第 ${state.teams.slice().sort((a,b)=>b.wins-a.wins).findIndex(t=>t.isUser)+1} 名。`);}
function playRound(){const names=state.playoffTeams;if(state.round>=4)return;const userName=state.userTeam, userIndex=names.indexOf(userName),tactic=state.tactic;let userAdvanced=false;let lines=[];for(let i=0;i<names.length;i+=2){const a=state.teams.find(t=>t.name===names[i]),b=state.teams.find(t=>t.name===names[i+1]);if(!a||!b)continue;let ar=rosterRating(a.roster),br=rosterRating(b.roster);if(a.name===userName)ar+=tacticBonus(tactic);if(b.name===userName)br+=tacticBonus(tactic);const p=clamp(.5+(ar-br)*.025+(Math.random()-.5)*.19,.18,.82),aw=Math.random()<p;let winner=aw?a:b,loser=aw?b:a;const wins=4,loss=2+Math.floor(Math.random()*2);lines.push(`${winner.name} ${wins}–${loss} ${loser.name}`);if(a.name===userName||b.name===userName)userAdvanced=winner.name===userName;}
  if(names.length===2){const a=state.teams.find(t=>t.name===names[0]),b=state.teams.find(t=>t.name===names[1]);let ar=rosterRating(a.roster),br=rosterRating(b.roster);if(a.name===userName)ar+=tacticBonus(tactic);if(b.name===userName)br+=tacticBonus(tactic);const p=clamp(.5+(ar-br)*.025+(Math.random()-.5)*.19,.18,.82),winner=Math.random()<p?a:b;lines.push(`總冠軍：${winner.name}`);state.champion=winner.name;state.round=4;state.lastRound=lines.join(' · ');finishSeason();return;}
  if(userIndex>=0&&!userAdvanced){const opponent=names[userIndex^1];state.lastRound=`${userName} 遭 ${opponent} 淘汰。 ${lines.join(' · ')}`;state.round=4;state.champion=names[0];finishSeason();return;}
  const winners=[];for(let i=0;i<names.length;i+=2){const a=state.teams.find(t=>t.name===names[i]),b=state.teams.find(t=>t.name===names[i+1]);if(!a||!b)continue;let ar=rosterRating(a.roster),br=rosterRating(b.roster);if(a.name===userName)ar+=tacticBonus(tactic);if(b.name===userName)br+=tacticBonus(tactic);winners.push(Math.random()<clamp(.5+(ar-br)*.025+(Math.random()-.5)*.19,.18,.82)?a.name:b.name);}state.playoffTeams=winners;state.round++;state.tactic=null;state.lastRound=lines.join(' · ');if(state.round===3&&winners.length===2){/* Finals will resolve on next click. */}save();render();toast(`${['第一輪','分區準決賽','分區決賽'][state.round-1]}完成！`);}
function tacticBonus(t){return [2,3,2,2][t]||0;}
function finishSeason(){const u=user(),sorted=state.teams.slice().sort((a,b)=>b.wins-a.wins),rank=sorted.findIndex(t=>t.isUser)+1;const champ=state.champion||state.playoffTeams[0];if(champ===u.name)u.championships++;state.history.push({year:state.year,name:u.name,wins:u.wins,losses:u.losses,rank,champion:champ});if(champ===u.name)state.awards.push({year:state.year,title:'總冠軍',description:`帶領 ${u.name} 奪下第 ${state.year} 季總冠軍`,icon:'🏆'});if(u.wins>=65)state.awards.push({year:state.year,title:'歷史級戰績',description:`例行賽 ${u.wins} 勝`,icon:'⭐'});state.phase='playoffs';state.round=4;state.lastRound=`總冠軍：${champ}`;u.owner=clamp(u.owner+(champ===u.name?18:u.wins>41?6:-8),10,100);state.seasonLog.push({year:state.year,champion:champ});save();tab='home';render();toast(champ===u.name?'恭喜奪冠！':'季後賽結束，準備下一季。');}
function actions(action){if(action==='simulate')simulateRegular();if(action==='playRound')playRound();if(action==='offseason')offseason();}
function sign(id){const u=user(),p=(state.freeAgents||[]).find(x=>x.id==id);if(!p)return;if(u.roster.length>=15||totalSalary(u.roster)+p.salary>state.cap){toast('名額不足或超過薪資上限');return;}u.roster.push(p);state.freeAgents=state.freeAgents.filter(x=>x.id!=id);save();render();toast(`${p.name} 已加入球隊！`);}
function release(id){const u=user(),idx=u.roster.findIndex(p=>p.id==id);if(idx<0)return;if(u.roster.length<=8){toast('至少保留 8 位球員');return;}if(!confirm(`確定釋出 ${u.roster[idx].name}？薪資不會退還。`))return;const [p]=u.roster.splice(idx,1);p.years=1;state.freeAgents=state.freeAgents||[];state.freeAgents.push(p);save();render();toast('球員已釋出至自由市場。');}
function offseason(){if(state.year>=20){state.phase='complete';save();render();return;}const retiring=[];for(const t of state.teams){const remain=[];for(const p of t.roster){p.age++;p.years--;p.injured=Math.max(0,p.injured-1);if(p.age>35&&Math.random()<.28){if(t.isUser)retiring.push(p.name);continue;}const growth=p.age<25?Math.floor(Math.random()*4)-1:p.age>31?-Math.floor(Math.random()*3):Math.floor(Math.random()*3)-1;p.rating=clamp(p.rating+growth,35,99);if(p.age<27&&Math.random()<.13)p.potential=clamp(p.potential+1, p.rating,99);if(p.years<=0){p.years=1+Math.floor(Math.random()*3);p.salary=Math.max(1,Math.round(p.salary*(.9+Math.random()*.25)));if(Math.random()<.45){if(t.isUser)state.freeAgents=(state.freeAgents||[]).concat(p);continue;}}remain.push(p);}t.roster=remain;while(t.roster.length<10)t.roster.push(seededPlayer(48,76,state.year+1));t.wins=0;t.losses=0;}
 state.year++;state.phase='draft';state.champion=null;state.round=0;state.playoffTeams=[];state.freeAgents=(state.freeAgents||[]).concat(Array.from({length:18},()=>seededPlayer(52,79,state.year)));state.draftPick=seededPlayer(66,86,state.year);state.draftPick.rookie=true;state.draftPick.age=19+Math.floor(Math.random()*4);state.draftPick.years=4;state.draftPick.salary=Math.max(4,Math.round((state.draftPick.rating-42)*.27));if(retiring.length)toast(`球員退役：${retiring.slice(0,2).join('、')}`);save();showDraft();}
function showDraft(){const p=state.draftPick;if(!p){state.phase='regular';render();return;}const modal=document.createElement('div');modal.className='modal-back';modal.innerHTML=`<div class="modal"><div class="eyebrow">SEASON ${state.year} · ROOKIE DRAFT</div><h2>你的首輪選擇</h2><p>聯盟新秀選秀：每隊各有一個首輪籤。你抽到一位潛力新秀，可以選擇加入球隊，也可跳過保留薪資空間。</p><div class="box"><b>${esc(p.name)} · ${p.pos}</b><p>即戰力 <b class="rating">${p.rating}</b> · 潛力 <b class="positive">${p.potential}</b> · 年齡 ${p.age} · 新秀薪資 ${money(p.salary)}</p></div><button class="btn primary" id="draftYes" ${user().roster.length>=15||totalSalary(user().roster)+p.salary>state.cap?'disabled':''}>選擇這位新秀</button> <button class="btn" id="draftNo">跳過選秀</button><p class="muted">你的球隊評分 ${rosterRating(user().roster)} · 薪資 ${money(totalSalary(user().roster))} / ${money(state.cap)}</p></div>`;document.body.appendChild(modal);document.querySelector('#draftYes').onclick=()=>{user().roster.push(p);state.draftPick=null;state.phase='regular';save();modal.remove();tab='home';render();toast(`${p.name} 加入球隊！`);};document.querySelector('#draftNo').onclick=()=>{state.draftPick=null;state.phase='regular';save();modal.remove();tab='home';render();};}
document.querySelector('#resetBtn').onclick=()=>{if(confirm('確定刪除目前的王朝存檔並重新開始？')){localStorage.removeItem(KEY);state=null;tab='home';render();}};
if(state){state.cap=state.cap||140;state.awards=state.awards||[];state.history=state.history||[];state.freeAgents=state.freeAgents||[];if(state.phase==='draft'&&state.draftPick){render();showDraft();}else render();}else render();
})();
</script></body></html>
