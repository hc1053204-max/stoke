<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>霓虹球場｜Neon Court Showdown</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:#f8f4ec;background:radial-gradient(ellipse at 50% 0,#26354a,#101723 65%,#0a0f17)}.shell{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 12px}h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.08em}.sub{color:#aab8ca;font-size:13px}.hud{display:flex;align-items:center;gap:clamp(10px,3vw,25px);flex-wrap:wrap;padding:11px 15px;background:#192333;border:1px solid #37465b;border-radius:12px 12px 0 0;font-size:14px}.hud strong{color:#ffd27b}.hud .clock{font-variant-numeric:tabular-nums;font-size:18px}.stage{position:relative;overflow:hidden;border:1px solid #37465b;border-top:0;background:#bd7040;box-shadow:0 22px 70px #0008}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;background:#101827c9;backdrop-filter:blur(4px)}.overlay.hidden{display:none}.card{max-width:560px;padding:clamp(20px,5vw,36px);border:1px solid #56647a;border-radius:18px;background:linear-gradient(145deg,#26354af5,#172130f5);box-shadow:0 18px 55px #0008}.card h2{margin:0 0 8px;color:#ffd27b;font-size:clamp(27px,5vw,42px)}.card p{margin:8px 0 20px;color:#d0d9e3;line-height:1.75}.start{padding:12px 25px;border:0;border-radius:9px;color:#20202a;background:#ffd27b;box-shadow:0 4px 0 #b8793e;font:750 15px inherit;font-family:inherit;cursor:pointer}.start:hover{filter:brightness(1.08);transform:translateY(-1px)}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:#b1bed0;font-size:12px}.touch{display:none;align-items:center;gap:12px;user-select:none;-webkit-user-select:none}.pad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,34px);gap:4px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.touch button{border:1px solid #ffffff36;border-radius:9px;color:white;background:#202e43e8;font:700 13px inherit;font-family:inherit;touch-action:none}.touch .action{display:flex;gap:6px;align-items:center}.touch .action button{width:55px;height:48px}.touch button:active,.touch button.active{background:#bc6848}.note{margin-left:auto;text-align:right}@media(pointer:coarse){.touch{display:flex}.controls .keys{display:none}}@media(max-width:560px){body{padding:9px}.sub{display:none}.hud{gap:10px;padding:9px;font-size:12px}.controls{align-items:flex-start}.note{display:none}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><h1>霓虹球場</h1><div class="sub">NEON COURT SHOWDOWN · 街頭籃球挑戰</div></div><div class="sub">投進越多，得分越高</div></header>
  <section class="hud" aria-label="比賽狀態"><span>時間 <strong class="clock" id="clock">60</strong></span><span>得分 <strong id="score">0</strong></span><span>命中 <strong id="made">0</strong></span><span>連中 <strong id="streak">0</strong></span><span>投籃力道 <span class="meter"><i id="power"></i></span></span></section>
  <div class="stage"><canvas id="game" aria-label="霓虹球場籃球遊戲"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="headline">霓虹球場</h2><p id="message">運球切入，瞄準籃框投進更多球！<br>移動：WASD／方向鍵　衝刺：K<br>按住 J 蓄力，放開投籃。靠近籃框命中率更高！</p><button class="start" id="start">開始比賽</button></div></div></div>
  <footer class="controls"><div class="keys">移動 WASD／方向鍵　·　按住 J 蓄力、放開投籃　·　K 衝刺</div><div class="touch" aria-label="觸控操作"><div class="pad"><button data-key="arrowup">▲</button><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><div class="action"><button id="shootTouch">按住<br>投籃</button><button data-key="k">衝刺</button></div></div><div class="note">瞄準籃框並選擇適當距離</div></footer>
</main>
<script>
(()=>{
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start');
  const keys=new Set(),scoreEl=document.querySelector('#score'),madeEl=document.querySelector('#made'),streakEl=document.querySelector('#streak'),clockEl=document.querySelector('#clock'),powerEl=document.querySelector('#power');
  let W=800,H=450,dpr=1,mode='title',last=0,elapsed=0,score=0,made=0,streak=0,player,defender,ball,particles=[],notice='',noticeTime=0,charge=0,shootHeld=false,boost=0,boostCooldown=0,world=0,loopActive=false;
  const gameLength=60,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
  new ResizeObserver(resize).observe(canvas);
  const hoop=()=>({x:W*.83,y:H*.405});
  function reset(){elapsed=0;score=0;made=0;streak=0;charge=0;boost=0;boostCooldown=0;particles=[];const floor=H*.78;player={x:W*.24,y:floor,walk:0,face:1};defender={x:W*.58,y:floor-8,walk:0,stun:0};ball={state:'held',x:0,y:0,vx:0,vy:0,t:0,duration:0,sx:0,sy:0,made:false};notice='';noticeTime=0;syncHud();}
  function start(){reset();mode='playing';overlay.classList.add('hidden');last=performance.now();if(!loopActive){loopActive=true;requestAnimationFrame(frame);}}
  startBtn.addEventListener('click',start);
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!keys.has(k)){keys.add(k);if(k==='j')beginShot();if(k==='k')dash();if(k==='enter'&&mode!=='playing')start();}});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);if(k==='j')releaseShot();});
  window.addEventListener('blur',()=>{keys.clear();if(shootHeld)releaseShot();});
  document.querySelectorAll('.touch [data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();if(!keys.has(k)){keys.add(k);if(k==='k')dash();}};const up=e=>{e.preventDefault();keys.delete(k);};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);});
  const shootBtn=document.querySelector('#shootTouch');shootBtn.addEventListener('pointerdown',e=>{e.preventDefault();shootBtn.setPointerCapture(e.pointerId);shootBtn.classList.add('active');beginShot();});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>shootBtn.addEventListener(ev,e=>{e.preventDefault();shootBtn.classList.remove('active');releaseShot();}));
  function beginShot(){if(mode!=='playing'||ball.state!=='held'||shootHeld)return;shootHeld=true;charge=0;}
  function releaseShot(){if(!shootHeld)return;shootHeld=false;if(mode==='playing'&&ball.state==='held')shoot();}
  function dash(){if(mode!=='playing'||boostCooldown>0)return;boost=.34;boostCooldown=1.5;notice='加速！';noticeTime=.45;}
  function shoot(){const h=hoop(),dx=h.x-player.x,dist=Math.hypot(dx,(h.y-(player.y-28))*1.4);const quality=clamp(.97-dist/(W*.98),.22,.91);const defenseDist=Math.hypot(defender.x-player.x,(defender.y-player.y)*.8);const contest=clamp((115-defenseDist)/150,0,.62);const chargeBonus=.06+charge*.12;const chance=clamp(quality+chargeBonus-contest,.08,.94);ball.state='shot';ball.t=0;ball.duration=clamp(.65+dist/800,.68,1.35);ball.sx=player.x+12;ball.sy=player.y-40;ball.x=ball.sx;ball.y=ball.sy;ball.made=Math.random()<chance;ball.targetX=h.x-4;ball.targetY=h.y+3;ball.startY=ball.sy;ball.startX=ball.sx;ball.charge=charge;notice=chance>.72?'出手漂亮！':'出手！';noticeTime=.6;charge=0;}
  function finishShot(){if(ball.made){score+=2;made++;streak++;notice=streak>=3?`${streak} 連中！漂亮！`:'球進了！ +2';burst(ball.targetX,ball.targetY,'#ffe18a',14);}else{streak=0;notice='沒進！繼續加油';burst(ball.targetX,ball.targetY,'#fff2dc',6);}noticeTime=1.1;ball.state='held';}
  function update(dt){world+=dt;if(mode!=='playing')return;elapsed+=dt;if(elapsed>=gameLength){elapsed=gameLength;end();return;}if(shootHeld)charge=clamp(charge+dt*.72,0,1);boost=Math.max(0,boost-dt);boostCooldown=Math.max(0,boostCooldown-dt);noticeTime=Math.max(0,noticeTime-dt);
    let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(dx&&dy){dx*=.707;dy*=.707;}const speed=(boost?340:235)*dt;player.x=clamp(player.x+dx*speed,W*.07,W*.77);player.y=clamp(player.y+dy*speed*.66,H*.58,H*.85);if(dx)player.face=Math.sign(dx);if(dx||dy)player.walk+=dt*13;
    if(defender.stun>0)defender.stun-=dt;else{const vx=player.x-defender.x,vy=player.y-defender.y;const len=Math.hypot(vx,vy)||1;const dSpeed=player.x>W*.68?55:92;defender.x+=vx/len*dSpeed*dt;defender.y+=vy/len*dSpeed*.6*dt;defender.x=clamp(defender.x,W*.35,W*.78);defender.y=clamp(defender.y,H*.58,H*.85);if(len<35&&ball.state==='held'&&!shootHeld){defender.stun=.38;player.x=clamp(player.x-(vx/len)*20,W*.07,W*.77);notice='被貼身防守！';noticeTime=.45;}}
    defender.walk+=dt*9;
    if(ball.state==='held'){ball.x=player.x+Math.sin(world*11)*4;ball.y=player.y-13-Math.abs(Math.sin(world*11))*12;}
    else if(ball.state==='shot'){ball.t+=dt;const t=clamp(ball.t/ball.duration,0,1);ball.x=ball.startX+(ball.targetX-ball.startX)*t;ball.y=ball.startY+(ball.targetY-ball.startY)*t-Math.sin(t*Math.PI)*(H*.36+ball.charge*H*.08);if(t>=1)finishShot();}
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);syncHud();}
  function end(){mode='over';overlay.classList.remove('hidden');document.querySelector('#headline').textContent=score>=20?'神射手！':score>=10?'好球！':'比賽結束';document.querySelector('#message').innerHTML=`60 秒結束！你投進 <b>${made}</b> 球，得到 <b>${score}</b> 分。<br>${streak?`最後連續命中 ${streak} 球！<br>`:''}再來一場，挑戰自己的紀錄吧！`;startBtn.textContent='再玩一次';draw();}
  function syncHud(){scoreEl.textContent=score;madeEl.textContent=made;streakEl.textContent=streak;clockEl.textContent=String(Math.ceil(gameLength-elapsed));clockEl.style.color=gameLength-elapsed<=10?'#ff8b79':'';powerEl.style.width=`${charge*100}%`;}
  function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:.25+Math.random()*.4,max:.65,color});}}
  function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
  function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
  function court(){const floor=H*.57;const g=ctx.createLinearGradient(0,floor,0,H);g.addColorStop(0,'#d58a52');g.addColorStop(1,'#a95735');rect(0,0,W,H,'#192a3c');
    // arena stands
    for(let row=0;row<4;row++){rect(0,H*(.08+row*.085),W,H*.075,row%2?'#253a50':'#2b4056');for(let i=0;i<32;i++){const x=i*W/30+(row%2?7:0),y=H*(.105+row*.085);circle(x,y,Math.max(1.5,W*.003),['#f5c979','#df7180','#7dd2bd','#dce2e7'][((i+row*3)%4)]);}}
    rect(0,floor,W,H-floor,g);ctx.strokeStyle='#ffe0b0';ctx.lineWidth=2;ctx.globalAlpha=.72;ctx.beginPath();ctx.moveTo(0,H*.86);ctx.lineTo(W,H*.86);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.13,H*.58);ctx.lineTo(W*.13,H*.86);ctx.stroke();ctx.beginPath();ctx.ellipse(W*.13,H*.72,W*.105,H*.14,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.5,H*.58);ctx.lineTo(W*.5,H*.86);ctx.stroke();ctx.beginPath();ctx.ellipse(W*.5,H*.72,W*.075,H*.11,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffe0b0';ctx.beginPath();ctx.moveTo(W*.73,H*.58);ctx.lineTo(W*.73,H*.86);ctx.stroke();ctx.beginPath();ctx.arc(W*.73,H*.72,W*.17,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.globalAlpha=1;
    // hoop support and backboard at the right
    const h=hoop();rect(h.x+W*.035,h.y-H*.13,5,H*.22,'#dbe6e7');rect(h.x+W*.006,h.y-H*.13,W*.065,5,'#e7edf0');rect(h.x+W*.012,h.y-H*.13,W*.047,H*.04,'#f1f3eb');ctx.strokeStyle='#e65c42';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(h.x-W*.025,h.y);ctx.lineTo(h.x+W*.025,h.y);ctx.stroke();ctx.strokeStyle='#f1e7d4';ctx.lineWidth=1;for(let i=0;i<=6;i++){const x=h.x-W*.021+i*W*.007;ctx.beginPath();ctx.moveTo(x,h.y+2);ctx.lineTo(h.x+(x-h.x)*.55,h.y+H*.065);ctx.stroke();}ctx.beginPath();ctx.moveTo(h.x-W*.02,h.y+H*.025);ctx.lineTo(h.x+W*.02,h.y+H*.025);ctx.stroke();
    ctx.font=`700 ${Math.max(10,W*.018)}px system-ui`;ctx.fillStyle='#ffe0b0';ctx.textAlign='left';ctx.fillText('HOME COURT',W*.04,H*.18);
  }
  function drawPerson(o,shirt,shorts,isDefender=false){ctx.save();ctx.translate(o.x,o.y);const bob=Math.sin(o.walk)*2;ctx.fillStyle='#171b23aa';ctx.beginPath();ctx.ellipse(0,0,18,6,0,0,Math.PI*2);ctx.fill();ctx.translate(0,bob);if(boost&&!isDefender){ctx.globalAlpha=.8+.2*Math.sin(world*35);}const skin='#bd7954';rect(-12,-27,9,24,shorts);rect(3,-27,9,24,shorts);rect(-15,-5,15,5,'#f3ede0');rect(1,-5,15,5,'#f3ede0');rect(-15,-58,30,33,shirt);rect(-18,-53,7,23,shirt);rect(11,-53,7,23,shirt);circle(0,-68,12,skin);rect(-12,-79,24,6,'#222b35');rect(-4,-70,3,2,'#242633');rect(5,-70,3,2,'#242633');ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(8,W*.015)}px system-ui`;ctx.textAlign='center';ctx.fillText(isDefender?'D':'7',0,-38);ctx.restore();}
  function drawBall(x,y,r){circle(x,y+2,r+1,'#381f16');circle(x,y,r,'#ee762c');ctx.strokeStyle='#512d1c';ctx.lineWidth=Math.max(1,r*.11);ctx.beginPath();ctx.arc(x,y,r*.78,-Math.PI*.78,Math.PI*.78);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r*.85,y);ctx.quadraticCurveTo(x,y-r*.28,x+r*.85,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r*.25,y-r*.95);ctx.quadraticCurveTo(x+r*.18,y,x-r*.25,y+r*.95);ctx.stroke();}
  function draw(){if(!ctx||!W||!H)return;ctx.save();court();drawPerson(defender||{x:W*.58,y:H*.78,walk:0},'#db5d67','#6a3545',true);drawPerson(player||{x:W*.24,y:H*.78,walk:0},'#32b7a3','#216f75');if(ball){drawBall(ball.x||player.x,ball.y||player.y-20,Math.max(7,W*.014));}particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,3,p.color);});ctx.globalAlpha=1;
    if(shootHeld&&player){ctx.fillStyle='#131b26aa';ctx.fillRect(W*.34,H*.075,W*.32,H*.026);ctx.fillStyle=charge>.75?'#ffd27b':'#67dfbd';ctx.fillRect(W*.34,H*.075,W*.32*charge,H*.026);ctx.strokeStyle='#fff8';ctx.strokeRect(W*.34,H*.075,W*.32,H*.026);}
    if(noticeTime>0&&notice){ctx.globalAlpha=Math.min(1,noticeTime*2);ctx.fillStyle='#fff3d3';ctx.textAlign='center';ctx.font=`800 ${Math.max(18,W*.035)}px system-ui`;ctx.shadowColor='#17202c';ctx.shadowBlur=6;ctx.fillText(notice,W*.5,H*.22);ctx.shadowBlur=0;ctx.globalAlpha=1;}
    if(boostCooldown>0&&mode==='playing'){ctx.fillStyle='#ffffff99';ctx.font=`${Math.max(9,W*.014)}px system-ui`;ctx.textAlign='left';ctx.fillText('衝刺冷卻',W*.04,H*.24);ctx.fillStyle='#ffd27b';ctx.fillRect(W*.04,H*.255,W*.11*(1-boostCooldown/1.5),3);}
    ctx.restore();}
  function frame(now){if(mode!=='playing'){loopActive=false;draw();return;}const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();if(mode==='playing')requestAnimationFrame(frame);else loopActive=false;}
  player={x:W*.24,y:H*.78,walk:0,face:1};defender={x:W*.58,y:H*.77,walk:0,stun:0};ball={state:'held',x:player.x,y:player.y-20};resize();syncHud();
})();
</script>
</body>
</html>
