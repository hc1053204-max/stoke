<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#111a26;--panel2:#172332;--line:#263648;--muted:#91a1b4;--text:#eef3f8;--gold:#e5b85c;--green:#73d6a0;--red:#f07878;--blue:#8ebeff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#24344a 0,transparent 42%),var(--bg);color:var(--text);min-height:100vh}.app{max-width:1440px;margin:auto;padding:26px 34px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(145deg,#f3d48f,#b9802c);border-radius:14px;color:#17120a;font-size:23px;box-shadow:0 8px 26px #e5b85c30}.brand h1{font-size:16px;letter-spacing:2px;margin:0;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:4px}.top-actions{display:flex;align-items:center;gap:10px}.season-pill,.manager-pill{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#111a26;color:var(--muted);font-size:12px}.manager-pill strong{color:var(--text)}.hero{position:relative;overflow:hidden;padding:28px 30px;border:1px solid #394658;border-radius:20px;background:linear-gradient(112deg,#1c2a3a 0%,#111b27 60%,#182333 100%);box-shadow:0 18px 50px #0003;margin-bottom:20px}.hero:after{content:'🏀';position:absolute;right:5%;top:-30px;font-size:170px;opacity:.055;transform:rotate(-20deg)}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800}.hero h2{margin:8px 0 5px;font-size:clamp(23px,3vw,34px);letter-spacing:-.7px}.hero p{margin:0;color:var(--muted);font-size:13px}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}.button{border:1px solid var(--line);background:#1b2939;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:750;font-size:12px;cursor:pointer;transition:.18s}.button:hover{transform:translateY(-2px);border-color:#71839a;background:#24364a}.button.primary{background:var(--gold);border-color:var(--gold);color:#16130e}.button.primary:hover{background:#f1ca79}.button.subtle{background:transparent}.button.danger{color:#ffb0aa}.button.small{padding:7px 10px;font-size:11px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px;position:relative;z-index:1}.metric{padding:14px 15px;border:1px solid #ffffff12;background:#0a111a55;border-radius:13px}.metric label{display:block;color:var(--muted);font-size:10px;letter-spacing:.7px}.metric strong{display:block;font-size:22px;margin-top:6px}.metric .unit{font-size:11px;color:var(--muted);font-weight:500}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.85fr);gap:18px}.main-col,.side-col{display:grid;align-content:start;gap:18px}.card{background:linear-gradient(160deg,#141e2b,#101823);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 10px 30px #0002;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card-head h3{margin:0;font-size:15px}.card-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.text-link{color:var(--gold);font-size:11px;font-weight:800;cursor:pointer}.roster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.player{position:relative;padding:14px;border:1px solid #2a394b;border-radius:13px;background:linear-gradient(145deg,#1a2939,#141e2b);transition:.18s;overflow:hidden}.player:hover{transform:translateY(-2px);border-color:#66758a}.player-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.player-name{font-weight:850;font-size:13px}.player-meta{font-size:10px;color:var(--muted);margin-top:5px}.ovr{width:43px;height:43px;border:1px solid #dcb35b77;border-radius:11px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:18px;background:#d6a94b12;flex:none}.player-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.tag{padding:4px 7px;border-radius:6px;background:#253548;color:#c3d2e3;font-size:9px;font-weight:700}.tag.gold{background:#4b3b20;color:#f1cb7b}.tag.green{background:#17372c;color:#8ce4b5}.player-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff10;margin-top:11px;padding-top:10px;color:var(--muted);font-size:10px}.strength-list{display:grid;gap:13px}.strength-row{display:grid;grid-template-columns:30px 1fr 40px;gap:10px;align-items:center;font-size:11px}.pos-label{font-weight:850;color:#c5d3e2}.bar{height:6px;background:#263547;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ae7a30,#f0cc7b)}.strength-val{text-align:right;font-size:12px;font-weight:850;color:var(--gold)}.overall{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid #ffffff12;background:#0c141e;border-radius:13px;margin-bottom:15px}.overall b{font-size:30px;color:var(--gold)}.overall span{font-size:11px;color:var(--muted)}.activity{display:grid;gap:0}.activity-item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0d}.activity-item:last-child{border-bottom:0}.activity-icon{width:27px;height:27px;border-radius:8px;background:#26364a;display:grid;place-items:center;font-size:12px}.activity-item strong{display:block;font-size:11px}.activity-item small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.nav{display:flex;gap:7px;margin:0 0 18px;overflow:auto;padding-bottom:3px}.nav button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 13px;border-radius:9px;font-weight:750;font-size:12px;cursor:pointer}.nav button:hover{background:#172332;color:var(--text)}.nav button.active{background:#26364a;border-color:#354960;color:var(--gold)}.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 18px}.page-title h2{margin:0;font-size:24px}.page-title p{margin:6px 0 0;color:var(--muted);font-size:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px;min-width:520px}th{text-align:left;color:var(--muted);font-size:10px;font-weight:700;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #ffffff0b}tbody tr:hover{background:#ffffff05}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#25364a;color:#c5d6e8;font-size:9px}.prospect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.prospect{padding:15px;border:1px solid var(--line);border-radius:13px;background:#162231}.prospect h4{margin:0 0 5px;font-size:13px}.prospect p{margin:5px 0;color:var(--muted);font-size:10px}.prospect .button{margin-top:10px;width:100%}.training-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);background:#172332;border-radius:13px;margin-bottom:10px}.avatar{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(140deg,#30455d,#1b2938);font-size:20px}.training-card .grow{flex:1;min-width:0}.training-card strong{font-size:12px}.training-card small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:12px 14px;border:1px solid #e5b85c33;border-radius:11px;background:#e5b85c0b;color:#dbc895;font-size:11px;line-height:1.6;margin-bottom:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#eef3f8;color:#101722;padding:11px 16px;border-radius:11px;font-size:12px;font-weight:800;box-shadow:0 12px 40px #0008;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{text-align:center;color:#637286;font-size:10px;margin-top:28px}.modal-backdrop{position:fixed;inset:0;background:#05080dcc;display:grid;place-items:center;padding:20px;z-index:15}.modal{width:min(440px,100%);padding:22px;border:1px solid #3b4b60;border-radius:17px;background:#131e2b;box-shadow:0 24px 80px #0009}.modal h3{margin:0 0 8px}.modal p{color:var(--muted);font-size:12px;line-height:1.6}.field{display:grid;gap:6px;margin:13px 0;color:var(--muted);font-size:11px}.field input,.field select{background:#0d1520;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side-col{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{padding:16px 13px 40px}.topbar{align-items:flex-start}.manager-pill{display:none}.hero{padding:21px 17px}.hero-top{display:block}.hero-actions{margin-top:16px}.summary{grid-template-columns:repeat(2,1fr);gap:7px}.metric{padding:11px}.metric strong{font-size:19px}.roster-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side-col{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.prospect-grid{grid-template-columns:1fr}.page-title{align-items:flex-start;flex-direction:column}.training-card{align-items:flex-start}.training-card .button{padding:7px}.brand h1{font-size:13px}.season-pill{font-size:10px;padding:8px}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">🏀</div><div><h1>FRONT OFFICE</h1><small>BUILD YOUR DYNASTY · 球隊經營模擬</small></div></div><div class="top-actions"><div class="season-pill" id="seasonBadge">第 1 季 · 例行賽</div><div class="manager-pill">總經理　<strong id="managerName">總經理</strong></div><button class="button small" data-action="profile">⚙ 球隊設定</button></div></header>
<section class="hero"><div class="hero-top"><div><div class="eyebrow">YOUR FRANCHISE · EST. SEASON 01</div><h2 id="teamTitle">台北雷霆</h2><p id="heroSubtitle">每個決定都將定義你的王朝。</p></div><div class="hero-actions"><button class="button" data-action="new-season">⏭ 推進賽季</button><button class="button primary" data-action="add-log">＋ 球隊公告</button></div></div><div class="summary" id="summary"></div></section>
<nav class="nav" id="nav"><button class="active" data-tab="overview">總覽</button><button data-tab="roster">球員名單</button><button data-tab="transactions">交易歷史</button><button data-tab="free-agents">自由球員</button><button data-tab="draft">選秀模擬</button><button data-tab="development">球員成長</button></nav>
<main id="view"></main><div class="footer">FRONT OFFICE · 你的球隊，由你掌舵　·　進度自動儲存在此裝置</div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='front-office-dashboard-v2';const positions=['PG','SG','SF','PF','C'];const firstNames=['林恩','陳凱','王子豪','張宇','林冠廷','陳柏翰','周以安','李承恩','黃睿哲','吳家豪','許皓鈞','趙明軒','楊曜任','郭品澤','方允成','高晨','Jordan','Marcus','Darius','Kai'];const lastNames=['周','林','陳','高','黃','吳','王','李','張','楊','郭','許','鄭','蔡','葉','沈','Carter','Brooks','Reed','Mitchell','Turner','Hayes'];let page='overview',toastTimer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function player({rating=60,age=22,potential=85,pos=pick(positions),name=null,salary=null}={}){return{id:Date.now()+Math.random(),name:name||pick(firstNames)+' '+pick(lastNames),pos,age,rating,potential,salary:salary??Math.round((rating*0.35+age*0.08)*10)/10,starter:false}}
function fresh(){let roster=Array.from({length:12},(_,i)=>player({rating:Math.floor(57+Math.random()*20),age:19+Math.floor(Math.random()*14),potential:Math.min(99,70+Math.floor(Math.random()*29))}));roster.slice(0,5).forEach(p=>p.starter=true);return{team:'台北雷霆',manager:'總經理',season:1,wins:0,losses:0,budget:128,roster,history:[{title:'球隊正式成立',detail:'新王朝從今天開始。',date:'第 1 季 · 開季'}],drafted:[],log:[]}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()};state.roster ||= [];state.history ||= [];state.drafted ||= [];state.log ||= [];state.budget ??=128;state.season ||=1;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('無法儲存：瀏覽器儲存空間不足')}}function notify(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function payroll(){return state.roster.reduce((s,p)=>s+(+p.salary||0),0)}function strength(list=state.roster){if(!list.length)return 0;return Math.round(list.reduce((s,p)=>s+p.rating,0)/list.length)}function starters(){return state.roster.filter(p=>p.starter)}function phase(){return state.season+' 季 · 例行賽'}
function updateHeader(){let s=strength();$('#teamTitle').textContent=state.team;$('#managerName').textContent=state.manager;$('#seasonBadge').textContent=phase();$('#heroSubtitle').textContent=`戰績 ${state.wins}-${state.losses}　·　球隊總評 ${s} OVR　·　距離冠軍更近一步。`;$('#summary').innerHTML=`<div class="metric"><label>球隊戰力</label><strong>${s}<span class="unit"> OVR</span></strong></div><div class="metric"><label>本季戰績</label><strong>${state.wins}<span class="unit"> 勝</span> ${state.losses}<span class="unit"> 敗</span></strong></div><div class="metric"><label>球員名單</label><strong>${state.roster.length}<span class="unit"> 人</span></strong></div><div class="metric"><label>薪資空間</label><strong>${Math.max(0,150-payroll()).toFixed(1)}<span class="unit"> M</span></strong></div><div class="metric"><label>球隊預算</label><strong>${state.budget.toFixed(1)}<span class="unit"> M</span></strong></div>`}
function playerCard(p){return `<article class="player"><div class="player-top"><div><div class="player-name">${esc(p.name)}</div><div class="player-meta">${p.pos} · ${p.age} 歲 · ${p.starter?'先發':'替補'}</div></div><div class="ovr">${p.rating}</div></div><div class="player-tags"><span class="tag gold">潛力 ${p.potential}</span><span class="tag">年薪 ${(+p.salary).toFixed(1)}M</span><span class="tag ${p.rating>=80?'green':''}">${p.age<23?'新星':p.age>31?'老將':'巔峰期'}</span></div><div class="player-foot"><span>球員總評</span><span>${p.rating} / 99</span></div></article>`}
function strengthPanel(){return `<section class="card"><div class="card-head"><div><h3>球隊戰力分析</h3><p>先發陣容各位置平均總評</p></div><span class="tag gold">${strength()} OVR</span></div><div class="overall"><b>${strength()}</b><span>綜合戰力<br>聯盟競爭力評估</span></div><div class="strength-list">${positions.map(pos=>{let arr=starters().filter(p=>p.pos===pos);let val=arr.length?Math.round(arr.reduce((a,p)=>a+p.rating,0)/arr.length):Math.max(0,strength()-8);return `<div class="strength-row"><span class="pos-label">${pos}</span><div><div>${arr.length?arr.map(p=>esc(p.name.split(' ')[0])).join('、'):'待補強'}</div><div class="bar"><i style="width:${val}%"></i></div></div><span class="strength-val">${val}</span></div>`}).join('')}</div></section>`}
function recentPanel(){let rows=state.history.slice(-5).reverse();return `<section class="card"><div class="card-head"><div><h3>球隊動態</h3><p>最新簽約與球隊決策</p></div><span class="text-link" data-goto="transactions">完整歷史 →</span></div><div class="activity">${rows.length?rows.map((x,i)=>`<div class="activity-item"><div class="activity-icon">${i===0?'✦':'↗'}</div><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)} · ${esc(x.date)}</small></div></div>`).join(''):'<div class="empty">尚無球隊動態</div>'}</div></section>`}
function overview(){let recent=state.roster.slice().sort((a,b)=>b.rating-a.rating).slice(0,6);return `<div class="layout"><div class="main-col"><section class="card"><div class="card-head"><div><h3>球員陣容</h3><p>核心輪換與陣容深度 · ${state.roster.length} 位球員</p></div><span class="text-link" data-goto="roster">查看完整名單 →</span></div><div class="roster-grid">${recent.map(playerCard).join('')||'<div class="empty">目前沒有球員</div>'}</div></section><div class="two-col"><section class="card"><div class="card-head"><div><h3>自由球員市場</h3><p>尋找適合球隊的補強人選</p></div><span class="text-link" data-goto="free-agents">前往簽約 →</span></div><p style="color:var(--muted);font-size:12px;line-height:1.7">市場上有多位待簽球員，依據薪資空間與球隊需求，打造更具競爭力的輪換陣容。</p></section><section class="card"><div class="card-head"><div><h3>選秀前瞻</h3><p>新一屆潛力新星即將登場</p></div><span class="text-link" data-goto="draft">開始選秀 →</span></div><p style="color:var(--muted);font-size:12px;line-height:1.7">透過選秀發掘高潛力年輕球員，為球隊建立長期競爭力。</p></section></div></div><aside class="side-col">${strengthPanel()}${recentPanel()}</aside></div>`}
function rosterPage(){return `<div class="page-title"><div><h2>球員名單</h2><p>管理先發、球員薪資與陣容深度。</p></div><button class="button" data-action="auto-lineup">✦ 自動排先發</button></div><section class="card"><div class="card-head"><div><h3>全體球員</h3><p>點擊按鈕切換先發狀態，最多 5 位先發。</p></div><span class="tag">薪資總額 ${payroll().toFixed(1)}M</span></div><div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>年齡</th><th>總評</th><th>潛力</th><th>年薪</th><th>狀態</th><th>操作</th></tr></thead><tbody>${state.roster.slice().sort((a,b)=>b.rating-a.rating).map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td><span class="badge">${p.pos}</span></td><td>${p.age}</td><td><strong style="color:var(--gold)">${p.rating}</strong></td><td>${p.potential}</td><td>${(+p.salary).toFixed(1)}M</td><td>${p.starter?'<span class="tag gold">先發</span>':'替補'}</td><td><button class="button small" data-action="toggle-starter" data-id="${p.id}">${p.starter?'改替補':'設先發'}</button></td></tr>`).join('')}</tbody></table></div></section><div style="margin-top:16px">${strengthPanel()}</div>`}
function transactionPage(){return `<div class="page-title"><div><h2>交易歷史</h2><p>球隊所有簽約、選秀與管理決策。</p></div><span class="tag gold">${state.history.length} 筆紀錄</span></div><section class="card"><div class="activity">${state.history.length?state.history.slice().reverse().map(x=>`<div class="activity-item"><div class="activity-icon">${x.title.includes('交易')?'⇄':x.title.includes('簽約')?'✍':'✦'}</div><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)} · ${esc(x.date)}</small></div></div>`).join(''):'<div class="empty">尚無交易紀錄</div>'}</div></section>`}
function freeAgents(){let pool=[{name:'Marcus Hill',pos:'PG',age:27,rating:78,potential:80,salary:15.5},{name:'陳昱安',pos:'SF',age:24,rating:74,potential:88,salary:11.2},{name:'Darius Cole',pos:'C',age:30,rating:81,potential:81,salary:18.4},{name:'林冠宇',pos:'SG',age:22,rating:69,potential:91,salary:7.8},{name:'Jalen Brooks',pos:'PF',age:26,rating:76,potential:83,salary:13.6},{name:'王以辰',pos:'PG',age:20,rating:65,potential:89,salary:5.4}];return `<div class="page-title"><div><h2>自由球員簽約</h2><p>選擇球員補強陣容。簽約金額計入球隊薪資與預算。</p></div><span class="tag gold">可用薪資 ${Math.max(0,150-payroll()).toFixed(1)}M</span></div><div class="notice">簽約前請留意薪資空間與球隊預算。每次簽約會記錄在交易歷史中。</div><section class="card"><div class="prospect-grid">${pool.map((p,i)=>`<article class="prospect"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h4>${p.name}</h4><p>${p.pos} · ${p.age} 歲 · ${p.rating} OVR</p></div><div class="ovr">${p.rating}</div></div><p>潛力 ${p.potential}　·　年薪 ${p.salary.toFixed(1)}M</p><button class="button primary small" data-action="sign" data-index="${i}" data-name="${esc(p.name)}" data-pos="${p.pos}" data-age="${p.age}" data-rating="${p.rating}" data-potential="${p.potential}" data-salary="${p.salary}">簽下球員</button></article>`).join('')}</div></section>`}
function draftPage(){let candidates=Array.from({length:6},(_,i)=>({id:i,name:['陳冠宇','Jaylen Rivers','周昊','Malik Stone','林柏叡','Drew Carter'][i],pos:positions[i%5],age:18+Math.floor(Math.random()*2),rating:60+Math.floor(Math.random()*11),potential:85+Math.floor(Math.random()*15),salary:4.5+Math.random()*2}));return `<div class="page-title"><div><h2>選秀模擬</h2><p>發掘未來球星，投資球隊的下一個世代。</p></div><button class="button" data-action="refresh-draft">⟳ 更新選秀名單</button></div><div class="notice">本屆新秀名單每次更新會重新生成。簽下新秀需要預留薪資空間。</div><section class="card"><div class="card-head"><div><h3>年度新秀榜</h3><p>球探評估 · 預估能力與發展上限</p></div><span class="tag gold">DRAFT CLASS</span></div><div class="prospect-grid">${candidates.map(p=>`<article class="prospect"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h4>${p.name}</h4><p>${p.pos} · ${p.age} 歲 · 新秀</p></div><div class="ovr">${p.rating}</div></div><p>潛力 ${p.potential}　·　新秀合約 ${p.salary.toFixed(1)}M</p><button class="button primary small" data-action="draft-sign" data-name="${p.name}" data-pos="${p.pos}" data-age="${p.age}" data-rating="${p.rating}" data-potential="${p.potential}" data-salary="${p.salary.toFixed(1)}">選中球員</button></article>`).join('')}</div></section><section class="card" style="margin-top:16px"><div class="card-head"><div><h3>選秀紀錄</h3><p>已加入球隊的新秀</p></div></div>${state.drafted.length?`<div class="activity">${state.drafted.slice().reverse().map(p=>`<div class="activity-item"><div class="activity-icon">#</div><div><strong>${esc(p.name)} · ${p.pos} · ${p.rating} OVR</strong><small>潛力 ${p.potential} · 第 ${p.season} 季選秀</small></div></div>`).join('')}</div>`:'<div class="empty">尚未選進新秀</div>'}</section>`}
function developmentPage(){let list=state.roster.slice().sort((a,b)=>(b.potential-b.rating)-(a.potential-a.rating));return `<div class="page-title"><div><h2>球員成長中心</h2><p>安排個別訓練，提升球員能力。球員總評不會超過發展潛力。</p></div><span class="tag gold">訓練預算 ${state.budget.toFixed(1)}M</span></div><div class="notice">每次訓練消耗 1.5M 預算。年輕球員與高潛力球員通常具有較大的成長空間。</div><section class="card"><div class="card-head"><div><h3>訓練名單</h3><p>依照尚未開發的潛力排序</p></div></div>${list.length?list.map(p=>`<div class="training-card"><div class="avatar">${p.pos==='C'?'🛡️':p.pos==='PG'?'🎯':'🏀'}</div><div class="grow"><strong>${esc(p.name)}　<span style="color:var(--gold)">${p.rating} OVR</span></strong><small>${p.age} 歲 · 潛力 ${p.potential} · 可成長 ${Math.max(0,p.potential-p.rating)} 點</small><div class="bar"><i style="width:${Math.min(100,p.rating/p.potential*100)}%"></i></div></div><button class="button small" data-action="train" data-id="${p.id}">訓練 1.5M</button></div>`).join(''):'<div class="empty">名單中沒有球員</div>'}</section>`}
function render(){updateHeader();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));let content=page==='overview'?overview():page==='roster'?rosterPage():page==='transactions'?transactionPage():page==='free-agents'?freeAgents():page==='draft'?draftPage():developmentPage();$('#view').innerHTML=content;}
function record(title,detail){state.history.push({title,detail,date:`第 ${state.season} 季`});save()}
function setPage(next){page=next;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){setPage(tab.dataset.tab);return}let goto=e.target.closest('[data-goto]');if(goto){setPage(goto.dataset.goto);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='profile'){let box=document.createElement('div');box.className='modal-backdrop';box.innerHTML=`<div class="modal"><h3>球隊設定</h3><p>自訂球隊與總經理名稱，資料會儲存在這台裝置。</p><label class="field">球隊名稱<input id="editTeam" maxlength="24" value="${esc(state.team)}"></label><label class="field">總經理名稱<input id="editManager" maxlength="20" value="${esc(state.manager)}"></label><div class="modal-actions"><button class="button" data-modal="close">取消</button><button class="button primary" data-modal="save-profile">儲存設定</button></div></div>`;document.body.appendChild(box);return}
if(a==='sign'||a==='draft-sign'){let salary=+b.dataset.salary;if(state.roster.length>=15)return notify('球員名單已滿，請先釋出球員。');if(payroll()+salary>150)return notify('薪資空間不足，無法簽下這位球員。');if(a==='sign'&&state.budget<salary*.35)return notify('球隊預算不足。');let p=player({name:b.dataset.name,pos:b.dataset.pos,age:+b.dataset.age,rating:+b.dataset.rating,potential:+b.dataset.potential,salary});state.roster.push(p);state.budget=Math.max(0,state.budget-salary*.35);record(a==='sign'?'自由球員簽約':'選秀簽約',`${p.name} 加入球隊，合約 ${salary.toFixed(1)}M。`);if(a==='draft-sign'){state.drafted.push({...p,season:state.season});}save();render();notify(`${p.name} 已加入球隊！`);return}
if(a==='toggle-starter'){let p=state.roster.find(x=>String(x.id)===b.dataset.id);if(!p)return;if(!p.starter&&starters().length>=5)return notify('先發陣容最多 5 位球員。');p.starter=!p.starter;save();render();return}
if(a==='auto-lineup'){state.roster.forEach(p=>p.starter=false);state.roster.slice().sort((x,y)=>y.rating-x.rating).slice(0,5).forEach(p=>p.starter=true);save();render();notify('已依球員總評更新先發陣容。');return}
if(a==='train'){let p=state.roster.find(x=>String(x.id)===b.dataset.id);if(!p)return;if(state.budget<1.5)return notify('訓練預算不足。');if(p.rating>=p.potential)return notify('球員已達目前發展潛力。');state.budget-=1.5;let amount=Math.min(p.potential-p.rating,1+Math.floor(Math.random()*2));p.rating+=amount;record('球員個別訓練',`${p.name} 能力提升 ${amount} 點，現在為 ${p.rating} OVR。`);save();render();notify(`${p.name} 成長了 ${amount} 點！`);return}
if(a==='refresh-draft'){render();notify('已更新本屆新秀觀察名單。');return}
if(a==='new-season'){state.season++;state.wins=0;state.losses=0;let grown=0;state.roster.forEach(p=>{p.age++;let delta=p.age<=24?Math.floor(Math.random()*3):p.age>=33?-Math.floor(Math.random()*2):Math.floor(Math.random()*2);p.rating=clamp(p.rating+delta,p.age>=34?40:45,p.potential);grown+=delta});let result=Math.max(15,Math.min(65,Math.round(41+(strength()-70)*1.4+(Math.random()*12-6))));state.wins=result;state.losses=82-result;state.budget=Math.min(180,state.budget+12);record('賽季結算',`新賽季戰績 ${state.wins} 勝 ${state.losses} 敗，球員發展變化 ${grown>=0?'+':''}${grown}。`);save();render();notify(`第 ${state.season} 季開始！上季 ${state.wins} 勝。`);return}
if(a==='add-log'){let announcement=prompt('輸入球隊公告內容：');if(announcement?.trim()){record('球隊公告',announcement.trim());render();notify('公告已加入球隊動態。')}return}
});
document.addEventListener('click',e=>{let action=e.target.closest('[data-modal]')?.dataset.modal;if(!action)return;let box=e.target.closest('.modal-backdrop');if(action==='close'){box.remove();return}if(action==='save-profile'){let team=$('#editTeam').value.trim(),manager=$('#editManager').value.trim();if(team)state.team=team;if(manager)state.manager=manager;save();box.remove();render();notify('球隊設定已儲存。')}});
render();
})();
</script>
</body>
</html>
