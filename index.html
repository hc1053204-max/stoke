<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#0b111c;--panel:#141e2c;--panel2:#1b293a;--line:#2c3b4e;--muted:#9caec2;--gold:#e8bc66;--green:#73d3ad;--red:#fa8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -25%,#26364d,var(--bg) 67%);color:#eaf0f6;min-height:100vh;font-size:13px}.app{max-width:1390px;padding:17px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.ball{font-size:27px}.brand h1{font-size:19px;letter-spacing:.07em;margin:0}.brand .eyebrow{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.15em}.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}.btn{border:1px solid #3b4d62;border-radius:7px;padding:8px 11px;background:#1e2c3f;color:#eaf0f6;font:600 12px inherit;font-family:inherit;cursor:pointer}.btn:hover{border-color:var(--gold);color:var(--gold)}.btn.gold{background:var(--gold);color:#171b20;border-color:var(--gold)}.btn:disabled{opacity:.4;cursor:not-allowed}.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 12px;padding-bottom:9px}.tabs button{border:1px solid transparent;background:transparent;color:#aab8ca;padding:8px 11px;border-radius:7px;cursor:pointer;font:600 12px inherit;font-family:inherit}.tabs button.active,.tabs button:hover{background:#1b293a;border-color:#35475d;color:#fff}.tabs .tab-danger{margin-left:auto;color:#f69a96}.content{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(290px,.85fr);gap:12px}.card{background:linear-gradient(145deg,#172333,#111a27);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.full{grid-column:1/-1}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-title h2,.section-title h3{margin:0;font-size:15px}.muted{color:var(--muted)}.mini{font-size:10px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{padding:10px 12px;border:1px solid var(--line);background:#172536;border-radius:8px}.stat label{display:block;color:var(--muted);font-size:10px}.stat b{display:block;margin-top:5px;color:var(--gold);font-size:18px}.season{display:flex;justify-content:space-between;align-items:center;gap:10px}.season b{font-size:14px}.phases{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}.phase{padding:8px 5px;text-align:center;border:1px solid var(--line);border-radius:7px;color:#91a1b5;font-size:10px;background:#111a26}.phase.active{border-color:var(--gold);color:var(--gold);background:#332c20}.phase.done{color:var(--green)}.notice{padding:10px 11px;background:#282718;border:1px solid #63563a;color:#e9d39f;border-radius:7px;line-height:1.55;font-size:11px;margin:9px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.scroll{max-height:430px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th{position:sticky;top:0;background:#172333;color:#91a2b7;text-align:left;padding:8px 7px;font-size:10px;border-bottom:1px solid #35465a;cursor:pointer}td{padding:7px;border-bottom:1px solid #263548}tr:hover td{background:#1b2a3c}.player{color:#eef2f8;font-weight:650}.pos{display:inline-block;border:1px solid #40526a;border-radius:4px;padding:2px 5px;color:#aebdd0;font-size:9px}.ovr{color:var(--gold);font-weight:800}.money{color:#bdcadd}.starter{color:var(--green);font-size:9px}.bench{color:#aab8ca;font-size:9px}.subnav{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.subnav button{background:#182536;border:1px solid var(--line);color:#b4c3d4;border-radius:6px;padding:7px 10px;font:600 11px inherit;font-family:inherit;cursor:pointer}.subnav button.active{border-color:var(--gold);color:var(--gold)}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.filters input,.filters select,.field input{background:#101a27;border:1px solid #34465c;color:#eaf0f6;padding:8px;border-radius:6px;font:inherit}.filters input{min-width:180px;flex:1}.picks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.pick{border:1px solid #35465a;padding:6px 9px;border-radius:6px;color:#b1bfd0;background:#142031;cursor:pointer}.pick.selected{border-color:var(--gold);color:var(--gold)}.empty{text-align:center;padding:24px;color:var(--muted)}.bar{height:6px;background:#34445a;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.coach p{margin:0 0 8px;line-height:1.6;color:#c5d0dc;font-size:11px}.coach strong{color:var(--gold)}.modal-bg{position:fixed;inset:0;background:#03070cce;display:grid;place-items:center;padding:14px;z-index:5}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#172333;border:1px solid #4a5d74;border-radius:12px;padding:18px}.modal h2{margin:0 0 8px}.modal input{width:100%;padding:10px;background:#101a27;color:#fff;border:1px solid #34465c;border-radius:7px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:var(--gold);color:#17202a;padding:9px 14px;border-radius:7px;font-weight:700;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.foot{color:#78899e;text-align:center;font-size:10px;line-height:1.6;margin:13px 0}.profile{font-size:11px;color:#bbc8d6}.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.badge{padding:12px;border:1px solid var(--line);border-radius:8px;background:#172536}.badge.locked{opacity:.42;filter:grayscale(1)}
@media(max-width:850px){.content{grid-template-columns:1fr}.full{grid-column:auto}.phases{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.app{padding:10px}.summary{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top-actions{max-width:165px}.btn{padding:7px 8px;font-size:10px}.tabs button{padding:7px 8px;font-size:10px}.card{padding:11px}.phases{grid-template-columns:repeat(4,1fr)}.badge-grid{grid-template-columns:repeat(2,1fr)}}

<body><div class="app"><header class="top"><div class="brand"><div class="ball">🏀</div><div><h1>FANTASY · FRONT OFFICE</h1><div class="eyebrow">20-SEASON DYNASTY REBUILD LEAGUE</div></div></div><div class="top-actions"><span class="profile" id="managerLabel"></span><button class="btn" id="saveOut">匯出存檔</button><button class="btn" id="saveIn">匯入</button><button class="btn" id="loginBtn">經理設定</button><button class="btn" id="resetBtn">重新開始</button><input id="fileIn" type="file" accept="application/json" hidden></div></header><nav class="tabs" id="tabs"></nav><main id="view"></main><footer class="foot">本作是非官方、非授權的籃球幻想經營遊戲，與任何聯盟、球隊或球員均無隸屬、授權或合作關係。球員及球隊資料為虛構生成的遊戲模擬，不代表真實評價。存檔、經理設定、成就與排行榜只保存在這台裝置，不會同步至伺服器。</footer></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='front-office-v1',PROFILE='front-office-profile-v1',BOARD='front-office-board-v1',ACH='front-office-achievements-v1';
const franchises=['波士頓','布魯克林','紐約','費城','多倫多','芝加哥','克里夫蘭','底特律','印第安納','密爾瓦基','亞特蘭大','夏洛特','邁阿密','奧蘭多','華盛頓','丹佛','明尼蘇達','奧克拉荷馬城','波特蘭','猶他','金州','洛杉磯快艇','洛杉磯湖人','鳳凰城','沙加緬度','達拉斯','休士頓','孟菲斯','紐奧良','聖安東尼奧'];
const first=['林恩','陳凱','王子豪','張宇','林冠廷','陳柏翰','周以安','李承恩','黃睿哲','吳家豪','許皓鈞','趙明軒','楊曜任','郭品澤','方允成','高晨','江昀','鄭翔','羅子維','蔡昀哲','Miles','Jordan','Cameron','Darius','Jalen','Noah','Kai','Ethan','Marcus','Trey','Devin','Andre','Isaiah','Cole','Nico','Jamal','Tyler','Dylan'];
const last=['周','林','陳','高','黃','吳','王','李','張','楊','郭','許','鄭','蔡','葉','沈','杜','趙','何','劉','Carter','Brooks','Reed','Bennett','Mitchell','Turner','Hayes','Foster','Cooper','Parker','Young','Ward','Price','Powell','Bailey','Ross','Gray','Evans'];
const pos=['PG','SG','SF','PF','C'],seasonPhases=['開季','季中交易','全明星賽後','最後衝刺','季後賽','季末結算','休賽季'];
let profile=load(PROFILE,{manager:'臭G',team:'台北 Fantasy'}),state=load(KEY,null),tab='front',marketTab='交易市場',search='',position='全部',teamFilter='全部',sortBy='rating',sortDir=-1,sendIds=[],targetPick=null,toastTimer;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}}function $(s){return document.querySelector(s)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2100)}function money(x){return '$'+Number(x).toFixed(1)+'M'}
function makeP(rating=50,rookie=false){let ovr=rating;return{id:state?.nextId++||1,name:`${first[Math.random()*first.length|0]} ${last[Math.random()*last.length|0]}`,pos:pos[Math.random()*5|0],age:rookie?19+(Math.random()*4|0):19+(Math.random()*14|0),rating:ovr,potential:clamp(ovr+10+(Math.random()*18|0),ovr,99),salary:Math.max(1,Math.round((ovr-37)*.42+Math.random()*8)),years:1+(Math.random()*4|0),starter:false,rookie};}
function makeTeam(name,isUser=false){return{name,isUser,roster:Array.from({length:10},()=>makeP(53+(Math.random()*18|0))),wins:0,losses:0,owner:isUser?60:70,titles:0}}
function roster(team){return team?.roster||[]}function team(){return state.teams.find(x=>x.isUser)}function cap(){return state.cap||154}function payroll(t=team()){return roster(t).reduce((s,p)=>s+p.salary,0)}function ovr(t=team()){const ps=roster(t).slice().sort((a,b)=>b.rating-a.rating).slice(0,8);return ps.length?(ps.reduce((s,p)=>s+p.rating,0)/ps.length).toFixed(1):'—'}function phaseIndex(){return Math.max(0,seasonPhases.indexOf(state?.phase||'開季'))}
function init(){let teams=franchises.map(n=>makeTeam(n));let user=makeTeam(profile.team,true);state={nextId:1,teams:[...teams,user],userTeam:profile.team,manager:profile.manager,year:1,phase:'開季',cap:154,budget:223.3,expansionDone:false,roster:user.roster,market:Array.from({length:270},()=>makeP(48+(Math.random()*30|0))),freeAgents:Array.from({length:20},()=>makeP(48+(Math.random()*26|0)),draft:Array.from({length:31},()=>makeP(61+(Math.random()*18|0),true)),picks:Array.from({length:31},(_,i)=>({year:2025,team:franchises[i]||profile.team,number:i+1,value:Math.max(20,100-i*2)})),myPick:{year:2025,team:profile.team,number:10,value:98},log:['2025｜聯盟重啟：330 位虛構球員全部打回新秀，最強的 31 位進入選秀。你抽到第 10 順位。二十季，開始。'],record:{wins:0,losses:0},championships:0,points:0,seasonCount:0,achievements:[],records:[],seasonClosed:false,selectedMarket:'交易市場'};state.nextId=1000;state.teams[30]=user;state.roster=user.roster;save();}
function ensure(){if(!state){init();return}state.cap ||=154;state.budget ||=223.3;state.records ||= [];state.achievements ||= [];state.log ||= [];state.market ||= [];state.freeAgents ||= [];state.draft ||= [];state.picks ||= [];state.roster=team().roster;}
function tabs(){let items=[['front','總覽'],['market','球員／選秀權交易 ↓'],['career','生涯'],['tutorial','新手教學'],['leaderboard','排行榜'],['achievements','成就 '+getAch().length+'/32']];$('#tabs').innerHTML=items.map(([id,n])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('');$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});}
function getAch(){return load(ACH,[])}function award(id,label,desc){let a=getAch();if(a.some(x=>x.id===id))return;a.push({id,label,desc,date:new Date().toLocaleDateString('zh-Hant')});localStorage.setItem(ACH,JSON.stringify(a));toast('成就解鎖：'+label)}
function shell(html){$('#managerLabel').textContent=`${safe(profile.team)} ｜ GENERAL MANAGER / ${safe(profile.manager)}`;tabs();$('#view').innerHTML=html;bindCommon()}
function render(){ensure();if(tab==='front')shell(front());else if(tab==='market')shell(market());else if(tab==='career')shell(career());else if(tab==='tutorial')shell(tutorial());else if(tab==='leaderboard')shell(leaderboard());else shell(achievements());}
function front(){const t=team(),rank=state.teams.slice().sort((a,b)=>b.wins-a.wins).findIndex(x=>x.isUser)+1,prog=phaseIndex();let remaining=15-roster(t).length,tax=payroll()>cap()*1.32?'第二層奢侈稅':payroll()>cap()*1.22?'觸及奢侈稅':'未觸及稅線';let injuries=roster(t).filter(p=>p.injury).length;return `<div class="content"><section class="card"><div class="section-title"><div><div class="mini">NBA FANTASY · FRONT OFFICE</div><h2>${safe(profile.team)}</h2><span class="profile">GENERAL MANAGER / ${safe(profile.manager)}</span></div><button class="btn" data-do="coach">教練建議</button></div><div class="summary"><div class="stat"><label>榮譽分數</label><b>${state.points}</b></div><div class="stat"><label>總冠軍</label><b>${state.championships} 座</b></div><div class="stat"><label>老闆心情</label><b>${t.owner}/100</b></div><div class="stat"><label>例行賽戰績</label><b>${state.record.wins}–${state.record.losses}</b></div></div><div class="season"><div><b>SEASON ${state.year} / 共 20 季</b><div class="muted">${2024+state.year}—${2025+state.year}</div></div><div class="muted">聯盟排名 #${rank} ｜ ${tax}</div></div><div class="phases">${seasonPhases.map((p,i)=>`<div class="phase ${i===prog?'active':i<prog?'done':''}">${String(i+1).padStart(2,'0')}<br>${p}</div>`).join('')}</div>${!state.expansionDone?`<div class="notice">聯盟重啟：完成擴編選秀，至少組成 10 人名單後即可開打。你的開局名單目前 ${roster(t).length} 人。</div>`:''}<div class="actions"><button class="btn gold" data-do="advance" ${state.phase==='休賽季'&&state.year>=20?'disabled':''}>${state.phase==='開季'?'開始本階段':state.phase==='季後賽'?'模擬季後賽':state.phase==='休賽季'?'開始下一季':'推進至下一階段'}</button><button class="btn" data-tab="market">前往交易與補強</button><button class="btn" data-do="profile">球隊設定</button></div><div class="section-title" style="margin-top:15px"><h3>球員／選秀權交易</h3><span class="mini">點選球員加入交易送出名單</span></div><div class="summary"><div class="stat"><label>陣容人數</label><b>${roster(t).length} / 15</b></div><div class="stat"><label>薪資</label><b>${money(payroll())}</b></div><div class="stat"><label>薪資上限</label><b>${money(cap())}</b></div><div class="stat"><label>正選戰力</label><b>${teamStrength(true)}</b></div></div><div class="scroll"><table><thead><tr><th>球員</th><th>位置</th><th>年齡</th><th>總評</th><th>薪資</th><th>合約</th><th>角色</th><th>交易</th></tr></thead><tbody>${roster(t).map(p=>`<tr><td class="player">${safe(p.name)}</td><td><span class="pos">${p.pos}</span></td><td>${p.age}</td><td class="ovr">${p.rating}</td><td>${money(p.salary)}</td><td>${p.years} 年</td><td><button class="btn" data-role="${p.id}">${p.starter?'先發':'替補'}</button></td><td><button class="btn ${sendIds.includes(p.id)?'gold':''}" data-send="${p.id}">${sendIds.includes(p.id)?'已選':'選擇'}</button></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" data-do="release">釋出球員</button><button class="btn" data-tab="market">徵求報價</button><span class="mini">${remaining>0?`還差 ${Math.max(0,10-roster(t).length)} 人才能推進賽季`:''}</span></div></section><aside><section class="card coach"><div class="section-title"><h3>00 教練檢討 · ${2024+state.year} 休賽季</h3><span class="mini">即時建議</span></div><p>上季結果依戰報；補強建議依目前陣容。</p>${coachText()}<div class="section-title" style="margin-top:14px"><h3>我的選秀權</h3></div><p>2025 自家 · 第 ${state.myPick.number} 順位｜值 ${state.myPick.value}</p><div class="section-title"><h3>賽季日誌</h3></div><div class="scroll" style="max-height:230px">${state.log.slice().reverse().map(x=>`<p class="mini">${safe(x)}</p>`).join('')}</div></section></aside><section class="card full"><div class="section-title"><h3>賽季進度與聯盟摘要</h3><span class="mini">球員能力、潛力、薪資與部分合約均為遊戲模擬估算</span></div><p class="muted">老闆預算為薪資上限 145%；超過 122% 起課奢侈稅，132% 為第二層。交易配平、續約權與釋出薪資採簡化規則。${injuries?`目前傷兵 ${injuries} 人。`:''}</p></section></div>`}
function teamStrength(starters){let a=roster(team()).filter(p=>!!p.starter===starters);return a.length?(a.reduce((s,p)=>s+p.rating,0)/a.length).toFixed(1):'—'}function coachText(){let needs=pos.filter(x=>!roster(team()).some(p=>p.pos===x));let low=needs.length?`需要補強位置：${needs.join('、')}。`:'五個位置皆有球員，可以著重補輪替深度。';let cash=cap()-payroll();return `<p>${low}</p><p>目前薪資空間 ${money(Math.max(0,cash))}${cash>0?'，可直接簽下自由球員。':'，建議先交易或釋出合約。'}</p><p>替補戰力 ${teamStrength(false)}；多留意薪資稅線與球員合約年限。</p>`}
function market(){let pool=marketTab==='交易市場'?state.market:marketTab==='自由市場'?state.freeAgents:state.draft;let filtered=pool.filter(p=>(!search||p.name.toLowerCase().includes(search.toLowerCase()))&&(position==='全部'||p.pos===position)&&(teamFilter==='全部'||p.team===teamFilter));filtered.sort((a,b)=>(a[sortBy]??0)>(b[sortBy]??0)?sortDir:(a[sortBy]??0)<(b[sortBy]??0)?-sortDir:0);return `<div class="content"><section class="card"><div class="section-title"><div><div class="mini">PERSONNEL OPERATIONS</div><h2>球員交易與補強</h2></div><span class="mini">薪資 ${money(payroll())} / ${money(cap())}</span></div><div class="subnav">${['交易市場','自由市場','選秀'].map(x=>`<button class="${marketTab===x?'active':''}" data-market="${x}">${x}（${x==='交易市場'?state.market.length:x==='自由市場'?state.freeAgents.length:state.draft.length}）</button>`).join('')}</div><div class="filters"><input id="search" placeholder="搜尋球員姓名" value="${safe(search)}"><select id="teamFilter"><option>全部</option>${franchises.map(x=>`<option ${teamFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="posFilter"><option>全部</option>${pos.map(x=>`<option ${position===x?'selected':''}>${x}</option>`).join('')}</select><span class="mini">${filtered.length} 人</span></div>${marketTab==='交易市場'?`<div class="notice">先選擇對方球員或選秀權，再選你的球員作為回報。這是簡化的一對一交易模擬。</div>`:''}${marketTab==='選秀'?`<div class="picks">${state.picks.filter(p=>p.team!==profile.team).map(p=>`<button class="pick ${targetPick===p.number?'selected':''}" data-pick="${p.number}">#${p.number}</button>`).join('')}</div>`:''}<div class="scroll"><table><thead><tr><th data-sort="name">球員 ↕</th><th>球隊</th><th data-sort="pos">位置</th><th data-sort="age">年齡</th><th data-sort="rating">總評 ${sortBy==='rating'?'↓':'↕'}</th><th>預估</th><th data-sort="salary">薪資</th><th>合約</th><th>操作</th></tr></thead><tbody>${filtered.slice(0,180).map(p=>`<tr><td class="player">${safe(p.name)}</td><td>${safe(p.team||'新秀')}</td><td><span class="pos">${p.pos}</span></td><td>${p.age}</td><td class="ovr">${p.rating}</td><td>${Math.max(p.rating,p.potential-4)}–${p.potential}</td><td>${money(p.salary)}</td><td>${p.years} 年</td><td><button class="btn" data-acquire="${p.id}">${marketTab==='交易市場'?'交易':'簽下'}</button></td></tr>`).join('')}</tbody></table></div></section><aside><section class="card"><div class="section-title"><h3>交易籌碼</h3><span class="mini">${sendIds.length} 位球員</span></div><p class="muted">點選下方選秀權加入交易；再選你的球員作為回報。一次與一隊交易。</p><div class="notice">我的選秀權：${state.myPick.year} 自家 · 第 ${state.myPick.number} 順位（值 ${state.myPick.value}）</div>${sendIds.length?sendIds.map(id=>{let p=roster(team()).find(x=>x.id===id);return p?`<p>${safe(p.name)} · ${p.pos} · OVR ${p.rating}　<button class="btn" data-unsend="${id}">移除</button></p>`:''}).join(''):'<div class="empty">尚未選擇送出球員</div>'}<div class="actions"><button class="btn gold" data-do="trade" ${!sendIds.length?'disabled':''}>提出交易</button><button class="btn" data-do="clearTrade">清除</button></div><div class="box"><h3>薪資與陣容</h3><p>陣容 ${roster(team()).length}/15 人<br>薪資 ${money(payroll())}<br>剩餘空間 ${money(cap()-payroll())}<br>預算上限 ${money(state.budget)}</p><div class="bar"><i style="width:${clamp(payroll()/state.budget*100,0,100)}%"></i></div></div></section></aside></div>`}
function bindCommon(){$('#view').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#view').querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{marketTab=b.dataset.market;render()});$('#view').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let p=roster(team()).find(x=>x.id==b.dataset.role);p.starter=!p.starter;save();render()});$('#view').querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.send);sendIds=sendIds.includes(id)?sendIds.filter(x=>x!==id):[...sendIds,id];render()});$('#view').querySelectorAll('[data-unsend]').forEach(b=>b.onclick=()=>{sendIds=sendIds.filter(x=>x!==Number(b.dataset.unsend));render()});$('#view').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{targetPick=Number(b.dataset.pick);render()});$('#view').querySelectorAll('[data-acquire]').forEach(b=>b.onclick=()=>acquire(Number(b.dataset.acquire)));$('#view').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{let s=b.dataset.sort;if(sortBy===s)sortDir*=-1;else{sortBy=s;sortDir=-1}render()});$('#view').querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>doAction(b.dataset.do));if($('#search'))$('#search').oninput=e=>{search=e.target.value;let at=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(at,at)};if($('#teamFilter'))$('#teamFilter').onchange=e=>{teamFilter=e.target.value;render()};if($('#posFilter'))$('#posFilter').onchange=e=>{position=e.target.value;render()}}
function acquire(id){let list=marketTab==='交易市場'?state.market:marketTab==='自由市場'?state.freeAgents:state.draft,p=list.find(x=>x.id===id);if(!p)return;if(marketTab==='交易市場'){if(!sendIds.length)return toast('先在陣容選擇送出球員');let sent=roster(team()).filter(x=>sendIds.includes(x.id)),value=sent.reduce((s,x)=>s+x.rating,0)/sent.length;if(value<p.rating-12)return toast('對方不接受這個交易報價');if(payroll()-sent.reduce((s,x)=>s+x.salary,0)+p.salary>state.budget)return toast('交易後超過老闆預算');team().roster=roster(team()).filter(x=>!sendIds.includes(x.id));team().roster.push(p);state.market=state.market.filter(x=>x.id!==id).concat(sent.map(x=>({...x,team:profile.team})));sendIds=[];toast('交易完成！')}else{if(roster(team()).length>=15)return toast('陣容已滿');if(payroll()+p.salary>state.budget)return toast('超過老闆預算');team().roster.push(p);list.splice(list.indexOf(p),1);toast('球員已加入陣容')}state.roster=team().roster;save();render()}
function advance(){if(roster(team()).length<10)return toast('至少需要 10 位球員才能推進賽季');let i=phaseIndex();if(i===0&&!state.expansionDone){state.expansionDone=true;award('roster','建隊完成','完成第一份球隊名單');}if(state.phase==='休賽季'){if(state.year>=20)return toast('二十季王朝已完成');newSeason();return}if(state.phase==='開季'){simulateRecord();state.phase='季中交易'}else if(state.phase==='季中交易'){state.phase='全明星賽後'}else if(state.phase==='全明星賽後'){state.phase='最後衝刺'}else if(state.phase==='最後衝刺'){state.phase='季後賽'}else if(state.phase==='季後賽'){simulatePlayoff()}else if(state.phase==='季末結算'){settleSeason();state.phase='休賽季'}else if(state.phase==='休賽季'){newSeason()}state.log.push(`${2024+state.year} ${state.phase} · 階段推進完成。`);save();render()}
function simulateRecord(){let base=Number(ovr()),best=Number(ovr({roster:team().roster.filter(p=>p.starter)}))||base;let wins=clamp(Math.round(41+(base-65)*1.5+(best-65)*.4+(Math.random()-.5)*18),8,74);state.record={wins,losses:82-wins};team().wins=wins;team().losses=82-wins;let others=state.teams.filter(x=>!x.isUser);others.forEach(t=>{let w=clamp(Math.round(41+(Number(ovr(t))-65)*1.4+(Math.random()-.5)*18),8,74);t.wins=w;t.losses=82-w});}
function simulatePlayoff(){if(state.record.wins<42){state.log.push('季後賽：未能晉級。');toast('例行賽未達季後賽門檻，季末結算。');state.phase='季末結算';return}let strength=Number(ovr())+(state.tactic?3:0),chance=clamp(.45+(strength-68)*.025,.15,.82),won=Math.random()<chance;state.playoffResult=won?'總冠軍！':'季後賽止步';if(won){state.championships++;state.points+=1000;team().titles++;award('champion-'+state.championships,'王朝冠軍','奪得總冠軍');toast('恭喜奪冠！')}else{state.points+=250;toast('季後賽結束，再接再厲。')}state.phase='季末結算'}
function settleSeason(){state.points+=state.record.wins*5;state.records.push({year:state.year,wins:state.record.wins,losses:state.record.losses,champion:state.playoffResult==='總冠軍！'});if(state.record.wins>=65)award('historic-'+state.year,'歷史級戰績','單季至少 65 勝');state.seasonCount++;state.log.push(`${2024+state.year} 季末結算：${state.record.wins} 勝 ${state.record.losses} 敗，${state.playoffResult||'賽季結束'}。`);state.phase='休賽季';state.tactic='';}
function newSeason(){for(let p of roster(team())){p.age++;p.years--;let delta=p.age<25?Math.random()*4|0:p.age>31?-(Math.random()*3|0):Math.random()*3|0;p.rating=clamp(p.rating+delta-1,35,99);if(p.years<=0){p.years=1+(Math.random()*3|0);if(Math.random()<.25)state.freeAgents.push(p)}}team().roster=roster(team()).filter(p=>p.years>0||p.age<38);while(roster(team()).length<10)team().roster.push(makeP(48+(Math.random()*18|0)));state.year++;state.phase='開季';state.record={wins:0,losses:0};state.seasonClosed=false;state.draft=Array.from({length:31},()=>makeP(58+(Math.random()*25|0),true));state.market.push(...Array.from({length:30},()=>makeP(45+(Math.random()*28|0))));state.freeAgents.push(...Array.from({length:12},()=>makeP(45+(Math.random()*28|0)));state.myPick={year:2024+state.year,team:profile.team,number:1+(Math.random()*30|0),value:65};state.log.push(`${2024+state.year}｜休賽季完成，新秀選秀池與自由球員市場已更新。`);save();}
function doAction(a){if(a==='advance')advance();if(a==='coach')toast(coachText().replace(/<[^>]*>/g,''));if(a==='profile')profileModal();if(a==='release'){let p=roster(team()).find(x=>sendIds.includes(x.id));if(!p)return toast('先選擇要釋出的球員');if(roster(team()).length<=10)return toast('至少保留 10 位球員');team().roster=roster(team()).filter(x=>x.id!==p.id);sendIds=[];save();render();toast('球員已釋出。')}if(a==='trade')toast('請在交易市場選對方球員，再提交報價。');if(a==='clearTrade'){sendIds=[];targetPick=null;render()}}
function profileModal(){modal(`<h2>球隊設定</h2><p class="muted">設定只保存在這台裝置，不是線上登入帳號。</p><label>經理名稱<input id="mName" value="${safe(profile.manager)}"></label><p></p><label>球隊名稱<input id="tName" value="${safe(profile.team)}"></label><div class="actions"><button class="btn gold" id="profileSave">儲存設定</button></div>`);$('#profileSave').onclick=()=>{profile.manager=$('#mName').value.trim().slice(0,24)||'總經理';let old=profile.team;profile.team=$('#tName').value.trim().slice(0,30)||old;if(state){state.userTeam=profile.team;team().name=profile.team;state.myPick.team=profile.team}localStorage.setItem(PROFILE,JSON.stringify(profile));save();$('.modal-bg').remove();render()}}
function modal(html){let old=$('.modal-bg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg"><div class="modal">${html}<div class="actions"><button class="btn" onclick="this.closest('.modal-bg').remove()">關閉</button></div></div></div>`)}
function tutorial(){return `<div class="content"><section class="card full"><h2>新手教學</h2><p>① 先將陣容補至 10 人。② 用交易市場、自由市場及選秀補強。③ 每次推進一個賽季階段，開季會模擬 82 場戰績，季後賽依陣容評分模擬。④ 休賽季球員會成長、老化與進入合約年。⑤ 存檔自動保存在瀏覽器；用匯出功能建立備份。</p><div class="notice">薪資以百萬美元為單位；老闆預算約為薪資上限的 145%，超過 122% 起課奢侈稅，132% 為第二層。交易規則採簡化模擬。</div></section></div>`}
function career(){return `<div class="content"><section class="card full"><h2>生涯紀錄</h2><div class="summary"><div class="stat"><label>王朝季數</label><b>${state.year}/20</b></div><div class="stat"><label>榮譽分數</label><b>${state.points}</b></div><div class="stat"><label>總冠軍</label><b>${state.championships}</b></div><div class="stat"><label>球季完成</label><b>${state.seasonCount}</b></div></div>${state.records.length?state.records.slice().reverse().map(r=>`<p>第 ${r.year} 季　${r.wins}–${r.losses}　${r.champion?'🏆 總冠軍':''}</p>`).join(''):'<div class="empty">尚未完成球季</div>'}</section></div>`}
function leaderboard(){let rows=load(BOARD,[]);if(state.seasonCount&&!rows.some(x=>x.team===profile.team&&x.seasons===state.seasonCount)){rows.push({manager:profile.manager,team:profile.team,points:state.points,titles:state.championships,seasons:state.seasonCount});rows.sort((a,b)=>b.points-a.points);localStorage.setItem(BOARD,JSON.stringify(rows.slice(0,50)))}return `<div class="content"><section class="card full"><h2>本機排行榜</h2><p class="muted">此排行榜只在目前瀏覽器保存，不會與其他玩家同步。</p><div class="scroll"><table><thead><tr><th>名次</th><th>經理</th><th>球隊</th><th>榮譽分數</th><th>冠軍</th><th>球季</th></tr></thead><tbody>${rows.length?rows.map((x,i)=>`<tr><td>${i+1}</td><td>${safe(x.manager)}</td><td>${safe(x.team)}</td><td class="ovr">${x.points}</td><td>${x.titles}</td><td>${x.seasons}</td></tr>`).join(''):`<tr><td colspan="6">尚無紀錄</td></tr>`}</tbody></table></div></section></div>`}
function achievements(){let unlocked=getAch(),names=['新球隊成立','十勝賽季','季後賽首勝','首次奪冠','三連霸','王朝十冠','歷史級戰績','十季經營','二十季傳奇','薪資管理師','交易大師','選秀慧眼','逆轉勝','建隊完成','台北王朝','教練信任','老闆最愛','常勝軍','全明星教練','重建成功','自由市場獵手','薪資低於上限','三十勝','四十勝','五十勝','六十勝','十次季後賽','五座冠軍','培養新秀','球隊忠誠','生涯高分','傳奇經理'];return `<div class="content"><section class="card full"><h2>成就 ${unlocked.length}/32</h2><p class="muted">成就只保存在這台裝置。重新開始新存檔不會清除已解鎖獎章。</p><div class="badge-grid">${names.map((n,i)=>{let item=unlocked.find(x=>x.label===n);return `<div class="badge ${item?'':'locked'}"><b>${item?'🏅':'🔒'} ${n}</b><p class="mini">${item?safe(item.desc):'達成生涯目標解鎖'}</p></div>`}).join('')}</div></section></div>`}
function leaderboardPush(){let rows=load(BOARD,[]);rows.push({manager:profile.manager,team:profile.team,points:state.points,titles:state.championships,seasons:state.seasonCount});rows.sort((a,b)=>b.points-a.points);localStorage.setItem(BOARD,JSON.stringify(rows.slice(0,50)))}
function exportSave(){let blob=new Blob([JSON.stringify({state,profile,achievements:getAch(),board:load(BOARD,[])},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fantasy-front-office-save.json';a.click();URL.revokeObjectURL(a.href);toast('存檔已匯出')}
function importSave(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.state?.teams||!x.state.userTeam)throw 0;state=x.state;profile=x.profile||profile;localStorage.setItem(PROFILE,JSON.stringify(profile));if(x.achievements)localStorage.setItem(ACH,JSON.stringify(x.achievements));if(x.board)localStorage.setItem(BOARD,JSON.stringify(x.board));save();render();toast('存檔匯入成功')}catch{toast('存檔格式無效')}};r.readAsText(file)}
$('#saveOut').onclick=exportSave;$('#saveIn').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=e=>{if(e.target.files[0])importSave(e.target.files[0]);e.target.value=''};$('#loginBtn').onclick=profileModal;$('#resetBtn').onclick=()=>{if(confirm('確定重新開始？目前存檔會被取代，成就會保留。')){localStorage.removeItem(KEY);state=null;init();render()}};
if(!state)init();render();
})();
</script></body></html>
