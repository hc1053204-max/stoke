<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Noto Sans TC",sans-serif;--bg:#0e1420;--panel:#172131;--line:#34445a;--muted:#aab8ca;--gold:#f3c76b;--green:#73d3ad;--red:#fa8585}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#293954,var(--bg) 62%);color:#f4f6fa}.app{width:min(1160px,100%);margin:auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;display:grid;place-items:center;border:1px solid #53667f;border-radius:13px;background:linear-gradient(145deg,#293b54,#172232);font-size:23px}.brand h1{font-size:clamp(18px,3vw,25px);margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #51637a;border-radius:9px;padding:10px 14px;background:#26364b;color:#f5f7fb;font:650 13px inherit;font-family:inherit;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(1.14);transform:translateY(-1px)}.btn.primary{background:var(--gold);border-color:#ffe19b;color:#1b2028}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.side,.panel{background:linear-gradient(150deg,#1b2738f5,#141d2af5);border:1px solid var(--line);border-radius:14px}.side{padding:13px;height:max-content;position:sticky;top:12px}.team-summary{padding:12px;border-radius:10px;background:#222f42;margin-bottom:12px}.team-summary strong{display:block;color:var(--gold);font-size:17px;margin:4px 0}.muted,.team-summary span{color:var(--muted);font-size:12px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#c5d0df;border:0;text-align:left;padding:10px 11px;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#2a3b52;color:#fff}.side-note{margin-top:13px;padding:11px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.75}.main{min-width:0}.panel{padding:clamp(15px,3vw,25px);min-height:400px}.intro{max-width:760px;margin:auto;padding:20px 0}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.13em}.intro h2{font-size:clamp(30px,5vw,51px);line-height:1.14;margin:12px 0}.intro>p,.copy{color:#bdc9d8;line-height:1.8}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:20px 0}.feature,.box{padding:14px;background:#202d40;border:1px solid #35465d;border-radius:11px}.feature b{display:block;margin-bottom:5px}.feature span{color:var(--muted);font-size:12px;line-height:1.5}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.field input,.field select{background:#101a28;color:#fff;border:1px solid #4a5b72;border-radius:8px;padding:11px 12px;font:inherit;width:100%}.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end;margin-top:18px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:13px;margin-bottom:15px}.title-row h2{margin:0;font-size:24px}.title-row p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:13px 0}.stat{padding:13px;border:1px solid var(--line);border-radius:10px;background:#1e2b3d}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:6px;color:var(--gold)}.stat small{color:var(--muted);font-size:10px}.grid-two{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.box{margin:10px 0;background:#192536;border-color:var(--line)}.box h3{margin:0 0 10px;font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{text-align:left;color:#9eafc4;font-weight:600;padding:9px;border-bottom:1px solid var(--line)}td{padding:9px;border-bottom:1px solid #2c394a}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#293b52;color:#bdcde0;font-size:10px}.rating{color:var(--gold);font-weight:800}.positive{color:var(--green)}.notice{padding:12px 14px;border:1px solid #8a7047;background:#42351f80;border-radius:9px;color:#ffdfa0;line-height:1.6;font-size:12px;margin:12px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player-card{display:flex;justify-content:space-between;gap:9px;align-items:center;border:1px solid var(--line);background:#1b283a;border-radius:10px;padding:11px}.player-card .info{min-width:0}.player-card b{display:block;font-size:13px}.player-card small{display:block;color:var(--muted);margin-top:4px;font-size:10px;line-height:1.5}.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:13px}.history-row{display:grid;grid-template-columns:65px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.footer{color:#8594a8;text-align:center;font-size:10px;line-height:1.7;margin:20px auto 0;max-width:850px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--gold);color:#161c25;padding:11px 16px;border-radius:9px;font-weight:750;font-size:12px;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#050910d9;display:grid;place-items:center;padding:16px;z-index:4}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#1a2637;border:1px solid #52647a;border-radius:14px;padding:21px}.modal h2{margin:0 0 8px}.modal p{color:#b7c5d6;line-height:1.65;font-size:12px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.badge{display:flex;gap:10px;align-items:center;padding:12px;background:#1d2b3e;border:1px solid var(--line);border-radius:10px}.badge .icon{font-size:24px}.badge small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px 2px;font-size:11px}.team-summary{display:flex;align-items:center;justify-content:space-between;gap:8px}.side-note{display:none}}@media(max-width:580px){.app{padding:13px 9px 30px}.top{align-items:flex-start}.top-actions{max-width:145px}.top-actions .btn{font-size:10px;padding:8px}.brand p{display:none}.setup,.grid-two,.player-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:1fr}.panel{padding:13px}.nav button{font-size:10px}.title-row{flex-direction:column}.history-row{grid-template-columns:48px 1fr auto}}

<body><div class="app"><header class="top"><div class="brand"><div class="logo">🏀</div><div><h1>籃球王朝</h1><p>二十季重建聯盟 · 球隊總經理模擬</p></div></div><div class="top-actions"><button class="btn small" id="exportBtn">匯出存檔</button><button class="btn small" id="importBtn">匯入</button><button class="btn small" id="resetBtn">新開存檔</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header><div id="root"></div><footer class="footer">非官方、非授權的籃球幻想經營遊戲，與任何聯盟、球隊或球員均無隸屬、授權或合作關係。球隊及球員資料為虛構或遊戲生成，不代表真實評價。遊戲存檔及個人紀錄僅保存在此瀏覽器；排行榜是本機紀錄，不是全球排行榜。</footer></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const SAVE_KEY='dynasty-manager-save-v2',PROFILE_KEY='dynasty-manager-profile-v2',BADGE_KEY='dynasty-manager-badges-v2',BOARD_KEY='dynasty-manager-board-v2';
const teamsNames=['波士頓','布魯克林','紐約','費城','多倫多','芝加哥','克里夫蘭','底特律','印第安納','密爾瓦基','亞特蘭大','夏洛特','邁阿密','奧蘭多','華盛頓','丹佛','明尼蘇達','奧克拉荷馬城','波特蘭','猶他','金州','洛杉磯快艇','洛杉磯湖人','鳳凰城','沙加緬度','達拉斯','休士頓','曼菲斯','紐奧良','聖安東尼奧'];
const given=['林恩','陳凱','王子豪','張宇','林冠廷','陳柏翰','周以安','李承恩','黃睿哲','吳家豪','許皓鈞','趙明軒','楊曜任','郭品澤','方允成','高晨','江昀','鄭翔','羅子維','蔡昀哲','Miles','Jordan','Cameron','Darius','Jalen','Noah','Kai','Ethan','Marcus','Trey','Devin','Andre','Isaiah','Cole','Nico','Jamal','Tyler','Dylan'];
const family=['周','林','陳','高','黃','吳','王','李','張','楊','郭','許','鄭','蔡','葉','沈','杜','趙','何','劉','Carter','Brooks','Reed','Bennett','Mitchell','Turner','Hayes','Foster','Cooper','Parker','Young','Ward','Price','Powell','Bailey','Ross','Gray','Evans'];
const positions=['PG','SG','SF','PF','C'];let nextId=1,state=loadSave(),profile=loadJson(PROFILE_KEY,{name:'球隊經理'}),tab='home',toastTimer;
function loadJson(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}function loadSave(){const s=loadJson(SAVE_KEY,null);if(s&&s.userTeam&&Array.isArray(s.teams)){nextId=s.nextId||1;return s}return null}
function persist(){if(!state)return;state.nextId=nextId;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));$('saveStatus').textContent='本機已存檔'}catch{$('saveStatus').textContent='無法儲存：瀏覽器空間不足'}}
function persistProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch{}}
function $(q){return document.querySelector(q)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function money(n){return `$${n}M`}function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}
function makePlayer(lo=48,hi=84,season=1){const rating=Math.floor(lo+Math.random()*(hi-lo+1));return{id:nextId++,name:`${given[Math.random()*given.length|0]} ${family[Math.random()*family.length|0]}`,pos:positions[Math.random()*5|0],rating,potential:Math.min(99,rating+Math.random()*22|0),age:season===1?20+(Math.random()*13|0):19+(Math.random()*8|0),salary:Math.max(1,Math.round((rating-35)*.38+Math.random()*4)),years:1+(Math.random()*4|0),injured:0}}
function makeTeam(name,isUser=false){return{name,isUser,roster:Array.from({length:10},()=>makePlayer(53,83)),wins:0,losses:0,owner:70,championships:0}}
function rating(r){if(!r?.length)return 45;return Math.round(r.slice().sort((a,b)=>b.rating-a.rating).slice(0,8).reduce((s,p)=>s+p.rating,0)/Math.min(8,r.length))}function salary(r){return(r||[]).reduce((s,p)=>s+p.salary,0)}function user(){return state.teams.find(t=>t.isUser)}
function getBadges(){return loadJson(BADGE_KEY,[])}function award(id,title,description,icon){const all=getBadges();if(all.some(x=>x.id===id))return;all.push({id,title,description,icon,date:new Date().toLocaleDateString('zh-Hant')});localStorage.setItem(BADGE_KEY,JSON.stringify(all));toast(`解鎖成就：${title}`)}
function recordBoard(){if(!state||!user())return;const board=loadJson(BOARD_KEY,[]);board.push({name:profile.name||user().name,team:user().name,titles:user().championships,seasons:state.history.length,year:new Date().toLocaleDateString('zh-Hant')});board.sort((a,b)=>b.titles-a.titles||b.seasons-a.seasons);localStorage.setItem(BOARD_KEY,JSON.stringify(board.slice(0,20)))}
function startLeague(){profile.name=$('#managerName').value.trim().slice(0,24)||'球隊經理';persistProfile();const name=$('#teamName').value.trim().slice(0,24)||'新城拓荒者';state={userTeam:name,teams:[...teamsNames.map(n=>makeTeam(n)),makeTeam(name,true)],year:1,phase:'expansion',cap:140,expansion:[],history:[],awards:[],freeAgents:Array.from({length:48},()=>makePlayer(56,88)),playoffTeams:[],round:0,tactic:null,champion:null};persist();tab='roster';render()}
function nav(){return `<aside class="side"><div class="team-summary"><div><span>本機經理：${esc(profile.name||'球隊經理')}</span><strong>${esc(state?.userTeam||'尚未建立球隊')}</strong></div><span>${state?`第 ${state.year} 季 · ${phaseText()}`:'準備開始'}</span></div><nav class="nav">${[['home','總覽'],['roster','陣容'],['market','自由市場'],['standings','聯盟戰績'],['history','成就／王朝史']].map(([id,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</nav><div class="side-note">${state?`球隊評分 <b class="rating">${rating(user().roster)}</b><br>薪資 ${money(salary(user().roster))} / ${money(state.cap)}<br>冠軍 ${user().championships} 次`:'免費遊玩 · 免註冊'}<br><span id="saveStatus">${state?'本機已存檔':'資料只存於此瀏覽器'}</span></div></aside>`}function phaseText(){return({expansion:'擴編選秀',regular:'例行賽',playoffs:'季後賽',draft:'新秀選秀',complete:'二十季完成'})[state.phase]||''}
function shell(html){$('#root').innerHTML=`<div class="layout">${nav()}<main class="main"><section class="panel">${html}</section></main></div>`;$('#root').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});}
function render(){if(!state){renderIntro();return}if(state.phase==='expansion'){renderExpansion();return}let views={home:homeHTML,roster:rosterHTML,market:marketHTML,standings:standingsHTML,history:historyHTML};shell((views[tab]||homeHTML)());bind()}
function renderIntro(){const board=loadJson(BOARD_KEY,[]);$('#root').innerHTML=`<section class="panel"><div class="intro"><div class="eyebrow">FREE · BROWSER GM SIMULATION</div><h2>從一張白紙，<br><span style="color:var(--gold)">打造二十季王朝。</span></h2><p>建立原創擴張球隊，在薪資上限內挑選球員、簽約補強、培養新秀，並逐輪挑戰季後賽。無須註冊或安裝，直接在瀏覽器遊玩。</p><div class="feature-grid"><div class="feature"><b>🧢 擴編選秀</b><span>從虛構球員候選池挑選 8–12 人，組成建隊核心。</span></div><div class="feature"><b>📈 經營陣容</b><span>管理薪資、合約、球員年齡、能力成長與自由球員。</span></div><div class="feature"><b>🏆 季後賽戰術</b><span>模擬例行賽，為季後賽系列賽選擇戰術方向。</span></div><div class="feature"><b>💾 本機成就與存檔</b><span>成就、排行榜與存檔保存在此瀏覽器；支援存檔匯出備份。</span></div></div><div class="setup"><label class="field">經理名稱<input id="managerName" maxlength="24" value="${esc(profile.name||'球隊經理')}"></label><label class="field">擴張隊名稱<input id="teamName" maxlength="24" placeholder="例如：新城拓荒者" value="新城拓荒者"></label><button class="btn primary" id="createLeague">建立球隊</button></div><p class="muted" style="font-size:11px">免註冊模式：經理名稱只是本機個人檔案，不是安全帳號；本機排行榜不會與其他玩家同步。</p><div class="grid-two"><div class="box"><h3>🏅 我的成就（${getBadges().length}）</h3><p class="muted">${getBadges().length?getBadges().map(x=>`${x.icon} ${esc(x.title)}`).join('　'):'完成目標即可解鎖成就'}</p></div><div class="box"><h3>📊 本機排行榜</h3>${board.length?board.slice(0,3).map((x,i)=>`<p class="muted">${i+1}. ${esc(x.name)} · ${x.titles} 冠</p>`).join(''):'<p class="muted">完成球季後建立本機紀錄</p>'}</div></div></div></section>`;$('#createLeague').onclick=startLeague;}
let expansionPool=[];
function renderExpansion(){if(!expansionPool.length)expansionPool=state.freeAgents.slice(0,40);const picks=state.expansion||[];$('#root').innerHTML=`<section class="panel"><div class="title-row"><div><div class="eyebrow">EXPANSION DRAFT · SEASON 1</div><h2>挑選建隊核心</h2><p>選出 8–12 位球員。總薪資不得超過 ${money(state.cap)}；候選球員皆為虛構遊戲資料。</p></div><span class="tag">${picks.length} / 8–12 人</span></div><div class="cards"><div class="stat"><span>陣容評分</span><strong>${rating(picks)}</strong></div><div class="stat"><span>薪資</span><strong>${money(salary(picks))}</strong></div><div class="stat"><span>薪資空間</span><strong>${money(Math.max(0,state.cap-salary(picks)))}</strong></div><div class="stat"><span>名額</span><strong>${picks.length} / 15</strong></div></div><div class="player-grid">${expansionPool.map(p=>{const selected=picks.some(x=>x.id===p.id);const disabled=!selected&&(picks.length>=15||salary(picks)+p.salary>state.cap);return `<div class="player-card"><div class="info"><b>${esc(p.name)} <span class="tag">${p.pos}</span></b><small>評分 ${p.rating} · 潛力 ${p.potential} · ${p.age} 歲 · ${money(p.salary)} · 合約 ${p.years} 年</small></div><button class="btn small ${selected?'primary':''}" data-pick="${p.id}" ${disabled?'disabled':''}>${selected?'已選 ✓':'挑選'}</button></div>`}).join('')}</div><div class="actions"><button class="btn primary" id="finishExpansion" ${picks.length<8?'disabled':''}>完成建隊並開始第一季</button><button class="btn" id="clearPicks">清除選擇</button></div></section>`;$('#root').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const p=expansionPool.find(x=>x.id==b.dataset.pick);state.expansion=state.expansion.some(x=>x.id===p.id)?state.expansion.filter(x=>x.id!==p.id):state.expansion.concat(p);persist();renderExpansion()});$('#finishExpansion').onclick=()=>{if(state.expansion.length<8)return;user().roster=state.expansion.slice();state.freeAgents=state.freeAgents.filter(p=>!state.expansion.some(x=>x.id===p.id));state.expansion=null;state.phase='regular';persist();award('first-team','新球隊成立','建立你的擴張球隊','🧢');tab='home';render()};$('#clearPicks').onclick=()=>{state.expansion=[];persist();renderExpansion()};}
function homeHTML(){const u=user();let board='';if(state.phase==='regular')board=`<div class="notice"><b>第 ${state.year} 季例行賽準備就緒。</b>可先在自由市場補強，再模擬 82 場例行賽。</div><div class="actions"><button class="btn primary" data-action="regular">模擬 82 場例行賽</button><button class="btn" data-tab="market">前往自由市場</button></div>`;else if(state.phase==='playoffs')board=playoffHTML();else if(state.phase==='draft')board=`<div class="notice"><b>新秀選秀。</b>選擇新秀或跳過，開始下一季。</div><div class="box"><b>${esc(state.draftPick.name)} · ${state.draftPick.pos}</b><p class="muted">評分 ${state.draftPick.rating} · 潛力 ${state.draftPick.potential} · 薪資 ${money(state.draftPick.salary)}</p><div class="actions"><button class="btn primary" data-action="rookie" ${u.roster.length>=15||salary(u.roster)+state.draftPick.salary>state.cap?'disabled':''}>加入新秀</button><button class="btn" data-action="skipRookie">跳過</button></div></div>`;else board=`<div class="notice">${state.phase==='complete'?'二十季王朝旅程完成！':'球季已結束。開始休賽季，調整陣容並迎接新賽季。'}</div><div class="actions"><button class="btn primary" data-action="offseason" ${state.year>=20?'disabled':''}>開始下一季</button></div>`;const rank=state.teams.slice().sort((a,b)=>b.wins-a.wins).findIndex(t=>t.isUser)+1;return `<div class="title-row"><div><div class="eyebrow">FRONT OFFICE · SEASON ${state.year}</div><h2>${esc(state.userTeam)} 總經理辦公室</h2><p>${phaseText()} · 經理 ${esc(profile.name||'球隊經理')}</p></div><span class="tag">第 ${state.year} / 20 季</span></div><div class="cards"><div class="stat"><span>球隊評分</span><strong>${rating(u.roster)}</strong><small>${state.phase==='regular'?'賽季排名待定':`聯盟排名 #${rank}`}</small></div><div class="stat"><span>陣容人數</span><strong>${u.roster.length}<small> / 15 人</small></strong></div><div class="stat"><span>目前薪資</span><strong>${money(salary(u.roster))}</strong><small>上限 ${money(state.cap)}</small></div><div class="stat"><span>總冠軍</span><strong>${u.championships}</strong><small>老闆耐心 ${u.owner}%</small></div></div>${board}<div class="grid-two"><div class="box"><h3>球隊核心</h3><div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>評分</th><th>年齡</th></tr></thead><tbody>${u.roster.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="tag">${p.pos}</span></td><td class="rating">${p.rating}</td><td>${p.age}</td></tr>`).join('')}</tbody></table></div></div><div class="box"><h3>最近賽季</h3>${state.history.length?`<p class="copy">第 ${state.history.at(-1).year} 季：${state.history.at(-1).wins} 勝 ${state.history.at(-1).losses} 敗<br>冠軍：${esc(state.history.at(-1).champion)}</p>`:'<p class="muted">完成第一季後，這裡會顯示球隊戰績。</p>'}</div></div>`}
function playoffHTML(){if(state.round>=3)return `<div class="notice"><b>本季季後賽已結束。</b> 總冠軍：${esc(state.champion)} ${state.champion===state.userTeam?'🏆':''}</div><div class="actions"><button class="btn primary" data-action="offseason" ${state.year>=20?'disabled':''}>開始休賽季</button></div>`;const rounds=['季後賽首輪','分區決賽','總冠軍賽'];return `<div class="notice"><b>${rounds[state.round]}</b><br>為本輪系列賽選擇戰術。模擬結果會根據雙方球隊評分與戰術加成決定。</div><div class="actions">${['均衡戰術','外線進攻','禁區優勢','強硬防守'].map((x,i)=>`<button class="btn ${state.tactic===i?'primary':''}" data-tactic="${i}">${x}</button>`).join('')}</div><button class="btn primary" data-action="playoff" ${state.tactic===null?'disabled':''}>模擬本輪系列賽</button>${state.lastRound?`<p class="muted">${esc(state.lastRound)}</p>`:''}`}
function rosterHTML(){const u=user();return `<div class="title-row"><div><div class="eyebrow">TEAM ROSTER</div><h2>球隊陣容</h2><p>本遊戲球員均為虛構生成資料。球員會隨年齡成長或衰退，合約可能到期。</p></div><span class="tag">${u.roster.length} / 15</span></div><div class="cards"><div class="stat"><span>評分</span><strong>${rating(u.roster)}</strong></div><div class="stat"><span>球員薪資</span><strong>${money(salary(u.roster))}</strong></div><div class="stat"><span>薪資上限</span><strong>${money(state.cap)}</strong></div><div class="stat"><span>平均年齡</span><strong>${(u.roster.reduce((s,p)=>s+p.age,0)/Math.max(1,u.roster.length)).toFixed(1)}</strong></div></div><div class="table-wrap"><table><thead><tr><th>球員</th><th>位置</th><th>評分</th><th>潛力</th><th>年齡</th><th>薪資</th><th>合約</th><th></th></tr></thead><tbody>${u.roster.slice().sort((a,b)=>b.rating-a.rating).map(p=>`<tr><td>${esc(p.name)} ${p.injured?`<span class="tag">傷停 ${p.injured}週</span>`:''}</td><td><span class="tag">${p.pos}</span></td><td class="rating">${p.rating}</td><td>${p.potential}</td><td>${p.age}</td><td>${money(p.salary)}</td><td>${p.years} 年</td><td><button class="btn small" data-release="${p.id}" ${u.roster.length<=8||state.phase==='playoffs'?'disabled':''}>釋出</button></td></tr>`).join('')}</tbody></table></div><div class="notice">薪資上限 ${money(state.cap)}。至少保留 8 位球員；釋出球員不會退還已承諾薪資。</div>`}
function marketHTML(){const pool=state.freeAgents||[],u=user();return `<div class="title-row"><div><div class="eyebrow">FREE AGENCY</div><h2>自由球員市場</h2><p>簽下球員補強陣容，需同時符合薪資空間與名額限制。</p></div><span class="tag">${pool.length} 位</span></div><div class="cards"><div class="stat"><span>目前薪資</span><strong>${money(salary(u.roster))}</strong></div><div class="stat"><span>薪資空間</span><strong>${money(Math.max(0,state.cap-salary(u.roster)))}</strong></div><div class="stat"><span>名額</span><strong>${u.roster.length} / 15</strong></div><div class="stat"><span>球隊評分</span><strong>${rating(u.roster)}</strong></div></div>${pool.length?`<div class="player-grid">${pool.slice().sort((a,b)=>b.rating-a.rating).map(p=>`<div class="player-card"><div class="info"><b>${esc(p.name)} <span class="tag">${p.pos}</span></b><small>評分 ${p.rating} · 潛力 ${p.potential} · ${p.age} 歲 · ${money(p.salary)} · ${p.years} 年</small></div><button class="btn small" data-sign="${p.id}" ${u.roster.length>=15||salary(u.roster)+p.salary>state.cap||state.phase==='playoffs'?'disabled':''}>簽約</button></div>`).join('')}</div>`:'<div class="empty">市場暫無球員。</div>'}`}
function standingsHTML(){const list=state.teams.slice().sort((a,b)=>b.wins-a.wins||rating(b.roster)-rating(a.roster));return `<div class="title-row"><div><div class="eyebrow">LEAGUE STANDINGS</div><h2>聯盟戰績</h2><p>共 31 支隊伍（30 支虛構聯盟球隊與你的擴張隊）；例行賽排名前八晉級季後賽。</p></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>球隊</th><th>勝</th><th>敗</th><th>勝率</th><th>評分</th></tr></thead><tbody>${list.map((t,i)=>`<tr style="${t.isUser?'background:#2d3e53':''}"><td>${i+1}</td><td>${esc(t.name)}${t.isUser?' (你)':''}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.wins?(t.wins/82).toFixed(3):'—'}</td><td class="rating">${rating(t.roster)}</td></tr>`).join('')}</tbody></table></div>`}
function historyHTML(){const badges=getBadges(),board=loadJson(BOARD_KEY,[]);return `<div class="title-row"><div><div class="eyebrow">DYNASTY ARCHIVE</div><h2>成就與王朝紀錄</h2><p>獎章跨新存檔保留在此瀏覽器；排行榜為本機紀錄，不會上傳或與其他玩家同步。</p></div></div><div class="cards"><div class="stat"><span>收藏成就</span><strong>${badges.length}</strong></div><div class="stat"><span>王朝冠軍</span><strong>${state?user().championships:0}</strong></div><div class="stat"><span>完成球季</span><strong>${state?state.history.length:0}</strong></div><div class="stat"><span>排行榜紀錄</span><strong>${board.length}</strong></div></div><div class="box"><h3>🏅 成就獎章</h3>${badges.length?`<div class="player-grid">${badges.map(b=>`<div class="badge"><span class="icon">${b.icon}</span><div><b>${esc(b.title)}</b><small>${esc(b.description)} · ${esc(b.date)}</small></div></div>`).join('')}</div>`:'<p class="muted">尚未解鎖成就。奪冠、累積勝場或完成王朝旅程即可獲得獎章。</p>'}</div><div class="box"><h3>📊 本機排行榜</h3>${board.length?`<div class="table-wrap"><table><thead><tr><th>名次</th><th>經理</th><th>球隊</th><th>冠軍</th><th>紀錄日期</th></tr></thead><tbody>${board.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.team)}</td><td>${x.titles}</td><td>${esc(x.year)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">完成球季後會保存本機排行榜紀錄。</p>'}</div>${state?`<div class="box"><h3>📚 球季歷史</h3>${state.history.length?state.history.slice().reverse().map(h=>`<div class="history-row"><b>第 ${h.year} 季</b><span>${h.wins} 勝 ${h.losses} 敗 · 冠軍 ${esc(h.champion)}</span><b>${h.champion===state.userTeam?'<span class="positive">🏆</span>':`#${h.rank}`}</b></div>`).join(''):'<p class="muted">完成第一季後顯示。</p>'}</div>`:''}<div class="box"><h3>🔒 存檔與隱私</h3><p class="copy">此版本不提供真正的帳號密碼登入。遊戲存檔、經理名稱、成就與排行榜僅存於此瀏覽器的 localStorage；清除瀏覽器資料可能導致遺失。使用頁首「匯出存檔」備份。沒有後端伺服器或全球排行榜。</p></div>`}
function bind(){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));root.querySelectorAll('[data-tactic]').forEach(b=>b.onclick=()=>{state.tactic=Number(b.dataset.tactic);persist();render()});root.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>sign(b.dataset.sign));root.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>release(b.dataset.release));root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function simulateRegular(){for(const t of state.teams){const r=rating(t.roster),winRate=clamp(.5+(r-70)*.009+(Math.random()-.5)*.24,.15,.85);t.wins=Math.round(82*winRate);t.losses=82-t.wins}const list=state.teams.slice().sort((a,b)=>b.wins-a.wins||rating(b.roster)-rating(a.roster));state.playoffTeams=list.slice(0,8).map(t=>t.name);state.phase='playoffs';state.round=0;state.tactic=null;user().owner=clamp(user().owner+(user().wins>=41?4:-5),10,100);for(const p of user().roster)if(Math.random()<.1)p.injured=1+(Math.random()*4|0);persist();tab='home';render();toast(`例行賽完成：${user().wins} 勝，排名第 ${list.findIndex(t=>t.isUser)+1}。`)}
function simulateRound(){const names=state.playoffTeams;if(state.tactic===null)return;const userName=state.userTeam,tactic=state.tactic,lines=[],winners=[];for(let i=0;i<names.length;i+=2){const a=state.teams.find(t=>t.name===names[i]),b=state.teams.find(t=>t.name===names[i+1]);if(!a||!b)continue;const ta=rating(a.roster)+(a.isUser?[2,4,3,3][tactic]:0),tb=rating(b.roster)+(b.isUser?[2,4,3,3][tactic]:0);const prob=clamp(.5+(ta-tb)*.025+(Math.random()-.5)*.18,.15,.85),winner=Math.random()<prob?a:b;winners.push(winner.name);lines.push(`${winner.name} 勝出對陣 ${winner===a?b.name:a.name}`)}state.lastRound=lines.join(' · ');state.playoffTeams=winners;state.round++;state.tactic=null;if(winners.length===1){state.champion=winners[0];finishSeason();return}persist();render();toast('本輪季後賽已完成。')}
function finishSeason(){const u=user(),rank=state.teams.slice().sort((a,b)=>b.wins-a.wins).findIndex(t=>t.isUser)+1;state.history.push({year:state.year,wins:u.wins,losses:u.losses,rank,champion:state.champion});if(state.champion===u.name){u.championships++;award('champion-first','王朝起點','首度奪得聯盟總冠軍','🏆');award('champions-'+u.championships,`${u.championships} 冠王朝`,`累積 ${u.championships} 次總冠軍`,'👑')}if(u.wins>=65)award('historic-'+state.year,'歷史級例行賽','單季至少 65 勝','⭐');if(state.history.length>=20)award('twenty-seasons','二十季傳奇','完成二十季經營','🌟');u.owner=clamp(u.owner+(state.champion===u.name?16:u.wins>41?5:-9),5,100);state.phase='playoffs';state.round=3;recordBoard();persist();render();toast(state.champion===u.name?'恭喜奪冠！':'季後賽結束。')}
function sign(id){const u=user(),p=state.freeAgents.find(x=>x.id==id);if(!p)return;if(u.roster.length>=15||salary(u.roster)+p.salary>state.cap)return toast('名額不足或超過薪資上限');u.roster.push(p);state.freeAgents=state.freeAgents.filter(x=>x.id!=id);persist();render();toast(`${p.name} 已簽約。`)}function release(id){const u=user(),i=u.roster.findIndex(p=>p.id==id);if(i<0||u.roster.length<=8)return;if(!confirm(`確定釋出 ${u.roster[i].name}？`))return;const [p]=u.roster.splice(i,1);state.freeAgents.push(p);persist();render()}
function action(a){if(a==='regular')simulateRegular();if(a==='playoff')simulateRound();if(a==='rookie'){user().roster.push(state.draftPick);state.draftPick=null;state.phase='regular';persist();render();toast('新秀已加入陣容。')}if(a==='skipRookie'){state.draftPick=null;state.phase='regular';persist();render()}if(a==='offseason')offseason()}
function offseason(){if(state.year>=20){state.phase='complete';award('twenty-seasons','二十季傳奇','完成二十季經營','🌟');persist();render();return}for(const t of state.teams){const keep=[];for(const p of t.roster){p.age++;p.years--;p.injured=Math.max(0,p.injured-1);if(p.age>36&&Math.random()<.35){if(t.isUser)toast(`${p.name} 宣布退役。`);continue}const change=p.age<25?(Math.random()*4|0)-1:p.age>31?-(Math.random()*3|0):(Math.random()*3|0)-1;p.rating=clamp(p.rating+change,35,99);if(p.years<=0){p.years=1+(Math.random()*3|0);if(Math.random()<.38){if(t.isUser)state.freeAgents.push(p);continue}}keep.push(p)}t.roster=keep;while(t.roster.length<8)t.roster.push(makePlayer(48,73,state.year+1));t.wins=0;t.losses=0}state.year++;state.champion=null;state.playoffTeams=[];state.round=0;state.freeAgents.push(...Array.from({length:18},()=>makePlayer(52,79,state.year)));state.draftPick=makePlayer(65,86,state.year);state.draftPick.age=19+(Math.random()*4|0);state.draftPick.years=4;state.draftPick.salary=Math.max(4,Math.round((state.draftPick.rating-42)*.27));state.phase='draft';persist();tab='home';render()}
function exportSave(){const data={version:2,state,profile,achievements:getBadges(),leaderboard:loadJson(BOARD_KEY,[])};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='basketball-dynasty-save.json';a.click();URL.revokeObjectURL(a.href);toast('已匯出存檔備份。')}
function importSave(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.state||!d.state.userTeam||!Array.isArray(d.state.teams))throw Error();state=d.state;profile=d.profile||profile;nextId=state.nextId||5000;if(d.achievements)localStorage.setItem(BADGE_KEY,JSON.stringify(d.achievements));if(d.leaderboard)localStorage.setItem(BOARD_KEY,JSON.stringify(d.leaderboard));persistProfile();persist();tab='home';render();toast('存檔匯入成功。')}catch{toast('檔案格式無效，沒有更動目前存檔。')}};r.readAsText(file)}
$('#exportBtn').onclick=()=>exportSave();$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importSave(e.target.files[0]);e.target.value=''};$('#resetBtn').onclick=()=>{if(confirm('刪除目前遊戲存檔並重新開始？成就紀錄會保留。')){localStorage.removeItem(SAVE_KEY);state=null;tab='home';render()}};
if(state){state.cap=state.cap||140;state.history=state.history||[];state.awards=state.awards||[];state.freeAgents=state.freeAgents||[];if(state.phase==='expansion')expansionPool=state.freeAgents.slice(0,40);render()}else render();
})();
</script></body></html>
